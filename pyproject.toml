[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lexora-pilot"
version = "0.1.0"
description = "Evidence-preserving legal document pilot"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
lexora = "legal_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"legal_ai.kb" = ["viewer.html", "entity-viewer.html"]
