[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lexora-pilot"
version = "0.1.0"
description = "Evidence-preserving legal document pilot"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Web layer (FastAPI). The core pipeline stays standard-library only.
# pypdf reads PDFs with a text layer on import (approved 2026-11-07).
web = ["fastapi==0.162.0", "uvicorn==0.54.0", "pydantic==2.14.3", "pypdf==7.0.0"]
# One-off conversion of the th1nhng0 Parquet metadata into the local SQLite catalog (approved 2026-11-07).
catalog = ["pyarrow==26.0.1"]
# TestClient for tests/test_web_api.py.
web-test = ["httpx2==2.16.0"]

[project.scripts]
lexora = "legal_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"legal_ai.kb" = ["viewer.html", "entity-viewer.html"]
"legal_ai" = ["term-tip.js", "term-tip.css"]
