[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lexora-pilot"
version = "0.1.0"
description = "Evidence-preserving legal document pilot"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Web layer (FastAPI). The core pipeline stays standard-library only.
web = ["fastapi==0.162.0", "uvicorn==0.54.0", "pydantic==2.14.3"]
# TestClient for tests/test_web_api.py.
web-test = ["httpx==0.28.1"]

[project.scripts]
lexora = "legal_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"legal_ai.kb" = ["viewer.html", "entity-viewer.html"]
"legal_ai" = ["term-tip.js", "term-tip.css"]
