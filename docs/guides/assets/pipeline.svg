<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 660" width="820" height="660" role="img" aria-labelledby="t d">
  <title id="t">Toàn bộ quy trình của Lexora</title>
  <desc id="d">Văn bản từ vbpl.vn được chụp và khóa, tách cấu trúc, thành corpus 94 Điều. Từ corpus tạo ĐK1, ĐK2 và quy phạm do AI trích xuất (ĐK3), qua kiểm chứng thành ĐK4. Cả bốn dùng chung truy xuất, chung model sinh câu trả lời và cùng cách chấm.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#595e63"/>
    </marker>
    <style>
      text { font-family: "Be Vietnam Pro", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #222426; }
      .t { font-size: 15px; font-weight: 600; }
      .s { font-size: 12px; fill: #595e63; }
      .k { font-size: 11.5px; fill: #595e63; letter-spacing: 0.06em; font-weight: 600; }
      .box { fill: #ffffff; stroke: #b6babb; stroke-width: 1.2; }
      .shared { fill: #ffffff; stroke: #2a2d30; stroke-width: 1.6; }
      .line { stroke: #595e63; stroke-width: 1.6; fill: none; }
    </style>
  </defs>
  <rect width="820" height="660" fill="#f4f5f4" rx="12"/>

  <text class="k" x="24" y="30">DỮ LIỆU</text>
  <rect class="box" x="150" y="40" width="520" height="52" rx="10"/>
  <text class="t" x="410" y="62" text-anchor="middle">Bản chụp văn bản từ vbpl.vn</text>
  <text class="s" x="410" y="81" text-anchor="middle">khóa phiên bản · mã băm · ngày truy cập · trạng thái hiệu lực</text>

  <rect class="box" x="150" y="118" width="520" height="52" rx="10"/>
  <text class="t" x="410" y="140" text-anchor="middle">Tách Chương / Mục / Điều / Khoản / Điểm</text>
  <text class="s" x="410" y="159" text-anchor="middle">chuẩn hóa chữ; mọi trích dẫn neo vào văn bản đã chuẩn hóa</text>

  <rect x="150" y="196" width="520" height="52" rx="10" fill="#e7e8e7" stroke="#b6babb" stroke-width="1.2"/>
  <text class="t" x="410" y="218" text-anchor="middle">Corpus thực nghiệm</text>
  <text class="s" x="410" y="237" text-anchor="middle">5 văn bản · 94 Điều · phiên bản khóa veaeaad4a6edc</text>

  <path class="line" d="M410 92 V114" marker-end="url(#a)"/>
  <path class="line" d="M410 170 V192" marker-end="url(#a)"/>

  <text class="k" x="24" y="290">BIỂU DIỄN</text>
  <rect x="40" y="300" width="150" height="58" rx="10" fill="#e4e6e6" stroke="#b6babb" stroke-width="1.2"/>
  <text class="t" x="115" y="324" text-anchor="middle">ĐK1</text>
  <text class="s" x="115" y="343" text-anchor="middle">cắt đoạn đều nhau</text>

  <rect x="210" y="300" width="150" height="58" rx="10" fill="#cfe0ff" stroke="#9db8e8" stroke-width="1.2"/>
  <text class="t" x="285" y="324" text-anchor="middle">ĐK2</text>
  <text class="s" x="285" y="343" text-anchor="middle">theo cấu trúc luật</text>

  <rect class="box" x="400" y="300" width="380" height="58" rx="10"/>
  <text class="t" x="590" y="324" text-anchor="middle">Trích xuất quy phạm bằng AI</text>
  <text class="s" x="590" y="343" text-anchor="middle">gpt-oss-120b · mỗi ô chép nguyên văn từ câu</text>

  <rect x="400" y="390" width="100" height="52" rx="10" fill="#ffd8a3" stroke="#e0b779" stroke-width="1.2"/>
  <text class="t" x="450" y="413" text-anchor="middle">ĐK3</text>
  <text class="s" x="450" y="431" text-anchor="middle">chưa kiểm chứng</text>

  <rect class="box" x="535" y="390" width="110" height="52" rx="10" stroke-dasharray="5 4"/>
  <text class="t" x="590" y="413" text-anchor="middle">Kiểm chứng</text>
  <text class="s" x="590" y="431" text-anchor="middle">loại bản ghi sai</text>

  <rect x="680" y="390" width="100" height="52" rx="10" fill="#b4ecbe" stroke="#86c896" stroke-width="1.2"/>
  <text class="t" x="730" y="413" text-anchor="middle">ĐK4</text>
  <text class="s" x="730" y="431" text-anchor="middle">đã kiểm chứng</text>

  <path class="line" d="M410 248 V272 H115 V296" marker-end="url(#a)"/>
  <path class="line" d="M285 272 V296" marker-end="url(#a)"/>
  <path class="line" d="M410 272 H590 V296" marker-end="url(#a)"/>
  <path class="line" d="M450 358 V386" marker-end="url(#a)"/>
  <path class="line" d="M500 416 H531" marker-end="url(#a)"/>
  <path class="line" d="M645 416 H676" marker-end="url(#a)"/>

  <text class="k" x="468" y="482">DÙNG CHUNG CHO CẢ BỐN ĐIỀU KIỆN</text>
  <rect class="shared" x="40" y="496" width="740" height="44" rx="10"/>
  <text class="t" x="410" y="523" text-anchor="middle">Truy xuất: BM25 / BGE-M3 / kết hợp, cùng cấu hình, cùng top-5</text>

  <rect class="shared" x="40" y="558" width="740" height="40" rx="10"/>
  <text class="t" x="410" y="583" text-anchor="middle">Sinh câu trả lời + cổng trích dẫn, cùng model, cùng ngân sách độ dài</text>

  <rect class="shared" x="40" y="612" width="740" height="38" rx="10"/>
  <text class="t" x="410" y="636" text-anchor="middle">Chấm: tự động (trích dẫn, từ chối) + người chấm mù theo rubric</text>

  <path class="line" d="M115 358 V492" marker-end="url(#a)"/>
  <path class="line" d="M285 358 V492" marker-end="url(#a)"/>
  <path class="line" d="M450 442 V492" marker-end="url(#a)"/>
  <path class="line" d="M730 442 V492" marker-end="url(#a)"/>
  <path class="line" d="M410 540 V554" marker-end="url(#a)"/>
  <path class="line" d="M410 598 V608" marker-end="url(#a)"/>
</svg>
