ields":[{"label":"Đơn vị","text":"điểm d khoản 3 Điều 107, Bộ luật Lao động 2019\n45-2019-qh14/chapter-vii/section-1/article-107/clause-3/point-d","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 107. Làm thêm giờ\n3. Người sử dụng lao động được sử dụng người lao động làm thêm không quá 300 giờ trong 01 năm trong một số ngành, nghề, công việc hoặc trường hợp sau đây:","highlight":["được sử dụng người lao động làm thêm không quá 300 giờ trong 01 năm"]},{"label":"Nguyên văn đơn vị","text":"d) Trường hợp phải giải quyết công việc cấp bách, không thể trì hoãn do tính chất thời vụ, thời điểm của nguyên liệu, sản phẩm hoặc để giải quyết công việc phát sinh do yếu tố khách quan không dự liệu trước, do hậu quả thời tiết, thiên tai, hỏa hoạn, địch họa, thiếu điện, thiếu nguyên liệu, sự cố kỹ thuật của dây chuyền sản xuất;","highlight":[]},{"label":"Câu được trích xuất","text":"Trường hợp phải giải quyết công việc cấp bách, không thể trì hoãn do tính chất thời vụ, thời điểm của nguyên liệu, sản phẩm hoặc để giải quyết công việc phát sinh do yếu tố khách quan không dự liệu trước, do hậu quả thời tiết, thiên tai, hỏa hoạn, địch họa, thiếu điện, thiếu nguyên liệu, sự cố kỹ thuật của dây chuyền sản xuất","highlight":[]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: được phép (từ: \"được\")\nChủ thể: Người sử dụng lao động\nHành vi: sử dụng người lao động làm thêm\nĐiều kiện: Trường hợp phải giải quyết công việc cấp bách, không thể trì hoãn do tính chất thời vụ, thời điểm của nguyên liệu, sản phẩm hoặc để giải quyết công việc phát sinh do yếu tố khách quan không dự liệu trước, do hậu quả thời tiết, thiên tai, hỏa hoạn, địch họa, thiếu điện, thiếu nguyên liệu, sự cố kỹ thuật của dây chuyền sản xuất\nĐịnh lượng: không quá 300 giờ trong 01 năm","highlight":[]}]},{"id":"R658e308411","group":"Bộ luật Lao động 2019 Điều 32","heading":"khoản 3 Điều 32, Bộ luật Lao động 2019 (quyền (từ: \"được\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 3 Điều 32, Bộ luật Lao động 2019\n45-2019-qh14/chapter-iii/section-2/article-32/clause-3","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 32. Làm việc không trọn thời gian","highlight":[]},{"label":"Nguyên văn đơn vị","text":"3. Người lao động làm việc không trọn thời gian được hưởng lương; bình đẳng trong thực hiện quyền và nghĩa vụ với người lao động làm việc trọn thời gian; bình đẳng về cơ hội, không bị phân biệt đối xử, bảo đảm an toàn, vệ sinh lao động.","highlight":["bình đẳng trong thực hiện quyền và nghĩa vụ với người lao động làm việc trọn thời gian"]},{"label":"Câu được trích xuất","text":"Người lao động làm việc không trọn thời gian được hưởng lương; bình đẳng trong thực hiện quyền và nghĩa vụ với người lao động làm việc trọn thời gian; bình đẳng về cơ hội, không bị phân biệt đối xử, bảo đảm an toàn, vệ sinh lao động","highlight":["bình đẳng trong thực hiện quyền và nghĩa vụ với người lao động làm việc trọn thời gian"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: quyền (từ: \"được\")\nChủ thể: Người lao động làm việc không trọn thời gian\nHành vi: bình đẳng trong thực hiện quyền và nghĩa vụ","highlight":[]}]},{"id":"R84292496e5","group":"Bộ luật Lao động 2019 Điều 112","heading":"điểm đ khoản 1 Điều 112, Bộ luật Lao động 2019 (quyền (từ: \"được\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm đ khoản 1 Điều 112, Bộ luật Lao động 2019\n45-2019-qh14/chapter-vii/section-2/article-112/clause-1/point-đ","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 112. Nghỉ lễ, tết\n1. Người lao động được nghỉ làm việc, hưởng nguyên lương trong những ngày lễ, tết sau đây:","highlight":["Người lao động được nghỉ làm việc, hưởng nguyên lương trong những ngày lễ, tết sau đây"]},{"label":"Nguyên văn đơn vị","text":"đ) Quốc khánh: 02 ngày (ngày 02 tháng 9 dương lịch và 01 ngày liền kề trước hoặc sau);","highlight":[]},{"label":"Câu được trích xuất","text":"Quốc khánh: 02 ngày (ngày 02 tháng 9 dương lịch và 01 ngày liền kề trước hoặc sau)","highlight":[]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: quyền (từ: \"được\")\nChủ thể: Người lao động\nHành vi: nghỉ làm việc, hưởng nguyên lương\nĐối tượng: Quốc khánh: 02 ngày (ngày 02 tháng 9 dương lịch và 01 ngày liền kề trước hoặc sau)\nĐịnh lượng: 02 ngày","highlight":[]}]},{"id":"R0d83c36a50","group":"Bộ luật Lao động 2019 Điều 36","heading":"điểm a khoản 2 Điều 36, Bộ luật Lao động 2019 (chưa rõ)","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm a khoản 2 Điều 36, Bộ luật Lao động 2019\n45-2019-qh14/chapter-iii/section-3/article-36/clause-2/point-a","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 36. Quyền đơn phương chấm dứt hợp đồng lao động của người sử dụng lao động\n2. Khi đơn phương chấm dứt hợp đồng lao động trong trường hợp quy định tại các điểm a, b, c, đ và g khoản 1 Điều này, người sử dụng lao động phải báo trước cho người lao động như sau:","highlight":["phải báo trước cho người lao động như sau"]},{"label":"Nguyên văn đơn vị","text":"a) Ít nhất 45 ngày đối với hợp đồng lao động không xác định thời hạn;","highlight":["Ít nhất 45 ngày"]},{"label":"Câu được trích xuất","text":"Ít nhất 45 ngày đối với hợp đồng lao động không xác định thời hạn","highlight":["Ít nhất 45 ngày"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: chưa rõ\nĐiều kiện: đối với hợp đồng lao động không xác định thời hạn\nĐịnh lượng: Ít nhất 45 ngày","highlight":["Ít nhất 45 ngày"]}]},{"id":"R4089828986","group":"NĐ 12/2022/NĐ-CP Điều 17","heading":"điểm c khoản 1 Điều 17, NĐ 12/2022/NĐ-CP (cấm (từ: \"Không\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm c khoản 1 Điều 17, NĐ 12/2022/NĐ-CP\n12-2022-nd-cp/chapter-ii/article-17/clause-1/point-c","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 17. Vi phạm quy định về tiền lương\n1. Phạt tiền từ 5.000.000 đồng đến 10.000.000 đồng đối với người sử dụng lao động có một trong các hành vi sau đây:","highlight":[]},{"label":"Nguyên văn đơn vị","text":"c) Không tham khảo ý kiến của tổ chức đại diện người lao động tại cơ sở đối với nơi có tổ chức đại diện người lao động tại cơ sở khi xây dựng thang lương, bảng lương; định mức lao động; quy chế thưởng;","highlight":["Không tham khảo ý kiến","mức lao động; quy chế thưởng"]},{"label":"Câu được trích xuất","text":"Không tham khảo ý kiến của tổ chức đại diện người lao động tại cơ sở đối với nơi có tổ chức đại diện người lao động tại cơ sở khi xây dựng thang lương, bảng lương; định mức lao động; quy chế thưởng","highlight":["Không tham khảo ý kiến","mức lao động; quy chế thưởng"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: cấm (từ: \"Không\")\nHành vi: tham khảo ý kiến của tổ chức đại diện người lao động tại cơ sở đối với nơi có tổ chức đại diện người lao động tại cơ sở khi xây dựng thang lương, bảng lương; mức lao động; quy chế thưởng","highlight":["Tính quy phạm: cấm (từ: \"Không\")","mức lao động; quy chế thưởng"]}]}],"short":"Kiểm tra loại bỏ"}},"modalities":["obligation","prohibition","entitlement","permission","unknown"],"slots":["actor","action","object","beneficiary","recipient","conditions","exceptions","deadlines","quantities","outcome"],"slot_names":{"actor":"Chủ thể","action":"Hành vi","object":"Đối tượng","beneficiary":"Bên thụ hưởng","recipient":"Bên nhận","conditions":"Điều kiện","exceptions":"Ngoại lệ","deadlines":"Thời hạn","quantities":"Định lượng","outcome":"Kết quả"}}</script>

  }
  const body = {task, reviewer: state.reviewer.trim(), mode: BLIND ? 'blind' : 'suggestions', exported_at: new Date().toISOString(), items};
  const slug = state.reviewer.trim().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '').toLowerCase() || 'nguoi-duyet';
  const blob = new Blob([JSON.stringify(body, null, 2)], {type: 'application/json'});
  const a = el('a', {href: URL.createObjectURL(blob), download: `review-${task}-${slug}.json`});
  document.body.append(a); a.click(); a.remove();
  say(`Đã xuất ${items.length}/${itemsOf(task).length} mục xong của việc này.`);
}
function importResult(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try { data = JSON.parse(reader.result); } catch (e) { say('Tệp không phải JSON hợp lệ.'); return; }
    if (!data || !PACK.tasks[data.task] || !Array.isArray(data.items)) { say('Tệp không phải kết quả duyệt của gói này.'); return; }
    if (data.mode && data.mode !== (BLIND ? 'blind' : 'suggestions')) { say('Tệp này thuộc chế độ khác (có gợi ý hoặc độc lập); không nhập.'); return; }
    if (!state.reviewer.trim() && data.reviewer) { state.reviewer = data.reviewer; $('reviewer').value = data.reviewer; loadAll(); }
    if (state.tab !== data.task) switchTab(data.task);
    const known = new Set(itemsOf(data.task).map(i => i.id));
    let n = 0;
    for (const r of data.items) {
      if (!known.has(r.id)) continue;
      const st = stOf(data.task, r.id);
      st.note = r.note || ''; st.done = true;
      if (data.task === 'gold') st.norms = (r.edited_norms || []).map(x => ({modality: x.modality, cue: x.cue || x.modality_cue || '', slots: x.slots || {}}));
      else st.value = r.value;
      n++;
    }
    save(); renderAll(); say(`Đã nhập ${n} mục.`);
  };
  reader.readAsText(file);
}
function loadAll() { for (const t of tasks) load(t.task); }

// ---- keyboard ----
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target, tag = t && t.tagName;
  if ((tag === 'INPUT' && t.type !== 'radio') || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if (tag === 'BUTTON' && (e.key === 'Enter' || e.key === ' ')) return;
  const task = state.tab; if (!task) return;
  const it = itemsOf(task).find(i => i.id === currentId()); if (!it) return;
  if (e.key === 'j') { step(1); e.preventDefault(); }
  else if (e.key === 'k') { step(-1); e.preventDefault(); }
  else if (e.key === 'Enter') { if (task === 'gold') goldAccept(it, stOf(task, it.id)); else accept(it); e.preventDefault(); }
  else if (task === 'gold' && e.key === 'n') { noNorm(it); e.preventDefault(); }
  else if (task === 'gold' && e.key === '+') { const b = $('addnorm'); if (b) b.click(); e.preventDefault(); }
  else if (task !== 'gold' && /^[1-9]$/.test(e.key)) { const o = taskOf(task).options[Number(e.key) - 1]; if (o) { pick(it, o.value); e.preventDefault(); } }
});
$('tabs').addEventListener('keydown', e => {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  const i = tasks.findIndex(t => t.task === state.tab), j = (i + (e.key === 'ArrowRight' ? 1 : tasks.length - 1)) % tasks.length;
  switchTab(tasks[j].task); $('tab-' + tasks[j].task).focus(); e.preventDefault();
});
$('filter').addEventListener('change', e => { state.filter = e.target.value; const ids = visibleIds(); if (ids.length && !ids.includes(currentId())) state.data[state.tab].pos = ids[0]; renderAll(); });
$('export').addEventListener('click', exportResult);
$('import').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', e => { if (e.target.files[0]) importResult(e.target.files[0]); e.target.value = ''; });
$('reviewer').addEventListener('change', e => { state.reviewer = e.target.value; try { localStorage.setItem('rp:reviewer', state.reviewer); } catch (x) {} loadAll(); renderAll(); say(`Đang lưu cho "${state.reviewer.trim() || 'chưa đặt tên'}".`); });
$('theme').addEventListener('click', () => {
  const root = document.documentElement;
  const dark = root.dataset.theme === 'dark' || (!root.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('rp:theme', root.dataset.theme); } catch (x) {}
});

// ---- start ----
(function init() {
  const hash = new URLSearchParams(location.hash.slice(1));
  try { const th = hash.get('theme') || localStorage.getItem('rp:theme'); if (th) document.documentElement.dataset.theme = th; } catch (x) {}
  const mb = $('modebadge');
  mb.textContent = BLIND ? 'Chế độ độc lập: không có gợi ý' : 'Có gợi ý của model'; mb.className = 'badge' + (BLIND ? ' blind' : '');
  try { state.reviewer = localStorage.getItem('rp:reviewer') || ''; } catch (x) {}
  if (hash.get('reviewer')) state.reviewer = hash.get('reviewer');
  $('reviewer').value = state.reviewer;
  loadAll();
  let start = hash.get('tab');
  if (!start) { try { start = sessionStorage.getItem('rp:tab'); } catch (x) {} }
  state.tab = PACK.tasks[start] ? start : tasks[0].task;
  if (hash.get('item')) state.data[state.tab].pos = hash.get('item');
  renderAll();
  if (!state.reviewer) say('Nhập tên người duyệt ở đầu trang; tiến độ được lưu riêng cho từng tên.');
})();
</script>
</body>
</html>
