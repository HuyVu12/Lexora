cấp phục vụ thực hiện theo quy định tại Điều 75 của Luật Bảo hiểm xã hội; hồ sơ, trình tự giải quyết hưởng tiếp trợ cấp tai nạn lao động, bệnh nghề nghiệp hằng tháng thực hiện theo quy định tại Điều 80 và Điều 81 của Luật Bảo hiểm xã hội.\";","highlight":[]},{"label":"Ngày hiệu lực (cột effective_from) và câu hiệu lực của văn bản sửa đổi","text":"2025-07-01\n1. Luật này có hiệu lực thi hành từ ngày 01 tháng 7 năm 2025.","highlight":["2025-07-01","ngày 01 tháng 7 năm 2025"]}]},{"id":"53054fe04de3814a0e0cfee0","group":"resolved","heading":"Sửa đổi: khoản 5 Điều 49, Luật An toàn, vệ sinh lao động số 84/2015/QH13","question":"Đích (đúng điểm, khoản, Điều, văn bản), loại lệnh và phạm vi của cạnh có khớp câu lệnh không?","fields":[{"label":"Câu lệnh (cột instruction)","text":"Sửa đổi, bổ sung khoản 5 Điều 49 như sau:","highlight":["khoản 5 Điều 49","Điều 49","Sửa đổi, bổ sung"]},{"label":"Tên Điều và câu dẫn trong văn bản sửa đổi","text":"Điều 139. Sửa đổi, bổ sung một số luật có liên quan đến bảo hiểm xã hội\n1. Sửa đổi, bổ sung một số điều của Luật An toàn, vệ sinh lao động số 84/2015/QH13 như sau:","highlight":["84/2015/QH13"]},{"label":"Đơn vị chứa câu lệnh (cột amending_unit)","text":"điểm đ khoản 1 Điều 139, Luật Bảo hiểm xã hội số 41/2024/QH15 [41-2024-qh15-sua-doi/chapter-xi/article-139/clause-1/point-đ]","highlight":[]},{"label":"Đích quy tắc đọc được (cột target_named, kind, status)","text":"khoản 5 Điều 49, Luật An toàn, vệ sinh lao động số 84/2015/QH13\nLoại: modify (sửa đổi, bổ sung)\nTrạng thái: resolved","highlight":["khoản 5 Điều 49"]},{"label":"Đơn vị đích (cột target_unit)","text":"khoản 5 Điều 49, Luật An toàn, vệ sinh lao động số 84/2015/QH13 [84-2015-qh13/chapter-iii/section-3/article-49/clause-5]","highlight":["khoản 5 Điều 49"]},{"label":"Nguyên văn đơn vị đích (cột target_text)","text":"5. Người đang hưởng trợ cấp tai nạn lao động, bệnh nghề nghiệp hằng tháng khi ra nước ngoài để định cư được giải quyết hưởng trợ cấp một lần; mức trợ cấp một lần bằng 03 tháng mức trợ cấp đang hưởng. Hồ sơ, trình tự giải quyết trợ cấp một lần thực hiện theo quy định tại khoản 2, khoản 3 Điều 109 và khoản 4 Điều 110 của Luật bảo hiểm xã hội.","highlight":[]},{"label":"Lời văn mới (cột new_wording_text)","text":"đ) Sửa đổi, bổ sung khoản 5 Điều 49 như sau: \"5. Người đang hưởng trợ cấp tai nạn lao động, bệnh nghề nghiệp hằng tháng khi ra nước ngoài để định cư được giải quyết hưởng trợ cấp một lần; mức trợ cấp một lần bằng 03 tháng mức trợ cấp đang hưởng. Hồ sơ, trình tự giải quyết trợ cấp một lần thực hiện theo quy định của Luật Bảo hiểm xã hội.\";","highlight":[]},{"label":"Ngày hiệu lực (cột effective_from) và câu hiệu lực của văn bản sửa đổi","text":"2025-07-01\n1. Luật này có hiệu lực thi hành từ ngày 01 tháng 7 năm 2025.","highlight":["2025-07-01","ngày 01 tháng 7 năm 2025"]}]},{"id":"3c410a942f9c340079887221","group":"resolved","heading":"Sửa đổi: khoản 3 Điều 53, Luật An toàn, vệ sinh lao động số 84/2015/QH13","question":"Đích (đúng điểm, khoản, Điều, văn bản), loại lệnh và phạm vi của cạnh có khớp câu lệnh không?","fields":[{"label":"Câu lệnh (cột instruction)","text":"Sửa đổi, bổ sung khoản 3 Điều 53 như sau:","highlight":["khoản 3 Điều 53","Điều 53","Sửa đổi, bổ sung"]},{"label":"Tên Điều và câu dẫn trong văn bản sửa đổi","text":"Điều 139. Sửa đổi, bổ sung một số luật có liên quan đến bảo hiểm xã hội\n1. Sửa đổi, bổ sung một số điều của Luật An toàn, vệ sinh lao động số 84/2015/QH13 như sau:","highlight":["84/2015/QH13"]},{"label":"Đơn vị chứa câu lệnh (cột amending_unit)","text":"điểm e khoản 1 Điều 139, Luật Bảo hiểm xã hội số 41/2024/QH15 [41-2024-qh15-sua-doi/chapter-xi/article-139/clause-1/point-e]","highlight":[]},{"label":"Đích quy tắc đọc được (cột target_named, kind, status)","text":"khoản 3 Điều 53, Luật An toàn, vệ sinh lao động số 84/2015/QH13\nLoại: modify (sửa đổi, bổ sung)\nTrạng thái: resolved","highlight":["khoản 3 Điều 53"]},{"label":"Đơn vị đích (cột target_unit)","text":"khoản 3 Điều 53, Luật An toà  rồi so từng ô của quy phạm.\nHỏi lần lượt: tính quy phạm, chủ thể, có thêm điều luật không nói, có bỏ mất ý làm đổi nghĩa.\nNếu đúng nghĩa, xem chữ lấy từ đâu: câu dẫn, viết lại, hay nguyên văn.\nNhiều nhãn cùng đúng thì chọn nhãn đứng trước trong danh sách.\nÔ để trống không phải lỗi, trừ khi thiếu nó thì sai nghĩa.\nGợi ý là của model; khi không chắc, chọn Không rõ và ghi lý do.","source":"experiments/runs/audit-rejections-v1/sheet.csv = bộ a18ba17ef7635 trong data/kb/vm-lexora-20261124.sqlite; nhãn nhập cho huyvu qua scripts/review_pack/convert.py audit","options":[{"value":"sai","label":"Sai","hint":"Nói điều luật không nói, mâu thuẫn, sai chủ thể, sai tính quy phạm, bỏ mất điều kiện, ngoại lệ hoặc phủ định làm đổi nghĩa","csv":{"label":"sai"}},{"value":"dien_dat","label":"Đúng, diễn đạt lại","hint":"Đúng nghĩa nhưng giá trị bị viết lại, rút gọn hoặc ghép từ nhiều chỗ, không còn nguyên văn","csv":{"label":"dien_dat"}},{"value":"dung_ngu_canh","label":"Đúng, mượn câu dẫn","hint":"Đúng, nhưng có chữ lấy từ câu dẫn của khoản, tên Điều hoặc câu khác thay vì từ chính câu","csv":{"label":"dung_ngu_canh"}},{"value":"dung","label":"Đúng, nguyên văn","hint":"Đúng và mọi chữ nằm nguyên văn trong câu","csv":{"label":"dung"}},{"value":"khong_ro","label":"Không rõ","hint":"Không quyết định được; ghi lý do vào ghi chú","csv":{"label":"khong_ro"}}],"items":[{"id":"R9606202419","group":"NĐ 145/2020/NĐ-CP Điều 70","heading":"điểm c khoản 2 Điều 70, NĐ 145/2020/NĐ-CP (nghĩa vụ)","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm c khoản 2 Điều 70, NĐ 145/2020/NĐ-CP\n145-2020-nd-cp/chapter-viii/article-70/clause-2/point-c","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 70. Trình tự, thủ tục xử lý kỷ luật lao động\nTrình tự, thủ tục xử lý kỷ luật lao động tại khoản 6 Điều 122 của Bộ luật Lao động được quy định như sau:\n2. Trong thời hiệu xử lý kỷ luật lao động quy định tại khoản 1, khoản 2 Điều 123 của Bộ luật Lao động, người sử dụng lao động tiến hành họp xử lý kỷ luật lao động như sau:","highlight":[]},{"label":"Nguyên văn đơn vị","text":"c) Người sử dụng lao động tiến hành họp xử lý kỷ luật lao động theo thời gian, địa điểm đã thông báo quy định tại điểm a, điểm b khoản này. Trường hợp một trong các thành phần phải tham dự họp quy định tại điểm b, điểm c khoản 1 Điều 122 của Bộ luật Lao động không xác nhận tham dự cuộc họp hoặc vắng mặt thì người sử dụng lao động vẫn tiến hành họp xử lý kỷ luật lao động.","highlight":["vẫn tiến hành họp xử lý kỷ luật lao động"]},{"label":"Câu được trích xuất","text":"Trường hợp một trong các thành phần phải tham dự họp quy định tại điểm b, điểm c khoản 1 Điều 122 của Bộ luật Lao động không xác nhận tham dự cuộc họp hoặc vắng mặt thì người sử dụng lao động vẫn tiến hành họp xử lý kỷ luật lao động","highlight":["vẫn tiến hành họp xử lý kỷ luật lao động"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ\nChủ thể: người sử dụng lao động\nHành vi: tiến hành họp xử lý kỷ luật lao động\nĐiều kiện: Trường hợp một trong các thành phần phải tham dự họp quy định tại điểm b, điểm c khoản 1 Điều 122 của Bộ luật Lao động không xác nhận tham dự cuộc họp hoặc vắng mặt","highlight":["Tính quy phạm: nghĩa vụ"]}]},{"id":"R49a555b0a8","group":"NĐ 145/2020/NĐ-CP Điều 71","heading":"điểm c khoản 2 Điều 71, NĐ 145/2020/NĐ-CP (chưa rõ)","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm c khoản 2 Điều 71, NĐ 145/2020/NĐ-CP\n145-2020-nd-cp/chapter-viii/article-71/clause-2/point-c","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 71. Trình tự, thủ tục xử lý bồi thường thiệt hại\nTrình tự, thủ tục xử lý bồi thường thiệt hại tại khoản 2 Điều 130 của Bộ luật Lao động được quy định như sau:\n2. Trong thời hiệu xử lý bồi thường thiệt hại quy định tại Điều 72 Nghị định này, người sử dụng lao động tiến hành họp xử lý bồi thường thiệt hại như sau:","highlight":["tiến hành họp xử lý bồi thường thiệt hại"]},{"label":"Nguyên văn đơn vị","text":"c) Người sử dụng lao động tiến hành họp xử lý bồi thường thiệt hại theo thời gian, địa điểm đã thông báo quy định tại điểm a, điểm b khoản này. Trường hợp một trong các thành phần phải tham dự họp quy định tại điểm a khoản này không xác nhận tham dự hoặc vắng mặt thì người sử dụng lao động vẫn tiến hành họp xử lý bồi thường thiệt hại theo quy định của pháp luật.","highlight":["tiến hành họp xử lý bồi thường thiệt hại"]},{"label":"Câu được trích xuất","text":"Trường hợp một trong các thành phần phải tham dự họp quy định tại điểm a khoản này không xác nhận tham dự hoặc vắng mặt thì người sử dụng lao động vẫn tiến hành họp xử lý bồi thường thiệt hại theo quy định của pháp luật","highlight":["tiến hành họp xử lý bồi thường thiệt hại"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: chưa rõ\nChủ thể: người sử dụng lao động\nHành vi: tiến hành\nĐối tượng: họp xử lý bồi thường thiệt hại","highlight":[]}]},{"id":"R767a75370d","group":"NĐ 145/2020/NĐ-CP Điều 57","heading":"điểm b khoản 1 Điều 57, NĐ 145/2020/NĐ-CP (nghĩa vụ (từ: \"được\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm b khoản 1 Điều 57, NĐ 145/2020/NĐ-CP\n145-2020-nd-cp/chapter-vi/section-2/article-57/clause-1/point-b","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 57. Tiền lương làm thêm giờ vào ban đêm\nNgười lao động làm thêm giờ vào ban đêm theo khoản 3 Điều 98 của Bộ luật Lao động, được hưởng tiền lương tính theo công thức sau:\n1. Đối với người lao động hưởng lương theo thời gian, tiền lương làm thêm giờ vào ban đêm được tính như sau:\nTrong đó:","highlight":["được tính"]},{"label":"Nguyên văn đơn vị","text":"b) Tiền lương giờ vào ban ngày của ngày làm việc bình thường hoặc của ngày nghỉ hằng tuần hoặc của ngày nghỉ lễ, tết, ngày nghỉ có hưởng lương được xác định như sau:\nb1) Tiền lương giờ vào ban ngày của ngày làm việc bình thường, được tính ít nhất bằng 100% so với tiền lương giờ thực trả của công việc đang làm vào ngày làm việc bình thường đối với trường hợp người lao động không làm thêm giờ vào ban ngày của ngày đó (trước khi làm thêm giờ vào ban đêm); ít nhất bằng 150% so với tiền lương giờ thực trả của công việc đang làm vào ngày làm việc bình thường đối với trường hợp người lao động có làm thêm giờ vào ban ngày của ngày đó (trước khi làm thêm giờ vào ban đêm);\nb2) Tiền lương giờ vào ban ngày của ngày nghỉ hằng tuần, được tính ít nhất bằng 200% so với tiền lương giờ thực trả của công việc đang làm vào ngày làm việc bình thường;\nb3) Tiền lương giờ vào ban ngày của ngày nghỉ lễ, tết, ngày nghỉ có hưởng lương, được tính ít nhất bằng 300% so với tiền lương giờ thực trả của công việc đang làm vào ngày làm việc bình thường.","highlight":["được tính","ít nhất bằng 100%","không làm thêm giờ vào ban ngày của ngày đó"]},{"label":"Câu được trích xuất","text":"b1) Tiền lương giờ vào ban ngày của ngày làm việc bình thường, được tính ít nhất bằng 100% so với tiền lương giờ thực trả của công việc đang làm vào ngày làm việc bình thường đối với trường hợp người lao động không làm thêm giờ vào ban ngày của ngày đó (trước khi làm thêm giờ vào ban đêm); ít nhất bằng 150% so với tiền lương giờ thực trả của công việc đang làm vào ngày làm việc bình thường đối với trường hợp người lao động có làm thêm giờ vào ban ngày của ngày đó (trước khi làm thêm giờ vào ban đêm)","highlight":["được tính","ít nhất bằng 100%","không làm thêm giờ vào ban ngày của ngày đó"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"được\")\nHành vi: được tính\nĐối tượng: Tiền lương giờ vào ban ngày của ngày làm việc bình thường\nĐiều kiện: đối với trường hợp người lao động không làm thêm giờ vào ban ngày của ngày đó (trước khi làm thêm giờ vào ban đêm)\nĐịnh lượng: ít nhất bằng 100% so với tiền lương giờ thực trả của công việc đang làm vào ngày làm việc bình thường","highlight":["được tính","ít nhất bằng 100%","không làm thêm giờ vào ban ngày của ngày đó"]}]},{"id":"R85efaf6cfc","group":"Bộ luật Lao động 2019 Điều 21","heading":"điểm e khoản 1 Điều 21, Bộ luật Lao động 2019 (nghĩa vụ (từ: \"phải\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm e khoản 1 Điều 21, Bộ luật Lao động 2019\n45-2019-qh14/chapter-iii/section-1/article-21/clause-1/point-e","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 21. Nội dung hợp đồng lao động\n1. Hợp đồng lao động phải có những nội dung chủ yếu sau đây:","highlight":["Hợp đồng lao động phải có những nội dung chủ yếu sau đây"]},{"label":"Nguyên văn đơn vị","text":"e) Chế độ nâng bậc, nâng lương;","highlight":[]},{"label":"Câu được trích xuất","text":"Chế độ nâng bậc, nâng lương","highlight":[]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"phải\")\nChủ thể: Hợp đồng lao động\nHành vi: có\nĐối tượng: Chế độ nâng bậc, nâng lương","highlight":["Chủ thể: Hợp đồng lao động"]}]},{"id":"R7eaf3e9081","group":"Bộ luật Lao động 2019 Điều 125","heading":"khoản 1 Điều 125, Bộ luật Lao động 2019 (chưa rõ)","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 1 Điều 125, Bộ luật Lao động 2019\n45-2019-qh14/chapter-viii/section-1/article-125/clause-1","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 125. Áp dụng hình thức xử lý kỷ luật sa thải\nHình thức xử lý kỷ luật sa thải được người sử dụng lao động áp dụng trong trường hợp sau đây:","highlight":["Áp dụng hình thức xử lý kỷ luật sa thải"]},{"label":"Nguyên văn đơn vị","text":"1. Người lao động có hành vi trộm cắp, tham ô, đánh bạc, cố ý gây thương tích, sử dụng ma túy tại nơi làm việc;","highlight":[]},{"label":"Câu được trích xuất","text":"Người lao động có hành vi trộm cắp, tham ô, đánh bạc, cố ý gây thương tích, sử dụng ma túy tại nơi làm việc","highlight":[]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: chưa rõ\nChủ thể: người sử dụng lao động\nHành vi: áp dụng hình thức xử lý kỷ luật sa thải\nĐiều kiện: Người lao động có hành vi trộm cắp, tham ô, đánh bạc, cố ý gây thương tích, sử dụng ma túy tại nơi làm việc","highlight":["áp dụng hình thức xử lý kỷ luật sa thải"]}]},{"id":"R4efe7aac7a","group":"Bộ luật Lao động 2019 Điều 21","heading":"điểm đ khoản 1 Điều 21, Bộ luật Lao động 2019 (nghĩa vụ (từ: \"phải\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm đ khoản 1 Điều 21, Bộ luật Lao động 2019\n45-2019-qh14/chapter-iii/section-1/article-21/clause-1/point-đ","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 21. Nội dung hợp đồng lao động\n1. Hợp đồng lao động phải có những nội dung chủ yếu sau đây:","highlight":["Hợp đồng lao động phải có những nội dung chủ yếu sau đây"]},{"label":"Nguyên văn đơn vị","text":"đ) Mức lương theo công việc hoặc chức danh, hình thức trả lương, thời hạn trả lương, phụ cấp lương và các khoản bổ sung khác;","highlight":[]},{"label":"Câu được trích xuất","text":"Mức lương theo công việc hoặc chức danh, hình thức trả lương, thời hạn trả lương, phụ cấp lương và các khoản bổ sung khác","highlight":[]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"phải\")\nHành vi: có\nĐối tượng: Mức lương theo công việc hoặc chức danh, hình thức trả lương, thời hạn trả lương, phụ cấp lương và các khoản bổ sung khác","highlight":[]}]},{"id":"R435070813b","group":"NĐ 145/2020/NĐ-CP Điều 57","heading":"điểm c khoản 2 Điều 57, NĐ 145/2020/NĐ-CP (nghĩa vụ (từ: \"được\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm c khoản 2 Điều 57, NĐ 145/2020/NĐ-CP\n145-2020-nd-cp/chapter-vi/section-2/article-57/clause-2/point-c","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 57. Tiền lương làm thêm giờ vào ban đêm\nNgười lao động làm thêm giờ vào ban đêm theo khoản 3 Điều 98 của Bộ luật Lao động, được hưởng tiền lương tính theo công thức sau:\n2. Đối với người lao động hưởng lương theo sản phẩm, tiền lương làm thêm giờ vào ban đêm được tính như sau:\nTrong đó, đơn giá tiền lương sản phẩm vào ban ngày của ngày làm việc bình thường hoặc của ngày nghỉ hằng tuần hoặc của ngày nghỉ lễ, tết, ngày nghỉ có hưởng lương được xác định như sau:","highlight":[]},{"label":"Nguyên văn đơn vị","text":"c) Đơn giá tiền lương sản phẩm vào ban ngày của ngày nghỉ lễ, tết, ngày nghỉ có hưởng lương, được tính ít nhất 300% so với đơn giá tiền lương sản phẩm của ngày làm việc bình thường.","highlight":["được tính ít nhất 300%"]},{"label":"Câu được trích xuất","text":"Đơn giá tiền lương sản phẩm vào ban ngày của ngày nghỉ lễ, tết, ngày nghỉ có hưởng lương, được tính ít nhất 300% so với đơn giá tiền lương sản phẩm của ngày làm việc bình thường","highlight":["được tính ít nhất 300%"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"được\")\nHành vi: tính\nĐối tượng: Đơn giá tiền lương sản phẩm vào ban ngày của ngày nghỉ lễ, tết, ngày nghỉ có hưởng lương\nĐịnh lượng: ít nhất 300% so với đơn giá tiền lương sản phẩm của ngày làm việc bình thường","highlight":["Hành vi: tính"]}]},{"id":"Rab0c30c08d","group":"NĐ 145/2020/NĐ-CP Điều 59","heading":"điểm c khoản 1 Điều 59, NĐ 145/2020/NĐ-CP (nghĩa vụ (từ: \"phải\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm c khoản 1 Điều 59, NĐ 145/2020/NĐ-CP\n145-2020-nd-cp/chapter-vii/article-59/clause-1/point-c","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 59. Sự đồng ý của người lao động khi làm thêm giờ\n1. Trừ các trường hợp quy định tại Điều 108 của Bộ luật Lao động, các trường hợp khác khi tổ chức làm thêm giờ, người sử dụng lao động phải được sự đồng ý của người lao động tham gia làm thêm về các nội dung sau đây:","highlight":["phải được sự đồng ý của người lao động tham gia làm thêm","Trừ các trường hợp quy định tại Điều 108 của Bộ luật Lao động"]},{"label":"Nguyên văn đơn vị","text":"c) Công việc làm thêm.","highlight":[]},{"label":"Câu được trích xuất","text":"Công việc làm thêm","highlight":[]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"phải\")\nChủ thể: người sử dụng lao động\nHành vi: được sự đồng ý\nĐối tượng: Công việc làm thêm\nBên nhận: người lao động tham gia làm thêm\nĐiều kiện: khi tổ chức làm thêm giờ\nNgoại lệ: Trừ các trường hợp quy định tại Điều 108 của Bộ luật Lao động","highlight":["Trừ các trường hợp quy định tại Điều 108 của Bộ luật Lao động"]}]},{"id":"R68e62ec239","group":"Bộ luật Lao động 2019 Điều 107","heading":"điểm a khoản 3 Điều 107, Bộ luật Lao động 2019 (được phép (từ: \"được\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm a khoản 3 Điều 107, Bộ luật Lao động 2019\n45-2019-qh14/chapter-vii/section-1/article-107/clause-3/point-a","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 107. Làm thêm giờ\n3. Người sử dụng lao động được sử dụng người lao động làm thêm không quá 300 giờ trong 01 năm trong một số ngành, nghề, công việc hoặc trường hợp sau đây:","highlight":["được sử dụng người lao động làm thêm không quá 300 giờ trong 01 năm"]},{"label":"Nguyên văn đơn vị","text":"a) Sản xuất, gia công xuất khẩu sản phẩm hàng dệt, may, da, giày, điện, điện tử, chế biến nông, lâm, diêm nghiệp, thủy sản;","highlight":[]},{"label":"Câu được trích xuất","text":"Sản xuất, gia công xuất khẩu sản phẩm hàng dệt, may, da, giày, điện, điện tử, chế biến nông, lâm, diêm nghiệp, thủy sản","highlight":[]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: được phép (từ: \"được\")\nChủ thể: Người sử dụng lao động\nHành vi: sử dụng người lao động làm thêm\nĐiều kiện: Sản xuất, gia công xuất khẩu sản phẩm hàng dệt, may, da, giày, điện, điện tử, chế biến nông, lâm, diêm nghiệp, thủy sản\nĐịnh lượng: không quá 300 giờ trong 01 năm","highlight":[]}]},{"id":"Rfa363b1fd2","group":"NĐ 145/2020/NĐ-CP Điều 56","heading":"khoản 1 Điều 56, NĐ 145/2020/NĐ-CP (nghĩa vụ (từ: \"được\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 1 Điều 56, NĐ 145/2020/NĐ-CP\n145-2020-nd-cp/chapter-vi/section-2/article-56/clause-1","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 56. Tiền lương làm việc vào ban đêm\nTiền lương làm việc vào ban đêm theo khoản 2 Điều 98 của Bộ luật Lao động, được tính theo công thức sau:","highlight":[]},{"label":"Nguyên văn đơn vị","text":"1. Đối với người lao động hưởng lương theo thời gian, tiền lương làm việc vào ban đêm được tính như sau:\nTrong đó: Tiền lương giờ thực trả của công việc đang làm vào ngày làm việc bình thường được xác định theo điểm a khoản 1 Điều 55 Nghị định này.","highlight":["được xác định theo điểm a khoản 1 Điều 55 Nghị định này"]},{"label":"Câu được trích xuất","text":"Trong đó: Tiền lương giờ thực trả của công việc đang làm vào ngày làm việc bình thường được xác định theo điểm a khoản 1 Điều 55 Nghị định này","highlight":["được xác định theo điểm a khoản 1 Điều 55 Nghị định này"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"được\")\nHành vi: xác định tiền lương giờ thực trả\nĐối tượng: Tiền lương giờ thực trả của công việc đang làm vào ngày làm việc bình thường\nĐiều kiện: Trong đó","highlight":["Hành vi: xác định tiền lương giờ thực trả","Điều kiện: Trong đó"]}]},{"id":"R85b7e9ee25","group":"Bộ luật Lao động 2019 Điều 21","heading":"điểm d khoản 1 Điều 21, Bộ luật Lao động 2019 (nghĩa vụ (từ: \"phải\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm d khoản 1 Điều 21, Bộ luật Lao động 2019\n45-2019-qh14/chapter-iii/section-1/article-21/clause-1/point-d","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 21. Nội dung hợp đồng lao động\n1. Hợp đồng lao động phải có những nội dung chủ yếu sau đây:","highlight":["Hợp đồng lao động phải có những nội dung chủ yếu sau đây"]},{"label":"Nguyên văn đơn vị","text":"d) Thời hạn của hợp đồng lao động;","highlight":[]},{"label":"Câu được trích xuất","text":"Thời hạn của hợp đồng lao động","highlight":[]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"phải\")\nHành vi: có\nĐối tượng: Thời hạn của hợp đồng lao động","highlight":[]}]},{"id":"R54b51a00df","group":"Bộ luật Lao động 2019 Điều 45","heading":"khoản 2 Điều 45, Bộ luật Lao động 2019 (chưa rõ (từ: \"thì\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 2 Điều 45, Bộ luật Lao động 2019\n45-2019-qh14/chapter-iii/section-3/article-45/clause-2","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 45. Thông báo chấm dứt hợp đồng lao động","highlight":[]},{"label":"Nguyên văn đơn vị","text":"2. Trường hợp người sử dụng lao động không phải là cá nhân chấm dứt hoạt động thì thời điểm chấm dứt hợp đồng lao động tính từ thời điểm có thông báo chấm dứt hoạt động.\nTrường hợp người sử dụng lao động không phải là cá nhân bị cơ quan chuyên môn về đăng ký kinh doanh thuộc Ủy ban nhân dân cấp tỉnh ra thông báo không có người đại diện theo pháp luật, người được ủy quyền thực hiện quyền và nghĩa vụ của người đại diện theo pháp luật theo quy định tại khoản 7 Điều 34 của Bộ luật này thì thời điểm chấm dứt hợp đồng lao động tính từ ngày ra thông báo.","highlight":["thời điểm chấm dứt hợp đồng lao động tính từ ngày ra thông báo"]},{"label":"Câu được trích xuất","text":"Trường hợp người sử dụng lao động không phải là cá nhân bị cơ quan chuyên môn về đăng ký kinh doanh thuộc Ủy ban nhân dân cấp tỉnh ra thông báo không có người đại diện theo pháp luật, người được ủy quyền thực hiện quyền và nghĩa vụ của người đại diện theo pháp luật theo quy định tại khoản 7 Điều 34 của Bộ luật này thì thời điểm chấm dứt hợp đồng lao động tính từ ngày ra thông báo","highlight":["thời điểm chấm dứt hợp đồng lao động tính từ ngày ra thông báo"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: chưa rõ (từ: \"thì\")\nHành vi: ra thông báo\nĐiều kiện: người sử dụng lao động không phải là cá nhân bị cơ quan chuyên môn về đăng ký kinh doanh thuộc Ủy ban nhân dân cấp tỉnh ra thông báo không có người đại diện theo pháp luật, người được ủy quyền thực hiện quyền và nghĩa vụ của người đại diện theo pháp luật theo quy định tại khoản 7 Điều 34 của Bộ luật này\nKết quả: thời điểm chấm dứt hợp đồng lao động tính từ ngày ra thông báo","highlight":["thời điểm chấm dứt hợp đồng lao động tính từ ngày ra thông báo","chưa rõ (từ: \"thì\")"]}]},{"id":"Rb36ec84382","group":"Bộ luật Lao động 2019 Điều 105","heading":"khoản 2 Điều 105, Bộ luật Lao động 2019 (quyền (từ: \"có quyền\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 2 Điều 105, Bộ luật Lao động 2019\n45-2019-qh14/chapter-vii/section-1/article-105/clause-2","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 105. Thời giờ làm việc bình thường","highlight":[]},{"label":"Nguyên văn đơn vị","text":"2. Người sử dụng lao động có quyền quy định thời giờ làm việc theo ngày hoặc tuần nhưng phải thông báo cho người lao động biết; trường hợp theo tuần thì thời giờ làm việc bình thường không quá 10 giờ trong 01 ngày và không quá 48 giờ trong 01 tuần.\nNhà nước khuyến khích người sử dụng lao động thực hiện tuần làm việc 40 giờ đối với người lao động.","highlight":["có quyền quy định thời giờ làm việc theo ngày hoặc tuần","nhưng phải thông báo cho người lao động biết"]},{"label":"Câu được trích xuất","text":"Người sử dụng lao động có quyền quy định thời giờ làm việc theo ngày hoặc tuần nhưng phải thông báo cho người lao động biết; trường hợp theo tuần thì thời giờ làm việc bình thường không quá 10 giờ trong 01 ngày và không quá 48 giờ trong 01 tuần","highlight":["có quyền quy định thời giờ làm việc theo ngày hoặc tuần","nhưng phải thông báo cho người lao động biết"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: quyền (từ: \"có quyền\")\nChủ thể: Người sử dụng lao động\nHành vi: quy định\nĐối tượng: thời giờ làm việc theo ngày hoặc tuần","highlight":[]}]},{"id":"R62a610d7f1","group":"NĐ 145/2020/NĐ-CP Điều 71","heading":"khoản 3 Điều 71, NĐ 145/2020/NĐ-CP (nghĩa vụ (từ: \"phải\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 3 Điều 71, NĐ 145/2020/NĐ-CP\n145-2020-nd-cp/chapter-viii/article-71/clause-3","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 71. Trình tự, thủ tục xử lý bồi thường thiệt hại\nTrình tự, thủ tục xử lý bồi thường thiệt hại tại khoản 2 Điều 130 của Bộ luật Lao động được quy định như sau:","highlight":[]},{"label":"Nguyên văn đơn vị","text":"3. Nội dung cuộc họp xử lý bồi thường thiệt hại phải được lập thành biên bản, thông qua trước khi kết thúc cuộc họp và có chữ ký của người tham dự cuộc họp theo quy định tại điểm a khoản 2 Điều này, trường hợp có người không ký vào biên bản thì người ghi biên bản nêu rõ họ tên, lý do không ký (nếu có) vào nội dung biên bản.","highlight":["phải được lập thành biên bản, thông qua trước khi kết thúc cuộc họp"]},{"label":"Câu được trích xuất","text":"Nội dung cuộc họp xử lý bồi thường thiệt hại phải được lập thành biên bản, thông qua trước khi kết thúc cuộc họp và có chữ ký của người tham dự cuộc họp theo quy định tại điểm a khoản 2 Điều này, trường hợp có người không ký vào biên bản thì người ghi biên bản nêu rõ họ tên, lý do không ký (nếu có) vào nội dung biên bản","highlight":["phải được lập thành biên bản, thông qua trước khi kết thúc cuộc họp"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"phải\")\nChủ thể: Nội dung cuộc họp xử lý bồi thường thiệt hại\nHành vi: được thông qua","highlight":["Hành vi: được thông qua"]}]},{"id":"R4cfd08a228","group":"NĐ 145/2020/NĐ-CP Điều 57","heading":"điểm c khoản 2 Điều 57, NĐ 145/2020/NĐ-CP (nghĩa vụ (từ: \"được\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm c khoản 2 Điều 57, NĐ 145/2020/NĐ-CP\n145-2020-nd-cp/chapter-vi/section-2/article-57/clause-2/point-c","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 57. Tiền lương làm thêm giờ vào ban đêm\nNgười lao động làm thêm giờ vào ban đêm theo khoản 3 Điều 98 của Bộ luật Lao động, được hưởng tiền lương tính theo công thức sau:\n2. Đối với người lao động hưởng lương theo sản phẩm, tiền lương làm thêm giờ vào ban đêm được tính như sau:\nTrong đó, đơn giá tiền lương sản phẩm vào ban ngày của ngày làm việc bình thường hoặc của ngày nghỉ hằng tuần hoặc của ngày nghỉ lễ, tết, ngày nghỉ có hưởng lương được xác định như sau:","highlight":[]},{"label":"Nguyên văn đơn vị","text":"c) Đơn giá tiền lương sản phẩm vào ban ngày của ngày nghỉ lễ, tết, ngày nghỉ có hưởng lương, được tính ít nhất 300% so với đơn giá tiền lương sản phẩm của ngày làm việc bình thường.","highlight":["Đơn giá tiền lương sản phẩm vào ban ngày của ngày nghỉ lễ, tết, ngày nghỉ có hưởng lương"]},{"label":"Câu được trích xuất","text":"Đơn giá tiền lương sản phẩm vào ban ngày của ngày nghỉ lễ, tết, ngày nghỉ có hưởng lương, được tính ít nhất 300% so với đơn giá tiền lương sản phẩm của ngày làm việc bình thường","highlight":["Đơn giá tiền lương sản phẩm vào ban ngày của ngày nghỉ lễ, tết, ngày nghỉ có hưởng lương"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"được\")\nHành vi: tính\nĐối tượng: ít nhất 300% so với đơn giá tiền lương sản phẩm của ngày làm việc bình thường","highlight":["Đối tượng: ít nhất 300%"]}]},{"id":"R7918a0db38","group":"NĐ 145/2020/NĐ-CP Điều 8","heading":"điểm b khoản 5 Điều 8, NĐ 145/2020/NĐ-CP (cấm (từ: \"không\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm b khoản 5 Điều 8, NĐ 145/2020/NĐ-CP\n145-2020-nd-cp/chapter-iii/section-2/article-8/clause-5/point-b","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 8. Trợ cấp thôi việc, trợ cấp mất việc làm\n5. Tiền lương để tính trợ cấp thôi việc, trợ cấp mất việc làm được quy định như sau:","highlight":[]},{"label":"Nguyên văn đơn vị","text":"b) Trường hợp người lao động làm việc cho người sử dụng lao động theo nhiều hợp đồng lao động kế tiếp nhau theo quy định tại khoản 2 Điều 20 của Bộ luật Lao động thì tiền lương để tính trợ cấp thôi việc, trợ cấp mất việc làm là tiền lương bình quân của 06 tháng liền kề theo hợp đồng lao động trước khi chấm dứt hợp đồng lao động cuối cùng. Trường hợp hợp đồng lao động cuối cùng bị tuyên bố vô hiệu vì có nội dung tiền lương thấp hơn mức lương tối thiểu vùng do Chính phủ công bố hoặc mức lương ghi trong thỏa ước lao động tập thể thì tiền lương làm căn cứ tính trợ cấp thôi việc do hai bên thỏa thuận nhưng không thấp hơn mức lương tối thiểu vùng hoặc mức lương ghi trong thỏa ước lao động tập thể.","highlight":["do hai bên thỏa thuận nhưng không thấp hơn mức lương tối thiểu vùng"]},{"label":"Câu được trích xuất","text":"Trường hợp hợp đồng lao động cuối cùng bị tuyên bố vô hiệu vì có nội dung tiền lương thấp hơn mức lương tối thiểu vùng do Chính phủ công bố hoặc mức lương ghi trong thỏa ước lao động tập thể thì tiền lương làm căn cứ tính trợ cấp thôi việc do hai bên thỏa thuận nhưng không thấp hơn mức lương tối thiểu vùng hoặc mức lương ghi trong thỏa ước lao động tập thể","highlight":["do hai bên thỏa thuận nhưng không thấp hơn mức lương tối thiểu vùng"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: cấm (từ: \"không\")\nChủ thể: hai bên\nHành vi: thỏa thuận\nĐối tượng: tiền lương làm căn cứ tính trợ cấp thôi việc\nĐiều kiện: trong trường hợp hợp đồng lao động cuối cùng bị tuyên bố vô hiệu vì có nội dung tiền lương thấp hơn mức lương tối thiểu vùng do Chính phủ công bố hoặc mức lương ghi trong thỏa ước lao động tập thể","highlight":["Tính quy phạm: cấm (từ: \"không\")","Hành vi: thỏa thuận"]}]},{"id":"Rb8f1eddc7d","group":"Bộ luật Lao động 2019 Điều 26","heading":"Điều 26, Bộ luật Lao động 2019 (nghĩa vụ (từ: \"phải\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"Điều 26, Bộ luật Lao động 2019\n45-2019-qh14/chapter-iii/section-1/article-26","highlight":[]},{"label":"Nguyên văn đơn vị","text":"Điều 26. Tiền lương thử việc\nTiền lương của người lao động trong thời gian thử việc do hai bên thỏa thuận nhưng ít nhất phải bằng 85% mức lương của công việc đó.","highlight":["ít nhất phải bằng 85% mức lương của công việc đó"]},{"label":"Câu được trích xuất","text":"Tiền lương của người lao động trong thời gian thử việc do hai bên thỏa thuận nhưng ít nhất phải bằng 85% mức lương của công việc đó","highlight":["ít nhất phải bằng 85% mức lương của công việc đó"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"phải\")\nHành vi: phải bằng\nĐối tượng: 85% mức lương của công việc đó\nBên thụ hưởng: người lao động\nĐiều kiện: trong thời gian thử việc\nĐịnh lượng: ít nhất 85%","highlight":["Định lượng: ít nhất 85%"]}]},{"id":"R8d3d01ade0","group":"Bộ luật Lao động 2019 Điều 125","heading":"khoản 3 Điều 125, Bộ luật Lao động 2019 (chưa rõ)","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 3 Điều 125, Bộ luật Lao động 2019\n45-2019-qh14/chapter-viii/section-1/article-125/clause-3","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 125. Áp dụng hình thức xử lý kỷ luật sa thải\nHình thức xử lý kỷ luật sa thải được người sử dụng lao động áp dụng trong trường hợp sau đây:","highlight":[]},{"label":"Nguyên văn đơn vị","text":"3. Người lao động bị xử lý kỷ luật kéo dài thời hạn nâng lương hoặc cách chức mà tái phạm trong thời gian chưa xóa kỷ luật. Tái phạm là trường hợp người lao động lặp lại hành vi vi phạm đã bị xử lý kỷ luật mà chưa được xóa kỷ luật theo quy định tại Điều 126 của Bộ luật này;","highlight":["Tái phạm là trường hợp người lao động lặp lại hành vi vi phạm đã bị xử lý kỷ luật","kéo dài thời hạn nâng lương hoặc cách chức mà tái phạm"]},{"label":"Câu được trích xuất","text":"Tái phạm là trường hợp người lao động lặp lại hành vi vi phạm đã bị xử lý kỷ luật mà chưa được xóa kỷ luật theo quy định tại Điều 126 của Bộ luật này","highlight":["Tái phạm là trường hợp người lao động lặp lại hành vi vi phạm đã bị xử lý kỷ luật"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: chưa rõ\nChủ thể: người sử dụng lao động\nHành vi: áp dụng hình thức xử lý kỷ luật sa thải\nĐiều kiện: Tái phạm là trường hợp người lao động lặp lại hành vi vi phạm đã bị xử lý kỷ luật mà chưa được xóa kỷ luật theo quy định tại Điều 126 của Bộ luật này","highlight":["Tái phạm là trường hợp người lao động lặp lại hành vi vi phạm đã bị xử lý kỷ luật"]}]},{"id":"Re37fa0037e","group":"Bộ luật Lao động 2019 Điều 30","heading":"khoản 2 Điều 30, Bộ luật Lao động 2019 (cấm (từ: \"không được\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 2 Điều 30, Bộ luật Lao động 2019\n45-2019-qh14/chapter-iii/section-2/article-30/clause-2","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 30. Tạm hoãn thực hiện hợp đồng lao động","highlight":[]},{"label":"Nguyên văn đơn vị","text":"2. Trong thời gian tạm hoãn thực hiện hợp đồng lao động, người lao động không được hưởng lương và quyền, lợi ích đã giao kết trong hợp đồng lao động, trừ trường hợp hai bên có thỏa thuận hoặc pháp luật có quy định khác.","highlight":["không được hưởng lương và quyền, lợi ích đã giao kết trong hợp đồng lao động","trừ trường hợp hai bên có thỏa thuận hoặc pháp luật có quy định khác"]},{"label":"Câu được trích xuất","text":"Trong thời gian tạm hoãn thực hiện hợp đồng lao động, người lao động không được hưởng lương và quyền, lợi ích đã giao kết trong hợp đồng lao động, trừ trường hợp hai bên có thỏa thuận hoặc pháp luật có quy định khác","highlight":["không được hưởng lương và quyền, lợi ích đã giao kết trong hợp đồng lao động","trừ trường hợp hai bên có thỏa thuận hoặc pháp luật có quy định khác"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: cấm (từ: \"không được\")\nChủ thể: người lao động\nHành vi: hưởng lương và quyền, lợi ích đã giao kết trong hợp đồng lao động\nĐiều kiện: Trong thời gian tạm hoãn thực hiện hợp đồng lao động\nNgoại lệ: trừ trường hợp hai bên có thỏa thuận hoặc pháp luật có quy định khác","highlight":["trừ trường hợp hai bên có thỏa thuận hoặc pháp luật có quy định khác"]}]},{"id":"R80bd5b224c","group":"NĐ 145/2020/NĐ-CP Điều 59","heading":"điểm a khoản 1 Điều 59, NĐ 145/2020/NĐ-CP (nghĩa vụ (từ: \"phải\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm a khoản 1 Điều 59, NĐ 145/2020/NĐ-CP\n145-2020-nd-cp/chapter-vii/article-59/clause-1/point-a","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 59. Sự đồng ý của người lao động khi làm thêm giờ\n1. Trừ các trường hợp quy định tại Điều 108 của Bộ luật Lao động, các trường hợp khác khi tổ chức làm thêm giờ, người sử dụng lao động phải được sự đồng ý của người lao động tham gia làm thêm về các nội dung sau đây:","highlight":["phải được sự đồng ý của người lao động tham gia làm thêm"]},{"label":"Nguyên văn đơn vị","text":"a) Thời gian làm thêm;","highlight":[]},{"label":"Câu được trích xuất","text":"Thời gian làm thêm","highlight":[]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"phải\")\nChủ thể: người sử dụng lao động\nHành vi: được sự đồng ý\nĐối tượng: Thời gian làm thêm\nBên nhận: người lao động tham gia làm thêm\nĐiều kiện: khi tổ chức làm thêm giờ\nNgoại lệ: Trừ các trường hợp quy định tại Điều 108 của Bộ luật Lao động","highlight":[]}]},{"id":"Re5556714cc","group":"NĐ 145/2020/NĐ-CP Điều 114","heading":"điểm g khoản 2 Điều 114, NĐ 145/2020/NĐ-CP (nghĩa vụ)","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm g khoản 2 Điều 114, NĐ 145/2020/NĐ-CP\n145-2020-nd-cp/chapter-xi/section-4/article-114/clause-2/point-g","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 114. Hiệu lực thi hành\n2. Kể từ ngày Nghị định này có hiệu lực thi hành, các Nghị định sau đây hết hiệu lực thi hành:","highlight":["hết hiệu lực thi hành"]},{"label":"Nguyên văn đơn vị","text":"g) Nghị định số 85/2015/NĐ-CP ngày 01 tháng 10 năm 2015 của Chính phủ quy định chi tiết một số điều của Bộ luật Lao động về chính sách đối với lao động nữ;","highlight":[]},{"label":"Câu được trích xuất","text":"Nghị định số 85/2015/NĐ-CP ngày 01 tháng 10 năm 2015 của Chính phủ quy định chi tiết một số điều của Bộ luật Lao động về chính sách đối với lao động nữ","highlight":[]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ\nChủ thể: Nghị định số 85/2015/NĐ-CP ngày 01 tháng 10 năm 2015 của Chính phủ quy định chi tiết một số điều của Bộ luật Lao động về chính sách đối với lao động nữ\nHành vi: hết hiệu lực thi hành\nĐiều kiện: Kể từ ngày Nghị định này có hiệu lực thi hành","highlight":["hết hiệu lực thi hành","Tính quy phạm: nghĩa vụ"]}]},{"id":"R4edeefaa28","group":"Bộ luật Lao động 2019 Điều 21","heading":"điểm k khoản 1 Điều 21, Bộ luật Lao động 2019 (nghĩa vụ (từ: \"phải\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm k khoản 1 Điều 21, Bộ luật Lao động 2019\n45-2019-qh14/chapter-iii/section-1/article-21/clause-1/point-k","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 21. Nội dung hợp đồng lao động\n1. Hợp đồng lao động phải có những nội dung chủ yếu sau đây:","highlight":["Hợp đồng lao động phải có những nội dung chủ yếu sau đây"]},{"label":"Nguyên văn đơn vị","text":"k) Đào tạo, bồi dưỡng, nâng cao trình độ, kỹ năng nghề.","highlight":[]},{"label":"Câu được trích xuất","text":"Đào tạo, bồi dưỡng, nâng cao trình độ, kỹ năng nghề","highlight":[]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"phải\")\nHành vi: có\nĐối tượng: Đào tạo, bồi dưỡng, nâng cao trình độ, kỹ năng nghề","highlight":[]}]},{"id":"R490c8fc442","group":"NĐ 145/2020/NĐ-CP Điều 57","heading":"điểm b khoản 1 Điều 57, NĐ 145/2020/NĐ-CP (nghĩa vụ (từ: \"được\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm b khoản 1 Điều 57, NĐ 145/2020/NĐ-CP\n145-2020-nd-cp/chapter-vi/section-2/article-57/clause-1/point-b","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 57. Tiền lương làm thêm giờ vào ban đêm\nNgười lao động làm thêm giờ vào ban đêm theo khoản 3 Điều 98 của Bộ luật Lao động, được hưởng tiền lương tính theo công thức sau:\n1. Đối với người lao động hưởng lương theo thời gian, tiền lương làm thêm giờ vào ban đêm được tính như sau:\nTrong đó:","highlight":[]},{"label":"Nguyên văn đơn vị","text":"b) Tiền lương giờ vào ban ngày của ngày làm việc bình thường hoặc của ngày nghỉ hằng tuần hoặc của ngày nghỉ lễ, tết, ngày nghỉ có hưởng lương được xác định như sau:\nb1) Tiền lương giờ vào ban ngày của ngày làm việc bình thường, được tính ít nhất bằng 100% so với tiền lương giờ thực trả của công việc đang làm vào ngày làm việc bình thường đối với trường hợp người lao động không làm thêm giờ vào ban ngày của ngày đó (trước khi làm thêm giờ vào ban đêm); ít nhất bằng 150% so với tiền lương giờ thực trả của công việc đang làm vào ngày làm việc bình thường đối với trường hợp người lao động có làm thêm giờ vào ban ngày của ngày đó (trước khi làm thêm giờ vào ban đêm);\nb2) Tiền lương giờ vào ban ngày của ngày nghỉ hằng tuần, được tính ít nhất bằng 200% so với tiền lương giờ thực trả của công việc đang làm vào ngày làm việc bình thường;\nb3) Tiền lương giờ vào ban ngày của ngày nghỉ lễ, tết, ngày nghỉ có hưởng lương, được tính ít nhất bằng 300% so với tiền lương giờ thực trả của công việc đang làm vào ngày làm việc bình thường.","highlight":["đối với trường hợp người lao động không làm thêm giờ"]},{"label":"Câu được trích xuất","text":"b1) Tiền lương giờ vào ban ngày của ngày làm việc bình thường, được tính ít nhất bằng 100% so với tiền lương giờ thực trả của công việc đang làm vào ngày làm việc bình thường đối với trường hợp người lao động không làm thêm giờ vào ban ngày của ngày đó (trước khi làm thêm giờ vào ban đêm); ít nhất bằng 150% so với tiền lương giờ thực trả của công việc đang làm vào ngày làm việc bình thường đối với trường hợp người lao động có làm thêm giờ vào ban ngày của ngày đó (trước khi làm thêm giờ vào ban đêm)","highlight":["đối với trường hợp người lao động không làm thêm giờ"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"được\")\nHành vi: tính\nĐối tượng: ít nhất bằng 100% so với tiền lương giờ thực trả của công việc đang làm vào ngày làm việc bình thường\nĐiều kiện: trong trường hợp người lao động không làm thêm giờ vào ban ngày của ngày đó (trước khi làm thêm giờ vào ban đêm)","highlight":["Điều kiện: trong trường hợp","Đối tượng: ít nhất bằng 100%"]}]},{"id":"R4dbf1c4d33","group":"NĐ 145/2020/NĐ-CP Điều 57","heading":"điểm c khoản 2 Điều 57, NĐ 145/2020/NĐ-CP (nghĩa vụ (từ: \"được\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm c khoản 2 Điều 57, NĐ 145/2020/NĐ-CP\n145-2020-nd-cp/chapter-vi/section-2/article-57/clause-2/point-c","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 57. Tiền lương làm thêm giờ vào ban đêm\nNgười lao động làm thêm giờ vào ban đêm theo khoản 3 Điều 98 của Bộ luật Lao động, được hưởng tiền lương tính theo công thức sau:\n2. Đối với người lao động hưởng lương theo sản phẩm, tiền lương làm thêm giờ vào ban đêm được tính như sau:\nTrong đó, đơn giá tiền lương sản phẩm vào ban ngày của ngày làm việc bình thường hoặc của ngày nghỉ hằng tuần hoặc của ngày nghỉ lễ, tết, ngày nghỉ có hưởng lương được xác định như sau:","highlight":[]},{"label":"Nguyên văn đơn vị","text":"c) Đơn giá tiền lương sản phẩm vào ban ngày của ngày nghỉ lễ, tết, ngày nghỉ có hưởng lương, được tính ít nhất 300% so với đơn giá tiền lương sản phẩm của ngày làm việc bình thường.","highlight":["được tính ít nhất 300%"]},{"label":"Câu được trích xuất","text":"Đơn giá tiền lương sản phẩm vào ban ngày của ngày nghỉ lễ, tết, ngày nghỉ có hưởng lương, được tính ít nhất 300% so với đơn giá tiền lương sản phẩm của ngày làm việc bình thường","highlight":["được tính ít nhất 300%"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"được\")\nHành vi: được tính\nĐối tượng: Đơn giá tiền lương sản phẩm vào ban ngày của ngày nghỉ lễ, tết, ngày nghỉ có hưởng lương\nĐịnh lượng: ít nhất 300% so với đơn giá tiền lương sản phẩm của ngày làm việc bình thường","highlight":["Hành vi: được tính"]}]},{"id":"R52fb44159f","group":"Bộ luật Lao động 2019 Điều 113","heading":"khoản 3 Điều 113, Bộ luật Lao động 2019 (quyền (từ: \"được\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 3 Điều 113, Bộ luật Lao động 2019\n45-2019-qh14/chapter-vii/section-2/article-113/clause-3","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 113. Nghỉ hằng năm","highlight":[]},{"label":"Nguyên văn đơn vị","text":"3. Trường hợp do thôi việc, bị mất việc làm mà chưa nghỉ hằng năm hoặc chưa nghỉ hết số ngày nghỉ hằng năm thì được người sử dụng lao động thanh toán tiền lương cho những ngày chưa nghỉ.","highlight":["thì được người sử dụng lao động thanh toán tiền lương cho những ngày chưa nghỉ"]},{"label":"Câu được trích xuất","text":"Trường hợp do thôi việc, bị mất việc làm mà chưa nghỉ hằng năm hoặc chưa nghỉ hết số ngày nghỉ hằng năm thì được người sử dụng lao động thanh toán tiền lương cho những ngày chưa nghỉ","highlight":["thì được người sử dụng lao động thanh toán tiền lương cho những ngày chưa nghỉ"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: quyền (từ: \"được\")\nChủ thể: người sử dụng lao động\nHành vi: thanh toán tiền lương\nĐối tượng: cho những ngày chưa nghỉ\nBên thụ hưởng: người lao động","highlight":["Tính quy phạm: quyền","Chủ thể: người sử dụng lao động"]}]},{"id":"R5284dd47c5","group":"NĐ 145/2020/NĐ-CP Điều 70","heading":"điểm b khoản 2 Điều 70, NĐ 145/2020/NĐ-CP (nghĩa vụ (từ: \"phải\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm b khoản 2 Điều 70, NĐ 145/2020/NĐ-CP\n145-2020-nd-cp/chapter-viii/article-70/clause-2/point-b","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 70. Trình tự, thủ tục xử lý kỷ luật lao động\nTrình tự, thủ tục xử lý kỷ luật lao động tại khoản 6 Điều 122 của Bộ luật Lao động được quy định như sau:\n2. Trong thời hiệu xử lý kỷ luật lao động quy định tại khoản 1, khoản 2 Điều 123 của Bộ luật Lao động, người sử dụng lao động tiến hành họp xử lý kỷ luật lao động như sau:","highlight":[]},{"label":"Nguyên văn đơn vị","text":"b) Khi nhận được thông báo của người sử dụng lao động, các thành phần phải tham dự họp quy định tại điểm b, điểm c khoản 1 Điều 122 của Bộ luật Lao động phải xác nhận tham dự cuộc họp với người sử dụng lao động. Trường hợp một trong các thành phần phải tham dự không thể tham dự họp theo thời gian, địa điểm đã thông báo thì người lao động và người sử dụng lao động thỏa thuận việc thay đổi thời gian, địa điểm họp; trường hợp hai bên không thỏa thuận được thì người sử dụng lao động quyết định thời gian, địa điểm họp;","highlight":["các thành phần phải tham dự họp quy định tại điểm b, điểm c khoản 1 Điều 122"]},{"label":"Câu được trích xuất","text":"Khi nhận được thông báo của người sử dụng lao động, các thành phần phải tham dự họp quy định tại điểm b, điểm c khoản 1 Điều 122 của Bộ luật Lao động phải xác nhận tham dự cuộc họp với người sử dụng lao động","highlight":["các thành phần phải tham dự họp quy định tại điểm b, điểm c khoản 1 Điều 122"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"phải\")\nChủ thể: các thành phần tham dự họp quy định tại điểm b, điểm c khoản 1 Điều 122 của Bộ luật Lao động\nHành vi: xác nhận tham dự cuộc họp với người sử dụng lao động\nĐiều kiện: Khi nhận được thông báo của người sử dụng lao động","highlight":["Chủ thể: các thành phần tham dự họp"]}]},{"id":"R153ed78059","group":"Bộ luật Lao động 2019 Điều 35","heading":"điểm b khoản 2 Điều 35, Bộ luật Lao động 2019 (quyền (từ: \"có quyền\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm b khoản 2 Điều 35, Bộ luật Lao động 2019\n45-2019-qh14/chapter-iii/section-3/article-35/clause-2/point-b","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 35. Quyền đơn phương chấm dứt hợp đồng lao động của người lao động\n2. Người lao động có quyền đơn phương chấm dứt hợp đồng lao động không cần báo trước trong trường hợp sau đây:","highlight":["Người lao động có quyền đơn phương chấm dứt hợp đồng lao động không cần báo trước"]},{"label":"Nguyên văn đơn vị","text":"b) Không được trả đủ lương hoặc trả lương không đúng thời hạn, trừ trường hợp quy định tại khoản 4 Điều 97 của Bộ luật này;","highlight":["trừ trường hợp quy định tại khoản 4 Điều 97 của Bộ luật này"]},{"label":"Câu được trích xuất","text":"Không được trả đủ lương hoặc trả lương không đúng thời hạn, trừ trường hợp quy định tại khoản 4 Điều 97 của Bộ luật này","highlight":["trừ trường hợp quy định tại khoản 4 Điều 97 của Bộ luật này"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: quyền (từ: \"có quyền\")\nChủ thể: Người lao động\nHành vi: đơn phương chấm dứt\nĐối tượng: hợp đồng lao động\nĐiều kiện: Không được trả đủ lương hoặc trả lương không đúng thời hạn\nNgoại lệ: trường hợp quy định tại khoản 4 Điều 97 của Bộ luật này\nThời hạn: không cần báo trước","highlight":[]}]},{"id":"Rafd5b2a29d","group":"Bộ luật Lao động 2019 Điều 125","heading":"khoản 3 Điều 125, Bộ luật Lao động 2019 (chưa rõ)","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 3 Điều 125, Bộ luật Lao động 2019\n45-2019-qh14/chapter-viii/section-1/article-125/clause-3","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 125. Áp dụng hình thức xử lý kỷ luật sa thải\nHình thức xử lý kỷ luật sa thải được người sử dụng lao động áp dụng trong trường hợp sau đây:","highlight":[]},{"label":"Nguyên văn đơn vị","text":"3. Người lao động bị xử lý kỷ luật kéo dài thời hạn nâng lương hoặc cách chức mà tái phạm trong thời gian chưa xóa kỷ luật. Tái phạm là trường hợp người lao động lặp lại hành vi vi phạm đã bị xử lý kỷ luật mà chưa được xóa kỷ luật theo quy định tại Điều 126 của Bộ luật này;","highlight":["kéo dài thời hạn nâng lương hoặc cách chức mà tái phạm trong thời gian chưa xóa kỷ luật"]},{"label":"Câu được trích xuất","text":"Người lao động bị xử lý kỷ luật kéo dài thời hạn nâng lương hoặc cách chức mà tái phạm trong thời gian chưa xóa kỷ luật","highlight":["kéo dài thời hạn nâng lương hoặc cách chức mà tái phạm trong thời gian chưa xóa kỷ luật"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: chưa rõ\nChủ thể: người sử dụng lao động\nHành vi: áp dụng hình thức xử lý kỷ luật sa thải\nĐiều kiện: Người lao động bị xử lý kỷ luật kéo dài thời hạn nâng lương hoặc cách chức mà tái phạm trong thời gian chưa xóa kỷ luật","highlight":["kéo dài thời hạn nâng lương hoặc cách chức mà tái phạm trong thời gian chưa xóa kỷ luật"]}]},{"id":"R5f8df93dd9","group":"NĐ 12/2022/NĐ-CP Điều 10","heading":"điểm a khoản 2 Điều 10, NĐ 12/2022/NĐ-CP (cấm)","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm a khoản 2 Điều 10, NĐ 12/2022/NĐ-CP\n12-2022-nd-cp/chapter-ii/article-10/clause-2/point-a","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 10. Vi phạm quy định về thử việc\n2. Phạt tiền từ 2.000.000 đồng đến 5.000.000 đồng đối với người sử dụng lao động có một trong các hành vi sau đây:","highlight":["Phạt tiền từ 2.000.000 đồng đến 5.000.000 đồng"]},{"label":"Nguyên văn đơn vị","text":"a) Yêu cầu người lao động thử việc quá 01 lần đối với một công việc;","highlight":["Yêu cầu người lao động thử việc quá 01 lần đối với một công việc"]},{"label":"Câu được trích xuất","text":"Yêu cầu người lao động thử việc quá 01 lần đối với một công việc","highlight":["Yêu cầu người lao động thử việc quá 01 lần đối với một công việc"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: cấm\nChủ thể: người sử dụng lao động\nHành vi: Yêu cầu người lao động thử việc\nĐiều kiện: đối với một công việc\nĐịnh lượng: quá 01 lần\nKết quả: Phạt tiền từ 2.000.000 đồng đến 5.000.000 đồng","highlight":["Phạt tiền từ 2.000.000 đồng đến 5.000.000 đồng"]}]},{"id":"R3cca63b47d","group":"Bộ luật Lao động 2019 Điều 96","heading":"khoản 3 Điều 96, Bộ luật Lao động 2019 (chưa rõ)","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 3 Điều 96, Bộ luật Lao động 2019\n45-2019-qh14/chapter-vi/article-96/clause-3","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 96. Hình thức trả lương","highlight":[]},{"label":"Nguyên văn đơn vị","text":"3. Chính phủ quy định chi tiết Điều này.","highlight":["Chính phủ quy định chi tiết Điều này"]},{"label":"Câu được trích xuất","text":"Chính phủ quy định chi tiết Điều này","highlight":["Chính phủ quy định chi tiết Điều này"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: chưa rõ\nChủ thể: Chính phủ\nHành vi: quy định chi tiết Điều này","highlight":[]}]},{"id":"Rdd2e6d5490","group":"Bộ luật Lao động 2019 Điều 125","heading":"khoản 4 Điều 125, Bộ luật Lao động 2019 (chưa rõ)","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 4 Điều 125, Bộ luật Lao động 2019\n45-2019-qh14/chapter-viii/section-1/article-125/clause-4","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 125. Áp dụng hình thức xử lý kỷ luật sa thải\nHình thức xử lý kỷ luật sa thải được người sử dụng lao động áp dụng trong trường hợp sau đây:","highlight":[]},{"label":"Nguyên văn đơn vị","text":"4. Người lao động tự ý bỏ việc 05 ngày cộng dồn trong thời hạn 30 ngày hoặc 20 ngày cộng dồn trong thời hạn 365 ngày tính từ ngày đầu tiên tự ý bỏ việc mà không có lý do chính đáng.\nTrường hợp được coi là có lý do chính đáng bao gồm thiên tai, hỏa hoạn, bản thân, thân nhân bị ốm có xác nhận của cơ sở khám bệnh, chữa bệnh có thẩm quyền và trường hợp khác được quy định trong nội quy lao động.","highlight":["Trường hợp được coi là có lý do chính đáng","mà không có lý do chính đáng"]},{"label":"Câu được trích xuất","text":"Trường hợp được coi là có lý do chính đáng bao gồm thiên tai, hỏa hoạn, bản thân, thân nhân bị ốm có xác nhận của cơ sở khám bệnh, chữa bệnh có thẩm quyền và trường hợp khác được quy định trong nội quy lao động","highlight":["Trường hợp được coi là có lý do chính đáng"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: chưa rõ\nChủ thể: người sử dụng lao động\nHành vi: áp dụng hình thức xử lý kỷ luật sa thải\nĐiều kiện: Trường hợp được coi là có lý do chính đáng bao gồm thiên tai, hỏa hoạn, bản thân, thân nhân bị ốm có xác nhận của cơ sở khám bệnh, chữa bệnh có thẩm quyền và trường hợp khác được quy định trong nội quy lao động","highlight":["Trường hợp được coi là có lý do chính đáng","Hành vi: áp dụng hình thức xử lý kỷ luật sa thải"]}]},{"id":"R3235cbdb1d","group":"Bộ luật Lao động 2019 Điều 29","heading":"khoản 3 Điều 29, Bộ luật Lao động 2019 (quyền (từ: \"được\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 3 Điều 29, Bộ luật Lao động 2019\n45-2019-qh14/chapter-iii/section-2/article-29/clause-3","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 29. Chuyển người lao động làm công việc khác so với hợp đồng lao động","highlight":[]},{"label":"Nguyên văn đơn vị","text":"3. Người lao động chuyển sang làm công việc khác so với hợp đồng lao động được trả lương theo công việc mới. Nếu tiền lương của công việc mới thấp hơn tiền lương của công việc cũ thì được giữ nguyên tiền lương của công việc cũ trong thời hạn 30 ngày làm việc. Tiền lương theo công việc mới ít nhất phải bằng 85% tiền lương của công việc cũ nhưng không thấp hơn mức lương tối thiểu.","highlight":["được giữ nguyên tiền lương của công việc cũ trong thời hạn 30 ngày làm việc","Người lao động chuyển sang làm công việc khác"]},{"label":"Câu được trích xuất","text":"Nếu tiền lương của công việc mới thấp hơn tiền lương của công việc cũ thì được giữ nguyên tiền lương của công việc cũ trong thời hạn 30 ngày làm việc","highlight":["được giữ nguyên tiền lương của công việc cũ trong thời hạn 30 ngày làm việc"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: quyền (từ: \"được\")\nChủ thể: người lao động\nHành vi: giữ nguyên tiền lương của công việc cũ\nBên thụ hưởng: người lao động\nĐiều kiện: Nếu tiền lương của công việc mới thấp hơn tiền lương của công việc cũ\nThời hạn: trong thời hạn 30 ngày làm việc","highlight":[]}]},{"id":"R0d73ed4bb3","group":"Bộ luật Lao động 2019 Điều 112","heading":"điểm đ khoản 1 Điều 112, Bộ luật Lao động 2019 (quyền (từ: \"được\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm đ khoản 1 Điều 112, Bộ luật Lao động 2019\n45-2019-qh14/chapter-vii/section-2/article-112/clause-1/point-đ","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 112. Nghỉ lễ, tết\n1. Người lao động được nghỉ làm việc, hưởng nguyên lương trong những ngày lễ, tết sau đây:","highlight":["Người lao động được nghỉ làm việc, hưởng nguyên lương trong những ngày lễ, tết sau đây"]},{"label":"Nguyên văn đơn vị","text":"đ) Quốc khánh: 02 ngày (ngày 02 tháng 9 dương lịch và 01 ngày liền kề trước hoặc sau);","highlight":[]},{"label":"Câu được trích xuất","text":"Quốc khánh: 02 ngày (ngày 02 tháng 9 dương lịch và 01 ngày liền kề trước hoặc sau)","highlight":[]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: quyền (từ: \"được\")\nChủ thể: Người lao động\nHành vi: nghỉ làm việc, hưởng nguyên lương\nĐối tượng: Quốc khánh: 02 ngày (ngày 02 tháng 9 dương lịch và 01 ngày liền kề trước hoặc sau)\nĐiều kiện: trong những ngày lễ, tết sau đây\nĐịnh lượng: 02 ngày","highlight":[]}]},{"id":"Rb57fa267a9","group":"Bộ luật Lao động 2019 Điều 21","heading":"điểm a khoản 1 Điều 21, Bộ luật Lao động 2019 (nghĩa vụ (từ: \"phải\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm a khoản 1 Điều 21, Bộ luật Lao động 2019\n45-2019-qh14/chapter-iii/section-1/article-21/clause-1/point-a","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 21. Nội dung hợp đồng lao động\n1. Hợp đồng lao động phải có những nội dung chủ yếu sau đây:","highlight":["Hợp đồng lao động phải có những nội dung chủ yếu sau đây"]},{"label":"Nguyên văn đơn vị","text":"a) Tên, địa chỉ của người sử dụng lao động và họ tên, chức danh của người giao kết hợp đồng lao động bên phía người sử dụng lao động;","highlight":[]},{"label":"Câu được trích xuất","text":"Tên, địa chỉ của người sử dụng lao động và họ tên, chức danh của người giao kết hợp đồng lao động bên phía người sử dụng lao động","highlight":[]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"phải\")\nChủ thể: Hợp đồng lao động\nHành vi: có\nĐối tượng: Tên, địa chỉ của người sử dụng lao động và họ tên, chức danh của người giao kết hợp đồng lao động bên phía người sử dụng lao động","highlight":["Chủ thể: Hợp đồng lao động"]}]},{"id":"R9f3b937bc6","group":"NĐ 12/2022/NĐ-CP Điều 10","heading":"điểm a khoản 2 Điều 10, NĐ 12/2022/NĐ-CP (cấm)","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm a khoản 2 Điều 10, NĐ 12/2022/NĐ-CP\n12-2022-nd-cp/chapter-ii/article-10/clause-2/point-a","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 10. Vi phạm quy định về thử việc\n2. Phạt tiền từ 2.000.000 đồng đến 5.000.000 đồng đối với người sử dụng lao động có một trong các hành vi sau đây:","highlight":[]},{"label":"Nguyên văn đơn vị","text":"a) Yêu cầu người lao động thử việc quá 01 lần đối với một công việc;","highlight":["Yêu cầu người lao động thử việc quá 01 lần đối với một công việc"]},{"label":"Câu được trích xuất","text":"Yêu cầu người lao động thử việc quá 01 lần đối với một công việc","highlight":["Yêu cầu người lao động thử việc quá 01 lần đối với một công việc"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: cấm\nHành vi: Yêu cầu thử việc\nĐối tượng: người lao động quá 01 lần đối với một công việc","highlight":["Hành vi: Yêu cầu thử việc","Đối tượng: người lao động quá 01 lần"]}]},{"id":"R0341cfb653","group":"Bộ luật Lao động 2019 Điều 122","heading":"khoản 6 Điều 122, Bộ luật Lao động 2019 (chưa rõ)","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 6 Điều 122, Bộ luật Lao động 2019\n45-2019-qh14/chapter-viii/section-1/article-122/clause-6","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 122. Nguyên tắc, trình tự, thủ tục xử lý kỷ luật lao động","highlight":[]},{"label":"Nguyên văn đơn vị","text":"6. Chính phủ quy định trình tự, thủ tục xử lý kỷ luật lao động.","highlight":["Chính phủ quy định trình tự, thủ tục xử lý kỷ luật lao động"]},{"label":"Câu được trích xuất","text":"Chính phủ quy định trình tự, thủ tục xử lý kỷ luật lao động","highlight":["Chính phủ quy định trình tự, thủ tục xử lý kỷ luật lao động"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: chưa rõ\nChủ thể: Chính phủ\nHành vi: quy định\nĐối tượng: trình tự, thủ tục xử lý kỷ luật lao động","highlight":[]}]},{"id":"Rf384514175","group":"Bộ luật Lao động 2019 Điều 30","heading":"điểm đ khoản 1 Điều 30, Bộ luật Lao động 2019 (được phép (từ: \"được\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm đ khoản 1 Điều 30, Bộ luật Lao động 2019\n45-2019-qh14/chapter-iii/section-2/article-30/clause-1/point-đ","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 30. Tạm hoãn thực hiện hợp đồng lao động\n1. Các trường hợp tạm hoãn thực hiện hợp đồng lao động bao gồm:","highlight":["Các trường hợp tạm hoãn thực hiện hợp đồng lao động bao gồm"]},{"label":"Nguyên văn đơn vị","text":"đ) Người lao động được bổ nhiệm làm người quản lý doanh nghiệp của công ty trách nhiệm hữu hạn một thành viên do Nhà nước nắm giữ 100% vốn điều lệ;","highlight":["Người lao động được bổ nhiệm làm người quản lý doanh nghiệp"]},{"label":"Câu được trích xuất","text":"Người lao động được bổ nhiệm làm người quản lý doanh nghiệp của công ty trách nhiệm hữu hạn một thành viên do Nhà nước nắm giữ 100% vốn điều lệ","highlight":["Người lao động được bổ nhiệm làm người quản lý doanh nghiệp"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: được phép (từ: \"được\")\nChủ thể: Người lao động\nHành vi: bổ nhiệm làm\nĐối tượng: người quản lý doanh nghiệp của công ty trách nhiệm hữu hạn một thành viên do Nhà nước nắm giữ 100% vốn điều lệ\nKết quả: tạm hoãn thực hiện hợp đồng lao động","highlight":["Tính quy phạm: được phép"]}]},{"id":"R0157003c8a","group":"Bộ luật Lao động 2019 Điều 21","heading":"điểm d khoản 1 Điều 21, Bộ luật Lao động 2019 (nghĩa vụ (từ: \"phải\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm d khoản 1 Điều 21, Bộ luật Lao động 2019\n45-2019-qh14/chapter-iii/section-1/article-21/clause-1/point-d","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 21. Nội dung hợp đồng lao động\n1. Hợp đồng lao động phải có những nội dung chủ yếu sau đây:","highlight":["Hợp đồng lao động phải có những nội dung chủ yếu sau đây"]},{"label":"Nguyên văn đơn vị","text":"d) Thời hạn của hợp đồng lao động;","highlight":[]},{"label":"Câu được trích xuất","text":"Thời hạn của hợp đồng lao động","highlight":[]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"phải\")\nChủ thể: Hợp đồng lao động\nHành vi: có\nĐối tượng: Thời hạn của hợp đồng lao động","highlight":["Chủ thể: Hợp đồng lao động"]}]},{"id":"Rdcd23705cd","group":"NĐ 12/2022/NĐ-CP Điều 17","heading":"điểm a khoản 5 Điều 17, NĐ 12/2022/NĐ-CP (nghĩa vụ (từ: \"Buộc\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm a khoản 5 Điều 17, NĐ 12/2022/NĐ-CP\n12-2022-nd-cp/chapter-ii/article-17/clause-5/point-a","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 17. Vi phạm quy định về tiền lương\n5. Biện pháp khắc phục hậu quả","highlight":[]},{"label":"Nguyên văn đơn vị","text":"a) Buộc người sử dụng lao động trả đủ tiền lương cộng với khoản tiền lãi của số tiền lương chậm trả, trả thiếu cho người lao động tính theo mức lãi suất tiền gửi không kỳ hạn cao nhất của các ngân hàng thương mại nhà nước công bố tại thời điểm xử phạt đối với hành vi vi phạm quy định tại khoản 2, khoản 3 Điều này;","highlight":["Buộc người sử dụng lao động trả đủ tiền lương","đối với hành vi vi phạm quy định tại khoản 2, khoản 3 Điều này"]},{"label":"Câu được trích xuất","text":"Buộc người sử dụng lao động trả đủ tiền lương cộng với khoản tiền lãi của số tiền lương chậm trả, trả thiếu cho người lao động tính theo mức lãi suất tiền gửi không kỳ hạn cao nhất của các ngân hàng thương mại nhà nước công bố tại thời điểm xử phạt đối với hành vi vi phạm quy định tại khoản 2, khoản 3 Điều này","highlight":["Buộc người sử dụng lao động trả đủ tiền lương","đối với hành vi vi phạm quy định tại khoản 2, khoản 3 Điều này"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"Buộc\")\nChủ thể: người sử dụng lao động\nHành vi: trả đủ tiền lương cộng với khoản tiền lãi của số tiền lương chậm trả, trả thiếu\nBên thụ hưởng: người lao động\nĐiều kiện: tính theo mức lãi suất tiền gửi không kỳ hạn cao nhất của các ngân hàng thương mại nhà nước công bố tại thời điểm xử phạt","highlight":[]}]},{"id":"Rfc356c1ac6","group":"Bộ luật Lao động 2019 Điều 21","heading":"điểm g khoản 1 Điều 21, Bộ luật Lao động 2019 (nghĩa vụ (từ: \"phải\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm g khoản 1 Điều 21, Bộ luật Lao động 2019\n45-2019-qh14/chapter-iii/section-1/article-21/clause-1/point-g","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 21. Nội dung hợp đồng lao động\n1. Hợp đồng lao động phải có những nội dung chủ yếu sau đây:","highlight":["Hợp đồng lao động phải có những nội dung chủ yếu sau đây"]},{"label":"Nguyên văn đơn vị","text":"g) Thời giờ làm việc, thời giờ nghỉ ngơi;","highlight":[]},{"label":"Câu được trích xuất","text":"Thời giờ làm việc, thời giờ nghỉ ngơi","highlight":[]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"phải\")\nHành vi: có\nĐối tượng: Thời giờ làm việc, thời giờ nghỉ ngơi","highlight":[]}]},{"id":"R024df825db","group":"Bộ luật Lao động 2019 Điều 102","heading":"khoản 2 Điều 102, Bộ luật Lao động 2019 (quyền (từ: \"có権\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 2 Điều 102, Bộ luật Lao động 2019\n45-2019-qh14/chapter-vi/article-102/clause-2","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 102. Khấu trừ tiền lương","highlight":[]},{"label":"Nguyên văn đơn vị","text":"2. Người lao động có quyền được biết lý do khấu trừ tiền lương của mình.","highlight":["có quyền được biết lý do khấu trừ tiền lương của mình"]},{"label":"Câu được trích xuất","text":"Người lao động có quyền được biết lý do khấu trừ tiền lương của mình","highlight":["có quyền được biết lý do khấu trừ tiền lương của mình"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: quyền (từ: \"có権\")\nChủ thể: Người lao động\nHành vi: biết\nĐối tượng: lý do khấu trừ tiền lương của mình","highlight":["có権"]}]},{"id":"R73aff9f2fb","group":"Bộ luật Lao động 2019 Điều 29","heading":"khoản 3 Điều 29, Bộ luật Lao động 2019 (nghĩa vụ (từ: \"phải\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 3 Điều 29, Bộ luật Lao động 2019\n45-2019-qh14/chapter-iii/section-2/article-29/clause-3","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 29. Chuyển người lao động làm công việc khác so với hợp đồng lao động","highlight":[]},{"label":"Nguyên văn đơn vị","text":"3. Người lao động chuyển sang làm công việc khác so với hợp đồng lao động được trả lương theo công việc mới. Nếu tiền lương của công việc mới thấp hơn tiền lương của công việc cũ thì được giữ nguyên tiền lương của công việc cũ trong thời hạn 30 ngày làm việc. Tiền lương theo công việc mới ít nhất phải bằng 85% tiền lương của công việc cũ nhưng không thấp hơn mức lương tối thiểu.","highlight":["ít nhất phải bằng 85% tiền lương của công việc cũ"]},{"label":"Câu được trích xuất","text":"Tiền lương theo công việc mới ít nhất phải bằng 85% tiền lương của công việc cũ nhưng không thấp hơn mức lương tối thiểu","highlight":["ít nhất phải bằng 85% tiền lương của công việc cũ"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"phải\")\nHành vi: bằng 85% tiền lương của công việc cũ\nBên thụ hưởng: người lao động\nĐịnh lượng: 85%","highlight":["Hành vi: bằng 85%"]}]},{"id":"Rea24e268be","group":"Bộ luật Lao động 2019 Điều 101","heading":"khoản 2 Điều 101, Bộ luật Lao động 2019 (nghĩa vụ (từ: \"phải\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 2 Điều 101, Bộ luật Lao động 2019\n45-2019-qh14/chapter-vi/article-101/clause-2","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 101. Tạm ứng tiền lương","highlight":[]},{"label":"Nguyên văn đơn vị","text":"2. Người sử dụng lao động phải cho người lao động tạm ứng tiền lương tương ứng với số ngày người lao động tạm thời nghỉ việc để thực hiện nghĩa vụ công dân từ 01 tuần trở lên nhưng tối đa không quá 01 tháng tiền lương theo hợp đồng lao động và người lao động phải hoàn trả số tiền đã tạm ứng.\nNgười lao động nhập ngũ theo quy định của Luật Nghĩa vụ quân sự thì không được tạm ứng tiền lương.","highlight":["người lao động phải hoàn trả số tiền đã tạm ứng"]},{"label":"Câu được trích xuất","text":"Người sử dụng lao động phải cho người lao động tạm ứng tiền lương tương ứng với số ngày người lao động tạm thời nghỉ việc để thực hiện nghĩa vụ công dân từ 01 tuần trở lên nhưng tối đa không quá 01 tháng tiền lương theo hợp đồng lao động và người lao động phải hoàn trả số tiền đã tạm ứng","highlight":["người lao động phải hoàn trả số tiền đã tạm ứng"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"phải\")\nChủ thể: người lao động\nHành vi: hoàn trả số tiền đã tạm ứng","highlight":[]}]},{"id":"R9f53f93d23","group":"NĐ 145/2020/NĐ-CP Điều 57","heading":"điểm b khoản 1 Điều 57, NĐ 145/2020/NĐ-CP (nghĩa vụ (từ: \"được\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm b khoản 1 Điều 57, NĐ 145/2020/NĐ-CP\n145-2020-nd-cp/chapter-vi/section-2/article-57/clause-1/point-b","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 57. Tiền lương làm thêm giờ vào ban đêm\nNgười lao động làm thêm giờ vào ban đêm theo khoản 3 Điều 98 của Bộ luật Lao động, được hưởng tiền lương tính theo công thức sau:\n1. Đối với người lao động hưởng lương theo thời gian, tiền lương làm thêm giờ vào ban đêm được tính như sau:\nTrong đó:","highlight":[]},{"label":"Nguyên văn đơn vị","text":"b) Tiền lương giờ vào ban ngày của ngày làm việc bình thường hoặc của ngày nghỉ hằng tuần hoặc của ngày nghỉ lễ, tết, ngày nghỉ có hưởng lương được xác định như sau:\nb1) Tiền lương giờ vào ban ngày của ngày làm việc bình thường, được tính ít nhất bằng 100% so với tiền lương giờ thực trả của công việc đang làm vào ngày làm việc bình thường đối với trường hợp người lao động không làm thêm giờ vào ban ngày của ngày đó (trước khi làm thêm giờ vào ban đêm); ít nhất bằng 150% so với tiền lương giờ thực trả của công việc đang làm vào ngày làm việc bình thường đối với trường hợp người lao động có làm thêm giờ vào ban ngày của ngày đó (trước khi làm thêm giờ vào ban đêm);\nb2) Tiền lương giờ vào ban ngày của ngày nghỉ hằng tuần, được tính ít nhất bằng 200% so với tiền lương giờ thực trả của công việc đang làm vào ngày làm việc bình thường;\nb3) Tiền lương giờ vào ban ngày của ngày nghỉ lễ, tết, ngày nghỉ có hưởng lương, được tính ít nhất bằng 300% so với tiền lương giờ thực trả của công việc đang làm vào ngày làm việc bình thường.","highlight":["đối với trường hợp người lao động có làm thêm giờ"]},{"label":"Câu được trích xuất","text":"b1) Tiền lương giờ vào ban ngày của ngày làm việc bình thường, được tính ít nhất bằng 100% so với tiền lương giờ thực trả của công việc đang làm vào ngày làm việc bình thường đối với trường hợp người lao động không làm thêm giờ vào ban ngày của ngày đó (trước khi làm thêm giờ vào ban đêm); ít nhất bằng 150% so với tiền lương giờ thực trả của công việc đang làm vào ngày làm việc bình thường đối với trường hợp người lao động có làm thêm giờ vào ban ngày của ngày đó (trước khi làm thêm giờ vào ban đêm)","highlight":["đối với trường hợp người lao động có làm thêm giờ"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"được\")\nHành vi: tính\nĐối tượng: ít nhất bằng 150% so với tiền lương giờ thực trả của công việc đang làm vào ngày làm việc bình thường\nĐiều kiện: trong trường hợp người lao động có làm thêm giờ vào ban ngày của ngày đó (trước khi làm thêm giờ vào ban đêm)","highlight":["Điều kiện: trong trường hợp","Đối tượng: ít nhất bằng 150%"]}]},{"id":"Rea3104a0e3","group":"Bộ luật Lao động 2019 Điều 95","heading":"khoản 3 Điều 95, Bộ luật Lao động 2019 (nghĩa vụ (từ: \"phải\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 3 Điều 95, Bộ luật Lao động 2019\n45-2019-qh14/chapter-vi/article-95/clause-3","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 95. Trả lương","highlight":[]},{"label":"Nguyên văn đơn vị","text":"3. Mỗi lần trả lương, người sử dụng lao động phải thông báo bảng kê trả lương cho người lao động, trong đó ghi rõ tiền lương, tiền lương làm thêm giờ, tiền lương làm việc vào ban đêm, nội dung và số tiền bị khấu trừ (nếu có).","highlight":["phải thông báo bảng kê trả lương cho người lao động"]},{"label":"Câu được trích xuất","text":"Mỗi lần trả lương, người sử dụng lao động phải thông báo bảng kê trả lương cho người lao động, trong đó ghi rõ tiền lương, tiền lương làm thêm giờ, tiền lương làm việc vào ban đêm, nội dung và số tiền bị khấu trừ (nếu có)","highlight":["phải thông báo bảng kê trả lương cho người lao động"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"phải\")\nChủ thể: người sử dụng lao động\nHành vi: ghi rõ tiền lương, tiền lương làm thêm giờ, tiền lương làm việc vào ban đêm, nội dung và số tiền bị khấu trừ (nếu có)\nĐiều kiện: trong đó","highlight":["Điều kiện: trong đó"]}]},{"id":"Rd36beb8092","group":"Bộ luật Lao động 2019 Điều 122","heading":"điểm c khoản 1 Điều 122, Bộ luật Lao động 2019 (nghĩa vụ (từ: \"phải\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm c khoản 1 Điều 122, Bộ luật Lao động 2019\n45-2019-qh14/chapter-viii/section-1/article-122/clause-1/point-c","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 122. Nguyên tắc, trình tự, thủ tục xử lý kỷ luật lao động\n1. Việc xử lý kỷ luật lao động được quy định như sau:","highlight":[]},{"label":"Nguyên văn đơn vị","text":"c) Người lao động phải có mặt và có quyền tự bào chữa, nhờ luật sư hoặc tổ chức đại diện người lao động bào chữa; trường hợp là người chưa đủ 15 tuổi thì phải có sự tham gia của người đại diện theo pháp luật;","highlight":["thì phải có sự tham gia của người đại diện theo pháp luật"]},{"label":"Câu được trích xuất","text":"Người lao động phải có mặt và có quyền tự bào chữa, nhờ luật sư hoặc tổ chức đại diện người lao động bào chữa; trường hợp là người chưa đủ 15 tuổi thì phải có sự tham gia của người đại diện theo pháp luật","highlight":["thì phải có sự tham gia của người đại diện theo pháp luật"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"phải\")\nHành vi: thì có sự tham gia của người đại diện theo pháp luật\nĐiều kiện: trường hợp là người chưa đủ 15 tuổi","highlight":["Hành vi: thì có sự tham gia"]}]},{"id":"R0ac942e1a9","group":"Bộ luật Lao động 2019 Điều 27","heading":"khoản 1 Điều 27, Bộ luật Lao động 2019 (chưa rõ)","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 1 Điều 27, Bộ luật Lao động 2019\n45-2019-qh14/chapter-iii/section-1/article-27/clause-1","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 27. Kết thúc thời gian thử việc","highlight":[]},{"label":"Nguyên văn đơn vị","text":"1. Khi kết thúc thời gian thử việc, người sử dụng lao động phải thông báo kết quả thử việc cho người lao động.\nTrường hợp thử việc đạt yêu cầu thì người sử dụng lao động tiếp tục thực hiện hợp đồng lao động đã giao kết đối với trường hợp thỏa thuận thử việc trong hợp đồng lao động hoặc phải giao kết hợp đồng lao động đối với trường hợp giao kết hợp đồng thử việc.\nTrường hợp thử việc không đạt yêu cầu thì chấm dứt hợp đồng lao động đã giao kết hoặc hợp đồng thử việc.","highlight":["người sử dụng lao động tiếp tục thực hiện hợp đồng lao động đã giao kết đối với trường hợp thỏa thuận thử việc trong hợp đồng lao động"]},{"label":"Câu được trích xuất","text":"Trường hợp thử việc đạt yêu cầu thì người sử dụng lao động tiếp tục thực hiện hợp đồng lao động đã giao kết đối với trường hợp thỏa thuận thử việc trong hợp đồng lao động hoặc phải giao kết hợp đồng lao động đối với trường hợp giao kết hợp đồng thử việc","highlight":["người sử dụng lao động tiếp tục thực hiện hợp đồng lao động đã giao kết đối với trường hợp thỏa thuận thử việc trong hợp đồng lao động"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: chưa rõ\nChủ thể: người sử dụng lao động\nHành vi: tiếp tục thực hiện\nĐối tượng: hợp đồng lao động đã giao kết\nĐiều kiện: Trường hợp thử việc đạt yêu cầu; đối với trường hợp thỏa thuận thử việc trong hợp đồng lao động","highlight":[]}]},{"id":"Re3aa8c95d3","group":"Bộ luật Lao động 2019 Điều 44","heading":"điểm d khoản 1 Điều 44, Bộ luật Lao động 2019 (nghĩa vụ (từ: \"phải\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm d khoản 1 Điều 44, Bộ luật Lao động 2019\n45-2019-qh14/chapter-iii/section-3/article-44/clause-1/point-d","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 44. Phương án sử dụng lao động\n1. Phương án sử dụng lao động phải có những nội dung chủ yếu sau đây:","highlight":["Phương án sử dụng lao động phải có những nội dung chủ yếu sau đây"]},{"label":"Nguyên văn đơn vị","
