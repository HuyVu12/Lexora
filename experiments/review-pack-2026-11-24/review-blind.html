ộng, bảo hiểm xã hội;","highlight":["Phạt tiền đến 75.000.000 đồng"]},{"label":"Câu dẫn hoặc tên Điều chứa các đơn vị trên (không thuộc gold, hiện cùng đơn vị trong ngữ cảnh)","text":"[khoản 2 Điều 61, Nghị định số 283/2026/NĐ-CP Quy định xử phạt vi phạm hành chính trong lĩnh vực lao động, bảo hiểm xã hội, người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng] 2. Cục trưởng Cục Việc làm, Cục trưởng Cục Tiền lương và Bảo hiểm xã hội có quyền:\n[Điều 66, Nghị định số 283/2026/NĐ-CP Quy định xử phạt vi phạm hành chính trong lĩnh vực lao động, bảo hiểm xã hội, người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng] Điều 66. Hiệu lực thi hành","highlight":[]},{"label":"Đơn vị B: Nghị định 283/2026/NĐ-CP Điều 66 khoản 2","text":"[Nghị định 283/2026/NĐ-CP Điều 66 khoản 2] 2. Quy định về thẩm quyền xử phạt vi phạm hành chính của Cục trưởng Cục tiền lương và Bảo hiểm xã hội tại khoản 2 Điều 61 và khoản 11 Điều 63 của Nghị định này có hiệu lực thi hành kể từ ngày Nghị định sửa đổi, bổ sung một số điều của Nghị định số 189/2025/NĐ-CP ngày 01 tháng 7 năm 2025 của Chính phủ quy định chi tiết Luật Xử lý vi phạm hành chính về thẩm quyền xử phạt vi phạm hành chính có hiệu lực thi hành.","highlight":["có hiệu lực thi hành kể từ ngày Nghị định sửa đổi, bổ sung một số điều của Nghị định số 189/2025/NĐ-CP"]},{"label":"Đáp án tham chiếu (phần trong ngoặc kép phải có trong A, B hoặc câu dẫn của chúng)","text":"\"Cục trưởng Cục Việc làm, Cục trưởng Cục Tiền lương và Bảo hiểm xã hội có quyền\" \"Phạt tiền đến 75.000.000 đồng đối với hành vi vi phạm trong lĩnh vực lao động, bảo hiểm xã hội\". Riêng thẩm quyền của Cục trưởng Cục Tiền lương và Bảo hiểm xã hội \"có hiệu lực thi hành kể từ ngày Nghị định sửa đổi, bổ sung một số điều của Nghị định số 189/2025/NĐ-CP\" (xem nguyên văn đơn vị B về văn bản sửa đổi này).","highlight":[]},{"label":"Ngày hiệu lực và trạng thái","text":"Nghị định số 283/2026/NĐ-CP Quy định xử phạt vi phạm hành chính trong lĩnh vực lao động, bảo hiểm xã hội, người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng: hiệu lực từ 2026-09-10 (theo vbpl.vn)\nTrạng thái máy tính tại 2026-11-11 (unit-status-v2):\nđiểm b khoản 2 Điều 61, Nghị định số 283/2026/NĐ-CP Quy định xử phạt vi phạm hành chính trong lĩnh vực lao động, bảo hiểm xã hội, người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng: còn hiệu lực\nkhoản 2 Điều 66, Nghị định số 283/2026/NĐ-CP Quy định xử phạt vi phạm hành chính trong lĩnh vực lao động, bảo hiểm xã hội, người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng: còn hiệu lực","highlight":[]}]},{"id":"l15","group":"loại b","heading":"l15 · Doanh nghiệp trốn đóng bảo hiểm xã hội bắt buộc phải khắc phục hậu quả thế nào, và nếu đã ...","question":"Câu hỏi có cần đơn vị B mới trả lời đủ không, và danh sách đáp án (A và B) có đủ, không thừa không?","fields":[{"label":"Câu hỏi (ngày áp dụng 2026-11-11, loại b: chế tài, thẩm quyền xử phạt)","text":"Doanh nghiệp trốn đóng bảo hiểm xã hội bắt buộc phải khắc phục hậu quả thế nào, và nếu đã bị xử phạt rồi mà vẫn tái phạm thì có thể bị xử lý ra sao?","highlight":[]},{"label":"Đơn vị A: Nghị định 283/2026/NĐ-CP Điều 44 khoản 3 điểm a; Nghị định 283/2026/NĐ-CP Điều 44 khoản 3 điểm b","text":"[Nghị định 283/2026/NĐ-CP Điều 44 khoản 3 điểm a] a) Buộc người sử dụng lao động lập hồ sơ đăng ký hoặc lập hồ sơ đăng ký đầy đủ số người tham gia bảo hiểm xã hội bắt buộc cho người lao động; đóng đủ số tiền bảo hiểm xã hội bắt buộc trốn đóng; nộp số tiền bằng 0,03%/ngày tính trên số tiền bảo hiểm xã hội bắt buộc trốn đóng và số ngày trốn đóng vào quỹ bảo hiểm xã hội đối với hành vi vi phạm quy định tại khoản 1 Điều này;\n[Nghị định 283/2026/NĐ-CP Điều 44 khoản 3 điểm b] b) Buộc người sử dụng lao động đóng đủ số tiền bảo hiểm xã hội bắt buộc trốn đóng; nộp số tiền bằng 0,03%/ngày tính trên số tiền bảo hiểm xã hội bắt buộc trốn đóng và số ngày trốn đóng vào quỹ bảo hiểm xã hội đối với hành vi vi phạm quy định tại khoản 2 Điều này.","highlight":["nộp số tiền bằng 0,03%/ngày"]},{"label":"Câu dẫn hoặc tên Điều chứa các đơn vị trên (không thuộc gold, hiện cùng đơn vị trong ngữ cảnh)","text":"[khoản 3 Điều 44, Nghị định số 283/2026/NĐ-CP Quy định xử phạt vi phạm hành chính trong lĩnh vực lao động, bảo hiểm xã hội, người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng] 3. Biện pháp khắc phục hậu quả\n[khoản 2 Điều 4, Nghị định số 283/2026/NĐ-CP Quy định xử phạt vi phạm hành chính trong lĩnh vực lao động, bảo hiểm xã hội, người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng] 2. Trong quá trình xem xét, xử lý vụ vi phạm, nếu xét thấy hành vi vi phạm sau đây có dấu hiệu tội phạm, thì người có thẩm quyền đang giải quyết vụ việc phải chuyển hồ sơ liên quan đến hành vi có dấu hiệu tội phạm cho cơ quan có thẩm quyền tiến hành tố tụng hình sự để truy cứu trách nhiệm hình sự theo quy định tại Điều 62 của Luật Xử lý vi phạm hành chính:","highlight":["phải chuyển hồ sơ liên quan đến hành vi có dấu hiệu tội phạm"]},{"label":"Đơn vị B: Nghị định 283/2026/NĐ-CP Điều 4 khoản 2 điểm l","text":"[Nghị định 283/2026/NĐ-CP Điều 4 khoản 2 điểm l] l) Hành vi tái phạm quy định về đóng bảo hiểm xã hội bắt buộc quy định tại Điều 44 của Nghị định này; tái phạm quy định về đóng bảo hiểm thất nghiệp quy định tại Điều 46 của Nghị định này.","highlight":["Hành vi tái phạm quy định về đóng bảo hiểm xã hội bắt buộc quy định tại Điều 44"]},{"label":"Đáp án tham chiếu (phần trong ngoặc kép phải có trong A, B hoặc câu dẫn của chúng)","text":"Phải \"đóng đủ số tiền bảo hiểm xã hội bắt buộc trốn đóng\" và nộp \"số tiền bằng 0,03%/ngày tính trên số tiền bảo hiểm xã hội bắt buộc trốn đóng và số ngày trốn đóng\". Với \"Hành vi tái phạm quy định về đóng bảo hiểm xã hội bắt buộc quy định tại Điều 44 của Nghị định này\", nếu có dấu hiệu tội phạm thì người có thẩm quyền \"phải chuyển hồ sơ liên quan đến hành vi có dấu hiệu tội phạm cho cơ quan có thẩm quyền tiến hành tố tụng hình sự\".","highlight":[]},{"label":"Ngày hiệu lực và trạng thái","text":"Nghị định số 283/2026/NĐ-CP Quy định xử phạt vi phạm hành chính trong lĩnh vực lao động, bảo hiểm xã hội, người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng: hiệu lực từ 2026-09-10 (theo vbpl.vn)\nTrạng thái máy tính tại 2026-11-11 (unit-status-v2):\nđiểm a khoản 3 Điều 44, Nghị định số 283/2026/NĐ-CP Quy định xử phạt vi phạm hành chính trong lĩnh vực lao động, bảo hiểm xã hội, người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng: còn hiệu lực\nđiểm b khoản 3 Điều 44, Nghị định số 283/2026/NĐ-CP Quy định xử phạt vi phạm hành chính trong lĩnh vực lao động, bảo hiểm xã hội, người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng: còn hiệu lực\nđiểm l khoản 2 Điều 4, Nghị định số 283/2026/NĐ-CP Quy định xử phạt vi phạm hành chính trong lĩnh vực lao động, bảo hiểm xã hội, người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng: còn hiệu lực","highlight":[]}]},{"id":"l16","group":"loại b","heading":"l16 · Doanh nghiệp lợi dụng hoạt động đưa người lao động đi làm việc ở nước ngoài để tổ chức xuấ...","question":"Câu hỏi có cần đơn vị B mới trả lời đủ không, và danh sách đáp án (A và B) có đủ, không thừa không?","fields":[{"label":"Câu hỏi (ngày áp dụng 2026-11-11, loại b: chế tài, thẩm quyền xử phạt)","text":"Doanh nghiệp lợi dụng hoạt động đưa người lao động đi làm việc ở nước ngoài để tổ chức xuất cảnh trái phép thì lực lượng nào có thẩm quyền xử phạt?","highlight":["lực lượng nào"]},{"label":"Đơn vị A: Nghị định 283/2026/NĐ-CP Điều 49 khoản 9 điểm a","text":"[Nghị định 283/2026/NĐ-CP Điều 49 khoản 9 điểm a] a) Lợi dụng hoạt động đưa người lao động Việt Nam đi làm việc ở nước ngoài để tổ chức xuất cảnh trái phép, bóc lột hoặc cưỡng bức lao động mà không bị truy cứu trách nhiệm hình sự;","highlight":[]},{"label":"Câu dẫn hoặc tên Điều chứa các đơn vị trên (không thuộc gold, hiện cùng đơn vị trong ngữ cảnh)","text":"[khoản 9 Điều 49, Nghị định số 283/2026/NĐ-CP Quy định xử phạt vi phạm hành chính trong lĩnh vực lao động, bảo hiểm xã hội, người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng] 9. Phạt tiền từ 150.000.000 đồng đến 180.000.000 đồng khi có một trong các hành vi sau đây:\n[Điều 63, Nghị định số 283/2026/NĐ-CP Quy định xử phạt vi phạm hành chính trong lĩnh vực lao động, bảo hiểm xã hội, người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng] Điều 63. Nguyên tắc xác định và phân định thẩm quyền xử phạt","highlight":[]},{"label":"Đơn vị B: Nghị định 283/2026/NĐ-CP Điều 63 khoản 7","text":"[Nghị định 283/2026/NĐ-CP Điều 63 khoản 7] 7. Người có thẩm quyền xử phạt của Bộ đội Biên phòng có thẩm quyền xử phạt vi phạm hành chính và áp dụng các biện pháp khắc phục hậu quả đối với các hành vi vi phạm hành chính quy định tại điểm a khoản 9 Điều 49; khoản 8 Điều 50; điểm a khoản 7 Điều 51; điểm a khoản 6 Điều 52 của Nghị định này theo thẩm quyền quy định tại Điều 60 của Nghị định này trong phạm vi, lĩnh vực quản lý, phù hợp chức năng, nhiệm vụ, quyền hạn, địa bàn được giao.","highlight":["điểm a khoản 9 Điều 49"]},{"label":"Đáp án tham chiếu (phần trong ngoặc kép phải có trong A, B hoặc câu dẫn của chúng)","text":"Hành vi \"Lợi dụng hoạt động đưa người lao động Việt Nam đi làm việc ở nước ngoài để tổ chức xuất cảnh trái phép, bóc lột hoặc cưỡng bức lao động mà không bị truy cứu trách nhiệm hình sự\". \"Người có thẩm quyền xử phạt của Bộ đội Biên phòng có thẩm quyền xử phạt vi phạm hành chính\" đối với \"điểm a khoản 9 Điều 49\".","highlight":[]},{"label":"Ngày hiệu lực và trạng thái","text":"Nghị định số 283/2026/NĐ-CP Quy định xử phạt vi phạm hành chính trong lĩnh vực lao động, bảo hiểm xã hội, người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng: hiệu lực từ 2026-09-10 (theo vbpl.vn)\nTrạng thái máy tính tại 2026-11-11 (unit-status-v2):\nđiểm a khoản 9 Điều 49, Nghị định số 283/2026/NĐ-CP Quy định xử phạt vi phạm hành chính trong lĩnh vực lao động, bảo hiểm xã hội, người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng: còn hiệu lực\nkhoản 7 Điều 63, Nghị định số 283/2026/NĐ-CP Quy định xử phạt vi phạm hành chính trong lĩnh vực lao động, bảo hiểm xã hội, người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng: còn hiệu lực","highlight":[]},{"label":"Đơn vị liên quan agent tìm thấy (ngoài gold)","text":"[khoản 5 Điều 63, Nghị định số 283/2026/NĐ-CP Quy định xử phạt vi phạm hành chính trong lĩnh vực lao động, bảo hiểm xã hội, người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng] 5. Người có thẩm quyền xử phạt của Công an nhân dân có thẩm quyền xử phạt vi phạm hành chính và áp dụng các biện pháp khắc phục hậu quả đối với các hành vi vi phạm hành chính quy định tại điểm c khoản 2 Điều 8; điểm đ khoản 3 Điều 9; điểm a, b, c khoản 4 Điều 10; điểm d khoản 1, khoản 3 Điều 11; khoản 3, khoản 4 Điều 13; khoản 3 Điều 17; điểm a, b khoản 3 Điều 25; khoản 4 Điều 28; Điều 29; điểm đ khoản 3 Điều 32; điểm đ khoản 1 Điều 37; khoản 5, khoản 6 Điều 37; khoản 2 Điều 38; điểm a khoản 3 Điều 39; Điều 44; Điều 46; điểm a khoản 1, khoản 2 Điều 47; điểm b khoản 1 Điều 48; các điểm a, c, d khoản 4 Điều 48; điểm b khoản 6 Điều 48; các điểm a, b, e khoản 1 Điều 49; điểm a khoản 6 Điều 49; điểm a khoản 8 Điều 49; các điểm a, b, c, d, e, g, h khoản 9 Điều 49; khoản 8 Điều 50; khoản 1, các điểm a, b, c khoản 7 Điều 51; các điểm a, c khoản 6 Điều 52 và Điều 53 của Nghị định này theo thẩm quyền quy định tại Điều 58 của Nghị định này và chức năng, nhiệm vụ, quyền hạn được giao thuộc lĩnh vực, địa bàn mình quản lý.\n[khoản 2 Điều 63, Nghị định số 283/2026/NĐ-CP Quy định xử phạt vi phạm hành chính trong lĩnh vực lao động, bảo hiểm xã hội, người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng] 2. Chủ tịch Ủy ban nhân dân các cấp có thẩm quyền xử phạt vi phạm hành chính và áp dụng các biện pháp khắc phục hậu quả đối với các hành vi vi phạm hành chính quy định tại Chương II, Chương III và Chương IV của Nghị định này theo thẩm quyền quy định tại Điều 55 của Nghị định này và chức năng, nhiệm vụ, quyền hạn được giao.\n[khoản 8 Điều 63, Nghị định số 283/2026/NĐ-CP Quy định xử phạt vi phạm hành chính trong lĩnh vực lao động, bảo hiểm xã hội, người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng] 8. Giám đốc Sở Nội vụ có thẩm quyền xử phạt vi phạm hành chính và áp dụng các biện pháp khắc phục hậu quả đối với các hành vi vi phạm hành chính quy định tại Chương II, Chương III, Chương IV của Nghị định này theo thẩm quyền quy định tại khoản 1 Điều 61 của Nghị định này và chức năng, nhiệm vụ, quyền hạn được giao.","highlight":["các điểm a, b, c, d, e, g, h khoản 9 Điều 49","Chương IV"]}]},{"id":"l17","group":"loại c","heading":"l17 · Công ty cho thuê lại lao động phải thực hiện những nghĩa vụ nào, kể cả các nghĩa vụ chung ...","question":"Câu hỏi có cần đơn vị B mới trả lời đủ không, và danh sách đáp án (A và B) có đủ, không thừa không?","fields":[{"label":"Câu hỏi (ngày áp dụng 2026-11-11, loại c: dẫn chiếu trong cùng văn bản)","text":"Công ty cho thuê lại lao động phải thực hiện những nghĩa vụ nào, kể cả các nghĩa vụ chung của người sử dụng lao động?","highlight":["kể cả các nghĩa vụ chung"]},{"label":"Đơn vị A: Bộ luật Lao động 45/2019/QH14 Điều 56 khoản 1; Bộ luật Lao động 45/2019/QH14 Điều 56 khoản 2; Bộ luật Lao động 45/2019/QH14 Điều 56 khoản 3; Bộ luật Lao động 45/2019/QH14 Điều 56 khoản 4; Bộ luật Lao động 45/2019/QH14 Điều 56 khoản 5; Bộ luật Lao động 45/2019/QH14 Điều 56 khoản 6","text":"[Bộ luật Lao động 45/2019/QH14 Điều 56 khoản 1] 1. Bảo đảm đưa người lao động có trình độ phù hợp với những yêu cầu của bên thuê lại lao động và nội dung của hợp đồng lao động đã ký với người lao động;\n[Bộ luật Lao động 45/2019/QH14 Điều 56 khoản 2] 2. Thông báo cho người lao động biết nội dung của hợp đồng cho thuê lại lao động;\n[Bộ luật Lao động 45/2019/QH14 Điều 56 khoản 3] 3. Thông báo cho bên thuê lại lao động biết sơ yếu lý lịch của người lao động, yêu cầu của người lao động;\n[Bộ luật Lao động 45/2019/QH14 Điều 56 khoản 4] 4. Bảo đảm trả lương cho người lao động thuê lại không thấp hơn tiền lương của người lao động của bên thuê lại lao động có cùng trình độ, làm cùng công việc hoặc công việc có giá trị như nhau;\n[Bộ luật Lao động 45/2019/QH14 Điều 56 khoản 5] 5. Lập hồ sơ ghi rõ số lao động đã cho thuê lại, bên thuê lại lao động và định kỳ báo cáo cơ quan chuyên môn về lao động thuộc Ủy ban nhân dân cấp tỉnh;\n[Bộ luật Lao động 45/2019/QH14 Điều 56 khoản 6] 6. Xử lý kỷ luật lao động đối với người lao động vi phạm kỷ luật lao động khi bên thuê lại lao động trả lại người lao động do vi phạm kỷ luật lao động.","highlight":[]},{"label":"Câu dẫn hoặc tên Điều chứa các đơn vị trên (không thuộc gold, hiện cùng đơn vị trong ngữ cảnh)","text":"[Điều 56, Bộ Luật lao động số 45/2019/QH14] Điều 56. Quyền và nghĩa vụ của doanh nghiệp cho thuê lại lao động\nNgoài các quyền và nghĩa vụ quy định tại Điều 6 của Bộ luật này, doanh nghiệp cho thuê lại lao động có các quyền và nghĩa vụ sau đây:\n[khoản 2 Điều 6, Bộ Luật lao động số 45/2019/QH14] 2. Người sử dụng lao động có các nghĩa vụ sau đây:","highlight":["Ngoài các quyền và nghĩa vụ quy định tại Điều 6 của Bộ luật này"]},{"label":"Đơn vị B: Bộ luật Lao động 45/2019/QH14 Điều 6 khoản 2 điểm a; Bộ luật Lao động 45/2019/QH14 Điều 6 khoản 2 điểm b; Bộ luật Lao động 45/2019/QH14 Điều 6 khoản 2 điểm c; Bộ luật Lao động 45/2019/QH14 Điều 6 khoản 2 điểm d; Bộ luật Lao động 45/2019/QH14 Điều 6 khoản 2 điểm đ","text":"[Bộ luật Lao động 45/2019/QH14 Điều 6 khoản 2 điểm a] a) Thực hiện hợp đồng lao động, thỏa ước lao động tập thể và thỏa thuận hợp pháp khác; tôn trọng danh dự, nhân phẩm của người lao động;\n[Bộ luật Lao động 45/2019/QH14 Điều 6 khoản 2 điểm b] b) Thiết lập cơ chế và thực hiện đối thoại, trao đổi với người lao động và tổ chức đại diện người lao động; thực hiện quy chế dân chủ ở cơ sở tại nơi làm việc;\n[Bộ luật Lao động 45/2019/QH14 Điều 6 khoản 2 điểm c] c) Đào tạo, đào tạo lại, bồi dưỡng nâng cao trình độ, kỹ năng nghề nhằm duy trì, chuyển đổi nghề nghiệp, việc làm cho người lao động;\n[Bộ luật Lao động 45/2019/QH14 Điều 6 khoản 2 điểm d] d) Thực hiện quy định của pháp luật về lao động, việc làm, giáo dục nghề nghiệp, bảo hiểm xã hội, bảo hiểm y tế, bảo hiểm thất nghiệp và an toàn, vệ sinh lao động; xây dựng và thực hiện các giải pháp phòng, chống quấy rối tình dục tại nơi làm việc;\n[Bộ luật Lao động 45/2019/QH14 Điều 6 khoản 2 điểm đ] đ) Tham gia phát triển tiêu chuẩn kỹ năng nghề quốc gia, đánh giá, công nhận kỹ năng nghề cho người lao động.","highlight":[]},{"label":"Đáp án tham chiếu (phần trong ngoặc kép phải có trong A, B hoặc câu dẫn của chúng)","text":"\"Ngoài các quyền và nghĩa vụ quy định tại Điều 6 của Bộ luật này, doanh nghiệp cho thuê lại lao động có các quyền và nghĩa vụ sau đây\", như \"Thông báo cho người lao động biết nội dung của hợp đồng cho thuê lại lao động\". Nghĩa vụ chung ở Điều 6 gồm \"Thực hiện hợp đồng lao động, thỏa ước lao động tập thể và thỏa thuận hợp pháp khác\" và \"Đào tạo, đào tạo lại, bồi dưỡng nâng cao trình độ, kỹ năng nghề\".","highlight":[]},{"label":"Ngày hiệu lực và trạng thái","text":"Bộ Luật lao động số 45/2019/QH14: hiệu lực từ 2021-01-01 (theo vbpl.vn)\nTrạng thái máy tính tại 2026-11-11 (unit-status-v2):\nkhoản 1 Điều 56, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nkhoản 2 Điều 56, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nkhoản 3 Điều 56, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nkhoản 4 Điều 56, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nkhoản 5 Điều 56, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nkhoản 6 Điều 56, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nđiểm a khoản 2 Điều 6, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nđiểm b khoản 2 Điều 6, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nđiểm c khoản 2 Điều 6, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nđiểm d khoản 2 Điều 6, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nđiểm đ khoản 2 Điều 6, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực","highlight":[]}]},{"id":"l18","group":"loại c","heading":"l18 · Công đoàn cơ sở tổ chức đình công mà không đúng trình tự, thủ tục thì Chủ tịch Ủy ban nhân...","question":"Câu hỏi có cần đơn vị B mới trả lời đủ không, và danh sách đáp án (A và B) có đủ, không thừa không?","fields":[{"label":"Câu hỏi (ngày áp dụng 2026-11-11, loại c: dẫn chiếu trong cùng văn bản)","text":"Công đoàn cơ sở tổ chức đình công mà không đúng trình tự, thủ tục thì Chủ tịch Ủy ban nhân dân cấp huyện phải làm gì và trong bao lâu, và trình tự đình công đúng gồm những bước nào?","highlight":[]},{"label":"Đơn vị A: Bộ luật Lao động 45/2019/QH14 Điều 211","text":"[Bộ luật Lao động 45/2019/QH14 Điều 211] Điều 211. Xử lý cuộc đình công không đúng trình tự, thủ tục Trong thời hạn 12 giờ kể từ khi nhận được thông báo về cuộc đình công không tuân theo quy định tại các điều 200, 201 và 202 của Bộ luật này, Chủ tịch Ủy ban nhân dân cấp huyện chủ trì, chỉ đạo cơ quan chuyên môn về lao động phối hợp với công đoàn cùng cấp, cơ quan, tổ chức có liên quan trực tiếp gặp gỡ người sử dụng lao động và đại diện ban lãnh đạo tổ chức đại diện người lao động tại cơ sở để nghe ý kiến, hỗ trợ các bên tìm biện pháp giải quyết, đưa hoạt động sản xuất, kinh doanh trở lại bình thường. Trường hợp phát hiện có hành vi vi phạm pháp luật thì lập biên bản, tiến hành xử lý hoặc kiến nghị cơ quan có thẩm quyền xử lý cá nhân, tổ chức đã thực hiện hành vi vi phạm pháp luật theo quy định của pháp luật. Đối với các nội dung tranh chấp lao động thì tùy từng loại tranh chấp, hướng dẫn, hỗ trợ các bên tiến hành các thủ tục giải quyết tranh chấp lao động theo quy định của Bộ luật này.","highlight":["Trong thời hạn 12 giờ","các điều 200, 201 và 202"]},{"label":"Câu dẫn hoặc tên Điều chứa các đơn vị trên (không thuộc gold, hiện cùng đơn vị trong ngữ cảnh)","text":"[Điều 200, Bộ Luật lao động số 45/2019/QH14] Điều 200. Trình tự đình công","highlight":[]},{"label":"Đơn vị B: Bộ luật Lao động 45/2019/QH14 Điều 200 khoản 1; Bộ luật Lao động 45/2019/QH14 Điều 200 khoản 2; Bộ luật Lao động 45/2019/QH14 Điều 200 khoản 3","text":"[Bộ luật Lao động 45/2019/QH14 Điều 200 khoản 1] 1. Lấy ý kiến về đình công theo quy định tại Điều 201 của Bộ luật này.\n[Bộ luật Lao động 45/2019/QH14 Điều 200 khoản 2] 2. Ra quyết định đình công và thông báo đình công theo quy định tại Điều 202 của Bộ luật này.\n[Bộ luật Lao động 45/2019/QH14 Điều 200 khoản 3] 3. Tiến hành đình công.","highlight":["Lấy ý kiến về đình công","Ra quyết định đình công và thông báo đình công","Tiến hành đình công"]},{"label":"Đáp án tham chiếu (phần trong ngoặc kép phải có trong A, B hoặc câu dẫn của chúng)","text":"\"Trong thời hạn 12 giờ kể từ khi nhận được thông báo về cuộc đình công không tuân theo quy định tại các điều 200, 201 và 202 của Bộ luật này, Chủ tịch Ủy ban nhân dân cấp huyện chủ trì\" việc gặp gỡ các bên. Trình tự đình công gồm \"Lấy ý kiến về đình công\", \"Ra quyết định đình công và thông báo đình công\", \"Tiến hành đình công\".","highlight":[]},{"label":"Ngày hiệu lực và trạng thái","text":"Bộ Luật lao động số 45/2019/QH14: hiệu lực từ 2021-01-01 (theo vbpl.vn)\nTrạng thái máy tính tại 2026-11-11 (unit-status-v2):\nĐiều 211, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nkhoản 1 Điều 200, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nkhoản 2 Điều 200, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nkhoản 3 Điều 200, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực","highlight":[]}]},{"id":"l19","group":"loại c","heading":"l19 · Người đang nhận trợ cấp hằng tháng từ bảo hiểm xã hội thì ai đóng bảo hiểm y tế cho họ?","question":"Câu hỏi có cần đơn vị B mới trả lời đủ không, và danh sách đáp án (A và B) có đủ, không thừa không?","fields":[{"label":"Câu hỏi (ngày áp dụng 2026-11-11, loại c: dẫn chiếu trong cùng văn bản)","text":"Người đang nhận trợ cấp hằng tháng từ bảo hiểm xã hội thì ai đóng bảo hiểm y tế cho họ?","highlight":[]},{"label":"Đơn vị A: Luật Bảo hiểm xã hội 41/2024/QH15 Điều 10 khoản 2 điểm b","text":"[Luật Bảo hiểm xã hội 41/2024/QH15 Điều 10 khoản 2 điểm b] b) Hưởng bảo hiểm y tế trong trường hợp đang hưởng lương hưu; nghỉ việc hưởng trợ cấp tai nạn lao động, bệnh nghề nghiệp hằng tháng; trong thời gian nghỉ việc hưởng chế độ thai sản từ 14 ngày làm việc trở lên trong tháng; trong thời gian nghỉ việc hưởng chế độ ốm đau từ 14 ngày làm việc trở lên trong tháng hoặc nghỉ việc hưởng trợ cấp ốm đau đối với người lao động bị mắc bệnh thuộc danh mục bệnh cần chữa trị dài ngày do Bộ trưởng Bộ Y tế ban hành; đang hưởng chế độ quy định tại Điều 23 của Luật này;","highlight":["đang hưởng chế độ quy định tại Điều 23 của Luật này","nghỉ việc hưởng trợ cấp tai nạn lao động, bệnh nghề nghiệp hằng tháng"]},{"label":"Câu dẫn hoặc tên Điều chứa các đơn vị trên (không thuộc gold, hiện cùng đơn vị trong ngữ cảnh)","text":"[khoản 2 Điều 10, Luật Bảo hiểm xã hội số 41/2024/QH15] 2. Người thụ hưởng chế độ bảo hiểm xã hội có các quyền sau đây:\n[Điều 23, Luật Bảo hiểm xã hội số 41/2024/QH15] Điều 23. Chế độ đối với người lao động không đủ điều kiện hưởng lương hưu và chưa đủ tuổi hưởng trợ cấp hưu trí xã hội","highlight":[]},{"label":"Đơn vị B: Luật Bảo hiểm xã hội 41/2024/QH15 Điều 23 khoản 6","text":"[Luật Bảo hiểm xã hội 41/2024/QH15 Điều 23 khoản 6] 6. Người đang trong thời gian hưởng trợ cấp hằng tháng thì được ngân sách nhà nước đóng bảo hiểm y tế.","highlight":["được ngân sách nhà nước đóng bảo hiểm y tế"]},{"label":"Đáp án tham chiếu (phần trong ngoặc kép phải có trong A, B hoặc câu dẫn của chúng)","text":"Người lao động được \"Hưởng bảo hiểm y tế trong trường hợp\" \"đang hưởng chế độ quy định tại Điều 23 của Luật này\". Theo Điều 23, \"Người đang trong thời gian hưởng trợ cấp hằng tháng thì được ngân sách nhà nước đóng bảo hiểm y tế\".","highlight":[]},{"label":"Ngày hiệu lực và trạng thái","text":"Luật Bảo hiểm xã hội số 41/2024/QH15: hiệu lực từ 2025-07-01 (theo vbpl.vn)\nTrạng thái máy tính tại 2026-11-11 (unit-status-v2):\nđiểm b khoản 2 Điều 10, Luật Bảo hiểm xã hội số 41/2024/QH15: còn hiệu lực\nkhoản 6 Điều 23, Luật Bảo hiểm xã hội số 41/2024/QH15: còn hiệu lực","highlight":[]}]},{"id":"l20","group":"loại c","heading":"l20 · Lao động nữ bị sảy thai ở tuần thứ 8 thì được nghỉ tối đa bao nhiêu ngày và trợ cấp mỗi ng...","question":"Câu hỏi có cần đơn vị B mới trả lời đủ không, và danh sách đáp án (A và B) có đủ, không thừa không?","fields":[{"label":"Câu hỏi (ngày áp dụng 2026-11-11, loại c: dẫn chiếu trong cùng văn bản)","text":"Lao động nữ bị sảy thai ở tuần thứ 8 thì được nghỉ tối đa bao nhiêu ngày và trợ cấp mỗi ngày tính thế nào?","highlight":[]},{"label":"Đơn vị A: Luật Bảo hiểm xã hội 41/2024/QH15 Điều 59 khoản 1; Luật Bảo hiểm xã hội 41/2024/QH15 Điều 59 khoản 3","text":"[Luật Bảo hiểm xã hội 41/2024/QH15 Điều 59 khoản 1] 1. Trợ cấp thai sản một tháng của người lao động quy định tại các điều 51, 52, 53, 54, 55, 56 và 57 của Luật này bằng 100% mức bình quân tiền lương làm căn cứ đóng bảo hiểm xã hội bắt buộc của 06 tháng gần nhất trước khi nghỉ việc hưởng chế độ thai sản. Đối với người lao động đóng bảo hiểm xã hội bắt buộc chưa đủ 06 tháng thì trợ cấp thai sản của người lao động quy định tại Điều 51, Điều 52, các khoản 2, 5, 6 và 7 Điều 53, các khoản 1, 2 và 4 Điều 54, khoản 2 Điều 55 và Điều 57 của Luật này là mức bình quân tiền lương làm căn cứ đóng bảo hiểm xã hội bắt buộc của các tháng đã đóng.\n[Luật Bảo hiểm xã hội 41/2024/QH15 Điều 59 khoản 3] 3. Trợ cấp thai sản khi sinh con, nhận con khi nhờ mang thai hộ hoặc nhận nuôi con nuôi dưới 06 tháng tuổi được tính theo mức trợ cấp thai sản quy định tại khoản 1 Điều này, trường hợp có ngày lẻ hoặc trường hợp quy định tại Điều 52 và Điều 57 của Luật này thì mức trợ cấp mỗi ngày được tính bằng mức trợ cấp thai sản một tháng chia cho 30 ngày.","highlight":["chia cho 30 ngày","bằng 100% mức bình quân tiền lương"]},{"label":"Câu dẫn hoặc tên Điều chứa các đơn vị trên (không thuộc gold, hiện cùng đơn vị trong ngữ cảnh)","text":"[Điều 59, Luật Bảo hiểm xã hội số 41/2024/QH15] Điều 59. Trợ cấp thai sản\n[khoản 1 Điều 52, Luật Bảo hiểm xã hội số 41/2024/QH15] 1. Thời gian nghỉ việc hưởng chế độ thai sản khi sảy thai, phá thai, thai chết trong tử cung, thai chết trong khi chuyển dạ, thai ngoài tử cung do người hành nghề khám bệnh, chữa bệnh thuộc cơ sở khám bệnh, chữa bệnh chỉ định nhưng tối đa theo quy định sau đây:","highlight":[]},{"label":"Đơn vị B: Luật Bảo hiểm xã hội 41/2024/QH15 Điều 52 khoản 1 điểm b","text":"[Luật Bảo hiểm xã hội 41/2024/QH15 Điều 52 khoản 1 điểm b] b) 20 ngày nếu thai từ đủ 05 tuần tuổi đến dưới 13 tuần tuổi;","highlight":["20 ngày nếu thai từ đủ 05 tuần tuổi đến dưới 13 tuần tuổi"]},{"label":"Đáp án tham chiếu (phần trong ngoặc kép phải có trong A, B hoặc câu dẫn của chúng)","text":"Thai \"từ đủ 05 tuần tuổi đến dưới 13 tuần tuổi\" được nghỉ tối đa \"20 ngày\". Trợ cấp thai sản một tháng \"bằng 100% mức bình quân tiền lương làm căn cứ đóng bảo hiểm xã hội bắt buộc của 06 tháng gần nhất trước khi nghỉ việc hưởng chế độ thai sản\", và với trường hợp Điều 52 \"mức trợ cấp mỗi ngày được tính bằng mức trợ cấp thai sản một tháng chia cho 30 ngày\".","highlight":[]},{"label":"Ngày hiệu lực và trạng thái","text":"Luật Bảo hiểm xã hội số 41/2024/QH15: hiệu lực từ 2025-07-01 (theo vbpl.vn)\nTrạng thái máy tính tại 2026-11-11 (unit-status-v2):\nkhoản 1 Điều 59, Luật Bảo hiểm xã hội số 41/2024/QH15: còn hiệu lực\nkhoản 3 Điều 59, Luật Bảo hiểm xã hội số 41/2024/QH15: còn hiệu lực\nđiểm b khoản 1 Điều 52, Luật Bảo hiểm xã hội số 41/2024/QH15: còn hiệu lực","highlight":[]}]},{"id":"l21","group":"loại c","heading":"l21 · Nhân viên nghỉ việc khi chưa đủ điều kiện hưởng lương hưu thì thời gian đóng bảo hiểm xã h...","question":"Câu hỏi có cần đơn vị B mới trả lời đủ không, và danh sách đáp án (A và B) có đủ, không thừa không?","fields":[{"label":"Câu hỏi (ngày áp dụng 2026-11-11, loại c: dẫn chiếu trong cùng văn bản)","text":"Nhân viên nghỉ việc khi chưa đủ điều kiện hưởng lương hưu thì thời gian đóng bảo hiểm xã hội có được bảo lưu không, và sau này cần điều kiện gì về số năm đóng và tuổi để hưởng lương hưu?","highlight":[]},{"label":"Đơn vị A: Luật Bảo hiểm xã hội 41/2024/QH15 Điều 71","text":"[Luật Bảo hiểm xã hội 41/2024/QH15 Điều 71] Điều 71. Người lao động khi nghỉ việc mà chưa đủ điều kiện để hưởng lương hưu theo quy định tại Điều 64, Điều 65 của Luật này hoặc chưa hưởng bảo hiểm xã hội một lần theo quy định tại Điều 70 của Luật này hoặc chưa hưởng trợ cấp hằng tháng theo quy định tại Điều 23 của Luật này thì được bảo lưu thời gian đóng bảo hiểm xã hội. Người lao động khi nghỉ việc mà chưa đủ điều kiện để hưởng lương hưu theo quy định tại Điều 64, Điều 65 của Luật này hoặc chưa hưởng bảo hiểm xã hội một lần theo quy định tại Điều 70 của Luật này hoặc chưa hưởng trợ cấp hằng tháng theo quy định tại Điều 23 của Luật này thì được bảo lưu thời gian đóng bảo hiểm xã hội.","highlight":["thì được bảo lưu thời gian đóng bảo hiểm xã hội"]},{"label":"Câu dẫn hoặc tên Điều chứa các đơn vị trên (không thuộc gold, hiện cùng đơn vị trong ngữ cảnh)","text":"[khoản 1 Điều 64, Luật Bảo hiểm xã hội số 41/2024/QH15] 1. Đối tượng quy định tại các điểm a, b, c, g, h, i, k, l, m và n khoản 1 và khoản 2 Điều 2 của Luật này khi nghỉ việc có thời gian đóng bảo hiểm xã hội bắt buộc từ đủ 15 năm trở lên thì được hưởng lương hưu nếu thuộc một trong các trường hợp sau đây:","highlight":["từ đủ 15 năm trở lên"]},{"label":"Đơn vị B: Luật Bảo hiểm xã hội 41/2024/QH15 Điều 64 khoản 1 điểm a","text":"[Luật Bảo hiểm xã hội 41/2024/QH15 Điều 64 khoản 1 điểm a] a) Đủ tuổi nghỉ hưu theo quy định tại khoản 2 Điều 169 của Bộ luật Lao động;","highlight":["Đủ tuổi nghỉ hưu theo quy định tại khoản 2 Điều 169 của Bộ luật Lao động"]},{"label":"Đáp án tham chiếu (phần trong ngoặc kép phải có trong A, B hoặc câu dẫn của chúng)","text":"Người lao động nghỉ việc mà chưa đủ điều kiện hưởng lương hưu \"thì được bảo lưu thời gian đóng bảo hiểm xã hội\". Để hưởng lương hưu cần \"thời gian đóng bảo hiểm xã hội bắt buộc từ đủ 15 năm trở lên\" và \"Đủ tuổi nghỉ hưu theo quy định tại khoản 2 Điều 169 của Bộ luật Lao động\".","highlight":[]},{"label":"Ngày hiệu lực và trạng thái","text":"Luật Bảo hiểm xã hội số 41/2024/QH15: hiệu lực từ 2025-07-01 (theo vbpl.vn)\nTrạng thái máy tính tại 2026-11-11 (unit-status-v2):\nĐiều 71, Luật Bảo hiểm xã hội số 41/2024/QH15: còn hiệu lực\nđiểm a khoản 1 Điều 64, Luật Bảo hiểm xã hội số 41/2024/QH15: còn hiệu lực","highlight":[]}]},{"id":"l22","group":"loại c","heading":"l22 · Người lao động được cho thuê lại có những nghĩa vụ gì trong quá trình làm việc?","question":"Câu hỏi có cần đơn vị B mới trả lời đủ không, và danh sách đáp án (A và B) có đủ, không thừa không?","fields":[{"label":"Câu hỏi (ngày áp dụng 2026-11-11, loại c: dẫn chiếu trong cùng văn bản)","text":"Người lao động được cho thuê lại có những nghĩa vụ gì trong quá trình làm việc?","highlight":[]},{"label":"Đơn vị A: Bộ luật Lao động 45/2019/QH14 Điều 58 khoản 1; Bộ luật Lao động 45/2019/QH14 Điều 58 khoản 2","text":"[Bộ luật Lao động 45/2019/QH14 Điều 58 khoản 1] 1. Thực hiện công việc theo hợp đồng lao động đã ký với doanh nghiệp hoạt động cho thuê lại lao động;\n[Bộ luật Lao động 45/2019/QH14 Điều 58 khoản 2] 2. Chấp hành kỷ luật lao động, nội quy lao động; tuân theo sự quản lý, điều hành, giám sát hợp pháp của bên thuê lại lao động;","highlight":[]},{"label":"Câu dẫn hoặc tên Điều chứa các đơn vị trên (không thuộc gold, hiện cùng đơn vị trong ngữ cảnh)","text":"[Điều 58, Bộ Luật lao động số 45/2019/QH14] Điều 58. Quyền và nghĩa vụ của người lao động thuê lại\nNgoài các quyền và nghĩa vụ theo quy định tại Điều 5 của Bộ luật này, người lao động thuê lại có các quyền và nghĩa vụ sau đây:\n[khoản 2 Điều 5, Bộ Luật lao động số 45/2019/QH14] 2. Người lao động có các nghĩa vụ sau đây:","highlight":["Ngoài các quyền và nghĩa vụ theo quy định tại Điều 5 của Bộ luật này"]},{"label":"Đơn vị B: Bộ luật Lao động 45/2019/QH14 Điều 5 khoản 2 điểm a; Bộ luật Lao động 45/2019/QH14 Điều 5 khoản 2 điểm b; Bộ luật Lao động 45/2019/QH14 Điều 5 khoản 2 điểm c","text":"[Bộ luật Lao động 45/2019/QH14 Điều 5 khoản 2 điểm a] a) Thực hiện hợp đồng lao động, thỏa ước lao động tập thể và thỏa thuận hợp pháp khác;\n[Bộ luật Lao động 45/2019/QH14 Điều 5 khoản 2 điểm b] b) Chấp hành kỷ luật lao động, nội quy lao động; tuân theo sự quản lý, điều hành, giám sát của người sử dụng lao động;\n[Bộ luật Lao động 45/2019/QH14 Điều 5 khoản 2 điểm c] c) Thực hiện quy định của pháp luật về lao động, việc làm, giáo dục nghề nghiệp, bảo hiểm xã hội, bảo hiểm y tế, bảo hiểm thất nghiệp và an toàn, vệ sinh lao động.","highlight":[]},{"label":"Đáp án tham chiếu (phần trong ngoặc kép phải có trong A, B hoặc câu dẫn của chúng)","text":"Ngoài nghĩa vụ chung, người lao động thuê lại phải \"Thực hiện công việc theo hợp đồng lao động đã ký với doanh nghiệp hoạt động cho thuê lại lao động\" và \"tuân theo sự quản lý, điều hành, giám sát hợp pháp của bên thuê lại lao động\". Nghĩa vụ chung gồm \"Thực hiện hợp đồng lao động, thỏa ước lao động tập thể và thỏa thuận hợp pháp khác\" và \"Thực hiện quy định của pháp luật về lao động, việc làm, giáo dục nghề nghiệp, bảo hiểm xã hội\".","highlight":[]},{"label":"Ngày hiệu lực và trạng thái","text":"Bộ Luật lao động số 45/2019/QH14: hiệu lực từ 2021-01-01 (theo vbpl.vn)\nTrạng thái máy tính tại 2026-11-11 (unit-status-v2):\nkhoản 1 Điều 58, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nkhoản 2 Điều 58, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nđiểm a khoản 2 Điều 5, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nđiểm b khoản 2 Điều 5, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nđiểm c khoản 2 Điều 5, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực","highlight":[]}]},{"id":"l23","group":"loại c","heading":"l23 · Đại diện người lao động tham gia các phiên họp thương lượng tập thể có được tính lương khô...","question":"Câu hỏi có cần đơn vị B mới trả lời đủ không, và danh sách đáp án (A và B) có đủ, không thừa không?","fields":[{"label":"Câu hỏi (ngày áp dụng 2026-11-11, loại c: dẫn chiếu trong cùng văn bản)","text":"Đại diện người lao động tham gia các phiên họp thương lượng tập thể có được tính lương không, và thời gian đó có bị trừ vào thời gian làm công việc đại diện mà công ty dành cho ban lãnh đạo tổ chức đại diện không?","highlight":["thời gian làm công việc đại diện mà công ty dành cho ban lãnh đạo tổ chức đại diện"]},{"label":"Đơn vị A: Bộ luật Lao động 45/2019/QH14 Điều 70 khoản 2","text":"[Bộ luật Lao động 45/2019/QH14 Điều 70 khoản 2] 2. Thời gian thương lượng tập thể không được quá 90 ngày kể từ ngày bắt đầu thương lượng, trừ trường hợp các bên có thỏa thuận khác. Thời gian tham gia các phiên họp thương lượng tập thể của đại diện bên người lao động được tính là thời gian làm việc có hưởng lương. Trường hợp người lao động là thành viên của tổ chức đại diện người lao động tham gia các phiên họp thương lượng tập thể thì thời gian tham gia các phiên họp không tính vào thời gian quy định tại khoản 2 Điều 176 của Bộ luật này.","highlight":["được tính là thời gian làm việc có hưởng lương","không tính vào thời gian quy định tại khoản 2 Điều 176 của Bộ luật này"]},{"label":"Câu dẫn hoặc tên Điều chứa các đơn vị trên (không thuộc gold, hiện cùng đơn vị trong ngữ cảnh)","text":"[Điều 70, Bộ Luật lao động số 45/2019/QH14] Điều 70. Quy trình thương lượng tập thể tại doanh nghiệp\n[Điều 176, Bộ Luật lao động số 45/2019/QH14] Điều 176. Quyền của thành viên ban lãnh đạo của tổ chức đại diện người lao động tại cơ sở","highlight":[]},{"label":"Đơn vị B: Bộ luật Lao động 45/2019/QH14 Điều 176 khoản 2","text":"[Bộ luật Lao động 45/2019/QH14 Điều 176 khoản 2] 2. Chính phủ quy định thời gian tối thiểu mà người sử dụng lao động dành cho toàn bộ thành viên ban lãnh đạo của tổ chức đại diện người lao động tại cơ sở để thực hiện nhiệm vụ của tổ chức đại diện trên cơ sở số lượng thành viên của tổ chức.","highlight":[]},{"label":"Đáp án tham chiếu (phần trong ngoặc kép phải có trong A, B hoặc câu dẫn của chúng)","text":"\"Thời gian tham gia các phiên họp thương lượng tập thể của đại diện bên người lao động được tính là thời gian làm việc có hưởng lương\", và với thành viên của tổ chức đại diện \"thì thời gian tham gia các phiên họp không tính vào thời gian quy định tại khoản 2 Điều 176 của Bộ luật này\". Thời gian đó là thời gian tối thiểu mà \"Chính phủ quy định thời gian tối thiểu mà người sử dụng lao động dành cho toàn bộ thành viên ban lãnh đạo của tổ chức đại diện người lao động tại cơ sở\".","highlight":[]},{"label":"Ngày hiệu lực và trạng thái","text":"Bộ Luật lao động số 45/2019/QH14: hiệu lực từ 2021-01-01 (theo vbpl.vn)\nTrạng thái máy tính tại 2026-11-11 (unit-status-v2):\nkhoản 2 Điều 70, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nkhoản 2 Điều 176, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực","highlight":[]}]},{"id":"l24","group":"loại c","heading":"l24 · Hòa giải viên lao động có bao lâu để hòa giải một tranh chấp lao động tập thể về quyền, và...","question":"Câu hỏi có cần đơn vị B mới trả lời đủ không, và danh sách đáp án (A và B) có đủ, không thừa không?","fields":[{"label":"Câu hỏi (ngày áp dụng 2026-11-11, loại c: dẫn chiếu trong cùng văn bản)","text":"Hòa giải viên lao động có bao lâu để hòa giải một tranh chấp lao động tập thể về quyền, và nếu quá hạn mà không hòa giải thì các bên làm gì?","highlight":[]},{"label":"Đơn vị A: Bộ luật Lao động 45/2019/QH14 Điều 192 khoản 2 điểm a; Bộ luật Lao động 45/2019/QH14 Điều 192 khoản 2 điểm b","text":"[Bộ luật Lao động 45/2019/QH14 Điều 192 khoản 2 điểm a] a) Yêu cầu Hội đồng trọng tài lao động giải quyết theo quy định tại Điều 193 của Bộ luật này;\n[Bộ luật Lao động 45/2019/QH14 Điều 192 khoản 2 điểm b] b) Yêu cầu Tòa án giải quyết.","highlight":[]},{"label":"Câu dẫn hoặc tên Điều chứa các đơn vị trên (không thuộc gold, hiện cùng đơn vị trong ngữ cảnh)","text":"[khoản 2 Điều 192, Bộ Luật lao động số 45/2019/QH14] 2. Trong trường hợp hòa giải không thành hoặc hết thời hạn hòa giải quy định tại khoản 2 Điều 188 của Bộ luật này mà hòa giải viên lao động không tiến hành hòa giải thì các bên tranh chấp có quyền lựa chọn một trong các phương thức sau để giải quyết tranh chấp:\n[Điều 188, Bộ Luật lao động số 45/2019/QH14] Điều 188. Trình tự, thủ tục hòa giải tranh chấp lao động cá nhân của hòa giải viên lao động","highlight":["hết thời hạn hòa giải quy định tại khoản 2 Điều 188"]},{"label":"Đơn vị B: Bộ luật Lao động 45/2019/QH14 Điều 188 khoản 2","text":"[Bộ luật Lao động 45/2019/QH14 Điều 188 khoản 2] 2. Trong thời hạn 05 ngày làm việc kể từ ngày hòa giải viên lao động nhận được yêu cầu từ bên yêu cầu giải quyết tranh chấp hoặc từ cơ quan quy định tại khoản 3 Điều 181 của Bộ luật này, hòa giải viên lao động phải kết thúc việc hòa giải.","highlight":["Trong thời hạn 05 ngày làm việc","hòa giải viên lao động phải kết thúc việc hòa giải"]},{"label":"Đáp án tham chiếu (phần trong ngoặc kép phải có trong A, B hoặc câu dẫn của chúng)","text":"Theo Điều 188, \"Trong thời hạn 05 ngày làm việc\" từ khi nhận được yêu cầu \"hòa giải viên lao động phải kết thúc việc hòa giải\". Nếu \"hết thời hạn hòa giải quy định tại khoản 2 Điều 188 của Bộ luật này mà hòa giải viên lao động không tiến hành hòa giải\" thì các bên có quyền \"Yêu cầu Hội đồng trọng tài lao động giải quyết\" hoặc \"Yêu cầu Tòa án giải quyết\".","highlight":[]},{"label":"Ngày hiệu lực và trạng thái","text":"Bộ Luật lao động số 45/2019/QH14: hiệu lực từ 2021-01-01 (theo vbpl.vn)\nTrạng thái máy tính tại 2026-11-11 (unit-status-v2):\nđiểm a khoản 2 Điều 192, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nđiểm b khoản 2 Điều 192, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nkhoản 2 Điều 188, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực","highlight":[]},{"label":"Đơn vị liên quan agent tìm thấy (ngoài gold)","text":"[khoản 1 Điều 192, Bộ Luật lao động số 45/2019/QH14] 1. Trình tự, thủ tục hòa giải tranh chấp lao động tập thể về quyền được thực hiện theo quy định tại các khoản 2, 3, 4, 5 và 6 Điều 188 của Bộ luật này.\nĐối với tranh chấp quy định tại điểm b và điểm c khoản 2 Điều 179 của Bộ luật này mà xác định có hành vi vi phạm pháp luật thì hòa giải viên lao động lập biên bản và chuyển hồ sơ, tài liệu đến cơ quan có thẩm quyền xem xét, xử lý theo quy định của pháp luật.","highlight":[]}]},{"id":"l25","group":"loại c","heading":"l25 · Nhân viên bị tai nạn trên đường từ nhà đến chỗ làm và phải đi khám giám định thương tật. P...","question":"Câu hỏi có cần đơn vị B mới trả lời đủ không, và danh sách đáp án (A và B) có đủ, không thừa không?","fields":[{"label":"Câu hỏi (ngày áp dụng 2026-11-11, loại c: dẫn chiếu trong cùng văn bản)","text":"Nhân viên bị tai nạn trên đường từ nhà đến chỗ làm và phải đi khám giám định thương tật. Phí giám định có được quỹ bảo hiểm tai nạn lao động trả không, cần đủ điều kiện gì?","highlight":[]},{"label":"Đơn vị A: Luật An toàn, vệ sinh lao động 84/2015/QH13 Điều 42 khoản 1","text":"[Luật An toàn, vệ sinh lao động 84/2015/QH13 Điều 42 khoản 1] 1. Trả phí khám giám định thương tật, bệnh tật do tai nạn lao động, bệnh nghề nghiệp đối với các trường hợp đủ điều kiện hưởng theo quy định tại Điều 45 và Điều 46 của Luật này; trả phí khám giám định đối với trường hợp người lao động chủ động đi khám giám định mức suy giảm khả năng lao động theo quy định tại điểm b khoản 1 và khoản 3 Điều 47 của Luật này mà kết quả khám giám định đủ điều kiện để điều chỉnh tăng mức hưởng trợ cấp tai nạn lao động, bệnh nghề nghiệp.","highlight":["đủ điều kiện hưởng theo quy định tại Điều 45 và Điều 46"]},{"label":"Câu dẫn hoặc tên Điều chứa các đơn vị trên (không thuộc gold, hiện cùng đơn vị trong ngữ cảnh)","text":"[Điều 42, Luật An toàn, vệ sinh lao động số 84/2015/QH13] Điều 42. Sử dụng Quỹ bảo hiểm tai nạn lao động, bệnh nghề nghiệp\n[khoản 1 Điều 45, Luật An toàn, vệ sinh lao động số 84/2015/QH13] 1. Bị tai nạn thuộc một trong các trường hợp sau đây:\n[Điều 45, Luật An toàn, vệ sinh lao động số 84/2015/QH13] Điều 45. Điều kiện hưởng chế độ tai nạn lao động\nNgười lao động tham gia bảo hiểm tai nạn lao động, bệnh nghề nghiệp được hưởng chế độ tai nạn lao động khi có đủ các điều kiện sau đây:","highlight":[]},{"label":"Đơn vị B: Luật An toàn, vệ sinh lao động 84/2015/QH13 Điều 45 khoản 1 điểm c; Luật An toàn, vệ sinh lao động 84/2015/QH13 Điều 45 khoản 2","text":"[Luật An toàn, vệ sinh lao động 84/2015/QH13 Điều 45 khoản 1 điểm c] c) Trên tuyến đường đi từ nơi ở đến nơi làm việc hoặc từ nơi làm việc về nơi ở trong khoảng thời gian và tuyến đường hợp lý;\n[Luật An toàn, vệ sinh lao động 84/2015/QH13 Điều 45 khoản 2] 2. Suy giảm khả năng lao động từ 5% trở lên do bị tai nạn quy định tại khoản 1 Điều này;","highlight":["Trên tuyến đường đi từ nơi ở đến nơi làm việc","Suy giảm khả năng lao động từ 5% trở lên"]},{"label":"Đáp án tham chiếu (phần trong ngoặc kép phải có trong A, B hoặc câu dẫn của chúng)","text":"Quỹ \"Trả phí khám giám định thương tật, bệnh tật do tai nạn lao động, bệnh nghề nghiệp đối với các trường hợp đủ điều kiện hưởng theo quy định tại Điều 45 và Điều 46 của Luật này\". Điều 45 gồm tai nạn \"Trên tuyến đường đi từ nơi ở đến nơi làm việc hoặc từ nơi làm việc về nơi ở trong khoảng thời gian và tuyến đường hợp lý\" và \"Suy giảm khả năng lao động từ 5% trở lên do bị tai nạn quy định tại khoản 1 Điều này\".","highlight":[]},{"label":"Ngày hiệu lực và trạng thái","text":"Luật An toàn, vệ sinh lao động số 84/2015/QH13: hiệu lực từ 2016-07-01 (theo vbpl.vn)\nTrạng thái máy tính tại 2026-11-11 (unit-status-v2):\nkhoản 1 Điều 42, Luật An toàn, vệ sinh lao động số 84/2015/QH13: còn hiệu lực\nđiểm c khoản 1 Điều 45, Luật An toàn, vệ sinh lao động số 84/2015/QH13: còn hiệu lực\nkhoản 2 Điều 45, Luật An toàn, vệ sinh lao động số 84/2015/QH13: còn hiệu lực","highlight":[]},{"label":"Đơn vị liên quan agent tìm thấy (ngoài gold)","text":"[khoản 3 Điều 45, Luật An toàn, vệ sinh lao động số 84/2015/QH13] 3. Người lao động không được hưởng chế độ do Quỹ bảo hiểm tai nạn lao động, bệnh nghề nghiệp chi trả nếu thuộc một trong các nguyên nhân quy định tại khoản 1 Điều 40 của Luật này.","highlight":["không được hưởng chế độ"]}]},{"id":"l26","group":"loại d","heading":"l26 · Nhà thầu muốn tuyển người lao động nước ngoài cho gói thầu thì trước đó phải kê khai và đề...","question":"Câu hỏi có cần đơn vị B mới trả lời đủ không, và danh sách đáp án (A và B) có đủ, không thừa không?","fields":[{"label":"Câu hỏi (ngày áp dụng 2026-11-11, loại d: sửa đổi, bổ sung)","text":"Nhà thầu muốn tuyển người lao động nước ngoài cho gói thầu thì trước đó phải kê khai và đề nghị tuyển lao động Việt Nam với cơ quan nào?","highlight":[]},{"label":"Đơn vị A: Nghị định 152/2020/NĐ-CP Điều 5 khoản 1","text":"[Nghị định 152/2020/NĐ-CP Điều 5 khoản 1] 1. Trước khi tuyển người lao động nước ngoài, nhà thầu có trách nhiệm kê khai số lượng, trình độ, năng lực chuyên môn, kinh nghiệm của người lao động nước ngoài cần tuyển để thực hiện gói thầu tại Việt Nam và đề nghị tuyển người lao động Việt Nam vào các vị trí công việc dự kiến tuyển người lao động nước ngoài với Chủ tịch Ủy ban nhân dân cấp tỉnh nơi nhà thầu thực hiện gói thầu theo Mẫu số 04/PLI Phụ lục I ban hành kèm theo Nghị định này. Trường hợp nhà thầu có nhu cầu điều chỉnh, bổ sung số lao động đã kê khai thì chủ đầu tư phải xác nhận phương án điều chỉnh, bổ sung nhu cầu lao động cần sử dụng của nhà thầu theo Mẫu số 05/PLI Phụ lục I ban hành kèm theo Nghị định này.","highlight":["Chủ tịch Ủy ban nhân dân cấp tỉnh"]},{"label":"Câu dẫn hoặc tên Điều chứa các đơn vị trên (không thuộc gold, hiện cùng đơn vị trong ngữ cảnh)","text":"[Điều 5, Nghị định số 152/2020/NĐ-CP Quy định về người lao động nước ngoài làm việc tại Việt Nam và tuyển dụng, quản lý người lao động Việt Nam làm việc cho tổ chức, cá nhân nước ngoài tại Việt Nam] Điều 5. Sử dụng người lao động nước ngoài của nhà thầu\n[khoản 13 Điều 1, Nghị định số 70/2023/NĐ-CP Sửa đổi, bổ sung một số điều của Nghị định số 152/2020/NĐ-CP ngày 30 tháng 12 năm 2020 của Chính phủ quy định về người lao động nước ngoài làm việc tại Việt Nam và tuyển dụng, quản lý người lao động Việt Nam làm việc cho tổ chức, cá nhân nước ngoài tại Việt Nam] 13. Thay thế, bổ sung một số từ, cụm từ tại các điểm, khoản, điều, phụ lục sau đây:","highlight":[]},{"label":"Đơn vị B: Nghị định 70/2023/NĐ-CP Điều 1 khoản 13 điểm a","text":"[Nghị định 70/2023/NĐ-CP Điều 1 khoản 13 điểm a] a) Thay thế cụm từ \"Chủ tịch Ủy ban nhân dân cấp tỉnh\" tại khoản 1 Điều 5 bằng cụm từ \"Sở Lao động - Thương binh và Xã hội\"; Thay thế cụm từ \"Chủ tịch Ủy ban nhân dân cấp tỉnh chỉ đạo\" bằng cụm từ \"Sở Lao động - Thương binh và Xã hội đề nghị\" tại khoản 2 Điều 5;","highlight":["Chủ tịch Ủy ban nhân dân cấp tỉnh","Sở Lao động - Thương binh và Xã hội"]},{"label":"Đáp án tham chiếu (phần trong ngoặc kép phải có trong A, B hoặc câu dẫn của chúng)","text":"Nhà thầu \"đề nghị tuyển người lao động Việt Nam vào các vị trí công việc dự kiến tuyển người lao động nước ngoài\" theo Điều 5 khoản 1. Nghị định 70/2023 \"Thay thế cụm từ\" \"Chủ tịch Ủy ban nhân dân cấp tỉnh\" tại khoản 1 Điều 5 bằng cụm từ \"Sở Lao động - Thương binh và Xã hội\", nên cơ quan hiện hành là Sở Lao động - Thương binh và Xã hội.","highlight":[]},{"label":"Ghi chú lỗi thời của bộ (stale_note)","text":"Điều 5 khoản 1 Nghị định 152/2020 còn cụm \"Chủ tịch Ủy ban nhân dân cấp tỉnh\" đã bị thay; đáp án hiện hành là cơ quan thay thế ở đơn vị B.","highlight":[]},{"label":"Ngày hiệu lực và trạng thái","text":"Nghị định số 152/2020/NĐ-CP Quy định về người lao động nước ngoài làm việc tại Việt Nam và tuyển dụng, quản lý người lao động Việt Nam làm việc cho tổ chức, cá nhân nước ngoài tại Việt Nam: hiệu lực từ 2021-02-15, hết hiệu lực từ 2026-11-15 (theo vbpl.vn)\nNghị định số 70/2023/NĐ-CP Sửa đổi, bổ sung một số điều của Nghị định số 152/2020/NĐ-CP ngày 30 tháng 12 năm 2020 của Chính phủ quy định về người lao động nước ngoài làm việc tại Việt Nam và tuyển dụng, quản lý người lao động Việt Nam làm việc cho tổ chức, cá nhân nước ngoài tại Việt Nam: hiệu lực từ 2023-09-18 (theo vbpl.vn)\nNghị định số 219/2025/NĐ-CP Quy định về người lao động nước ngoài làm việc tại Việt Nam: hiệu lực từ 2025-08-07, hết hiệu lực từ 2026-12-05 (theo vbpl.vn)\nTrạng thái máy tính tại 2026-11-11 (unit-status-v2):\nkhoản 1 Điều 5, Nghị định số 152/2020/NĐ-CP Quy định về người lao động nước ngoài làm việc tại Việt Nam và tuyển dụng, quản lý người lao động Việt Nam làm việc cho tổ chức, cá nhân nước ngoài tại Việt Nam: đã bị sửa đổi\nđiểm a khoản 13 Điều 1, Nghị định số 70/2023/NĐ-CP Sửa đổi, bổ sung một số điều của Nghị định số 152/2020/NĐ-CP ngày 30 tháng 12 năm 2020 của Chính phủ quy định về người lao động nước ngoài làm việc tại Việt Nam và tuyển dụng, quản lý người lao động Việt Nam làm việc cho tổ chức, cá nhân nước ngoài tại Việt Nam: còn hiệu lực","highlight":["hết hiệu lực từ 2026-11-15","đã bị sửa đổi","hiệu lực từ 2025-08-07"]},{"label":"Đơn vị liên quan agent tìm thấy (ngoài gold)","text":"[khoản 2 Điều 35, Nghị định số 219/2025/NĐ-CP Quy định về người lao động nước ngoài làm việc tại Việt Nam] 2. Nội dung về lao động nước ngoài làm việc tại Việt Nam quy định tại Nghị định số 152/2020/NĐ-CP ngày 30 tháng 12 năm 2020 của Chính phủ quy định về người lao động nước ngoài làm việc tại Việt Nam và tuyển dụng, quản lý người lao động Việt Nam làm việc cho tổ chức, cá nhân nước ngoài tại Việt Nam được sửa đổi, bổ sung tại Nghị định số 70/2023/NĐ-CP ngày 18 tháng 9 năm 2023 của Chính phủ hết hiệu lực thi hành kể từ ngày Nghị định này có hiệu lực.","highlight":["hết hiệu lực thi hành"]}]},{"id":"l27","group":"loại d","heading":"l27 · Người lao động nước ngoài làm việc cho cùng một công ty ở nhiều tỉnh thì công ty phải báo ...","question":"Câu hỏi có cần đơn vị B mới trả lời đủ không, và danh sách đáp án (A và B) có đủ, không thừa không?","fields":[{"label":"Câu hỏi (ngày áp dụng 2026-11-11, loại d: sửa đổi, bổ sung)","text":"Người lao động nước ngoài làm việc cho cùng một công ty ở nhiều tỉnh thì công ty phải báo cáo việc sử dụng người lao động đó như thế nào?","highlight":[]},{"label":"Đơn vị A: Nghị định 152/2020/NĐ-CP Điều 6 khoản 1","text":"[Nghị định 152/2020/NĐ-CP Điều 6 khoản 1] 1. Trước ngày 05 tháng 7 và ngày 05 tháng 01 của năm sau, người sử dụng lao động nước ngoài báo cáo 6 tháng đầu năm và hằng năm về tình hình sử dụng người lao động nước ngoài theo Mẫu số 07/PLI Phụ lục I ban hành kèm theo Nghị định này. Thời gian chốt số liệu báo cáo 6 tháng đầu năm được tính từ ngày 15 tháng 12 năm trước kỳ báo cáo đến ngày 14 tháng 6 của kỳ báo cáo, thời gian chốt số liệu báo hằng năm tính từ ngày 15 tháng 12 năm trước kỳ báo cáo đến ngày 14 tháng 12 của kỳ báo cáo.","highlight":[]},{"label":"Câu dẫn hoặc tên Điều chứa các đơn vị trên (không thuộc gold, hiện cùng đơn vị trong ngữ cảnh)","text":"[Điều 6, Nghị định số 152/2020/NĐ-CP Quy định về người lao động nước ngoài làm việc tại Việt Nam và tuyển dụng, quản lý người lao động Việt Nam làm việc cho tổ chức, cá nhân nước ngoài tại Việt Nam] Điều 6. Báo cáo sử dụng người lao động nước ngoài\n[Điều 1, Nghị định số 70/2023/NĐ-CP Sửa đổi, bổ sung một số điều của Nghị định số 152/2020/NĐ-CP ngày 30 tháng 12 năm 2020 của Chính phủ quy định về người lao động nước ngoài làm việc tại Việt Nam và tuyển dụng, quản lý người lao động Việt Nam làm việc cho tổ chức, cá nhân nước ngoài tại Việt Nam] Điều 1. Sửa đổi, bổ sung một số điều của Nghị định số 152/2020/NĐ-CP ngày 30 tháng 12 năm 2020 của Chính phủ quy định về người lao động nước ngoài làm việc tại Việt Nam và tuyển dụng, quản lý người lao động Việt Nam làm việc cho tổ chức, cá nhân nước ngoài tại Việt Nam","highlight":[]},{"label":"Đơn vị B: Nghị định 70/2023/NĐ-CP Điều 1 khoản 3","text":"[Nghị định 70/2023/NĐ-CP Điều 1 khoản 3] 3. Bổ sung khoản 3 Điều 6 như sau: \"3. Trường hợp người lao động nước ngoài làm việc cho một người sử dụng lao động tại nhiều tỉnh, thành phố trực thuộc trung ương thì trong vòng 3 ngày làm việc kể từ ngày người lao động nước ngoài bắt đầu làm việc, người sử dụng lao động phải báo cáo qua môi trường điện tử về Bộ Lao động - Thương binh và Xã hội và Sở Lao động - Thương binh và Xã hội nơi người lao động nước ngoài đến làm việc theo Mẫu số 17/PLI Phụ lục I ban hành kèm theo Nghị định này.\".","highlight":["trong vòng 3 ngày làm việc kể từ ngày người lao động nước ngoài bắt đầu làm việc"]},{"label":"Đáp án tham chiếu (phần trong ngoặc kép phải có trong A, B hoặc câu dẫn của chúng)","text":"Báo cáo định kỳ: \"người sử dụng lao động nước ngoài báo cáo 6 tháng đầu năm và hằng năm về tình hình sử dụng người lao động nước ngoài\". Nghị định 70/2023 bổ sung: \"trong vòng 3 ngày làm việc kể từ ngày người lao động nước ngoài bắt đầu làm việc, người sử dụng lao động phải báo cáo qua môi trường điện tử về Bộ Lao động - Thương binh và Xã hội và Sở Lao động - Thương binh và Xã hội nơi người lao động nước ngoài đến làm việc\".","highlight":[]},{"label":"Ngày hiệu lực và trạng thái","text":"Nghị định số 152/2020/NĐ-CP Quy định về người lao động nước ngoài làm việc tại Việt Nam và tuyển dụng, quản lý người lao động Việt Nam làm việc cho tổ chức, cá nhân nước ngoài tại Việt Nam: hiệu lực từ 2021-02-15, hết hiệu lực từ 2026-11-15 (theo vbpl.vn)\nNghị định số 70/2023/NĐ-CP Sửa đổi, bổ sung một số điều của Nghị định số 152/2020/NĐ-CP ngày 30 tháng 12 năm 2020 của Chính phủ quy định về người lao động nước ngoài làm việc tại Việt Nam và tuyển dụng, quản lý người lao động Việt Nam làm việc cho tổ chức, cá nhân nước ngoài tại Việt Nam: hiệu lực từ 2023-09-18 (theo vbpl.vn)\nNghị định số 219/2025/NĐ-CP Quy định về người lao động nước ngoài làm việc tại Việt Nam: hiệu lực từ 2025-08-07, hết hiệu lực từ 2026-12-05 (theo vbpl.vn)\nTrạng thái máy tính tại 2026-11-11 (unit-status-v2):\nkhoản 1 Điều 6, Nghị định số 152/2020/NĐ-CP Quy định về người lao động nước ngoài làm việc tại Việt Nam và tuyển dụng, quản lý người lao động Việt Nam làm việc cho tổ chức, cá nhân nước ngoài tại Việt Nam: còn hiệu lực\nkhoản 3 Điều 1, Nghị định số 70/2023/NĐ-CP Sửa đổi, bổ sung một số điều của Nghị định số 152/2020/NĐ-CP ngày 30 tháng 12 năm 2020 của Chính phủ quy định về người lao động nước ngoài làm việc tại Việt Nam và tuyển dụng, quản lý người lao động Việt Nam làm việc cho tổ chức, cá nhân nước ngoài tại Việt Nam: còn hiệu lực","highlight":["hết hiệu lực từ 2026-11-15","hiệu lực từ 2025-08-07"]},{"label":"Đơn vị liên quan agent tìm thấy (ngoài gold)","text":"[khoản 2 Điều 35, Nghị định số 219/2025/NĐ-CP Quy định về người lao động nước ngoài làm việc tại Việt Nam] 2. Nội dung về lao động nước ngoài làm việc tại Việt Nam quy định tại Nghị định số 152/2020/NĐ-CP ngày 30 tháng 12 năm 2020 của Chính phủ quy định về người lao động nước ngoài làm việc tại Việt Nam và tuyển dụng, quản lý người lao động Việt Nam làm việc cho tổ chức, cá nhân nước ngoài tại Việt Nam được sửa đổi, bổ sung tại Nghị định số 70/2023/NĐ-CP ngày 18 tháng 9 năm 2023 của Chính phủ hết hiệu lực thi hành kể từ ngày Nghị định này có hiệu lực.\n[khoản 5 Điều 22, Nghị định số 219/2025/NĐ-CP Quy định về người lao động nước ngoài làm việc tại Việt Nam] 5. Trường hợp người lao động nước ngoài đã được cấp giấy phép lao động có nhu cầu làm việc cho người sử dụng lao động đó tại nhiều tỉnh, thành phố trực thuộc trung ương, trước ít nhất 3 ngày dự kiến làm việc, người sử dụng lao động phải thông báo cho cơ quan có thẩm quyền nơi người lao động nước ngoài dự kiến làm việc thông tin: họ và tên, tuổi, quốc tịch, số hộ chiếu, số giấy phép lao động, tên người sử dụng lao động nước ngoài, ngày bắt đầu và ngày kết thúc làm việc không vượt quá thời hạn của giấy phép lao động đã được cấp.","highlight":["trước ít nhất 3 ngày dự kiến làm việc","hết hiệu lực thi hành"]}]},{"id":"l28","group":"loại d","heading":"l28 · Giấy tờ do nước ngoài cấp trong hồ sơ đề nghị xác nhận người lao động nước ngoài không thu...","question":"Câu hỏi có cần đơn vị B mới trả lời đủ không, và danh sách đáp án (A và B) có đủ, không thừa không?","fields":[{"label":"Câu hỏi (ngày áp dụng 2026-11-11, loại d: sửa đổi, bổ sung)","text":"Giấy tờ do nước ngoài cấp trong hồ sơ đề nghị xác nhận người lao động nước ngoài không thuộc diện cấp giấy phép lao động thì phải làm thủ tục gì về dịch thuật và chứng thực?","highlight":[]},{"label":"Đơn vị A: Nghị định 152/2020/NĐ-CP Điều 8 khoản 3 điểm e","text":"[Nghị định 152/2020/NĐ-CP Điều 8 khoản 3 điểm e] e) Các giấy tờ quy định tại điểm b, c và d khoản này là 01 bản gốc hoặc bản sao có chứng thực, nếu của nước ngoài thì phải hợp pháp hóa lãnh sự, dịch ra tiếng Việt và có chứng thực trừ trường hợp được miễn hợp pháp hóa lãnh sự theo điều ước quốc tế mà nước Cộng hòa xã hội chủ nghĩa Việt Nam và nước ngoài liên quan đều là thành viên hoặc theo nguyên tắc có đi có lại hoặc theo quy định của pháp luật.","highlight":["dịch ra tiếng Việt và có chứng thực"]},{"label":"Câu dẫn hoặc tên Điều chứa các đơn vị trên (không thuộc gold, hiện cùng đơn vị trong ngữ cảnh)","text":"[khoản 3 Điều 8, Nghị định số 152/2020/NĐ-CP Quy định về người lao động nước ngoài làm việc tại Việt Nam và tuyển dụng, quản lý người lao động Việt Nam làm việc cho tổ chức, cá nhân nước ngoài tại Việt Nam] 3. Hồ sơ đề nghị xác nhận không thuộc diện cấp giấy phép lao động, bao gồm:\n[khoản 13 Điều 1, Nghị định số 70/2023/NĐ-CP Sửa đổi, bổ sung một số điều của Nghị định số 152/2020/NĐ-CP ngày 30 tháng 12 năm 2020 của Chính phủ quy định về người lao động nước ngoài làm việc tại Việt Nam và tuyển dụng, quản lý người lao động Việt Nam làm việc cho tổ chức, cá nhân nước ngoài tại Việt Nam] 13. Thay thế, bổ sung một số từ, cụm từ tại các điểm, khoản, điều, phụ lục sau đây:","highlight":[]},{"label":"Đơn vị B: Nghị định 70/2023/NĐ-CP Điều 1 khoản 13 điểm c","text":"[Nghị định 70/2023/NĐ-CP Điều 1 khoản 13 điểm c] c) Thay thế cụm từ \"dịch ra tiếng Việt và có chứng thực\" bằng cụm từ \"dịch ra tiếng Việt và công chứng hoặc chứng thực\" tại điểm e khoản 3 Điều 8;","highlight":["dịch ra tiếng Việt và công chứng hoặc chứng thực","dịch ra tiếng Việt và có chứng thực"]},{"label":"Đáp án tham chiếu (phần trong ngoặc kép phải có trong A, B hoặc câu dẫn của chúng)","text":"Giấy tờ của nước ngoài \"phải hợp pháp hóa lãnh sự, dịch ra tiếng Việt và có chứng thực\" theo bả  Nam] 2. Nội dung về lao động nước ngoài làm việc tại Việt Nam quy định tại Nghị định số 152/2020/NĐ-CP ngày 30 tháng 12 năm 2020 của Chính phủ quy định về người lao động nước ngoài làm việc tại Việt Nam và tuyển dụng, quản lý người lao động Việt Nam làm việc cho tổ chức, cá nhân nước ngoài tại Việt Nam được sửa đổi, bổ sung tại Nghị định số 70/2023/NĐ-CP ngày 18 tháng 9 năm 2023 của Chính phủ hết hiệu lực thi hành kể từ ngày Nghị định này có hiệu lực.\n[khoản 2 Điều 5, Nghị định số 219/2025/NĐ-CP Quy định về người lao động nước ngoài làm việc tại Việt Nam] 2. Giấy tờ đã được hợp pháp hóa lãnh sự phải được dịch ra tiếng Việt và chứng thực theo quy định của pháp luật. Trường hợp giấy tờ là bản sao phải được chứng thực với bản gốc trước khi dịch ra tiếng Việt và chứng thực theo quy định của pháp luật.","highlight":["dịch ra tiếng Việt và chứng thực theo quy định của pháp luật","hết hiệu lực thi hành"]}]},{"id":"l29","group":"loại d","heading":"l29 · Khi nộp hồ sơ cấp giấy phép lao động cho người nước ngoài, giấy tờ của nước ngoài phải đượ...","question":"Câu hỏi có cần đơn vị B mới trả lời đủ không, và danh sách đáp án (A và B) có đủ, không thừa không?","fields":[{"label":"Câu hỏi (ngày áp dụng 2026-11-11, loại d: sửa đổi, bổ sung)","text":"Khi nộp hồ sơ cấp giấy phép lao động cho người nước ngoài, giấy tờ của nước ngoài phải được hợp pháp hóa và dịch ra tiếng Việt kèm thủ tục gì?","highlight":[]},{"label":"Đơn vị A: Nghị định 152/2020/NĐ-CP Điều 9 khoản 10","text":"[Nghị định 152/2020/NĐ-CP Điều 9 khoản 10] 10. Hợp pháp hóa lãnh sự, chứng thực các giấy tờ: Các giấy tờ quy định tại các khoản 2, 3, 4, 6 và 8 Điều này là 01 bản gốc hoặc bản sao có chứng thực, nếu của nước ngoài thì phải được hợp pháp hóa lãnh sự, trừ trường hợp được miễn hợp pháp hóa lãnh sự theo điều ước quốc tế mà nước Cộng hòa xã hội chủ nghĩa Việt Nam và nước ngoài liên quan đều là thành viên hoặc theo nguyên tắc có đi có lại hoặc theo quy định của pháp luật; dịch ra tiếng Việt và chứng thực theo qu b51","group":"resolved","heading":"Sửa đổi: Điều 4, Nghị định số 152/2020/NĐ-CP","question":"Đích (đúng điểm, khoản, Điều, văn bản), loại lệnh và phạm vi của cạnh có khớp câu lệnh không?","fields":[{"label":"Câu lệnh (cột instruction)","text":"Sửa đổi, bổ sung Điều 4 như sau:","highlight":["Điều 4","Điều 4","Sửa đổi, bổ sung"]},{"label":"Tên Điều và câu dẫn trong văn bản sửa đổi","text":"Điều 1. Sửa đổi, bổ sung một số điều của Nghị định số 152/2020/NĐ-CP ngày 30 tháng 12 năm 2020 của Chính phủ quy định về người lao động nước ngoài làm việc tại Việt Nam và tuyển dụng, quản lý người lao động Việt Nam làm việc cho tổ chức, cá nhân nước ngoài tại Việt Nam","highlight":["152/2020/NĐ-CP"]},{"label":"Đơn vị chứa câu lệnh (cột amending_unit)","text":"khoản 2 Điều 1, Nghị định số 70/2023/NĐ-CP [70-2023-nd-cp/article-1/clause-2]","highlight":[]},{"label":"Đích quy tắc đọc được (cột target_named, kind, status)","text":"Điều 4, Nghị định số 152/2020/NĐ-CP\nLoại: modify (sửa đổi, bổ sung)\nTrạng thái: resolved","highlight":["Điều 4"]},{"label":"Đơn vị đích (cột target_unit)","text":"Điều 4, Nghị định số 152/2020/NĐ-CP [152-2020-nd-cp/chapter-ii/section-1/article-4]","highlight":["Điều 4"]},{"label":"Nguyên văn đơn vị đích (cột target_text)","text":"Điều 4. Sử dụng người lao động nước ngoài","highlight":[]},{"label":"Lời văn mới (cột new_wording_text)","text":"2. Sửa đổi, bổ sung Điều 4 như sau: \"Điều 4. Sử dụng người lao động nước ngoài 1. Xác định nhu cầu sử dụng người lao động nước ngoài a) Trước ít nhất 15 ngày kể từ ngày dự kiến sử dụng người lao động nước ngoài, người sử dụng lao động (trừ nhà thầu) có trách nhiệm xác định nhu cầu sử dụng người lao động nước ngoài đối với từng vị trí công việc mà người lao động Việt Nam chưa đáp ứng được và báo cáo giải trình với Bộ Lao động - Thương binh và Xã hội hoặc Sở Lao động - Thương binh và Xã hội nơi người lao động nước ngoài dự kiến làm việc theo Mẫu số 01/PLI Phụ lục I ban hành kèm theo Nghị định này. Trong quá trình thực hiện nếu thay đổi nhu cầu sử dụng người lao động nước ngoài về vị trí, chức danh công việc, hình thức làm việc, số lượng, địa điểm thì người sử dụng lao động phải báo cáo Bộ Lao động - Thương binh và Xã hội hoặc Sở Lao động - Thương binh và Xã hội theo Mẫu số 02/PLI Phụ lục I ban hành kèm theo Nghị định này trước ít nhất 15 ngày kể từ ngày dự kiến sử dụng người lao động nước ngoài. b) Trường hợp người lao động nước ngoài quy định tại các khoản 3, 4, 5, 6 và 8 Điều 154 của Bộ luật Lao động và các khoản 1, 2, 4, 5, 7, 8, 9, 10, 11, 12, 13 và 14 Điều 7 Nghị định này thì người sử dụng lao động không phải thực hiện xác định nhu cầu sử dụng người lao động nước ngoài. c) Kể từ ngày 01 tháng 01 năm 2024, việc thông báo tuyển dụng người lao động Việt Nam vào các vị trí dự kiến tuyển dụng người lao động nước ngoài được thực hiện trên Cổng thông tin điện tử của Bộ Lao động - ...","highlight":[]},{"label":"Ngày hiệu lực (cột effective_from) và câu hiệu lực của văn bản sửa đổi","text":"2023-09-18\n1. Nghị định này có hiệu lực thi hành từ ngày 18 tháng 9 năm 2023.","highlight":["2023-09-18","ngày 18 tháng 9 năm 2023"]}]},{"id":"ebd4694e97b5cd1829d1e7f3","group":"resolved_parent","heading":"Bổ sung: khoản 3 Điều 6, Nghị định số 152/2020/NĐ-CP","question":"Đích (đúng điểm, khoản, Điều, văn bản), loại lệnh và phạm vi của cạnh có khớp câu lệnh không?","fields":[{"label":"Câu lệnh (cột instruction)","text":"Bổ sung khoản 3 Điều 6 như sau:","highlight":["khoản 3 Điều 6","Điều 6","Bổ sung"]},{"label":"Tên Điều và câu dẫn trong văn bản sửa đổi","text":"Điều 1. Sửa đổi, bổ sung một số điều của Nghị định số 152/2020/NĐ-CP ngày 30 tháng 12 năm 2020 của Chính phủ quy định về người lao động nước ngoài làm việc tại Việt Nam và tuyển dụng, quản lý người lao động Việt Nam làm việc cho tổ chức, cá nhân nước ngoài tại Việt Nam","highlight":["152/2020/NĐ-CP"]},{"label":"Đơn vị chứa câu lệnh (cột amending_unit)","text":"khoản 3 Điều 1, Nghị định số 70/2023/NĐ-CP [70-2023-nd-cp/article-1/clause-3]","highlight":[]},{"label":"Đích quy tắc đọc được (cột target_named, kind, status)","text":"khoản 3 Điều 6, Nghị định số 152/2020/NĐ-CP\nLoại: add (bổ sung)\nTrạng thái: resolved_parent\nLý do của quy tắc: added_unit_not_in_amended_text","highlight":["khoản 3 Điều 6"]},{"label":"Đơn vị đích (cột target_unit)","text":"(đơn vị cha gần nhất; đích chưa có trong văn bản) Điều 6, Nghị định số 152/2020/NĐ-CP [152-2020-nd-cp/chapter-ii/section-1/article-6]","highlight":["đơn vị cha gần nhất; đích chưa có trong văn bản"]},{"label":"Nguyên văn đơn vị đích (cột target_text)","text":"Điều 6. Báo cáo sử dụng người lao động nước ngoài","highlight":[]},{"label":"Lời văn mới (cột new_wording_text)","text":"3. Bổ sung khoản 3 Điều 6 như sau: \"3. Trường hợp người lao động nước ngoài làm việc cho một người sử dụng lao động tại nhiều tỉnh, thành phố trực thuộc trung ương thì trong vòng 3 ngày làm việc kể từ ngày người lao động nước ngoài bắt đầu làm việc, người sử dụng lao động phải báo cáo qua môi trường điện tử về Bộ Lao động - Thương binh và Xã hội và Sở Lao động - Thương binh và Xã hội nơi người lao động nước ngoài đến làm việc theo Mẫu số 17/PLI Phụ lục I ban hành kèm theo Nghị định này.\".","highlight":[]},{"label":"Ngày hiệu lực (cột effective_from) và câu hiệu lực của văn bản sửa đổi","text":"2023-09-18\n1. Nghị định này có hiệu lực thi hành từ ngày 18 tháng 9 năm 2023.","highlight":["2023-09-18","ngày 18 tháng 9 năm 2023"]}]},{"id":"831c08c170d2bae28780dcb5","group":"resolved","heading":"Sửa đổi: khoản 6 Điều 7, Nghị định số 152/2020/NĐ-CP","question":"Đích (đúng điểm, khoản, Điều, văn bản), loại lệnh và phạm vi của cạnh có khớp câu lệnh không?","fields":[{"label":"Câu lệnh (cột instruction)","text":"Sửa đổi, bổ sung khoản 6 của Điều 7 như sau:","highlight":["Điều 7","Sửa đổi, bổ sung"]},{"label":"Tên Điều và câu dẫn trong văn bản sửa đổi","text":"Điều 1. Sửa đổi, bổ sung một số điều của Nghị định số 152/2020/NĐ-CP ngày 30 tháng 12 năm 2020 của Chính phủ quy định về người lao động nước ngoài làm việc tại Việt Nam và tuyển dụng, quản lý người lao động Việt Nam làm việc cho tổ chức, cá nhân nước ngoài tại Việt Nam\n4. Sửa đổi, bổ sung một số khoản của Điều 7 như sau:","highlight":["152/2020/NĐ-CP"]},{"label":"Đơn vị chứa câu lệnh (cột amending_unit)","text":"điểm a khoản 4 Điều 1, Nghị định số 70/2023/NĐ-CP [70-2023-nd-cp/article-1/clause-4/point-a]","highlight":[]},{"label":"Đích quy tắc đọc được (cột target_named, kind, status)","text":"khoản 6 Điều 7, Nghị định số 152/2020/NĐ-CP\nLoại: modify (sửa đổi, bổ sung)\nTrạng thái: resolved","highlight":["khoản 6 Điều 7"]},{"label":"Đơn vị đích (cột target_unit)","text":"khoản 6 Điều 7, Nghị định số 152/2020/NĐ-CP [152-2020-nd-cp/chapter-ii/section-2/article-7/clause-6]","highlight":["khoản 6 Điều 7"]},{"label":"Nguyên văn đơn vị đích (cột target_text)","text":"6. Được cơ quan, tổ chức có thẩm quyền của nước ngoài cử sang Việt Nam giảng dạy, nghiên cứu tại trường quốc tế thuộc quản lý của cơ quan đại diện ngoại giao nước ngoài hoặc Liên hợp quốc; các cơ sở, tổ chức được thành lập theo các hiệp định mà Việt Nam đã ký kết, tham gia.","highlight":[]},{"label":"Lời văn mới (cột new_wording_text)","text":"a) Sửa đổi, bổ sung khoản 6 của Điều 7 như sau: \"6. Được cơ quan, tổ chức có thẩm quyền của nước ngoài cử sang Việt Nam giảng dạy hoặc làm nhà quản lý, giám đốc điều hành tại cơ sở giáo dục do cơ quan đại diện ngoại giao nước ngoài, tổ chức liên chính phủ đề nghị thành lập tại Việt Nam; các cơ sở, tổ chức được thành lập theo các điều ước quốc tế mà Việt Nam đã ký kết, tham gia.\"","highlight":[]},{"label":"Ngày hiệu lực (cột effective_from) và câu hiệu lực của văn bản sửa đổi","text":"2023-09-18\n1. Nghị định này có hiệu lực thi hành từ ngày 18 tháng 9 năm 2023.","highlight":["2023-09-18","ngày 18 tháng 9 năm 2023"]}]},{"id":"a8e03c42be9f6f771736fdbd","group":"resolved","heading":"Sửa đổi: khoản 14 Điều 7, Nghị định số 152/2020/NĐ-CP","question":"Đích (đúng điểm, khoản, Điều, văn bản), loại lệnh và phạm icle-9/clause-9]","highlight":["đơn vị cha gần nhất; đích chưa có trong văn bản"]},{"label":"Nguyên văn đơn vị đích (cột target_text)","text":"9. Hồ sơ đề nghị cấp giấy phép lao động đối với một số trường hợp đặc biệt:","highlight":[]},{"label":"Lời văn mới (cột new_wording_text)","text":"đ) Bổ sung điểm c khoản 9 Điều 9 như sau: \"c) Đối với người lao động nước ngoài là chuyên gia, lao động kỹ thuật đã được cấp giấy phép lao động và đã được gia hạn một lần mà có nhu cầu tiếp tục làm việc với cùng vị trí công việc và chức danh công việc ghi trong giấy phép lao động thì hồ sơ đề nghị cấp giấy phép lao động mới gồm các giấy tờ quy định tại khoản 1, 2, 5, 6, 7, 8 Điều này và bản sao giấy phép lao động đã được cấp.\".","highlight":[]},{"label":"Ngày hiệu lực (cột effective_from) và câu hiệu lực của văn bản sửa đổi","text":"2023-09-18\n1. Nghị định này có hiệu lực thi hành từ ngày 18 tháng 9 năm 2023.","highlight":["2023-09-18","ngày 18 tháng 9 năm 2023"]}]},{"id":"d8bbfbff489b700390dc190f","group":"resolved","heading":"Sửa đổi: khoản 2 Điều 11, Nghị định số 152/2020/NĐ-CP","question":"Đích (đúng điểm, khoản, Điều, văn bản), loại lệnh và phạm vi của cạnh có khớp câu lệnh không?","fields":[{"label":"Câu lệnh (cột instruction)","text":"Sửa đổi, bổ sung khoản 2 Điều 11 như sau:","highlight":["khoản 2 Điều 11","Điều 11","Sửa đổi, bổ sung"]},{"label":"Tên Điều và câu dẫn trong văn bản sửa đổi","text":"Điều 1. Sửa đổi, bổ sung một số điều của Nghị định số 152/2020/NĐ-CP ngày 30 tháng 12 năm 2020 của Chính phủ quy định về người lao động nước ngoài làm việc tại Việt Nam và tuyển dụng, quản lý người lao động Việt Nam làm việc cho tổ chức, cá nhân nước ngoài tại Việt Nam","highlight":["152/2020/NĐ-CP"]},{"label":"Đơn vị chứa câu lệnh (cột amending_unit)","text":"khoản 6 Điều 1, Nghị định số 70/2023/NĐ-CP [70-2023-nd-cp/article-1/clause-6]","highlight":[]},{"label":"Đích quy tắc đọc được (cột target_named, kind, status)","text":"khoản 2 Điều 11, Nghị định số 152/2020/NĐ-CP\nLoại: modify (sửa đổi, bổ sung)\nTrạng thái: resolved","highlight":["khoản 2 Điều 11"]},{"label":"Đơn vị đích (cột target_unit)","text":"khoản 2 Điều 11, Nghị định số 152/2020/NĐ-CP [152-2020-nd-cp/chapter-ii/section-3/article-11/clause-2]","highlight":["khoản 2 Điều 11"]},{"label":"Nguyên văn đơn vị đích (cột target_text)","text":"2. Trong thời hạn 05 ngày làm việc, kể từ ngày nhận dữ hồ sơ đề nghị cấp giấy phép lao động, Bộ Lao động - Thương binh và Xã hội hoặc Sở Lao động - Thương binh và Xã hội nơi người lao động dự kiến làm việc cấp giấy phép lao động cho người lao động nước ngoài theo Mẫu số 12/PLl Phụ lục I ban hành kèm theo Nghị định này. Mẫu giấy phép lao động do Bộ Lao động - Thương binh và Xã hội in và phát hành thống nhất. Trường hợp không cấp giấy phép lao động thì có văn bản trả lời và nêu rõ lý do.","highlight":[]},{"label":"Lời văn mới (cột new_wording_text)","text":"6. Sửa đổi, bổ sung khoản 2 Điều 11 như sau: \"2. Trong thời hạn 05 ngày làm việc, kể từ ngày nhận đủ hồ sơ đề nghị cấp giấy phép lao động, Bộ Lao động - Thương binh và Xã hội hoặc Sở Lao động - Thương binh và Xã hội nơi người lao động nước ngoài dự kiến làm việc thực hiện cấp giấy phép lao động cho người lao động nước ngoài theo Mẫu số 12/PLI Phụ lục I ban hành kèm theo Nghị định này. Trường hợp không cấp giấy phép lao động thì có văn bản trả lời và nêu rõ lý do. Giấy phép lao động có kích thước khổ A4 (21 cm x 29,7 cm), gồm 2 trang: trang 1 có màu xanh; trang 2 có nền màu trắng, hoa văn màu xanh, ở giữa có hình ngôi sao. Giấy phép lao động được mã số như sau: mã số tỉnh, thành phố trực thuộc trung ương và mà số Bộ Lao động - Thương binh và Xã hội theo Mẫu số 16/PLI Phụ lục I ban hành kèm theo Nghị định này; 2 chữ số cuối của năm cấp giấy phép; loại giấy phép (cấp mới ký hiệu 1; gia hạn ký hiệu 2; cấp lại ký hiệu 3); số thứ tự (từ 000.001). Trường hợp giấy phép lao động là bản điện tử thì phải phù hợp với quy định của pháp luật liên quan và đáp ứng nội dung theo Mẫu số 12/PLI Phụ lục I ban hành kèm theo Nghị định này.\".","highlight":[]},{"label":"Ngày hiệu lực (cột effective_from) và câu hiệu lực của văn bản sửa đổi","text":"2023-09-18\n1. Nghị định này có hiệu lực thi hành từ ngày 18 tháng 9 năm 2023.","highlight":["2023-09-18","ngày 18 tháng 9 năm 2023"]}]},{"id":"e406e416d8b2972d62b2837b","group":"resolved","heading":"Sửa đổi: khoản 3 Điều 12, Nghị định số 152/2020/NĐ-CP","question":"Đích (đúng điểm, khoản, Điều, văn bản), loại lệnh và phạm vi của cạnh có khớp câu lệnh không?","fields":[{"label":"Câu lệnh (cột instruction)","text":"Sửa đổi, bổ sung khoản 3 Điều 12 như sau:","highlight":["khoản 3 Điều 12","Điều 12","Sửa đổi, bổ sung"]},{"label":"Tên Điều và câu dẫn trong văn bản sửa đổi","text":"Điều 1. Sửa đổi, bổ sung một số điều của Nghị định số 152/2020/NĐ-CP ngày 30 tháng 12 năm 2020 của Chính phủ quy định về người lao động nước ngoài làm việc tại Việt Nam và tuyển dụng, quản lý người lao động Việt Nam làm việc cho tổ chức, cá nhân nước ngoài tại Việt Nam","highlight":["152/2020/NĐ-CP"]},{"label":"Đơn vị chứa câu lệnh (cột amending_unit)","text":"khoản 7 Điều 1, Nghị định số 70/2023/NĐ-CP [70-2023-nd-cp/article-1/clause-7]","highlight":[]},{"label":"Đích quy tắc đọc được (cột target_named, kind, status)","text":"khoản 3 Điều 12, Nghị định số 152/2020/NĐ-CP\nLoại: modify (sửa đổi, bổ sung)\nTrạng thái: resolved","highlight":["khoản 3 Điều 12"]},{"label":"Đơn vị đích (cột target_unit)","text":"khoản 3 Điều 12, Nghị định số 152/2020/NĐ-CP [152-2020-nd-cp/chapter-ii/section-4/article-12/clause-3]","highlight":["khoản 3 Điều 12"]},{"label":"Nguyên văn đơn vị đích (cột target_text)","text":"3. Thay đổi họ và tên, quốc tịch, số hộ chiếu, địa điểm làm việc ghi trong giấy phép lao động còn thời hạn.","highlight":[]},{"label":"Lời văn mới (cột new_wording_text)","text":"7. Sửa đổi, bổ sung khoản 3 Điều 12 như sau: \"3. Thay đổi một trong các nội dung sau: họ và tên, quốc tịch, số hộ chiếu, địa điểm làm việc, đổi tên doanh nghiệp mà không thay đổi mã số doanh nghiệp ghi trong giấy phép lao động còn thời hạn.\".","highlight":[]},{"label":"Ngày hiệu lực (cột effective_from) và câu hiệu lực của văn bản sửa đổi","text":"2023-09-18\n1. Nghị định này có hiệu lực thi hành từ ngày 18 tháng 9 năm 2023.","highlight":["2023-09-18","ngày 18 tháng 9 năm 2023"]}]},{"id":"b80a6c6fb0e08955dcdc08d4","group":"resolved","heading":"Sửa đổi: khoản 7 Điều 17, Nghị định số 152/2020/NĐ-CP","question":"Đích (đúng điểm, khoản, Điều, văn bản), loại lệnh và phạm vi của cạnh có khớp câu lệnh không?","fields":[{"label":"Câu lệnh (cột instruction)","text":"Sửa đổi, bổ sung khoản 7 Điều 17 như sau:","highlight":["khoản 7 Điều 17","Điều 17","Sửa đổi, bổ sung"]},{"label":"Tên Điều và câu dẫn trong văn bản sửa đổi","text":"Điều 1. Sửa đổi, bổ sung một số điều của Nghị định số 152/2020/NĐ-CP ngày 30 tháng 12 năm 2020 của Chính phủ quy định về người lao động nước ngoài làm việc tại Việt Nam và tuyển dụng, quản lý người lao động Việt Nam làm việc cho tổ chức, cá nhân nước ngoài tại Việt Nam","highlight":["152/2020/NĐ-CP"]},{"label":"Đơn vị chứa câu lệnh (cột amending_unit)","text":"khoản 8 Điều 1, Nghị định số 70/2023/NĐ-CP [70-2023-nd-cp/article-1/clause-8]","highlight":[]},{"label":"Đích quy tắc đọc được (cột target_named, kind, status)","text":"khoản 7 Điều 17, Nghị định số 152/2020/NĐ-CP\nLoại: modify (sửa đổi, bổ sung)\nTrạng thái: resolved","highlight":["khoản 7 Điều 17"]},{"label":"Đơn vị đích (cột target_unit)","text":"khoản 7 Điều 17, Nghị định số 152/2020/NĐ-CP [152-2020-nd-cp/chapter-ii/section-5/article-17/clause-7]","highlight":["khoản 7 Điều 17"]},{"label":"Nguyên văn đơn vị đích (cột target_text)","text":"7. Một trong các giấy tờ quy định tại khoản 8 Điều 9 Nghị định này chứng minh người lao động nước ngoài tiếp tục làm việc cho người sử dụng lao động theo nội dung giấy phép lao động đã được cấp.","highlight":[]},{"label":"Lời văn mới (cột new_wording_text)","text":"8. Sửa đổi, bổ sung khoản 7 Điều 17 như sau: \"Một trong các giấy tờ quy đị rget_text)","text":"2. Chủ tịch Ủy ban nhân dân cấp tỉnh chỉ đạo các cơ quan, tổ chức của địa phương giới thiệu, cung ứng người lao động Việt Nam cho nhà thầu hoặc phối hợp với các cơ quan, tổ chức ở địa phương khác để giới thiệu, cung ứng người lao động Việt Nam cho nhà thầu. Trong thời hạn tối đa 02 tháng, kể từ ngày nhận được đề nghị tuyển từ 500 người lao động Việt Nam trở lên và tối đa 01 tháng kể từ ngày nhận được đề nghị tuyển từ 100 đến dưới 500 người lao động Việt Nam và 15 ngày kể từ ngày nhận được đề nghị tuyển dưới 100 người lao động Việt Nam mà không giới thiệu hoặc cung ứng người lao động Việt Nam được cho nhà thầu thì Chủ tịch Ủy ban nhân dân cấp tỉnh xem xét, quyết định việc nhà thầu được tuyển người lao động nước ngoài vào các vị trí công việc không tuyển được người lao động Việt Nam theo Mẫu số 06/PLI Phụ lục I ban hành kèm theo Nghị định này.","highlight":["Chủ tịch Ủy ban nhân dân cấp tỉnh","Chủ tịch Ủy ban nhân dân cấp tỉnh chỉ đạo"]},{"label":"Lời văn mới (cột new_wording_text)","text":"a) Thay thế cụm từ \"Chủ tịch Ủy ban nhân dân cấp tỉnh\" tại khoản 1 Điều 5 bằng cụm từ \"Sở Lao động - Thương binh và Xã hội\"; Thay thế cụm từ \"Chủ tịch Ủy ban nhân dân cấp tỉnh chỉ đạo\" bằng cụm từ \"Sở Lao động - Thương binh và Xã hội đề nghị\" tại khoản 2 Điều 5;","highlight":[]},{"label":"Ngày hiệu lực (cột effective_from) và câu hiệu lực của văn bản sửa đổi","text":"2023-09-18\n1. Nghị định này có hiệu lực thi hành từ ngày 18 tháng 9 năm 2023.","highlight":["2023-09-18","ngày 18 tháng 9 năm 2023"]}]},{"id":"ed78c11e5e36f7cbb093d4b6","group":"resolved","heading":"Thay cụm từ: khoản 2 Điều 8, Nghị định số 152/2020/NĐ-CP","question":"Đích (đúng điểm, khoản, Điều, văn bản), loại lệnh và phạm vi của cạnh có khớp câu lệnh không?","fields":[{"label":"Câu lệnh (cột instruction)","text":"Thay thế cụm từ \"khoản 4, 6 và 8 Điều 154\" bằng cụm từ \"khoản 4 và khoản 6 Điều 154\" và cụm từ \"3 ngày\" thành cụm từ \"3 ngày làm việc\" tại khoản 2 Điều 8;","highlight":[  làm việc trước ít nhất 3 ngày, kể từ ngày người lao động nước ngoài dự kiến bắt đầu làm việc tại Việt Nam. Thời hạn xác nhận người lao động nước ngoài không thuộc diện cấp giấy phép lao động tối đa là 02 năm và theo thời hạn của một trong các trường hợp quy định tại Điều 10 Nghị định này. Trường hợp cấp lại xác nhận người lao động nước ngoài không thuộc diện cấp giấy phép lao động thì thời hạn tối đa là 02 năm.","highlight":["khoản 4, 6 và 8 Điều 154","3 ngày"]},{"label":"Lời văn mới (cột new_wording_text)","text":"b) Thay thế cụm từ \"khoản 4, 6 và 8 Điều 154\" bằng cụm từ \"khoản 4 và khoản 6 Điều 154\" và cụm từ \"3 ngày\" thành cụm từ \"3 ngày làm việc\" tại khoản 2 Điều 8;","highlight":[]},{"label":"Ngày hiệu lực (cột effective_from) và câu hiệu lực của văn bản sửa đổi","text":"2023-09-18\n1. Nghị định này có hiệu lực thi hành từ ngày 18 tháng 9 năm 2023.","highlight":["2023-09-18","ngày 18 tháng 9 năm 2023"]}]},{"id":"fa3799b84fdd70b98f10014d","group":"resolved","heading":"Thay cụm từ: điểm e khoản 3 Điều 8, Nghị định số 152/2020/NĐ-CP","question":"Đích (đúng điểm, khoản, Điều, văn bản), loại lệnh và phạm vi của cạnh có khớp câu lệnh không?","fields":[{"label":"Câu lệnh (cột instruction)","text":"Thay thế cụm từ \"dịch ra tiếng Việt và có chứng thực\" bằng cụm từ \"dịch ra tiếng Việt và công chứng hoặc chứng thực\" tại điểm e khoản 3 Điều 8;","highlight":["điểm e khoản 3 Điều 8","Điều 8","Thay thế cụm từ","Thay thế","cụm từ","dịch ra tiếng Việt và có chứng thực"]},{"label":"Tên Điều và câu dẫn trong văn bản sửa đổi","text":"Điều 1. Sửa đổi, bổ sung một số điều của Nghị định số 152/2020/NĐ-CP ngày 30 tháng 12 năm 2020 của Chính phủ quy định về người lao động nước ngoài làm việc tại Việt Nam và tuyển dụng, quản lý người lao động Việt Nam làm việc cho tổ chức, cá nhân nước ngoài tại Việt Nam\n13. Thay thế, bổ sung một số từ, cụm từ tại các điểm, khoản, điều, phụ lục sau đây:","highlight":["152/2020/NĐ-CP"]},{"label":"Đơn vị chứa câu lệnh (cột amending_unit)","te
