text":"d) Quyền và nghĩa vụ của người sử dụng lao động, người lao động và các bên liên quan trong việc thực hiện phương án sử dụng lao động;","highlight":[]},{"label":"Câu được trích xuất","text":"Quyền và nghĩa vụ của người sử dụng lao động, người lao động và các bên liên quan trong việc thực hiện phương án sử dụng lao động","highlight":[]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"phải\")\nHành vi: có\nĐối tượng: Quyền và nghĩa vụ của người sử dụng lao động, người lao động và các bên liên quan trong việc thực hiện phương án sử dụng lao động","highlight":[]}]},{"id":"Ra92fded30e","group":"Bộ luật Lao động 2019 Điều 125","heading":"khoản 4 Điều 125, Bộ luật Lao động 2019 (chưa rõ)","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 4 Điều 125, Bộ luật Lao động 2019\n45-2019-qh14/chapter-viii/section-1/article-125/clause-4","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 125. Áp dụng hình thức xử lý kỷ luật sa thải\nHình thức xử lý kỷ luật sa thải được người sử dụng lao động áp dụng trong trường hợp sau đây:","highlight":[]},{"label":"Nguyên văn đơn vị","text":"4. Người lao động tự ý bỏ việc 05 ngày cộng dồn trong thời hạn 30 ngày hoặc 20 ngày cộng dồn trong thời hạn 365 ngày tính từ ngày đầu tiên tự ý bỏ việc mà không có lý do chính đáng.\nTrường hợp được coi là có lý do chính đáng bao gồm thiên tai, hỏa hoạn, bản thân, thân nhân bị ốm có xác nhận của cơ sở khám bệnh, chữa bệnh có thẩm quyền và trường hợp khác được quy định trong nội quy lao động.","highlight":["mà không có lý do chính đáng"]},{"label":"Câu được trích xuất","text":"Người lao động tự ý bỏ việc 05 ngày cộng dồn trong thời hạn 30 ngày hoặc 20 ngày cộng dồn trong thời hạn 365 ngày tính từ ngày đầu tiên tự ý bỏ việc mà không có lý do chính đáng","highlight":["mà không có lý do chính đáng"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: chưa rõ\nChủ thể: người sử dụng lao động\nHành vi: áp dụng hình thức xử lý kỷ luật sa thải\nĐiều kiện: Người lao động tự ý bỏ việc 05 ngày cộng dồn trong thời hạn 30 ngày hoặc 20 ngày cộng dồn trong thời hạn 365 ngày tính từ ngày đầu tiên tự ý bỏ việc mà không có lý do chính đáng","highlight":["mà không có lý do chính đáng"]}]},{"id":"Ra549472d6f","group":"Bộ luật Lao động 2019 Điều 21","heading":"điểm a khoản 1 Điều 21, Bộ luật Lao động 2019 (nghĩa vụ (từ: \"phải\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm a khoản 1 Điều 21, Bộ luật Lao động 2019\n45-2019-qh14/chapter-iii/section-1/article-21/clause-1/point-a","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 21. Nội dung hợp đồng lao động\n1. Hợp đồng lao động phải có những nội dung chủ yếu sau đây:","highlight":["Hợp đồng lao động phải có những nội dung chủ yếu sau đây"]},{"label":"Nguyên văn đơn vị","text":"a) Tên, địa chỉ của người sử dụng lao động và họ tên, chức danh của người giao kết hợp đồng lao động bên phía người sử dụng lao động;","highlight":[]},{"label":"Câu được trích xuất","text":"Tên, địa chỉ của người sử dụng lao động và họ tên, chức danh của người giao kết hợp đồng lao động bên phía người sử dụng lao động","highlight":[]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"phải\")\nHành vi: có\nĐối tượng: Tên, địa chỉ của người sử dụng lao động và họ tên, chức danh của người giao kết hợp đồng lao động bên phía người sử dụng lao động","highlight":[]}]},{"id":"Rf019405119","group":"Bộ luật Lao động 2019 Điều 21","heading":"điểm g khoản 1 Điều 21, Bộ luật Lao động 2019 (nghĩa vụ (từ: \"phải\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm g khoản 1 Điều 21, Bộ luật Lao động 2019\n45-2019-qh14/chapter-iii/section-1/article-21/clause-1/point-g","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 21. Nội dung hợp đồng lao động\n1. Hợp đồng lao động phải có những nội dung chủ yếu sau đây:","highlight":["Hợp đồng lao động phải có những nội dung chủ yếu sau đây"]},{"label":"Nguyên văn đơn vị","text":"g) Thời giờ làm việc, thời giờ nghỉ ngơi;","highlight":[]},{"label":"Câu được trích xuất","text":"Thời giờ làm việc, thời giờ nghỉ ngơi","highlight":[]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"phải\")\nChủ thể: Hợp đồng lao động\nHành vi: có\nĐối tượng: Thời giờ làm việc, thời giờ nghỉ ngơi","highlight":["Chủ thể: Hợp đồng lao động"]}]},{"id":"Rb7ff4b0d7c","group":"Bộ luật Lao động 2019 Điều 101","heading":"khoản 2 Điều 101, Bộ luật Lao động 2019 (nghĩa vụ (từ: \"phải\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 2 Điều 101, Bộ luật Lao động 2019\n45-2019-qh14/chapter-vi/article-101/clause-2","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 101. Tạm ứng tiền lương","highlight":[]},{"label":"Nguyên văn đơn vị","text":"2. Người sử dụng lao động phải cho người lao động tạm ứng tiền lương tương ứng với số ngày người lao động tạm thời nghỉ việc để thực hiện nghĩa vụ công dân từ 01 tuần trở lên nhưng tối đa không quá 01 tháng tiền lương theo hợp đồng lao động và người lao động phải hoàn trả số tiền đã tạm ứng.\nNgười lao động nhập ngũ theo quy định của Luật Nghĩa vụ quân sự thì không được tạm ứng tiền lương.","highlight":["phải cho người lao động tạm ứng tiền lương","tối đa không quá 01 tháng tiền lương theo hợp đồng lao động"]},{"label":"Câu được trích xuất","text":"Người sử dụng lao động phải cho người lao động tạm ứng tiền lương tương ứng với số ngày người lao động tạm thời nghỉ việc để thực hiện nghĩa vụ công dân từ 01 tuần trở lên nhưng tối đa không quá 01 tháng tiền lương theo hợp đồng lao động và người lao động phải hoàn trả số tiền đã tạm ứng","highlight":["phải cho người lao động tạm ứng tiền lương","tối đa không quá 01 tháng tiền lương theo hợp đồng lao động"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"phải\")\nChủ thể: Người sử dụng lao động\nHành vi: cho\nĐối tượng: tạm ứng tiền lương\nBên thụ hưởng: người lao động\nBên nhận: người lao động\nĐiều kiện: tương ứng với số ngày người lao động tạm thời nghỉ việc để thực hiện nghĩa vụ công dân từ 01 tuần trở lên\nĐịnh lượng: tối đa không quá 01 tháng tiền lương theo hợp đồng lao động","highlight":["tối đa không quá 01 tháng tiền lương theo hợp đồng lao động"]}]},{"id":"Rf0c9c4d5eb","group":"Bộ luật Lao động 2019 Điều 41","heading":"khoản 2 Điều 41, Bộ luật Lao động 2019 (nghĩa vụ (từ: \"phải\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 2 Điều 41, Bộ luật Lao động 2019\n45-2019-qh14/chapter-iii/section-3/article-41/clause-2","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 41. Nghĩa vụ của người sử dụng lao động khi đơn phương chấm dứt hợp đồng lao động trái pháp luật","highlight":[]},{"label":"Nguyên văn đơn vị","text":"2. Trường hợp người lao động không muốn tiếp tục làm việc thì ngoài khoản tiền phải trả quy định tại khoản 1 Điều này người sử dụng lao động phải trả trợ cấp thôi việc theo quy định tại Điều 46 của Bộ luật này để chấm dứt hợp đồng lao động.","highlight":["người sử dụng lao động phải trả trợ cấp thôi việc theo quy định tại Điều 46 của Bộ luật này"]},{"label":"Câu được trích xuất","text":"Trường hợp người lao động không muốn tiếp tục làm việc thì ngoài khoản tiền phải trả quy định tại khoản 1 Điều này người sử dụng lao động phải trả trợ cấp thôi việc theo quy định tại Điều 46 của Bộ luật này để chấm dứt hợp đồng lao động","highlight":["người sử dụng lao động phải trả trợ cấp thôi việc theo quy định tại Điều 46 của Bộ luật này"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"phải\")\nChủ thể: người sử dụng lao động\nHành vi: trả trợ cấp thôi việc theo quy định tại Điều 46 của Bộ luật này để chấm dứt hợp đồng lao động\nĐiều kiện: Trường hợp người lao động không muốn tiếp tục làm việc; ngoài khoản tiền phải trả quy định tại khoản 1 Điều này","highlight":[]}]},{"id":"R2503fc9466","group":"Bộ luật Lao động 2019 Điều 21","heading":"điểm c khoản 1 Điều 21, Bộ luật Lao động 2019 (nghĩa vụ (từ: \"phải\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm c khoản 1 Điều 21, Bộ luật Lao động 2019\n45-2019-qh14/chapter-iii/section-1/article-21/clause-1/point-c","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 21. Nội dung hợp đồng lao động\n1. Hợp đồng lao động phải có những nội dung chủ yếu sau đây:","highlight":["Hợp đồng lao động phải có những nội dung chủ yếu sau đây"]},{"label":"Nguyên văn đơn vị","text":"c) Công việc và địa điểm làm việc;","highlight":[]},{"label":"Câu được trích xuất","text":"Công việc và địa điểm làm việc","highlight":[]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"phải\")\nChủ thể: Hợp đồng lao động\nHành vi: có\nĐối tượng: Công việc và địa điểm làm việc","highlight":["Chủ thể: Hợp đồng lao động"]}]},{"id":"R35f7edb547","group":"Bộ luật Lao động 2019 Điều 127","heading":"khoản 2 Điều 127, Bộ luật Lao động 2019 (chưa rõ)","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 2 Điều 127, Bộ luật Lao động 2019\n45-2019-qh14/chapter-viii/section-1/article-127/clause-2","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 127. Các hành vi bị nghiêm cấm khi xử lý kỷ luật lao động","highlight":["Các hành vi bị nghiêm cấm khi xử lý kỷ luật lao động"]},{"label":"Nguyên văn đơn vị","text":"2. Phạt tiền, cắt lương thay việc xử lý kỷ luật lao động.","highlight":[]},{"label":"Câu được trích xuất","text":"Phạt tiền, cắt lương thay việc xử lý kỷ luật lao động","highlight":[]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: chưa rõ\nHành vi: Phạt tiền, cắt lương\nĐối tượng: thay việc xử lý kỷ luật lao động","highlight":["Tính quy phạm: chưa rõ"]}]},{"id":"R7e22ad155c","group":"Bộ luật Lao động 2019 Điều 131","heading":"Điều 131, Bộ luật Lao động 2019 (quyền (từ: \"có quyền\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"Điều 131, Bộ luật Lao động 2019\n45-2019-qh14/chapter-viii/section-2/article-131","highlight":[]},{"label":"Nguyên văn đơn vị","text":"Điều 131. Khiếu nại về kỷ luật lao động, trách nhiệm vật chất\nNgười bị xử lý kỷ luật lao động, bị tạm đình chỉ công việc hoặc phải bồi thường theo chế độ trách nhiệm vật chất nếu thấy không thỏa đáng có quyền khiếu nại với người sử dụng lao động, với cơ quan có thẩm quyền theo quy định của pháp luật hoặc yêu cầu giải quyết tranh chấp lao động theo trình tự do pháp luật quy định.\nChính phủ quy định chi tiết Điều này.","highlight":["có quyền khiếu nại với người sử dụng lao động, với cơ quan có thẩm quyền theo quy định của pháp luật"]},{"label":"Câu được trích xuất","text":"Người bị xử lý kỷ luật lao động, bị tạm đình chỉ công việc hoặc phải bồi thường theo chế độ trách nhiệm vật chất nếu thấy không thỏa đáng có quyền khiếu nại với người sử dụng lao động, với cơ quan có thẩm quyền theo quy định của pháp luật hoặc yêu cầu giải quyết tranh chấp lao động theo trình tự do pháp luật quy định","highlight":["có quyền khiếu nại với người sử dụng lao động, với cơ quan có thẩm quyền theo quy định của pháp luật"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: quyền (từ: \"có quyền\")\nChủ thể: Người bị xử lý kỷ luật lao động, bị tạm đình chỉ công việc hoặc phải bồi thường theo chế độ trách nhiệm vật chất\nHành vi: khiếu nại với cơ quan có thẩm quyền theo quy định của pháp luật\nĐiều kiện: nếu thấy không thỏa đáng","highlight":["Hành vi: khiếu nại với cơ quan có thẩm quyền"]}]},{"id":"Rb15d3f93e1","group":"NĐ 145/2020/NĐ-CP Điều 60","heading":"khoản 5 Điều 60, NĐ 145/2020/NĐ-CP (được phép (từ: \"được\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 5 Điều 60, NĐ 145/2020/NĐ-CP\n145-2020-nd-cp/chapter-vii/article-60/clause-5","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 60. Giới hạn số giờ làm thêm","highlight":[]},{"label":"Nguyên văn đơn vị","text":"5. Thời giờ quy định tại các khoản 1 Điều 58 Nghị định này được giảm trừ khi tính tổng số giờ làm thêm trong tháng, trong năm để xác định việc tuân thủ quy định tại điểm b, điểm c khoản 2 Điều 107 của Bộ luật Lao động.","highlight":["được giảm trừ khi tính tổng số giờ làm thêm"]},{"label":"Câu được trích xuất","text":"Thời giờ quy định tại các khoản 1 Điều 58 Nghị định này được giảm trừ khi tính tổng số giờ làm thêm trong tháng, trong năm để xác định việc tuân thủ quy định tại điểm b, điểm c khoản 2 Điều 107 của Bộ luật Lao động","highlight":["được giảm trừ khi tính tổng số giờ làm thêm"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: được phép (từ: \"được\")\nHành vi: được giảm trừ\nĐối tượng: Thời giờ quy định tại các khoản 1 Điều 58 Nghị định này\nĐiều kiện: khi tính tổng số giờ làm thêm trong tháng, trong năm để xác định việc tuân thủ quy định tại điểm b, điểm c khoản 2 Điều 107 của Bộ luật Lao động","highlight":["Tính quy phạm: được phép"]}]},{"id":"R3c3cbd3765","group":"Bộ luật Lao động 2019 Điều 21","heading":"điểm k khoản 1 Điều 21, Bộ luật Lao động 2019 (nghĩa vụ (từ: \"phải\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm k khoản 1 Điều 21, Bộ luật Lao động 2019\n45-2019-qh14/chapter-iii/section-1/article-21/clause-1/point-k","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 21. Nội dung hợp đồng lao động\n1. Hợp đồng lao động phải có những nội dung chủ yếu sau đây:","highlight":["Hợp đồng lao động phải có những nội dung chủ yếu sau đây"]},{"label":"Nguyên văn đơn vị","text":"k) Đào tạo, bồi dưỡng, nâng cao trình độ, kỹ năng nghề.","highlight":[]},{"label":"Câu được trích xuất","text":"Đào tạo, bồi dưỡng, nâng cao trình độ, kỹ năng nghề","highlight":[]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"phải\")\nChủ thể: Hợp đồng lao động\nHành vi: có\nĐối tượng: Đào tạo, bồi dưỡng, nâng cao trình độ, kỹ năng nghề","highlight":["Chủ thể: Hợp đồng lao động"]}]},{"id":"R1f4f88c554","group":"Bộ luật Lao động 2019 Điều 30","heading":"điểm e khoản 1 Điều 30, Bộ luật Lao động 2019 (được phép (từ: \"được\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm e khoản 1 Điều 30, Bộ luật Lao động 2019\n45-2019-qh14/chapter-iii/section-2/article-30/clause-1/point-e","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 30. Tạm hoãn thực hiện hợp đồng lao động\n1. Các trường hợp tạm hoãn thực hiện hợp đồng lao động bao gồm:","highlight":[]},{"label":"Nguyên văn đơn vị","text":"e) Người lao động được ủy quyền để thực hiện quyền, trách nhiệm của đại diện chủ sở hữu nhà nước đối với phần vốn nhà nước tại doanh nghiệp;","highlight":["Người lao động được ủy quyền"]},{"label":"Câu được trích xuất","text":"Người lao động được ủy quyền để thực hiện quyền, trách nhiệm của đại diện chủ sở hữu nhà nước đối với phần vốn nhà nước tại doanh nghiệp","highlight":["Người lao động được ủy quyền"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: được phép (từ: \"được\")\nChủ thể: Người lao động\nHành vi: uy quyền để thực hiện quyền, trách nhiệm của đại diện chủ sở hữu nhà nước đối với phần vốn nhà nước tại doanh nghiệp","highlight":["Tính quy phạm: được phép","Hành vi: uy quyền"]}]},{"id":"Rc0bf07b62f","group":"NĐ 145/2020/NĐ-CP Điều 70","heading":"khoản 4 Điều 70, NĐ 145/2020/NĐ-CP (nghĩa vụ)","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 4 Điều 70, NĐ 145/2020/NĐ-CP\n145-2020-nd-cp/chapter-viii/article-70/clause-4","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 70. Trình tự, thủ tục xử lý kỷ luật lao động\nTrình tự, thủ tục xử lý kỷ luật lao động tại khoản 6 Điều 122 của Bộ luật Lao động được quy định như sau:","highlight":[]},{"label":"Nguyên văn đơn vị","text":"4. Trong thời hiệu xử lý kỷ luật lao động quy định tại khoản 1, khoản 2 Điều 123 của Bộ luật Lao động, người có thẩm quyền xử lý kỷ luật lao động ban hành quyết định xử lý kỷ luật lao động và gửi đến các thành phần phải tham dự quy định tại điểm b, điểm c khoản 1 Điều 122 của Bộ luật Lao động.","highlight":["ban hành quyết định xử lý kỷ luật lao động và gửi đến các thành phần phải tham dự"]},{"label":"Câu được trích xuất","text":"Trong thời hiệu xử lý kỷ luật lao động quy định tại khoản 1, khoản 2 Điều 123 của Bộ luật Lao động, người có thẩm quyền xử lý kỷ luật lao động ban hành quyết định xử lý kỷ luật lao động và gửi đến các thành phần phải tham dự quy định tại điểm b, điểm c khoản 1 Điều 122 của Bộ luật Lao động","highlight":["ban hành quyết định xử lý kỷ luật lao động và gửi đến các thành phần phải tham dự"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ\nChủ thể: người có thẩm quyền xử lý kỷ luật lao động\nHành vi: gửi đến các thành phần phải tham dự quy định tại điểm b, điểm c khoản 1 Điều 122 của Bộ luật Lao động\nĐối tượng: quyết định xử lý kỷ luật lao động\nBên nhận: các thành phần phải tham dự quy định tại điểm b, điểm c khoản 1 Điều 122 của Bộ luật Lao động\nĐiều kiện: Trong thời hiệu xử lý kỷ luật lao động quy định tại khoản 1, khoản 2 Điều 123 của Bộ luật Lao động","highlight":[]}]},{"id":"Rf63070aea3","group":"Bộ luật Lao động 2019 Điều 21","heading":"điểm c khoản 1 Điều 21, Bộ luật Lao động 2019 (nghĩa vụ (từ: \"phải\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm c khoản 1 Điều 21, Bộ luật Lao động 2019\n45-2019-qh14/chapter-iii/section-1/article-21/clause-1/point-c","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 21. Nội dung hợp đồng lao động\n1. Hợp đồng lao động phải có những nội dung chủ yếu sau đây:","highlight":["Hợp đồng lao động phải có những nội dung chủ yếu sau đây"]},{"label":"Nguyên văn đơn vị","text":"c) Công việc và địa điểm làm việc;","highlight":[]},{"label":"Câu được trích xuất","text":"Công việc và địa điểm làm việc","highlight":[]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"phải\")\nHành vi: có\nĐối tượng: Công việc và địa điểm làm việc","highlight":[]}]},{"id":"Re744154e89","group":"NĐ 145/2020/NĐ-CP Điều 55","heading":"khoản 2 Điều 55, NĐ 145/2020/NĐ-CP (chưa rõ)","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 2 Điều 55, NĐ 145/2020/NĐ-CP\n145-2020-nd-cp/chapter-vi/section-2/article-55/clause-2","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 55. Tiền lương làm thêm giờ\nTiền lương làm thêm giờ theo khoản 1 Điều 98 của Bộ luật Lao động được quy định như sau:","highlight":[]},{"label":"Nguyên văn đơn vị","text":"2. Đối với người lao động hưởng lương theo sản phẩm, được trả lương làm thêm giờ khi làm việc ngoài thời giờ làm việc bình thường để làm thêm số lượng, khối lượng sản phẩm ngoài số lượng, khối lượng sản phẩm theo định mức lao động theo thỏa thuận với người sử dụng lao động và được tính theo công thức sau:\nTiền lương làm thêm giờ\n=\nĐơn giá tiền lương sản phẩm của ngày làm việc bình thường\nx\nMức ít nhất 150% hoặc 200% hoặc 300%\nx\nSố sản phẩm làm thêm\nTrong đó:\nMức ít nhất bằng 150% so với đơn giá tiền lương sản phẩm của ngày làm việc bình thường, áp dụng đối với sản phẩm làm thêm vào ngày thường; mức ít nhất bằng 200% so với đơn giá tiền lương sản phẩm của ngày làm việc bình thường, áp dụng đối với sản phẩm làm thêm vào ngày nghỉ hằng tuần; mức ít nhất bằng 300% so với đơn giá tiền lương sản phẩm của ngày làm việc bình thường, áp dụng đối với sản phẩm làm thêm vào ngày nghỉ lễ, tết, ngày nghỉ có hưởng lương.","highlight":["mức ít nhất bằng 200% so với đơn giá tiền lương sản phẩm của ngày làm việc bình thường, áp dụng đối với sản phẩm làm thêm vào ngày nghỉ hằng tuần"]},{"label":"Câu được trích xuất","text":"Mức ít nhất bằng 150% so với đơn giá tiền lương sản phẩm của ngày làm việc bình thường, áp dụng đối với sản phẩm làm thêm vào ngày thường; mức ít nhất bằng 200% so với đơn giá tiền lương sản phẩm của ngày làm việc bình thường, áp dụng đối với sản phẩm làm thêm vào ngày nghỉ hằng tuần; mức ít nhất bằng 300% so với đơn giá tiền lương sản phẩm của ngày làm việc bình thường, áp dụng đối với sản phẩm làm thêm vào ngày nghỉ lễ, tết, ngày nghỉ có hưởng lương","highlight":["mức ít nhất bằng 200% so với đơn giá tiền lương sản phẩm của ngày làm việc bình thường, áp dụng đối với sản phẩm làm thêm vào ngày nghỉ hằng tuần"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: chưa rõ\nHành vi: Mức ít nhất bằng 200%\nĐối tượng: so với đơn giá tiền lương sản phẩm của ngày làm việc bình thường\nĐiều kiện: áp dụng đối với sản phẩm làm thêm vào ngày nghỉ hằng tuần\nĐịnh lượng: 200%","highlight":["Hành vi: Mức ít nhất bằng 200%"]}]},{"id":"R9fce0a0763","group":"NĐ 145/2020/NĐ-CP Điều 57","heading":"điểm b khoản 2 Điều 57, NĐ 145/2020/NĐ-CP (nghĩa vụ (từ: \"được\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm b khoản 2 Điều 57, NĐ 145/2020/NĐ-CP\n145-2020-nd-cp/chapter-vi/section-2/article-57/clause-2/point-b","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 57. Tiền lương làm thêm giờ vào ban đêm\nNgười lao động làm thêm giờ vào ban đêm theo khoản 3 Điều 98 của Bộ luật Lao động, được hưởng tiền lương tính theo công thức sau:\n2. Đối với người lao động hưởng lương theo sản phẩm, tiền lương làm thêm giờ vào ban đêm được tính như sau:\nTrong đó, đơn giá tiền lương sản phẩm vào ban ngày của ngày làm việc bình thường hoặc của ngày nghỉ hằng tuần hoặc của ngày nghỉ lễ, tết, ngày nghỉ có hưởng lương được xác định như sau:","highlight":[]},{"label":"Nguyên văn đơn vị","text":"b) Đơn giá tiền lương sản phẩm vào ban ngày của ngày nghỉ hằng tuần, được tính ít nhất bằng 200% so với đơn giá tiền lương sản phẩm của ngày làm việc bình thường;","highlight":["Đơn giá tiền lương sản phẩm vào ban ngày của ngày nghỉ hằng tuần"]},{"label":"Câu được trích xuất","text":"Đơn giá tiền lương sản phẩm vào ban ngày của ngày nghỉ hằng tuần, được tính ít nhất bằng 200% so với đơn giá tiền lương sản phẩm của ngày làm việc bình thường","highlight":["Đơn giá tiền lương sản phẩm vào ban ngày của ngày nghỉ hằng tuần"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"được\")\nHành vi: tính\nĐối tượng: ít nhất bằng 200% so với đơn giá tiền lương sản phẩm của ngày làm việc bình thường","highlight":["Đối tượng: ít nhất bằng 200%"]}]},{"id":"R5926b86319","group":"Bộ luật Lao động 2019 Điều 43","heading":"khoản 3 Điều 43, Bộ luật Lao động 2019 (quyền (từ: \"được\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 3 Điều 43, Bộ luật Lao động 2019\n45-2019-qh14/chapter-iii/section-3/article-43/clause-3","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 43. Nghĩa vụ của người sử dụng lao động khi chia, tách, hợp nhất, sáp nhập; bán, cho thuê, chuyển đổi loại hình doanh nghiệp; chuyển nhượng quyền sở hữu, quyền sử dụng tài sản của doanh nghiệp, hợp tác xã","highlight":[]},{"label":"Nguyên văn đơn vị","text":"3. Người lao động bị thôi việc thì được nhận trợ cấp mất việc làm theo quy định tại Điều 47 của Bộ luật này.","highlight":["được nhận trợ cấp mất việc làm theo quy định tại Điều 47 của Bộ luật này"]},{"label":"Câu được trích xuất","text":"Người lao động bị thôi việc thì được nhận trợ cấp mất việc làm theo quy định tại Điều 47 của Bộ luật này","highlight":["được nhận trợ cấp mất việc làm theo quy định tại Điều 47 của Bộ luật này"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: quyền (từ: \"được\")\nChủ thể: Người lao động bị thôi việc\nHành vi: nhận trợ cấp mất việc làm\nĐiều kiện: theo quy định tại Điều 47 của Bộ luật này","highlight":[]}]},{"id":"Rf26da11fbf","group":"Bộ luật Lao động 2019 Điều 98","heading":"điểm a khoản 1 Điều 98, Bộ luật Lao động 2019 (quyền (từ: \"được\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm a khoản 1 Điều 98, Bộ luật Lao động 2019\n45-2019-qh14/chapter-vi/article-98/clause-1/point-a","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 98. Tiền lương làm thêm giờ, làm việc vào ban đêm\n1. Người lao động làm thêm giờ được trả lương tính theo đơn giá tiền lương hoặc tiền lương thực trả theo công việc đang làm như sau:","highlight":["Người lao động làm thêm giờ được trả lương tính theo đơn giá tiền lương hoặc tiền lương thực trả theo công việc đang làm"]},{"label":"Nguyên văn đơn vị","text":"a) Vào ngày thường, ít nhất bằng 150%;","highlight":[]},{"label":"Câu được trích xuất","text":"Vào ngày thường, ít nhất bằng 150%","highlight":[]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: quyền (từ: \"được\")\nChủ thể: Người lao động làm thêm giờ\nHành vi: được trả lương\nĐối tượng: tính theo đơn giá tiền lương hoặc tiền lương thực trả theo công việc đang làm\nĐiều kiện: Vào ngày thường\nĐịnh lượng: ít nhất bằng 150%","highlight":[]}]},{"id":"Reb16e0ddb8","group":"Bộ luật Lao động 2019 Điều 105","heading":"khoản 1 Điều 105, Bộ luật Lao động 2019 (cấm (từ: \"không quá\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 1 Điều 105, Bộ luật Lao động 2019\n45-2019-qh14/chapter-vii/section-1/article-105/clause-1","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 105. Thời giờ làm việc bình thường","highlight":[]},{"label":"Nguyên văn đơn vị","text":"1. Thời giờ làm việc bình thường không quá 08 giờ trong 01 ngày và không quá 48 giờ trong 01 tuần.","highlight":["Thời giờ làm việc bình thường không quá 08 giờ trong 01 ngày"]},{"label":"Câu được trích xuất","text":"Thời giờ làm việc bình thường không quá 08 giờ trong 01 ngày và không quá 48 giờ trong 01 tuần","highlight":["Thời giờ làm việc bình thường không quá 08 giờ trong 01 ngày"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: cấm (từ: \"không quá\")\nHành vi: không quá 08 giờ trong 01 ngày và không quá 48 giờ trong 01 tuần\nĐịnh lượng: 08 giờ trong 01 ngày và 48 giờ trong 01 tuần","highlight":["Định lượng: 08 giờ trong 01 ngày và 48 giờ trong 01 tuần","Tính quy phạm: cấm"]}]},{"id":"R8540692d7e","group":"Bộ luật Lao động 2019 Điều 128","heading":"khoản 2 Điều 128, Bộ luật Lao động 2019 (quyền (từ: \"được\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 2 Điều 128, Bộ luật Lao động 2019\n45-2019-qh14/chapter-viii/section-1/article-128/clause-2","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 128. Tạm đình chỉ công việc","highlight":[]},{"label":"Nguyên văn đơn vị","text":"2. Thời hạn tạm đình chỉ công việc không được quá 15 ngày, trường hợp đặc biệt không được quá 90 ngày. Trong thời gian bị tạm đình chỉ công việc, người lao động được tạm ứng 50% tiền lương trước khi bị đình chỉ công việc.\nHết thời hạn tạm đình chỉ công việc, người sử dụng lao động phải nhận người lao động trở lại làm việc.","highlight":["người lao động được tạm ứng 50% tiền lương trước khi bị đình chỉ công việc"]},{"label":"Câu được trích xuất","text":"Trong thời gian bị tạm đình chỉ công việc, người lao động được tạm ứng 50% tiền lương trước khi bị đình chỉ công việc","highlight":["người lao động được tạm ứng 50% tiền lương trước khi bị đình chỉ công việc"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: quyền (từ: \"được\")\nHành vi: tạm ứng\nĐối tượng: 50% tiền lương\nBên thụ hưởng: người lao động\nĐiều kiện: Trong thời gian bị tạm đình chỉ công việc trước khi bị đình chỉ công việc\nĐịnh lượng: 50%","highlight":["Điều kiện: Trong thời gian bị tạm đình chỉ công việc trước khi bị đình chỉ công việc"]}]},{"id":"R78ed1a3d39","group":"Bộ luật Lao động 2019 Điều 125","heading":"khoản 2 Điều 125, Bộ luật Lao động 2019 (chưa rõ)","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 2 Điều 125, Bộ luật Lao động 2019\n45-2019-qh14/chapter-viii/section-1/article-125/clause-2","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 125. Áp dụng hình thức xử lý kỷ luật sa thải\nHình thức xử lý kỷ luật sa thải được người sử dụng lao động áp dụng trong trường hợp sau đây:","highlight":["Áp dụng hình thức xử lý kỷ luật sa thải"]},{"label":"Nguyên văn đơn vị","text":"2. Người lao động có hành vi tiết lộ bí mật kinh doanh, bí mật công nghệ, xâm phạm quyền sở hữu trí tuệ của người sử dụng lao động, có hành vi gây thiệt hại nghiêm trọng hoặc đe dọa gây thiệt hại đặc biệt nghiêm trọng về tài sản, lợi ích của người sử dụng lao động hoặc quấy rối tình dục tại nơi làm việc được quy định trong nội quy lao động;","highlight":[]},{"label":"Câu được trích xuất","text":"Người lao động có hành vi tiết lộ bí mật kinh doanh, bí mật công nghệ, xâm phạm quyền sở hữu trí tuệ của người sử dụng lao động, có hành vi gây thiệt hại nghiêm trọng hoặc đe dọa gây thiệt hại đặc biệt nghiêm trọng về tài sản, lợi ích của người sử dụng lao động hoặc quấy rối tình dục tại nơi làm việc được quy định trong nội quy lao động","highlight":[]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: chưa rõ\nChủ thể: người sử dụng lao động\nHành vi: áp dụng hình thức xử lý kỷ luật sa thải\nĐiều kiện: Người lao động có hành vi tiết lộ bí mật kinh doanh, bí mật công nghệ, xâm phạm quyền sở hữu trí tuệ của người sử dụng lao động, có hành vi gây thiệt hại nghiêm trọng hoặc đe dọa gây thiệt hại đặc biệt nghiêm trọng về tài sản, lợi ích của người sử dụng lao động hoặc quấy rối tình dục tại nơi làm việc được quy định trong nội quy lao động","highlight":[]}]},{"id":"R6e027ee504","group":"Bộ luật Lao động 2019 Điều 112","heading":"điểm d khoản 1 Điều 112, Bộ luật Lao động 2019 (quyền (từ: \"được\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm d khoản 1 Điều 112, Bộ luật Lao động 2019\n45-2019-qh14/chapter-vii/section-2/article-112/clause-1/point-d","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 112. Nghỉ lễ, tết\n1. Người lao động được nghỉ làm việc, hưởng nguyên lương trong những ngày lễ, tết sau đây:","highlight":["Người lao động được nghỉ làm việc, hưởng nguyên lương trong những ngày lễ, tết sau đây"]},{"label":"Nguyên văn đơn vị","text":"d) Ngày Quốc tế lao động: 01 ngày (ngày 01 tháng 5 dương lịch);","highlight":[]},{"label":"Câu được trích xuất","text":"Ngày Quốc tế lao động: 01 ngày (ngày 01 tháng 5 dương lịch)","highlight":[]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: quyền (từ: \"được\")\nChủ thể: Người lao động\nHành vi: nghỉ làm việc, hưởng nguyên lương\nĐối tượng: Ngày Quốc tế lao động: 01 ngày (ngày 01 tháng 5 dương lịch)\nĐiều kiện: trong những ngày lễ, tết sau đây\nĐịnh lượng: 01 ngày","highlight":[]}]},{"id":"Rdadff296d8","group":"Bộ luật Lao động 2019 Điều 111","heading":"khoản 1 Điều 111, Bộ luật Lao động 2019 (quyền (từ: \"được\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 1 Điều 111, Bộ luật Lao động 2019\n45-2019-qh14/chapter-vii/section-2/article-111/clause-1","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 111. Nghỉ hằng tuần","highlight":[]},{"label":"Nguyên văn đơn vị","text":"1. Mỗi tuần, người lao động được nghỉ ít nhất 24 giờ liên tục. Trong trường hợp đặc biệt do chu kỳ lao động không thể nghỉ hằng tuần thì người sử dụng lao động có trách nhiệm bảo đảm cho người lao động được nghỉ tính bình quân 01 tháng ít nhất 04 ngày.","highlight":["người lao động được nghỉ tính bình quân 01 tháng ít nhất 04 ngày"]},{"label":"Câu được trích xuất","text":"Trong trường hợp đặc biệt do chu kỳ lao động không thể nghỉ hằng tuần thì người sử dụng lao động có trách nhiệm bảo đảm cho người lao động được nghỉ tính bình quân 01 tháng ít nhất 04 ngày","highlight":["người lao động được nghỉ tính bình quân 01 tháng ít nhất 04 ngày"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: quyền (từ: \"được\")\nChủ thể: người lao động\nHành vi: nghỉ\nĐiều kiện: Trong trường hợp đặc biệt do chu kỳ lao động không thể nghỉ hằng tuần\nĐịnh lượng: tính bình quân 01 tháng ít nhất 04 ngày","highlight":[]}]},{"id":"Rb7875614f7","group":"Bộ luật Lao động 2019 Điều 29","heading":"khoản 4 Điều 29, Bộ luật Lao động 2019 (nghĩa vụ (từ: \"phải\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 4 Điều 29, Bộ luật Lao động 2019\n45-2019-qh14/chapter-iii/section-2/article-29/clause-4","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 29. Chuyển người lao động làm công việc khác so với hợp đồng lao động","highlight":[]},{"label":"Nguyên văn đơn vị","text":"4. Người lao động không đồng ý tạm thời làm công việc khác so với hợp đồng lao động quá 60 ngày làm việc cộng dồn trong 01 năm mà phải ngừng việc thì người sử dụng lao động phải trả lương ngừng việc theo quy định tại Điều 99 của Bộ luật này.","highlight":["người sử dụng lao động phải trả lương ngừng việc theo quy định tại Điều 99 của Bộ luật này"]},{"label":"Câu được trích xuất","text":"Người lao động không đồng ý tạm thời làm công việc khác so với hợp đồng lao động quá 60 ngày làm việc cộng dồn trong 01 năm mà phải ngừng việc thì người sử dụng lao động phải trả lương ngừng việc theo quy định tại Điều 99 của Bộ luật này","highlight":["người sử dụng lao động phải trả lương ngừng việc theo quy định tại Điều 99 của Bộ luật này"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"phải\")\nChủ thể: người sử dụng lao động\nHành vi: trả lương ngừng việc theo quy định tại Điều 99 của Bộ luật này\nĐiều kiện: Người lao động không đồng ý tạm thời làm công việc khác so với hợp đồng lao động quá 60 ngày làm việc cộng dồn trong 01 năm mà phải ngừng việc","highlight":[]}]},{"id":"Rf02f93aa06","group":"Bộ luật Lao động 2019 Điều 29","heading":"khoản 3 Điều 29, Bộ luật Lao động 2019 (cấm (từ: \"không\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 3 Điều 29, Bộ luật Lao động 2019\n45-2019-qh14/chapter-iii/section-2/article-29/clause-3","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 29. Chuyển người lao động làm công việc khác so với hợp đồng lao động","highlight":[]},{"label":"Nguyên văn đơn vị","text":"3. Người lao động chuyển sang làm công việc khác so với hợp đồng lao động được trả lương theo công việc mới. Nếu tiền lương của công việc mới thấp hơn tiền lương của công việc cũ thì được giữ nguyên tiền lương của công việc cũ trong thời hạn 30 ngày làm việc. Tiền lương theo công việc mới ít nhất phải bằng 85% tiền lương của công việc cũ nhưng không thấp hơn mức lương tối thiểu.","highlight":["nhưng không thấp hơn mức lương tối thiểu"]},{"label":"Câu được trích xuất","text":"Tiền lương theo công việc mới ít nhất phải bằng 85% tiền lương của công việc cũ nhưng không thấp hơn mức lương tối thiểu","highlight":["nhưng không thấp hơn mức lương tối thiểu"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: cấm (từ: \"không\")\nHành vi: thấp hơn mức lương tối thiểu\nBên thụ hưởng: người lao động","highlight":["Hành vi: thấp hơn mức lương tối thiểu"]}]},{"id":"Rd257b33c36","group":"Bộ luật Lao động 2019 Điều 29","heading":"khoản 3 Điều 29, Bộ luật Lao động 2019 (nghĩa vụ (từ: \"phải\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 3 Điều 29, Bộ luật Lao động 2019\n45-2019-qh14/chapter-iii/section-2/article-29/clause-3","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 29. Chuyển người lao động làm công việc khác so với hợp đồng lao động","highlight":[]},{"label":"Nguyên văn đơn vị","text":"3. Người lao động chuyển sang làm công việc khác so với hợp đồng lao động được trả lương theo công việc mới. Nếu tiền lương của công việc mới thấp hơn tiền lương của công việc cũ thì được giữ nguyên tiền lương của công việc cũ trong thời hạn 30 ngày làm việc. Tiền lương theo công việc mới ít nhất phải bằng 85% tiền lương của công việc cũ nhưng không thấp hơn mức lương tối thiểu.","highlight":["ít nhất phải bằng 85% tiền lương của công việc cũ nhưng không thấp hơn mức lương tối thiểu"]},{"label":"Câu được trích xuất","text":"Tiền lương theo công việc mới ít nhất phải bằng 85% tiền lương của công việc cũ nhưng không thấp hơn mức lương tối thiểu","highlight":["ít nhất phải bằng 85% tiền lương của công việc cũ nhưng không thấp hơn mức lương tối thiểu"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"phải\")\nChủ thể: Người sử dụng lao động\nHành vi: phải bằng 85% tiền lương của công việc cũ nhưng không thấp hơn mức lương tối thiểu\nĐối tượng: tiền lương theo công việc mới\nĐịnh lượng: ít nhất 85% tiền lương của công việc cũ","highlight":["Chủ thể: Người sử dụng lao động"]}]},{"id":"Raaba7536cf","group":"Bộ luật Lao động 2019 Điều 21","heading":"điểm e khoản 1 Điều 21, Bộ luật Lao động 2019 (nghĩa vụ (từ: \"phải\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm e khoản 1 Điều 21, Bộ luật Lao động 2019\n45-2019-qh14/chapter-iii/section-1/article-21/clause-1/point-e","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 21. Nội dung hợp đồng lao động\n1. Hợp đồng lao động phải có những nội dung chủ yếu sau đây:","highlight":["Hợp đồng lao động phải có những nội dung chủ yếu sau đây"]},{"label":"Nguyên văn đơn vị","text":"e) Chế độ nâng bậc, nâng lương;","highlight":[]},{"label":"Câu được trích xuất","text":"Chế độ nâng bậc, nâng lương","highlight":[]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"phải\")\nHành vi: có\nĐối tượng: Chế độ nâng bậc, nâng lương\nĐiều kiện: Hợp đồng lao động","highlight":["Điều kiện: Hợp đồng lao động"]}]},{"id":"R3a7da3f055","group":"NĐ 145/2020/NĐ-CP Điều 57","heading":"điểm a khoản 2 Điều 57, NĐ 145/2020/NĐ-CP (nghĩa vụ (từ: \"được\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm a khoản 2 Điều 57, NĐ 145/2020/NĐ-CP\n145-2020-nd-cp/chapter-vi/section-2/article-57/clause-2/point-a","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 57. Tiền lương làm thêm giờ vào ban đêm\nNgười lao động làm thêm giờ vào ban đêm theo khoản 3 Điều 98 của Bộ luật Lao động, được hưởng tiền lương tính theo công thức sau:\n2. Đối với người lao động hưởng lương theo sản phẩm, tiền lương làm thêm giờ vào ban đêm được tính như sau:\nTrong đó, đơn giá tiền lương sản phẩm vào ban ngày của ngày làm việc bình thường hoặc của ngày nghỉ hằng tuần hoặc của ngày nghỉ lễ, tết, ngày nghỉ có hưởng lương được xác định như sau:","highlight":[]},{"label":"Nguyên văn đơn vị","text":"a) Đơn giá tiền lương sản phẩm vào ban ngày của ngày làm việc bình thường, được tính ít nhất bằng 100% so với đơn giá tiền lương sản phẩm của ngày làm việc bình thường đối với trường hợp người lao động không làm thêm giờ vào ban ngày của ngày đó (trước khi làm thêm giờ vào ban đêm); ít nhất bằng 150% so với đơn giá tiền lương sản phẩm của ngày làm việc bình thường đối với trường hợp người lao động có làm thêm giờ vào ban ngày của ngày đó (trước khi làm thêm giờ vào ban đêm);","highlight":["Đơn giá tiền lương sản phẩm vào ban ngày của ngày làm việc bình thường"]},{"label":"Câu được trích xuất","text":"Đơn giá tiền lương sản phẩm vào ban ngày của ngày làm việc bình thường, được tính ít nhất bằng 100% so với đơn giá tiền lương sản phẩm của ngày làm việc bình thường đối với trường hợp người lao động không làm thêm giờ vào ban ngày của ngày đó (trước khi làm thêm giờ vào ban đêm); ít nhất bằng 150% so với đơn giá tiền lương sản phẩm của ngày làm việc bình thường đối với trường hợp người lao động có làm thêm giờ vào ban ngày của ngày đó (trước khi làm thêm giờ vào ban đêm)","highlight":["Đơn giá tiền lương sản phẩm vào ban ngày của ngày làm việc bình thường"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"được\")\nHành vi: tính\nĐối tượng: ít nhất bằng 100% so với đơn giá tiền lương sản phẩm của ngày làm việc bình thường\nĐiều kiện: đối với trường hợp người lao động không làm thêm giờ vào ban ngày của ngày đó (trước khi làm thêm giờ vào ban đêm)","highlight":["Đối tượng: ít nhất bằng 100%"]}]},{"id":"R3409a466ff","group":"Bộ luật Lao động 2019 Điều 30","heading":"điểm c khoản 1 Điều 30, Bộ luật Lao động 2019 (nghĩa vụ (từ: \"phải\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm c khoản 1 Điều 30, Bộ luật Lao động 2019\n45-2019-qh14/chapter-iii/section-2/article-30/clause-1/point-c","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 30. Tạm hoãn thực hiện hợp đồng lao động\n1. Các trường hợp tạm hoãn thực hiện hợp đồng lao động bao gồm:","highlight":["Các trường hợp tạm hoãn thực hiện hợp đồng lao động bao gồm"]},{"label":"Nguyên văn đơn vị","text":"c) Người lao động phải chấp hành quyết định áp dụng biện pháp đưa vào trường giáo dưỡng, cơ sở cai nghiện bắt buộc hoặc cơ sở giáo dục bắt buộc;","highlight":["Người lao động phải chấp hành quyết định"]},{"label":"Câu được trích xuất","text":"Người lao động phải chấp hành quyết định áp dụng biện pháp đưa vào trường giáo dưỡng, cơ sở cai nghiện bắt buộc hoặc cơ sở giáo dục bắt buộc","highlight":["Người lao động phải chấp hành quyết định"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"phải\")\nChủ thể: Người lao động\nHành vi: chấp hành\nĐối tượng: quyết định áp dụng biện pháp đưa vào trường giáo dưỡng, cơ sở cai nghiện bắt buộc hoặc cơ sở giáo dục bắt buộc","highlight":[]}]},{"id":"R7a0260bd8f","group":"Bộ luật Lao động 2019 Điều 29","heading":"khoản 1 Điều 29, Bộ luật Lao động 2019 (được phép (từ: \"được\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 1 Điều 29, Bộ luật Lao động 2019\n45-2019-qh14/chapter-iii/section-2/article-29/clause-1","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 29. Chuyển người lao động làm công việc khác so với hợp đồng lao động","highlight":[]},{"label":"Nguyên văn đơn vị","text":"1. Khi gặp khó khăn đột xuất do thiên tai, hỏa hoạn, dịch bệnh nguy hiểm, áp dụng biện pháp ngăn ngừa, khắc phục tai nạn lao động, bệnh nghề nghiệp, sự cố điện, nước hoặc do nhu cầu sản xuất, kinh doanh thì người sử dụng lao động được quyền tạm thời chuyển người lao động làm công việc khác so với hợp đồng lao động nhưng không được quá 60 ngày làm việc cộng dồn trong 01 năm; trường hợp chuyển người lao động làm công việc khác so với hợp đồng lao động quá 60 ngày làm việc cộng dồn trong 01 năm thì chỉ được thực hiện khi người lao động đồng ý bằng văn bản.\nNgười sử dụng lao động quy định cụ thể trong nội quy lao động những trường hợp do nhu cầu sản xuất, kinh doanh mà người sử dụng lao động được tạm thời chuyển người lao động làm công việc khác so với hợp đồng lao động.","highlight":["quy định cụ thể trong nội quy lao động những trường hợp do nhu cầu sản xuất, kinh doanh"]},{"label":"Câu được trích xuất","text":"Người sử dụng lao động quy định cụ thể trong nội quy lao động những trường hợp do nhu cầu sản xuất, kinh doanh mà người sử dụng lao động được tạm thời chuyển người lao động làm công việc khác so với hợp đồng lao động","highlight":["quy định cụ thể trong nội quy lao động những trường hợp do nhu cầu sản xuất, kinh doanh"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: được phép (từ: \"được\")\nChủ thể: người sử dụng lao động\nHành vi: được tạm thời chuyển\nĐối tượng: người lao động làm công việc khác so với hợp đồng lao động\nĐiều kiện: trong những trường hợp do nhu cầu sản xuất, kinh doanh","highlight":["Điều kiện: trong những trường hợp do nhu cầu sản xuất, kinh doanh"]}]},{"id":"R29bb980db7","group":"Bộ luật Lao động 2019 Điều 115","heading":"điểm c khoản 1 Điều 115, Bộ luật Lao động 2019 (quyền (từ: \"được\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm c khoản 1 Điều 115, Bộ luật Lao động 2019\n45-2019-qh14/chapter-vii/section-2/article-115/clause-1/point-c","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 115. Nghỉ việc riêng, nghỉ không hưởng lương\n1. Người lao động được nghỉ việc riêng mà vẫn hưởng nguyên lương và phải thông báo với người sử dụng lao động trong trường hợp sau đây:","highlight":["Người lao động được nghỉ việc riêng mà vẫn hưởng nguyên lương"]},{"label":"Nguyên văn đơn vị","text":"c) Cha đẻ, mẹ đẻ, cha nuôi, mẹ nuôi; cha đẻ, mẹ đẻ, cha nuôi, mẹ nuôi của vợ hoặc chồng; vợ hoặc chồng; con đẻ, con nuôi chết: nghỉ 03 ngày.","highlight":[]},{"label":"Câu được trích xuất","text":"Cha đẻ, mẹ đẻ, cha nuôi, mẹ nuôi; cha đẻ, mẹ đẻ, cha nuôi, mẹ nuôi của vợ hoặc chồng; vợ hoặc chồng; con đẻ, con nuôi chết: nghỉ 03 ngày","highlight":[]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: quyền (từ: \"được\")\nChủ thể: Người lao động\nHành vi: nghỉ việc riêng mà vẫn hưởng nguyên lương\nĐiều kiện: Cha đẻ, mẹ đẻ, cha nuôi, mẹ nuôi; cha đẻ, mẹ đẻ, cha nuôi, mẹ nuôi của vợ hoặc chồng; vợ hoặc chồng; con đẻ, con nuôi chết\nĐịnh lượng: 03 ngày","highlight":[]}]},{"id":"R7cb4004ddb","group":"NĐ 145/2020/NĐ-CP Điều 57","heading":"điểm a khoản 2 Điều 57, NĐ 145/2020/NĐ-CP (nghĩa vụ (từ: \"được\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm a khoản 2 Điều 57, NĐ 145/2020/NĐ-CP\n145-2020-nd-cp/chapter-vi/section-2/article-57/clause-2/point-a","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 57. Tiền lương làm thêm giờ vào ban đêm\nNgười lao động làm thêm giờ vào ban đêm theo khoản 3 Điều 98 của Bộ luật Lao động, được hưởng tiền lương tính theo công thức sau:\n2. Đối với người lao động hưởng lương theo sản phẩm, tiền lương làm thêm giờ vào ban đêm được tính như sau:\nTrong đó, đơn giá tiền lương sản phẩm vào ban ngày của ngày làm việc bình thường hoặc của ngày nghỉ hằng tuần hoặc của ngày nghỉ lễ, tết, ngày nghỉ có hưởng lương được xác định như sau:","highlight":[]},{"label":"Nguyên văn đơn vị","text":"a) Đơn giá tiền lương sản phẩm vào ban ngày của ngày làm việc bình thường, được tính ít nhất bằng 100% so với đơn giá tiền lương sản phẩm của ngày làm việc bình thường đối với trường hợp người lao động không làm thêm giờ vào ban ngày của ngày đó (trước khi làm thêm giờ vào ban đêm); ít nhất bằng 150% so với đơn giá tiền lương sản phẩm của ngày làm việc bình thường đối với trường hợp người lao động có làm thêm giờ vào ban ngày của ngày đó (trước khi làm thêm giờ vào ban đêm);","highlight":["Đơn giá tiền lương sản phẩm vào ban ngày của ngày làm việc bình thường"]},{"label":"Câu được trích xuất","text":"Đơn giá tiền lương sản phẩm vào ban ngày của ngày làm việc bình thường, được tính ít nhất bằng 100% so với đơn giá tiền lương sản phẩm của ngày làm việc bình thường đối với trường hợp người lao động không làm thêm giờ vào ban ngày của ngày đó (trước khi làm thêm giờ vào ban đêm); ít nhất bằng 150% so với đơn giá tiền lương sản phẩm của ngày làm việc bình thường đối với trường hợp người lao động có làm thêm giờ vào ban ngày của ngày đó (trước khi làm thêm giờ vào ban đêm)","highlight":["Đơn giá tiền lương sản phẩm vào ban ngày của ngày làm việc bình thường"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"được\")\nHành vi: tính\nĐối tượng: ít nhất bằng 150% so với đơn giá tiền lương sản phẩm của ngày làm việc bình thường\nĐiều kiện: đối với trường hợp người lao động có làm thêm giờ vào ban ngày của ngày đó (trước khi làm thêm giờ vào ban đêm)","highlight":["Đối tượng: ít nhất bằng 150%"]}]},{"id":"Rdf8b48d5df","group":"Bộ luật Lao động 2019 Điều 21","heading":"điểm e khoản 1 Điều 21, Bộ luật Lao động 2019 (nghĩa vụ (từ: \"phải\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm e khoản 1 Điều 21, Bộ luật Lao động 2019\n45-2019-qh14/chapter-iii/section-1/article-21/clause-1/point-e","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 21. Nội dung hợp đồng lao động\n1. Hợp đồng lao động phải có những nội dung chủ yếu sau đây:","highlight":["Hợp đồng lao động phải có những nội dung chủ yếu sau đây"]},{"label":"Nguyên văn đơn vị","text":"e) Chế độ nâng bậc, nâng lương;","highlight":[]},{"label":"Câu được trích xuất","text":"Chế độ nâng bậc, nâng lương","highlight":[]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"phải\")\nHành vi: có\nĐối tượng: Chế độ nâng bậc, nâng lương","highlight":[]}]},{"id":"Rb606b20a37","group":"Bộ luật Lao động 2019 Điều 20","heading":"điểm a khoản 2 Điều 20, Bộ luật Lao động 2019 (được phép (từ: \"được\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm a khoản 2 Điều 20, Bộ luật Lao động 2019\n45-2019-qh14/chapter-iii/section-1/article-20/clause-2/point-a","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 20. Loại hợp đồng lao động\n2. Khi hợp đồng lao động quy định tại điểm b khoản 1 Điều này hết hạn mà người lao động vẫn tiếp tục làm việc thì thực hiện như sau:","highlight":[]},{"label":"Nguyên văn đơn vị","text":"a) Trong thời hạn 30 ngày kể từ ngày hợp đồng lao động hết hạn, hai bên phải ký kết hợp đồng lao động mới; trong thời gian chưa ký kết hợp đồng lao động mới thì quyền, nghĩa vụ và lợi ích của hai bên được thực hiện theo hợp đồng đã giao kết;","highlight":["được thực hiện theo hợp đồng đã giao kết"]},{"label":"Câu được trích xuất","text":"Trong thời hạn 30 ngày kể từ ngày hợp đồng lao động hết hạn, hai bên phải ký kết hợp đồng lao động mới; trong thời gian chưa ký kết hợp đồng lao động mới thì quyền, nghĩa vụ và lợi ích của hai bên được thực hiện theo hợp đồng đã giao kết","highlight":["được thực hiện theo hợp đồng đã giao kết"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: được phép (từ: \"được\")\nChủ thể: hai bên\nHành vi: thực hiện quyền, nghĩa vụ và lợi ích\nBên thụ hưởng: hai bên\nĐiều kiện: trong thời gian chưa ký kết hợp đồng lao động mới","highlight":["Hành vi: thực hiện quyền, nghĩa vụ và lợi ích","Tính quy phạm: được phép"]}]},{"id":"Rc1b73fa932","group":"Bộ luật Lao động 2019 Điều 112","heading":"điểm e khoản 1 Điều 112, Bộ luật Lao động 2019 (quyền (từ: \"được\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm e khoản 1 Điều 112, Bộ luật Lao động 2019\n45-2019-qh14/chapter-vii/section-2/article-112/clause-1/point-e","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 112. Nghỉ lễ, tết\n1. Người lao động được nghỉ làm việc, hưởng nguyên lương trong những ngày lễ, tết sau đây:","highlight":["Người lao động được nghỉ làm việc, hưởng nguyên lương trong những ngày lễ, tết sau đây"]},{"label":"Nguyên văn đơn vị","text":"e) Ngày Giỗ Tổ Hùng Vương: 01 ngày (ngày 10 tháng 3 âm lịch).","highlight":[]},{"label":"Câu được trích xuất","text":"Ngày Giỗ Tổ Hùng Vương: 01 ngày (ngày 10 tháng 3 âm lịch)","highlight":[]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: quyền (từ: \"được\")\nChủ thể: Người lao động\nHành vi: nghỉ làm việc, hưởng nguyên lương\nĐối tượng: Ngày Giỗ Tổ Hùng Vương: 01 ngày (ngày 10 tháng 3 âm lịch)\nĐiều kiện: trong những ngày lễ, tết sau đây\nĐịnh lượng: 01 ngày","highlight":[]}]},{"id":"Rcda5a9af44","group":"NĐ 145/2020/NĐ-CP Điều 60","heading":"khoản 2 Điều 60, NĐ 145/2020/NĐ-CP (cấm (từ: \"không quá\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 2 Điều 60, NĐ 145/2020/NĐ-CP\n145-2020-nd-cp/chapter-vii/article-60/clause-2","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 60. Giới hạn số giờ làm thêm","highlight":[]},{"label":"Nguyên văn đơn vị","text":"2. Trường hợp áp dụng quy định thời giờ làm việc bình thường theo tuần thì tổng số giờ làm việc bình thường và số giờ làm thêm không quá 12 giờ trong 01 ngày.","highlight":["tổng số giờ làm việc bình thường và số giờ làm thêm không quá 12 giờ trong 01 ngày"]},{"label":"Câu được trích xuất","text":"Trường hợp áp dụng quy định thời giờ làm việc bình thường theo tuần thì tổng số giờ làm việc bình thường và số giờ làm thêm không quá 12 giờ trong 01 ngày","highlight":["tổng số giờ làm việc bình thường và số giờ làm thêm không quá 12 giờ trong 01 ngày"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: cấm (từ: \"không quá\")\nHành vi: không quá 12 giờ trong 01 ngày\nĐối tượng: 12 giờ trong 01 ngày\nĐiều kiện: Trường hợp áp dụng quy định thời giờ làm việc bình thường theo tuần\nĐịnh lượng: 12 giờ trong 01 ngày","highlight":["Tính quy phạm: cấm"]}]},{"id":"R32987141ef","group":"NĐ 12/2022/NĐ-CP Điều 17","heading":"điểm c khoản 1 Điều 17, NĐ 12/2022/NĐ-CP (nghĩa vụ)","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm c khoản 1 Điều 17, NĐ 12/2022/NĐ-CP\n12-2022-nd-cp/chapter-ii/article-17/clause-1/point-c","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 17. Vi phạm quy định về tiền lương\n1. Phạt tiền từ 5.000.000 đồng đến 10.000.000 đồng đối với người sử dụng lao động có một trong các hành vi sau đây:","highlight":["Phạt tiền từ 5.000.000 đồng đến 10.000.000 đồng"]},{"label":"Nguyên văn đơn vị","text":"c) Không tham khảo ý kiến của tổ chức đại diện người lao động tại cơ sở đối với nơi có tổ chức đại diện người lao động tại cơ sở khi xây dựng thang lương, bảng lương; định mức lao động; quy chế thưởng;","highlight":["Không tham khảo ý kiến"]},{"label":"Câu được trích xuất","text":"Không tham khảo ý kiến của tổ chức đại diện người lao động tại cơ sở đối với nơi có tổ chức đại diện người lao động tại cơ sở khi xây dựng thang lương, bảng lương; định mức lao động; quy chế thưởng","highlight":["Không tham khảo ý kiến"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ\nChủ thể: người sử dụng lao động\nHành vi: tham khảo ý kiến\nĐối tượng: tổ chức đại diện người lao động tại cơ sở\nĐiều kiện: đối với nơi có tổ chức đại diện người lao động tại cơ sở khi xây dựng thang lương, bảng lương; định mức lao động; quy chế thưởng\nKết quả: Phạt tiền từ 5.000.000 đồng đến 10.000.000 đồng","highlight":["Phạt tiền từ 5.000.000 đồng đến 10.000.000 đồng","Tính quy phạm: nghĩa vụ"]}]},{"id":"R78b016e6f0","group":"Bộ luật Lao động 2019 Điều 25","heading":"khoản 4 Điều 25, Bộ luật Lao động 2019 (nghĩa vụ)","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 4 Điều 25, Bộ luật Lao động 2019\n45-2019-qh14/chapter-iii/section-1/article-25/clause-4","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 25. Thời gian thử việc\nThời gian thử việc do hai bên thỏa thuận căn cứ vào tính chất và mức độ phức tạp của công việc nhưng chỉ được thử việc một lần đối với một công việc và bảo đảm điều kiện sau đây:","highlight":["bảo đảm điều kiện sau đây"]},{"label":"Nguyên văn đơn vị","text":"4. Không quá 06 ngày làm việc đối với công việc khác.","highlight":["Không quá 06 ngày làm việc đối với công việc khác"]},{"label":"Câu được trích xuất","text":"Không quá 06 ngày làm việc đối với công việc khác","highlight":["Không quá 06 ngày làm việc đối với công việc khác"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ\nHành vi: thử việc\nĐiều kiện: đối với công việc khác\nThời hạn: Không quá 06 ngày làm việc\nĐịnh lượng: 06 ngày làm việc","highlight":["Hành vi: thử việc"]}]},{"id":"R6e65d62e03","group":"Bộ luật Lao động 2019 Điều 48","heading":"điểm a khoản 3 Điều 48, Bộ luật Lao động 2019 (nghĩa vụ (từ: \"có trách nhiệm\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm a khoản 3 Điều 48, Bộ luật Lao động 2019\n45-2019-qh14/chapter-iii/section-3/article-48/clause-3/point-a","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 48. Trách nhiệm khi chấm dứt hợp đồng lao động\n3. Người sử dụng lao động có trách nhiệm sau đây:","highlight":["Người sử dụng lao động có trách nhiệm sau đây"]},{"label":"Nguyên văn đơn vị","text":"a) Hoàn thành thủ tục xác nhận thời gian đóng bảo hiểm xã hội, bảo hiểm thất nghiệp và trả lại cùng với bản chính giấy tờ khác nếu người sử dụng lao động đã giữ của người lao động;","highlight":["nếu người sử dụng lao động đã giữ của người lao động"]},{"label":"Câu được trích xuất","text":"Hoàn thành thủ tục xác nhận thời gian đóng bảo hiểm xã hội, bảo hiểm thất nghiệp và trả lại cùng với bản chính giấy tờ khác nếu người sử dụng lao động đã giữ của người lao động","highlight":["nếu người sử dụng lao động đã giữ của người lao động"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"có trách nhiệm\")\nChủ thể: Người sử dụng lao động\nHành vi: trả lại\nĐối tượng: bản chính giấy tờ khác\nBên thụ hưởng: người lao động\nBên nhận: người lao động\nĐiều kiện: nếu người sử dụng lao động đã giữ của người lao động","highlight":["nếu người sử dụng lao động đã giữ của người lao động"]}]},{"id":"Rbf0e761f7c","group":"Bộ luật Lao động 2019 Điều 29","heading":"khoản 2 Điều 29, Bộ luật Lao động 2019 (nghĩa vụ (từ: \"phải\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 2 Điều 29, Bộ luật Lao động 2019\n45-2019-qh14/chapter-iii/section-2/article-29/clause-2","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 29. Chuyển người lao động làm công việc khác so với hợp đồng lao động","highlight":[]},{"label":"Nguyên văn đơn vị","text":"2. Khi tạm thời chuyển người lao động làm công việc khác so với hợp đồng lao động quy định tại khoản 1 Điều này, người sử dụng lao động phải báo cho người lao động biết trước ít nhất 03 ngày làm việc, thông báo rõ thời hạn làm tạm thời và bố trí công việc phù hợp với sức khỏe, giới tính của người lao động.","highlight":["người sử dụng lao động phải báo cho người lao động biết trước ít nhất 03 ngày làm việc"]},{"label":"Câu được trích xuất","text":"Khi tạm thời chuyển người lao động làm công việc khác so với hợp đồng lao động quy định tại khoản 1 Điều này, người sử dụng lao động phải báo cho người lao động biết trước ít nhất 03 ngày làm việc, thông báo rõ thời hạn làm tạm thời và bố trí công việc phù hợp với sức khỏe, giới tính của người lao động","highlight":["người sử dụng lao động phải báo cho người lao động biết trước ít nhất 03 ngày làm việc"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"phải\")\nChủ thể: người sử dụng lao động\nHành vi: báo cho người lao động biết trước ít nhất 03 ngày làm việc\nBên thụ hưởng: người lao động\nĐiều kiện: Khi tạm thời chuyển người lao động làm công việc khác so với hợp đồng lao động quy định tại khoản 1 Điều này\nThời hạn: ít nhất 03 ngày làm việc","highlight":[]}]},{"id":"R3ec6bcf241","group":"Bộ luật Lao động 2019 Điều 30","heading":"điểm g khoản 1 Điều 30, Bộ luật Lao động 2019 (được phép (từ: \"được\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm g khoản 1 Điều 30, Bộ luật Lao động 2019\n45-2019-qh14/chapter-iii/section-2/article-30/clause-1/point-g","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 30. Tạm hoãn thực hiện hợp đồng lao động\n1. Các trường hợp tạm hoãn thực hiện hợp đồng lao động bao gồm:","highlight":[]},{"label":"Nguyên văn đơn vị","text":"g) Người lao động được ủy quyền để thực hiện quyền, trách nhiệm của doanh nghiệp đối với phần vốn của doanh nghiệp đầu tư tại doanh nghiệp khác;","highlight":["Người lao động được ủy quyền"]},{"label":"Câu được trích xuất","text":"Người lao động được ủy quyền để thực hiện quyền, trách nhiệm của doanh nghiệp đối với phần vốn của doanh nghiệp đầu tư tại doanh nghiệp khác","highlight":["Người lao động được ủy quyền"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: được phép (từ: \"được\")\nChủ thể: Người lao động\nHành vi: ủy quyền để thực hiện\nĐối tượng: quyền, trách nhiệm của doanh nghiệp đối với phần vốn của doanh nghiệp đầu tư tại doanh nghiệp khác\nKết quả: tạm hoãn thực hiện hợp đồng lao động","highlight":["Tính quy phạm: được phép","Hành vi: ủy quyền để thực hiện"]}]},{"id":"R9517cd6b2e","group":"NĐ 145/2020/NĐ-CP Điều 57","heading":"điểm b khoản 1 Điều 57, NĐ 145/2020/NĐ-CP (nghĩa vụ (từ: \"được\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm b khoản 1 Điều 57, NĐ 145/2020/NĐ-CP\n145-2020-nd-cp/chapter-vi/section-2/article-57/clause-1/point-b","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 57. Tiền lương làm thêm giờ vào ban đêm\nNgười lao động làm thêm giờ vào ban đêm theo khoản 3 Điều 98 của Bộ luật Lao động, được hưởng tiền lương tính theo công thức sau:\n1. Đối với người lao động hưởng lương theo thời gian, tiền lương làm thêm giờ vào ban đêm được tính như sau:\nTrong đó:","highlight":[]},{"label":"Nguyên văn đơn vị","text":"b) Tiền lương giờ vào ban ngày của ngày làm việc bình thường hoặc của ngày nghỉ hằng tuần hoặc của ngày nghỉ lễ, tết, ngày nghỉ có hưởng lương được xác định như sau:\nb1) Tiền lương giờ vào ban ngày của ngày làm việc bình thường, được tính ít nhất bằng 100% so với tiền lương giờ thực trả của công việc đang làm vào ngày làm việc bình thường đối với trường hợp người lao động không làm thêm giờ vào ban ngày của ngày đó (trước khi làm thêm giờ vào ban đêm); ít nhất bằng 150% so với tiền lương giờ thực trả của công việc đang làm vào ngày làm việc bình thường đối với trường hợp người lao động có làm thêm giờ vào ban ngày của ngày đó (trước khi làm thêm giờ vào ban đêm);\nb2) Tiền lương giờ vào ban ngày của ngày nghỉ hằng tuần, được tính ít nhất bằng 200% so với tiền lương giờ thực trả của công việc đang làm vào ngày làm việc bình thường;\nb3) Tiền lương giờ vào ban ngày của ngày nghỉ lễ, tết, ngày nghỉ có hưởng lương, được tính ít nhất bằng 300% so với tiền lương giờ thực trả của công việc đang làm vào ngày làm việc bình thường.","highlight":["Tiền lương giờ vào ban ngày của ngày nghỉ lễ, tết, ngày nghỉ có hưởng lương"]},{"label":"Câu được trích xuất","text":"b3) Tiền lương giờ vào ban ngày của ngày nghỉ lễ, tết, ngày nghỉ có hưởng lương, được tính ít nhất bằng 300% so với tiền lương giờ thực trả của công việc đang làm vào ngày làm việc bình thường","highlight":["Tiền lương giờ vào ban ngày của ngày nghỉ lễ, tết, ngày nghỉ có hưởng lương"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"được\")\nHành vi: tính\nĐối tượng: ít nhất bằng 300% so với tiền lương giờ thực trả của công việc đang làm vào ngày làm việc bình thường","highlight":["Đối tượng: ít nhất bằng 300%"]}]},{"id":"R75e6015238","group":"Bộ luật Lao động 2019 Điều 98","heading":"điểm c khoản 1 Điều 98, Bộ luật Lao động 2019 (quyền (từ: \"được\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm c khoản 1 Điều 98, Bộ luật Lao động 2019\n45-2019-qh14/chapter-vi/article-98/clause-1/point-c","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 98. Tiền lương làm thêm giờ, làm việc vào ban đêm\n1. Người lao động làm thêm giờ được trả lương tính theo đơn giá tiền lương hoặc tiền lương thực trả theo công việc đang làm như sau:","highlight":["Người lao động làm thêm giờ được trả lương tính theo đơn giá tiền lương hoặc tiền lương thực trả theo công việc đang làm"]},{"label":"Nguyên văn đơn vị","text":"c) Vào ngày nghỉ lễ, tết, ngày nghỉ có hưởng lương, ít nhất bằng 300% chưa kể tiền lương ngày lễ, tết, ngày nghỉ có hưởng lương đối với người lao động hưởng lương ngày.","highlight":[]},{"label":"Câu được trích xuất","text":"Vào ngày nghỉ lễ, tết, ngày nghỉ có hưởng lương, ít nhất bằng 300% chưa kể tiền lương ngày lễ, tết, ngày nghỉ có hưởng lương đối với người lao động hưởng lương ngày","highlight":[]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: quyền (từ: \"được\")\nChủ thể: Người lao động làm thêm giờ\nHành vi: được trả lương\nĐối tượng: tính theo đơn giá tiền lương hoặc tiền lương thực trả theo công việc đang làm\nĐiều kiện: Vào ngày nghỉ lễ, tết, ngày nghỉ có hưởng lương\nĐịnh lượng: ít nhất bằng 300% chưa kể tiền lương ngày lễ, tết, ngày nghỉ có hưởng lương đối với người lao động hưởng lương ngày","highlight":[]}]},{"id":"R981fc13ba3","group":"Bộ luật Lao động 2019 Điều 30","heading":"điểm g khoản 1 Điều 30, Bộ luật Lao động 2019 (được phép (từ: \"được\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm g khoản 1 Điều 30, Bộ luật Lao động 2019\n45-2019-qh14/chapter-iii/section-2/article-30/clause-1/point-g","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 30. Tạm hoãn thực hiện hợp đồng lao động\n1. Các trường hợp tạm hoãn thực hiện hợp đồng lao động bao gồm:","highlight":[]},{"label":"Nguyên văn đơn vị","text":"g) Người lao động được ủy quyền để thực hiện quyền, trách nhiệm của doanh nghiệp đối với phần vốn của doanh nghiệp đầu tư tại doanh nghiệp khác;","highlight":["Người lao động được ủy quyền"]},{"label":"Câu được trích xuất","text":"Người lao động được ủy quyền để thực hiện quyền, trách nhiệm của doanh nghiệp đối với phần vốn của doanh nghiệp đầu tư tại doanh nghiệp khác","highlight":["Người lao động được ủy quyền"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: được phép (từ: \"được\")\nChủ thể: Người lao động\nHành vi: uy quyền để thực hiện quyền, trách nhiệm của doanh nghiệp đối với phần vốn của doanh nghiệp đầu tư tại doanh nghiệp khác","highlight":["Tính quy phạm: được phép","Hành vi: uy quyền"]}]},{"id":"R5f220d8214","group":"Bộ luật Lao động 2019 Điều 46","heading":"khoản 4 Điều 46, Bộ luật Lao động 2019 (nghĩa vụ)","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 4 Điều 46, Bộ luật Lao động 2019\n45-2019-qh14/chapter-iii/section-3/article-46/clause-4","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 46. Trợ cấp thôi việc","highlight":[]},{"label":"Nguyên văn đơn vị","text":"4. Chính phủ quy định chi tiết Điều này.","highlight":["Chính phủ quy định chi tiết Điều này"]},{"label":"Câu được trích xuất","text":"Chính phủ quy định chi tiết Điều này","highlight":["Chính phủ quy định chi tiết Điều này"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ\nChủ thể: Chính phủ\nHành vi: quy định chi tiết\nĐối tượng: Điều này","highlight":[]}]},{"id":"R3d6cefb8a9","group":"NĐ 145/2020/NĐ-CP Điều 57","heading":"điểm b khoản 2 Điều 57, NĐ 145/2020/NĐ-CP (nghĩa vụ (từ: \"được\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm b khoản 2 Điều 57, NĐ 145/2020/NĐ-CP\n145-2020-nd-cp/chapter-vi/section-2/article-57/clause-2/point-b","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 57. Tiền lương làm thêm giờ vào ban đêm\nNgười lao động làm thêm giờ vào ban đêm theo khoản 3 Điều 98 của Bộ luật Lao động, được hưởng tiền lương tính theo công thức sau:\n2. Đối với người lao động hưởng lương theo sản phẩm, tiền lương làm thêm giờ vào ban đêm được tính như sau:\nTrong đó, đơn giá tiền lương sản phẩm vào ban ngày của ngày làm việc bình thường hoặc của ngày nghỉ hằng tuần hoặc của ngày nghỉ lễ, tết, ngày nghỉ có hưởng lương được xác định như sau:","highlight":[]},{"label":"Nguyên văn đơn vị","text":"b) Đơn giá tiền lương sản phẩm vào ban ngày của ngày nghỉ hằng tuần, được tính ít nhất bằng 200% so với đơn giá tiền lương sản phẩm của ngày làm việc bình thường;","highlight":["được tính ít nhất bằng 200%"]},{"label":"Câu được trích xuất","text":"Đơn giá tiền lương sản phẩm vào ban ngày của ngày nghỉ hằng tuần, được tính ít nhất bằng 200% so với đơn giá tiền lương sản phẩm của ngày làm việc bình thường","highlight":["được tính ít nhất bằng 200%"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"được\")\nHành vi: tính\nĐối tượng: Đơn giá tiền lương sản phẩm vào ban ngày của ngày nghỉ hằng tuần\nĐịnh lượng: ít nhất bằng 200% so với đơn giá tiền lương sản phẩm của ngày làm việc bình thường","highlight":["Hành vi: tính"]}]},{"id":"R2b4a1e0bf0","group":"NĐ 145/2020/NĐ-CP Điều 55","heading":"khoản 2 Điều 55, NĐ 145/2020/NĐ-CP (nghĩa vụ (từ: \"được tính\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 2 Điều 55, NĐ 145/2020/NĐ-CP\n145-2020-nd-cp/chapter-vi/section-2/article-55/clause-2","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 55. Tiền lương làm thêm giờ\nTiền lương làm thêm giờ theo khoản 1 Điều 98 của Bộ luật Lao động được quy định như sau:","highlight":[]},{"label":"Nguyên văn đơn vị","text":"2. Đối với người lao động hưởng lương theo sản phẩm, được trả lương làm thêm giờ khi làm việc ngoài thời giờ làm việc bình thường để làm thêm số lượng, khối lượng sản phẩm ngoài số lượng, khối lượng sản phẩm theo định mức lao động theo thỏa thuận với người sử dụng lao động và được tính theo công thức sau:\nTiền lương làm thêm giờ\n=\nĐơn giá tiền lương sản phẩm của ngày làm việc bình thường\nx\nMức ít nhất 150% hoặc 200% hoặc 300%\nx\nSố sản phẩm làm thêm\nTrong đó:\nMức ít nhất bằng 150% so với đơn giá tiền lương sản phẩm của ngày làm việc bình thường, áp dụng đối với sản phẩm làm thêm vào ngày thường; mức ít nhất bằng 200% so với đơn giá tiền lương sản phẩm của ngày làm việc bình thường, áp dụng đối với sản phẩm làm thêm vào ngày nghỉ hằng tuần; mức ít nhất bằng 300% so với đơn giá tiền lương sản phẩm của ngày làm việc bình thường, áp dụng đối với sản phẩm làm thêm vào ngày nghỉ lễ, tết, ngày nghỉ có hưởng lương.","highlight":["Đối với người lao động hưởng lương theo sản phẩm"]},{"label":"Câu được trích xuất","text":"Đối với người lao động hưởng lương theo sản phẩm, được trả lương làm thêm giờ khi làm việc ngoài thời giờ làm việc bình thường để làm thêm số lượng, khối lượng sản phẩm ngoài số lượng, khối lượng sản phẩm theo định mức lao động theo thỏa thuận với người sử dụng lao động và được tính theo công thức sau","highlight":["Đối với người lao động hưởng lương theo sản phẩm"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"được tính\")\nHành vi: tính\nĐối tượng: Tiền lương làm thêm giờ\nĐiều kiện: theo công thức sau","highlight":["Đối tượng: Tiền lương làm thêm giờ","Điều kiện: theo công thức sau"]}]},{"id":"Rf82af6111f","group":"NĐ 145/2020/NĐ-CP Điều 56","heading":"khoản 2 Điều 56, NĐ 145/2020/NĐ-CP (nghĩa vụ (từ: \"được\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 2 Điều 56, NĐ 145/2020/NĐ-CP\n145-2020-nd-cp/chapter-vi/section-2/article-56/clause-2","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 56. Tiền lương làm việc vào ban đêm\nTiền lương làm việc vào ban đêm theo khoản 2 Điều 98 của Bộ luật Lao động, được tính theo công thức sau:","highlight":[]},{"label":"Nguyên văn đơn vị","text":"2. Đối với người lao động hưởng lương theo sản phẩm, tiền lương làm việc vào ban đêm được tính như sau:","highlight":["tiền lương làm việc vào ban đêm được tính như sau"]},{"label":"Câu được trích xuất","text":"Đối với người lao động hưởng lương theo sản phẩm, tiền lương làm việc vào ban đêm được tính như sau","highlight":["tiền lương làm việc vào ban đêm được tính như sau"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ (từ: \"được\")\nHành vi: tính tiền lương làm việc vào ban đêm\nĐối tượng: tiền lương làm việc vào ban đêm\nBên thụ hưởng: người lao động hưởng lương theo sản phẩm\nĐiều kiện: Đối với người lao động hưởng lương theo sản phẩm","highlight":["Hành vi: tính tiền lương làm việc vào ban đêm"]}]},{"id":"R3b4e8e6a00","group":"Bộ luật Lao động 2019 Điều 34","heading":"khoản 9 Điều 34, Bộ luật Lao động 2019 (chưa rõ)","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 9 Điều 34, Bộ luật Lao động 2019\n45-2019-qh14/chapter-iii/section-3/article-34/clause-9","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 34. Các trường hợp chấm dứt hợp đồng lao động","highlight":[]},{"label":"Nguyên văn đơn vị","text":"9. Người lao động đơn phương chấm dứt hợp đồng lao động theo quy định tại Điều 35 của Bộ luật này.","highlight":["Người lao động đơn phương chấm dứt hợp đồng lao động theo quy định tại Điều 35 của Bộ luật này"]},{"label":"Câu được trích xuất","text":"Người lao động đơn phương chấm dứt hợp đồng lao động theo quy định tại Điều 35 của Bộ luật này","highlight":["Người lao động đơn phương chấm dứt hợp đồng lao động theo quy định tại Điều 35 của Bộ luật này"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: chưa rõ\nChủ thể: Người lao động\nHành vi: đơn phương chấm dứt hợp đồng lao động\nĐiều kiện: theo quy định tại Điều 35 của Bộ luật này","highlight":[]}]},{"id":"Rd51e8684a5","group":"Bộ luật Lao động 2019 Điều 105","heading":"khoản 2 Điều 105, Bộ luật Lao động 2019 (cấm (từ: \"không quá\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 2 Điều 105, Bộ luật Lao động 2019\n45-2019-qh14/chapter-vii/section-1/article-105/clause-2","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 105. Thời giờ làm việc bình thường","highlight":[]},{"label":"Nguyên văn đơn vị","text":"2. Người sử dụng lao động có quyền quy định thời giờ làm việc theo ngày hoặc tuần nhưng phải thông báo cho người lao động biết; trường hợp theo tuần thì thời giờ làm việc bình thường không quá 10 giờ trong 01 ngày và không quá 48 giờ trong 01 tuần.\nNhà nước khuyến khích người sử dụng lao động thực hiện tuần làm việc 40 giờ đối với người lao động.","highlight":["thời giờ làm việc bình thường không quá 10 giờ trong 01 ngày"]},{"label":"Câu được trích xuất","text":"Người sử dụng lao động có quyền quy định thời giờ làm việc theo ngày hoặc tuần nhưng phải thông báo cho người lao động biết; trường hợp theo tuần thì thời giờ làm việc bình thường không quá 10 giờ trong 01 ngày và không quá 48 giờ trong 01 tuần","highlight":["thời giờ làm việc bình thường không quá 10 giờ trong 01 ngày"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: cấm (từ: \"không quá\")\nHành vi: không quá 10 giờ trong 01 ngày và không quá 48 giờ trong 01 tuần\nĐiều kiện: trường hợp theo tuần\nĐịnh lượng: 10 giờ trong 01 ngày và 48 giờ trong 01 tuần","highlight":["Định lượng: 10 giờ trong 01 ngày và 48 giờ trong 01 tuần","Tính quy phạm: cấm"]}]},{"id":"Rf2a3eaec1b","group":"NĐ 145/2020/NĐ-CP Điều 114","heading":"điểm b khoản 2 Điều 114, NĐ 145/2020/NĐ-CP (nghĩa vụ)","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"điểm b khoản 2 Điều 114, NĐ 145/2020/NĐ-CP\n145-2020-nd-cp/chapter-xi/section-4/article-114/clause-2/point-b","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 114. Hiệu lực thi hành\n2. Kể từ ngày Nghị định này có hiệu lực thi hành, các Nghị định sau đây hết hiệu lực thi hành:","highlight":["hết hiệu lực thi hành"]},{"label":"Nguyên văn đơn vị","text":"b) Nghị định số 44/2013/NĐ-CP ngày 09 tháng 5 năm 2013 của Chính phủ quy định chi tiết thi hành một số điều của Bộ luật Lao động về hợp đồng lao động; Nghị định số 05/2015/NĐ-CP ngày 12 tháng 01 năm 2015 của Chính phủ quy định chi tiết và hướng dẫn thi hành một số nội dung của Bộ luật Lao động; Nghị định số 148/2018/NĐ-CP ngày 24 tháng 10 năm 2018 của Chính phủ sửa đổi, bổ sung một số điều của Nghị định số 05/2015/NĐ-CP ngày 12 tháng 01 năm 2015 của Chính phủ quy định chi tiết và hướng dẫn thi hành một số nội dung của Bộ luật Lao động;","highlight":[]},{"label":"Câu được trích xuất","text":"Nghị định số 44/2013/NĐ-CP ngày 09 tháng 5 năm 2013 của Chính phủ quy định chi tiết thi hành một số điều của Bộ luật Lao động về hợp đồng lao động; Nghị định số 05/2015/NĐ-CP ngày 12 tháng 01 năm 2015 của Chính phủ quy định chi tiết và hướng dẫn thi hành một số nội dung của Bộ luật Lao động; Nghị định số 148/2018/NĐ-CP ngày 24 tháng 10 năm 2018 của Chính phủ sửa đổi, bổ sung một số điều của Nghị định số 05/2015/NĐ-CP ngày 12 tháng 01 năm 2015 của Chính phủ quy định chi tiết và hướng dẫn thi hành một số nội dung của Bộ luật Lao động","highlight":[]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: nghĩa vụ\nChủ thể: Nghị định số 05/2015/NĐ-CP ngày 12 tháng 01 năm 2015 của Chính phủ quy định chi tiết và hướng dẫn thi hành một số nội dung của Bộ luật Lao động\nHành vi: hết hiệu lực thi hành\nĐiều kiện: Kể từ ngày Nghị định này có hiệu lực thi hành","highlight":["hết hiệu lực thi hành","Tính quy phạm: nghĩa vụ"]}]},{"id":"R9a09f93083","group":"Bộ luật Lao động 2019 Điều 42","heading":"khoản 6 Điều 42, Bộ luật Lao động 2019 (được phép (từ: \"được\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","fields":[{"label":"Đơn vị","text":"khoản 6 Điều 42, Bộ luật Lao động 2019\n45-2019-qh14/chapter-iii/section-3/article-42/clause-6","highlight":[]},{"label":"Tên Điều và câu dẫn","text":"Điều 42. Nghĩa vụ của người sử dụng lao động trong trường hợp thay đổi cơ cấu, công nghệ hoặc vì lý do kinh tế","highlight":[]},{"label":"Nguyên văn đơn vị","text":"6. Việc cho thôi việc đối với người lao động theo quy định tại Điều này chỉ được tiến hành sau khi đã trao đổi ý kiến với tổ chức đại diện người lao động tại cơ sở đối với nơi có tổ chức đại diện người lao động tại cơ sở mà người lao động là thành viên và thông báo trước 30 ngày cho Ủy ban nhân dân cấp tỉnh và cho người lao động.","highlight":["chỉ được tiến hành sau khi"]},{"label":"Câu được trích xuất","text":"Việc cho thôi việc đối với người lao động theo quy định tại Điều này chỉ được tiến hành sau khi đã trao đổi ý kiến với tổ chức đại diện người lao động tại cơ sở đối với nơi có tổ chức đại diện người lao động tại cơ sở mà người lao động là thành viên và thông báo trước 30 ngày cho Ủy ban nhân dân cấp tỉnh và cho người lao động","highlight":["chỉ được tiến hành sau khi"]},{"label":"Quy phạm model đưa ra","text":"Tính quy phạm: được phép (từ: \"được\")\nChủ thể: người sử dụng lao động\nHành vi: tiếp hành\nĐối tượng: việc cho thôi việc đối với người lao động\nĐiều kiện: sau khi đã trao đổi ý kiến với tổ chức đại diện người lao động tại cơ sở đối với nơi có tổ chức đại diện người lao động tại cơ sở mà người lao động là thành viên và thông báo trước 30 ngày cho Ủy ban nhân dân cấp tỉnh và cho người lao động\nThời hạn: thông báo trước 30 ngày","highlight":["Hành vi: tiếp hành"]}]},{"id":"Rfacbb8ed3a","group":"Bộ luật Lao động 2019 Điều 107","heading":"điểm d khoản 3 Điều 107, Bộ luật Lao động 2019 (được phép (từ: \"được\"))","question":"Quy phạm có đúng với luật không (đọc cả câu dẫn), và nếu đúng thì chữ lấy từ đâu?","f
