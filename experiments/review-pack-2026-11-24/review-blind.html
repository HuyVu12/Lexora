label":"Ngày hiệu lực và trạng thái máy tính","text":"Nghị định số 152/2020/NĐ-CP Quy định về người lao động nước ngoài làm việc tại Việt Nam và tuyển dụng, quản lý người lao động Việt Nam làm việc cho tổ chức, cá nhân nước ngoài tại Việt Nam: hiệu lực từ 2021-02-15, hết hiệu lực từ 2026-11-15 (theo vbpl.vn).\nTrạng thái tại 2024-05-10 (unit-status-v2): đã bị sửa đổi.","highlight":["2021-02-15","2026-11-15"]},{"label":"Đơn vị đối ứng: khoản 6 Điều 1, Nghị định số 70/2023/NĐ-CP Sửa đổi, bổ sung một số điều của Nghị định số 152/2020/NĐ-CP ngày 30 tháng 12 năm 2020 của Chính phủ quy định về người lao động nước ngoài làm việc tại Việt Nam và tuyển dụng, quản lý người lao động Việt Nam làm việc cho tổ chức, cá nhân nước ngoài tại Việt Nam (Nghị định số 70/2023/NĐ-CP Sửa đổi, bổ sung một số điều của Nghị định số 152/2020/NĐ-CP ngày 30 tháng 12 năm 2020 của Chính phủ quy định về người lao động nước ngoài làm việc tại Việt Nam và tuyển dụng, quản lý người lao động Việt Nam làm việc cho tổ chức, cá nhân nước ngoài tại Việt Nam: hiệu lực từ 2023-09-18 (theo vbpl.vn))","text":"6. Sửa đổi, bổ sung khoản 2 Điều 11 như sau:\n\"2. Trong thời hạn 05 ngày làm việc, kể từ ngày nhận đủ hồ sơ đề nghị cấp giấy phép lao động, Bộ Lao động - Thương binh và Xã hội hoặc Sở Lao động - Thương binh và Xã hội nơi người lao động nước ngoài dự kiến làm việc thực hiện cấp giấy phép lao động cho người lao động nước ngoài theo Mẫu số 12/PLI Phụ lục I ban hành kèm theo Nghị định này. Trường hợp không cấp giấy phép lao động thì có văn bản trả lời và nêu rõ lý do.\nGiấy phép lao động có kích thước khổ A4 (21 cm x 29,7 cm), gồm 2 trang: trang 1 có màu xanh; trang 2 có nền màu trắng, hoa văn màu xanh, ở giữa có hình ngôi sao. Giấy phép lao động được mã số như sau: mã số tỉnh, thành phố trực thuộc trung ương và mà số Bộ Lao động - Thương binh và Xã hội theo Mẫu số 16/PLI Phụ lục I ban hành kèm theo Nghị định này; 2 chữ số cuối của năm cấp giấy phép; loại giấy phép (cấp mới ký hiệu 1; gia hạn ký hiệu 2; cấp lại ký hiệu 3); số thứ tự (từ 000.001).\nTrường hợp giấy phép lao động là bản điện tử thì phải phù hợp với quy định của pháp luật liên quan và đáp ứng nội dung theo Mẫu số 12/PLI Phụ lục I ban hành kèm theo Nghị định này.\".","highlight":["Sửa đổi, bổ sung khoản 2 Điều 11","Giấy phép lao động có kích thước khổ A4 (21 cm x 29,7 cm), gồm 2 trang"]}]},{"id":"hl-c05|dap-an|84-2015-qh13/chapter-iii/section-3/article-49/clause-5","group":"hl-c05","heading":"hl-c05 · đáp án · khoản 5 Điều 49, Luật An toàn, vệ sinh lao động số 84/2015/QH13","question":"Đơn vị này có chứa thông tin câu hỏi hỏi và có áp dụng tại ngày áp dụng không?","fields":[{"label":"Câu hỏi (ngày áp dụng 2025-03-01)","text":"Tháng 3/2025, một người đang hưởng trợ cấp tai nạn lao động hằng tháng ra nước ngoài định cư (đề nghị giải quyết ngày 01/3/2025). Khi đó họ được trợ cấp một lần bao nhiêu và hồ sơ giải quyết theo những điều khoản nào?","highlight":["Tháng 3/2025","01/3/2025"]},{"label":"Đơn vị kiểm, vai trò \"đáp án\": khoản 5 Điều 49, Luật An toàn, vệ sinh lao động số 84/2015/QH13","text":"5. Người đang hưởng trợ cấp tai nạn lao động, bệnh nghề nghiệp hằng tháng khi ra nước ngoài để định cư được giải quyết hưởng trợ cấp một lần; mức trợ cấp một lần bằng 03 tháng mức trợ cấp đang hưởng. Hồ sơ, trình tự giải quyết trợ cấp một lần thực hiện theo quy định tại khoản 2, khoản 3 Điều 109 và khoản 4 Điều 110 của Luật bảo hiểm xã hội.","highlight":["mức trợ cấp một lần bằng 03 tháng mức trợ cấp đang hưởng","theo quy định tại khoản 2, khoản 3 Điều 109 và khoản 4 Điều 110 của Luật bảo hiểm xã hội"]},{"label":"Tên Điều và câu dẫn của đơn vị","text":"Điều 49. Trợ cấp hằng tháng","highlight":[]},{"label":"Ngày hiệu lực và trạng thái máy tính","text":"Luật An toàn, vệ sinh lao động số 84/2015/QH13: hiệu lực từ 2016-07-01 (theo vbpl.vn).\nTrạng thái tại 2025-03-01 (unit-status-v2): còn hiệu lực.","highlight":["2016-07-01"]}]},{"id":"hl-c05|chua-hieu-luc|41-2024-qh15-sua-doi/chapter-xi/article-139/clause-1/point-đ","group":"hl-c05","heading":"hl-c05 · chưa có hiệu lực · điểm đ khoản 1 Điều 139, Luật Bảo hiểm xã hội số 41/2024/QH15","question":"Ngày hiệu lực của văn bản chứa đơn vị này có muộn hơn ngày áp dụng không?","fields":[{"label":"Câu hỏi (ngày áp dụng 2025-03-01)","text":"Tháng 3/2025, một người đang hưởng trợ cấp tai nạn lao động hằng tháng ra nước ngoài định cư (đề nghị giải quyết ngày 01/3/2025). Khi đó họ được trợ cấp một lần bao nhiêu và hồ sơ giải quyết theo những điều khoản nào?","highlight":["Tháng 3/2025","01/3/2025"]},{"label":"Đơn vị kiểm, vai trò \"chưa có hiệu lực\": điểm đ khoản 1 Điều 139, Luật Bảo hiểm xã hội số 41/2024/QH15","text":"đ) Sửa đổi, bổ sung khoản 5 Điều 49 như sau:\n\"5. Người đang hưởng trợ cấp tai nạn lao động, bệnh nghề nghiệp hằng tháng khi ra nước ngoài để định cư được giải quyết hưởng trợ cấp một lần; mức trợ cấp một lần bằng 03 tháng mức trợ cấp đang hưởng. Hồ sơ, trình tự giải quyết trợ cấp một lần thực hiện theo quy định của Luật Bảo hiểm xã hội.\";","highlight":["Sửa đổi, bổ sung khoản 5 Điều 49"]},{"label":"Tên Điều và câu dẫn của đơn vị","text":"Điều 139. Sửa đổi, bổ sung một số luật có liên quan đến bảo hiểm xã hội\n1. Sửa đổi, bổ sung một số điều của Luật An toàn, vệ sinh lao động số 84/2015/QH13 như sau:","highlight":[]},{"label":"Ngày hiệu lực và trạng thái máy tính","text":"Luật Bảo hiểm xã hội số 41/2024/QH15: hiệu lực từ 2025-07-01 (theo vbpl.vn).\nTrạng thái tại 2025-03-01 (unit-status-v2): chưa có hiệu lực.","highlight":["2025-07-01"]},{"label":"Đơn vị đối ứng: khoản 5 Điều 49, Luật An toàn, vệ sinh lao động số 84/2015/QH13 (Luật An toàn, vệ sinh lao động số 84/2015/QH13: hiệu lực từ 2016-07-01 (theo vbpl.vn))","text":"5. Người đang hưởng trợ cấp tai nạn lao động, bệnh nghề nghiệp hằng tháng khi ra nước ngoài để định cư được giải quyết hưởng trợ cấp một lần; mức trợ cấp một lần bằng 03 tháng mức trợ cấp đang hưởng. Hồ sơ, trình tự giải quyết trợ cấp một lần thực hiện theo quy định tại khoản 2, khoản 3 Điều 109 và khoản 4 Điều 110 của Luật bảo hiểm xã hội.","highlight":[]}]},{"id":"hl-d01|dap-an|45-2019-qh14/chapter-vii/section-2/article-113/clause-1/point-a","group":"hl-d01","heading":"hl-d01 · đáp án · điểm a khoản 1 Điều 113, Bộ Luật lao động số 45/2019/QH14","question":"Đơn vị này có chứa thông tin câu hỏi hỏi và có áp dụng tại ngày áp dụng không?","fields":[{"label":"Câu hỏi (ngày áp dụng 2026-11-11)","text":"Nhân viên văn phòng làm việc đủ 12 tháng trong điều kiện bình thường thì được nghỉ hằng năm bao nhiêu ngày?","highlight":[]},{"label":"Đơn vị kiểm, vai trò \"đáp án\": điểm a khoản 1 Điều 113, Bộ Luật lao động số 45/2019/QH14","text":"a) 12 ngày làm việc đối với người làm công việc trong điều kiện bình thường;","highlight":["12 ngày làm việc đối với người làm công việc trong điều kiện bình thường"]},{"label":"Tên Điều và câu dẫn của đơn vị","text":"Điều 113. Nghỉ hằng năm\n1. Người lao động làm việc đủ 12 tháng cho một người sử dụng lao động thì được nghỉ hằng năm, hưởng nguyên lương theo hợp đồng lao động như sau:","highlight":[]},{"label":"Ngày hiệu lực và trạng thái máy tính","text":"Bộ Luật lao động số 45/2019/QH14: hiệu lực từ 2021-01-01 (theo vbpl.vn).\nTrạng thái tại 2026-11-11 (unit-status-v2): còn hiệu lực.","highlight":["2021-01-01"]}]},{"id":"hl-d02|dap-an|45-2019-qh14/chapter-iii/section-3/article-35/clause-1/point-a","group":"hl-d02","heading":"hl-d02 · đáp án · điểm a khoản 1 Điều 35, Bộ Luật lao động số 45/2019/QH14","question":"Đơn vị này có chứa thông tin câu hỏi hỏi và có áp dụng tại ngày áp dụng không?","fields":[{"label":"Câu hỏi (ngày áp dụng 2026-11-11)","text":"Nhân viên ký hợp đồng lao động không xác định thời hạn muốn nghỉ việc thì phải báo trước cho công ty ít nhất bao nhiêu ngày?","highlight":[]},{"label":"Đơn vị kiểm, vai trò \"đáp án\": điểm a khoản 1 Điều 35, Bộ Luật lao động số 45/2019/QH14","text":"a) Ít nhất 45 ngày nếu làm việc theo hợp đồng lao động không xác định thời hạn;","highlight":["Ít nhất 45 ngày nếu làm việc theo hợp đồng lao động không xác định thời hạn"]},{"label":"Tên Điều và câu dẫn của đơn vị","text":"Điều 35. Quyền đơn phương chấm dứt hợp đồng lao động của người lao động\n1. Người lao động có quyền đơn phương chấm dứt hợp đồng lao động nhưng phải báo trước cho người sử dụng lao động như sau:","highlight":[]},{"label":"Ngày hiệu lực và trạng thái máy tính","text":"Bộ Luật lao động số 45/2019/QH14: hiệu lực từ 2021-01-01 (theo vbpl.vn).\nTrạng thái tại 2026-11-11 (unit-status-v2): còn hiệu lực.","highlight":["2021-01-01"]}]},{"id":"hl-d03|dap-an|45-2019-qh14/chapter-x/article-139/clause-1","group":"hl-d03","heading":"hl-d03 · đáp án · khoản 1 Điều 139, Bộ Luật lao động số 45/2019/QH14","question":"Đơn vị này có chứa thông tin câu hỏi hỏi và có áp dụng tại ngày áp dụng không?","fields":[{"label":"Câu hỏi (ngày áp dụng 2026-11-11)","text":"Lao động nữ sinh một con được nghỉ thai sản tổng cộng bao lâu và được nghỉ trước khi sinh tối đa bao nhiêu tháng?","highlight":[]},{"label":"Đơn vị kiểm, vai trò \"đáp án\": khoản 1 Điều 139, Bộ Luật lao động số 45/2019/QH14","text":"1. Lao động nữ được nghỉ thai sản trước và sau khi sinh con là 06 tháng; thời gian nghỉ trước khi sinh không quá 02 tháng.\nTrường hợp lao động nữ sinh đôi trở lên thì tính từ con thứ 02 trở đi, cứ mỗi con, người mẹ được nghỉ thêm 01 tháng.","highlight":["06 tháng","không quá 02 tháng","Lao động nữ được nghỉ thai sản trước và sau khi sinh con là 06 tháng; thời gian nghỉ trước khi sinh không quá 02 tháng."]},{"label":"Tên Điều và câu dẫn của đơn vị","text":"Điều 139. Nghỉ thai sản","highlight":[]},{"label":"Ngày hiệu lực và trạng thái máy tính","text":"Bộ Luật lao động số 45/2019/QH14: hiệu lực từ 2021-01-01 (theo vbpl.vn).\nTrạng thái tại 2026-11-11 (unit-status-v2): còn hiệu lực.","highlight":["2021-01-01"]}]},{"id":"hl-d04|dap-an|45-2019-qh14/chapter-iii/section-1/article-25/clause-2","group":"hl-d04","heading":"hl-d04 · đáp án · khoản 2 Điều 25, Bộ Luật lao động số 45/2019/QH14","question":"Đơn vị này có chứa thông tin câu hỏi hỏi và có áp dụng tại ngày áp dụng không?","fields":[{"label":"Câu hỏi (ngày áp dụng 2026-11-11)","text":"Công ty tuyển kỹ sư có bằng đại học vào vị trí cần trình độ chuyên môn từ cao đẳng trở lên thì được thỏa thuận thử việc tối đa bao nhiêu ngày?","highlight":[]},{"label":"Đơn vị kiểm, vai trò \"đáp án\": khoản 2 Điều 25, Bộ Luật lao động số 45/2019/QH14","text":"2. Không quá 60 ngày đối với công việc có chức danh nghề nghiệp cần trình độ chuyên môn, kỹ thuật từ cao đẳng trở lên;","highlight":["Không quá 60 ngày đối với công việc có chức danh nghề nghiệp cần trình độ chuyên môn, kỹ thuật từ cao đẳng trở lên"]},{"label":"Tên Điều và câu dẫn của đơn vị","text":"Điều 25. Thời gian thử việc","highlight":[]},{"label":"Ngày hiệu lực và trạng thái máy tính","text":"Bộ Luật lao động số 45/2019/QH14: hiệu lực từ 2021-01-01 (theo vbpl.vn).\nTrạng thái tại 2026-11-11 (unit-status-v2): còn hiệu lực.","highlight":["2021-01-01"]}]},{"id":"hl-d05|dap-an|45-2019-qh14/chapter-iii/section-3/article-34/clause-3","group":"hl-d05","heading":"hl-d05 · đáp án · khoản 3 Điều 34, Bộ Luật lao động số 45/2019/QH14","question":"Đơn vị này có chứa thông tin câu hỏi hỏi và có áp dụng tại ngày áp dụng không?","fields":[{"label":"Câu hỏi (ngày áp dụng 2026-11-11)","text":"Người lao động và công ty thỏa thuận chấm dứt hợp đồng sau 5 năm làm việc thường xuyên. Công ty có phải trả trợ cấp thôi việc không, và mỗi năm làm việc được tính bao nhiêu?","highlight":[]},{"label":"Đơn vị kiểm, vai trò \"đáp án\": khoản 3 Điều 34, Bộ Luật lao động số 45/2019/QH14","text":"3. Hai bên thỏa thuận chấm dứt hợp đồng lao động.","highlight":["Hai bên thỏa thuận chấm dứt hợp đồng lao động."]},{"label":"Tên Điều và câu dẫn của đơn vị","text":"Điều 34. Các trường hợp chấm dứt hợp đồng lao động","highlight":[]},{"label":"Ngày hiệu lực và trạng thái máy tính","text":"Bộ Luật lao động số 45/2019/QH14: hiệu lực từ 2021-01-01 (theo vbpl.vn).\nTrạng thái tại 2026-11-11 (unit-status-v2): còn hiệu lực.","highlight":["2021-01-01"]}]},{"id":"hl-d05|dap-an|45-2019-qh14/chapter-iii/section-3/article-46/clause-1","group":"hl-d05","heading":"hl-d05 · đáp án · khoản 1 Điều 46, Bộ Luật lao động số 45/2019/QH14","question":"Đơn vị này có chứa thông tin câu hỏi hỏi và có áp dụng tại ngày áp dụng không?","fields":[{"label":"Câu hỏi (ngày áp dụng 2026-11-11)","text":"Người lao động và công ty thỏa thuận chấm dứt hợp đồng sau 5 năm làm việc thường xuyên. Công ty có phải trả trợ cấp thôi việc không, và mỗi năm làm việc được tính bao nhiêu?","highlight":[]},{"label":"Đơn vị kiểm, vai trò \"đáp án\": khoản 1 Điều 46, Bộ Luật lao động số 45/2019/QH14","text":"1. Khi hợp đồng lao động chấm dứt theo quy định tại các khoản 1, 2, 3, 4, 6, 7, 9 và 10 Điều 34 của Bộ luật này thì người sử dụng lao động có trách nhiệm trả trợ cấp thôi việc cho người lao động đã làm việc thường xuyên cho mình từ đủ 12 tháng trở lên, mỗi năm làm việc được trợ cấp một nửa tháng tiền lương, trừ trường hợp đủ điều kiện hưởng lương hưu theo quy định của pháp luật về bảo hiểm xã hội và trường hợp quy định tại điểm e khoản 1 Điều 36 của Bộ luật này.","highlight":["mỗi năm làm việc được trợ cấp một nửa tháng tiền lương","các khoản 1, 2, 3, 4, 6, 7, 9 và 10 Điều 34","từ đủ 12 tháng trở lên"]},{"label":"Tên Điều và câu dẫn của đơn vị","text":"Điều 46. Trợ cấp thôi việc","highlight":[]},{"label":"Ngày hiệu lực và trạng thái máy tính","text":"Bộ Luật lao động số 45/2019/QH14: hiệu lực từ 2021-01-01 (theo vbpl.vn).\nTrạng thái tại 2026-11-11 (unit-status-v2): còn hiệu lực.","highlight":["2021-01-01"]}]}],"short":"Hiệu lực"},"link":{"task":"link","title":"Bộ cần liên kết v1: có cần B không, gold có đúng không","instructions":"Mỗi mục là một câu hỏi; một lần chọn trả lời luôn hai cột needs_B và gold_ok của phiếu.\nĐọc câu hỏi, đơn vị A, câu dẫn của chúng và đơn vị B.\nCần B: thiếu B thì không trả lời đủ câu hỏi.\nGold đúng: danh sách đáp án (A và B) đủ, không thiếu, không thừa, không có đơn vị lỗi thời tại ngày áp dụng.\nĐáp án tham chiếu: mọi phần trong ngoặc kép phải có trong A, B hoặc câu dẫn hiện cùng chúng.\nCâu đối chứng (l30-l34) không có B, chọn Không cần B.\nCâu loại d (l26-l29) dựa trên NĐ 152/2020: xem ô Đơn vị liên quan về khoản 2 Điều 35 NĐ 219/2025.\nKhi chọn gold sai, ghi đơn vị thiếu hoặc thừa ở ô ghi chú.","options":[{"value":"can_B_gold_dung","label":"Cần B, gold đúng","hint":"Thiếu B thì không trả lời đủ; danh sách đáp án đủ, không thừa","csv":{"needs_B (co/khong)":"co","gold_ok (co/khong)":"co"}},{"value":"can_B_gold_sai","label":"Cần B, gold sai","hint":"Thiếu B thì không trả lời đủ; danh sách đáp án thiếu, thừa hoặc lỗi thời (ghi ở ghi chú)","csv":{"needs_B (co/khong)":"co","gold_ok (co/khong)":"khong"}},{"value":"khong_can_B_gold_dung","label":"Không cần B, gold đúng","hint":"A hoặc phần khác đã đủ; danh sách đáp án vẫn đúng (câu đối chứng chọn mục này)","csv":{"needs_B (co/khong)":"khong","gold_ok (co/khong)":"co"}},{"value":"khong_can_B_gold_sai","label":"Không cần B, gold sai","hint":"A hoặc phần khác đã đủ; danh sách đáp án thiếu hoặc thừa (ghi ở ghi chú)","csv":{"needs_B (co/khong)":"khong","gold_ok (co/khong)":"khong"}},{"value":"khong_chac","label":"Không chắc","hint":"Không tự quyết được; ghi lý do ở ghi chú; hai cột để trống","csv":{"needs_B (co/khong)":"","gold_ok (co/khong)":""}}],"items":[{"id":"l00","group":"loại a","heading":"l00 · Người được thuê làm giám đốc ở doanh nghiệp mà Nhà nước chỉ nắm một nửa vốn hoặc ít hơn th...","question":"Câu hỏi có cần đơn vị B mới trả lời đủ không, và danh sách đáp án (A và B) có đủ, không thừa không?","fields":[{"label":"Câu hỏi (ngày áp dụng 2026-11-11, loại a: luật dẫn văn bản hướng dẫn)","text":"Người được thuê làm giám đốc ở doanh nghiệp mà Nhà nước chỉ nắm một nửa vốn hoặc ít hơn thì hợp đồng lao động của họ phải có những nội dung chủ yếu nào?","highlight":[]},{"label":"Đơn vị A: Bộ luật Lao động 45/2019/QH14 Điều 21 khoản 1 điểm a; Bộ luật Lao động 45/2019/QH14 Điều 21 khoản 1 điểm b; Bộ luật Lao động 45/2019/QH14 Điều 21 khoản 1 điểm c; Bộ luật Lao động 45/2019/QH14 Điều 21 khoản 1 điểm d; Bộ luật Lao động 45/2019/QH14 Điều 21 khoản 1 điểm đ; Bộ luật Lao động 45/2019/QH14 Điều 21 khoản 1 điểm e; Bộ luật Lao động 45/2019/QH14 Điều 21 khoản 1 điểm g; Bộ luật Lao động 45/2019/QH14 Điều 21 khoản 1 điểm h; Bộ luật Lao động 45/2019/QH14 Điều 21 khoản 1 điểm i; Bộ luật Lao động 45/2019/QH14 Điều 21 khoản 1 điểm k","text":"[Bộ luật Lao động 45/2019/QH14 Điều 21 khoản 1 điểm a] a) Tên, địa chỉ của người sử dụng lao động và họ tên, chức danh của người giao kết hợp đồng lao động bên phía người sử dụng lao động;\n[Bộ luật Lao động 45/2019/QH14 Điều 21 khoản 1 điểm b] b) Họ tên, ngày tháng năm sinh, giới tính, nơi cư trú, số thẻ Căn cước công dân, Chứng minh nhân dân hoặc hộ chiếu của người giao kết hợp đồng lao động bên phía người lao động;\n[Bộ luật Lao động 45/2019/QH14 Điều 21 khoản 1 điểm c] c) Công việc và địa điểm làm việc;\n[Bộ luật Lao động 45/2019/QH14 Điều 21 khoản 1 điểm d] d) Thời hạn của hợp đồng lao động;\n[Bộ luật Lao động 45/2019/QH14 Điều 21 khoản 1 điểm đ] đ) Mức lương theo công việc hoặc chức danh, hình thức trả lương, thời hạn trả lương, phụ cấp lương và các khoản bổ sung khác;\n[Bộ luật Lao động 45/2019/QH14 Điều 21 khoản 1 điểm e] e) Chế độ nâng bậc, nâng lương;\n[Bộ luật Lao động 45/2019/QH14 Điều 21 khoản 1 điểm g] g) Thời giờ làm việc, thời giờ nghỉ ngơi;\n[Bộ luật Lao động 45/2019/QH14 Điều 21 khoản 1 điểm h] h) Trang bị bảo hộ lao động cho người lao động;\n[Bộ luật Lao động 45/2019/QH14 Điều 21 khoản 1 điểm i] i) Bảo hiểm xã hội, bảo hiểm y tế và bảo hiểm thất nghiệp;\n[Bộ luật Lao động 45/2019/QH14 Điều 21 khoản 1 điểm k] k) Đào tạo, bồi dưỡng, nâng cao trình độ, kỹ năng nghề.","highlight":[]},{"label":"Câu dẫn hoặc tên Điều chứa các đơn vị trên (không thuộc gold, hiện cùng đơn vị trong ngữ cảnh)","text":"[khoản 1 Điều 21, Bộ Luật lao động số 45/2019/QH14] 1. Hợp đồng lao động phải có những nội dung chủ yếu sau đây:","highlight":[]},{"label":"Đơn vị B: Nghị định 145/2020/NĐ-CP Điều 6","text":"[Nghị định 145/2020/NĐ-CP Điều 6] Điều 6. Nội dung hợp đồng lao động đối với người lao động được thuê làm giám đốc trong doanh nghiệp do Nhà nước nắm giữ từ 50% vốn điều lệ hoặc tổng số cổ phần có quyền biểu quyết trở xuống Nội dung hợp đồng lao động đối với người lao động được thuê làm giám đốc trong doanh nghiệp do Nhà nước nắm giữ từ 50% vốn điều lệ hoặc tổng số cổ phần có quyền biểu quyết trở xuống thực hiện theo quy định tại khoản 1 Điều 21 của Bộ luật Lao động.","highlight":["thực hiện theo quy định tại khoản 1 Điều 21 của Bộ luật Lao động","Nhà nước nắm giữ từ 50% vốn điều lệ"]},{"label":"Đáp án tham chiếu (phần trong ngoặc kép phải có trong A, B hoặc câu dẫn của chúng)","text":"Nội dung hợp đồng lao động của người được thuê làm giám đốc trong trường hợp này \"thực hiện theo quy định tại khoản 1 Điều 21 của Bộ luật Lao động\". Khoản 1 Điều 21 nêu các nội dung chủ yếu, ví dụ \"Tên, địa chỉ của người sử dụng lao động\", \"Mức lương theo công việc hoặc chức danh\", \"Thời giờ làm việc, thời giờ nghỉ ngơi\", \"Bảo hiểm xã hội, bảo hiểm y tế và bảo hiểm thất nghiệp\".","highlight":[]},{"label":"Ngày hiệu lực và trạng thái","text":"Bộ Luật lao động số 45/2019/QH14: hiệu lực từ 2021-01-01 (theo vbpl.vn)\nNghị định số 145/2020/NĐ-CP Quy định chi tiết và hướng dẫn thi hành một số điều của Bộ luật Lao động về điều kiện lao động và quan hệ lao động: hiệu lực từ 2021-02-01 (theo vbpl.vn)\nTrạng thái máy tính tại 2026-11-11 (unit-status-v2):\nđiểm a khoản 1 Điều 21, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nđiểm b khoản 1 Điều 21, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nđiểm c khoản 1 Điều 21, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nđiểm d khoản 1 Điều 21, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nđiểm đ khoản 1 Điều 21, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nđiểm e khoản 1 Điều 21, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nđiểm g khoản 1 Điều 21, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nđiểm h khoản 1 Điều 21, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nđiểm i khoản 1 Điều 21, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nđiểm k khoản 1 Điều 21, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nĐiều 6, Nghị định số 145/2020/NĐ-CP Quy định chi tiết và hướng dẫn thi hành một số điều của Bộ luật Lao động về điều kiện lao động và quan hệ lao động: còn hiệu lực","highlight":[]},{"label":"Đơn vị liên quan agent tìm thấy (ngoài gold)","text":"[khoản 4 Điều 21, Bộ Luật lao động số 45/2019/QH14] 4. Chính phủ quy định nội dung của hợp đồng lao động đối với người lao động được thuê làm giám đốc trong doanh nghiệp có vốn nhà nước.","highlight":["Chính phủ quy định nội dung của hợp đồng lao động đối với người lao động được thuê làm giám đốc trong doanh nghiệp có vốn nhà nước"]}]},{"id":"l01","group":"loại a","heading":"l01 · Nhân viên làm mất tài sản của công ty đúng lúc đang nghỉ ốm. Công ty có được xử lý bồi thư...","question":"Câu hỏi có cần đơn vị B mới trả lời đủ không, và danh sách đáp án (A và B) có đủ, không thừa không?","fields":[{"label":"Câu hỏi (ngày áp dụng 2026-11-11, loại a: luật dẫn văn bản hướng dẫn)","text":"Nhân viên làm mất tài sản của công ty đúng lúc đang nghỉ ốm. Công ty có được xử lý bồi thường trong thời gian đó không, và nếu thời hiệu xử lý hết trong lúc nghỉ thì được kéo dài thêm tối đa bao lâu?","highlight":[]},{"label":"Đơn vị A: Bộ luật Lao động 45/2019/QH14 Điều 122 khoản 4 điểm a; Nghị định 145/2020/NĐ-CP Điều 72 khoản 2","text":"[Bộ luật Lao động 45/2019/QH14 Điều 122 khoản 4 điểm a] a) Nghỉ ốm đau, điều dưỡng; nghỉ việc được sự đồng ý của người sử dụng lao động;\n[Nghị định 145/2020/NĐ-CP Điều 72 khoản 2] 2. Không xử lý bồi thường thiệt hại đối với người lao động đang trong thời gian quy định tại khoản 4 Điều 122 của Bộ luật Lao động.","highlight":["Không xử lý bồi thường thiệt hại","Nghỉ ốm đau, điều dưỡng"]},{"label":"Câu dẫn hoặc tên Điều chứa các đơn vị trên (không thuộc gold, hiện cùng đơn vị trong ngữ cảnh)","text":"[khoản 4 Điều 122, Bộ Luật lao động số 45/2019/QH14] 4. Không được xử lý kỷ luật lao động đối với người lao động đang trong thời gian sau đây:\n[Điều 72, Nghị định số 145/2020/NĐ-CP Quy định chi tiết và hướng dẫn thi hành một số điều của Bộ luật Lao động về điều kiện lao động và quan hệ lao động] Điều 72. Thời hiệu xử lý bồi thường thiệt hại\nThời hiệu xử lý bồi thường thiệt hại tại khoản 2 Điều 130 của Bộ luật Lao động được quy định như sau:","highlight":[]},{"label":"Đơn vị B: Nghị định 145/2020/NĐ-CP Điều 72 khoản 3","text":"[Nghị định 145/2020/NĐ-CP Điều 72 khoản 3] 3. Khi hết thời gian quy định tại khoản 4 Điều 122 của Bộ luật Lao động, nếu hết thời hiệu hoặc còn thời hiệu nhưng không đủ 60 ngày thì được kéo dài thời hiệu xử lý bồi thường thiệt hại nhưng không quá 60 ngày kể từ ngày hết thời gian nêu trên.","highlight":["được kéo dài thời hiệu xử lý bồi thường thiệt hại nhưng không quá 60 ngày"]},{"label":"Đáp án tham chiếu (phần trong ngoặc kép phải có trong A, B hoặc câu dẫn của chúng)","text":"\"Không xử lý bồi thường thiệt hại đối với người lao động đang trong thời gian quy định tại khoản 4 Điều 122 của Bộ luật Lao động\", trong đó có \"Nghỉ ốm đau, điều dưỡng\". Khi hết thời gian đó, nếu hết thời hiệu hoặc còn dưới 60 ngày thì \"được kéo dài thời hiệu xử lý bồi thường thiệt hại nhưng không quá 60 ngày kể từ ngày hết thời gian nêu trên\".","highlight":[]},{"label":"Ngày hiệu lực và trạng thái","text":"Bộ Luật lao động số 45/2019/QH14: hiệu lực từ 2021-01-01 (theo vbpl.vn)\nNghị định số 145/2020/NĐ-CP Quy định chi tiết và hướng dẫn thi hành một số điều của Bộ luật Lao động về điều kiện lao động và quan hệ lao động: hiệu lực từ 2021-02-01 (theo vbpl.vn)\nTrạng thái máy tính tại 2026-11-11 (unit-status-v2):\nđiểm a khoản 4 Điều 122, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nkhoản 2 Điều 72, Nghị định số 145/2020/NĐ-CP Quy định chi tiết và hướng dẫn thi hành một số điều của Bộ luật Lao động về điều kiện lao động và quan hệ lao động: còn hiệu lực\nkhoản 3 Điều 72, Nghị định số 145/2020/NĐ-CP Quy định chi tiết và hướng dẫn thi hành một số điều của Bộ luật Lao động về điều kiện lao động và quan hệ lao động: còn hiệu lực","highlight":[]}]},{"id":"l02","group":"loại a","heading":"l02 · Nhân viên ký hợp đồng có thời hạn, hết hạn thì ký tiếp hợp đồng mới rồi sau đó nghỉ việc. ...","question":"Câu hỏi có cần đơn vị B mới trả lời đủ không, và danh sách đáp án (A và B) có đủ, không thừa không?","fields":[{"label":"Câu hỏi (ngày áp dụng 2026-11-11, loại a: luật dẫn văn bản hướng dẫn)","text":"Nhân viên ký hợp đồng có thời hạn, hết hạn thì ký tiếp hợp đồng mới rồi sau đó nghỉ việc. Lương dùng để tính trợ cấp thôi việc lấy theo hợp đồng nào?","highlight":[]},{"label":"Đơn vị A: Bộ luật Lao động 45/2019/QH14 Điều 20 khoản 2 điểm a; Bộ luật Lao động 45/2019/QH14 Điều 20 khoản 2 điểm c","text":"[Bộ luật Lao động 45/2019/QH14 Điều 20 khoản 2 điểm a] a) Trong thời hạn 30 ngày kể từ ngày hợp đồng lao động hết hạn, hai bên phải ký kết hợp đồng lao động mới; trong thời gian chưa ký kết hợp đồng lao động mới thì quyền, nghĩa vụ và lợi ích của hai bên được thực hiện theo hợp đồng đã giao kết;\n[Bộ luật Lao động 45/2019/QH14 Điều 20 khoản 2 điểm c] c) Trường hợp hai bên ký kết hợp đồng lao động mới là hợp đồng lao động xác định thời hạn thì cũng chỉ được ký thêm 01 lần, sau đó nếu người lao động vẫn tiếp tục làm việc thì phải ký kết hợp đồng lao động không xác định thời hạn, trừ hợp đồng lao động đối với người được thuê làm giám đốc trong doanh nghiệp có vốn nhà nước và trường hợp quy định tại khoản 1 Điều 149, khoản 2 Điều 151 và khoản 4 Điều 177 của Bộ luật này.","highlight":[]},{"label":"Câu dẫn hoặc tên Điều chứa các đơn vị trên (không thuộc gold, hiện cùng đơn vị trong ngữ cảnh)","text":"[khoản 2 Điều 20, Bộ Luật lao động số 45/2019/QH14] 2. Khi hợp đồng lao động quy định tại điểm b khoản 1 Điều này hết hạn mà người lao động vẫn tiếp tục làm việc thì thực hiện như sau:\n[khoản 5 Điều 8, Nghị định số 145/2020/NĐ-CP Quy định chi tiết và hướng dẫn thi hành một số điều của Bộ luật Lao động về điều kiện lao động và quan hệ lao động] 5. Tiền lương để tính trợ cấp thôi việc, trợ cấp mất việc làm được quy định như sau:","highlight":[]},{"label":"Đơn vị B: Nghị định 145/2020/NĐ-CP Điều 8 khoản 5 điểm b","text":"[Nghị định 145/2020/NĐ-CP Điều 8 khoản 5 điểm b] b) Trường hợp người lao động làm việc cho người sử dụng lao động theo nhiều hợp đồng lao động kế tiếp nhau theo quy định tại khoản 2 Điều 20 của Bộ luật Lao động thì tiền lương để tính trợ cấp thôi việc, trợ cấp mất việc làm là tiền lương bình quân của 06 tháng liền kề theo hợp đồng lao động trước khi chấm dứt hợp đồng lao động cuối cùng. Trường hợp hợp đồng lao động cuối cùng bị tuyên bố vô hiệu vì có nội dung tiền lương thấp hơn mức lương tối thiểu vùng do Chính phủ công bố hoặc mức lương ghi trong thỏa ước lao động tập thể thì tiền lương làm căn cứ tính trợ cấp thôi việc do hai bên thỏa thuận nhưng không thấp hơn mức lương tối thiểu vùng hoặc mức lương ghi trong thỏa ước lao động tập thể.","highlight":["tiền lương bình quân của 06 tháng liền kề theo hợp đồng lao động trước khi chấm dứt hợp đồng lao động cuối cùng","theo quy định tại khoản 2 Điều 20"]},{"label":"Đáp án tham chiếu (phần trong ngoặc kép phải có trong A, B hoặc câu dẫn của chúng)","text":"Hết hạn hợp đồng mà người lao động vẫn làm thì \"hai bên phải ký kết hợp đồng lao động mới\", hợp đồng xác định thời hạn mới \"cũng chỉ được ký thêm 01 lần\". Khi làm việc theo nhiều hợp đồng kế tiếp nhau thì \"tiền lương để tính trợ cấp thôi việc, trợ cấp mất việc làm là tiền lương bình quân của 06 tháng liền kề theo hợp đồng lao động trước khi chấm dứt hợp đồng lao động cuối cùng\".","highlight":[]},{"label":"Ngày hiệu lực và trạng thái","text":"Bộ Luật lao động số 45/2019/QH14: hiệu lực từ 2021-01-01 (theo vbpl.vn)\nNghị định số 145/2020/NĐ-CP Quy định chi tiết và hướng dẫn thi hành một số điều của Bộ luật Lao động về điều kiện lao động và quan hệ lao động: hiệu lực từ 2021-02-01 (theo vbpl.vn)\nTrạng thái máy tính tại 2026-11-11 (unit-status-v2):\nđiểm a khoản 2 Điều 20, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nđiểm c khoản 2 Điều 20, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nđiểm b khoản 5 Điều 8, Nghị định số 145/2020/NĐ-CP Quy định chi tiết và hướng dẫn thi hành một số điều của Bộ luật Lao động về điều kiện lao động và quan hệ lao động: còn hiệu lực","highlight":[]}]},{"id":"l03","group":"loại a","heading":"l03 · Công ty sa thải nhân viên trái quy định rồi không muốn nhận lại, nhân viên cũng đồng ý khô...","question":"Câu hỏi có cần đơn vị B mới trả lời đủ không, và danh sách đáp án (A và B) có đủ, không thừa không?","fields":[{"label":"Câu hỏi (ngày áp dụng 2026-11-11, loại a: luật dẫn văn bản hướng dẫn)","text":"Công ty sa thải nhân viên trái quy định rồi không muốn nhận lại, nhân viên cũng đồng ý không quay lại. Công ty phải trả những khoản gì?","highlight":[]},{"label":"Đơn vị A: Bộ luật Lao động 45/2019/QH14 Điều 41 khoản 1; Bộ luật Lao động 45/2019/QH14 Điều 41 khoản 3","text":"[Bộ luật Lao động 45/2019/QH14 Điều 41 khoản 1] 1. Phải nhận người lao động trở lại làm việc theo hợp đồng lao động đã giao kết; phải trả tiền lương, đóng bảo hiểm xã hội, bảo hiểm y tế, bảo hiểm thất nghiệp trong những ngày người lao động không được làm việc và phải trả thêm cho người lao động một khoản tiền ít nhất bằng 02 tháng tiền lương theo hợp đồng lao động. Sau khi được nhận lại làm việc, người lao động hoàn trả cho người sử dụng lao động các khoản tiền trợ cấp thôi việc, trợ cấp mất việc làm nếu đã nhận của người sử dụng lao động. Trường hợp không còn vị trí, công việc đã giao kết trong hợp đồng lao động mà người lao động vẫn muốn làm việc thì hai bên thỏa thuận để sửa đổi, bổ sung hợp đồng lao động. Trường hợp vi phạm quy định về thời hạn báo trước quy định tại khoản 2 Điều 36 của Bộ luật này thì phải trả một khoản tiền tương ứng với tiền lương theo hợp đồng lao động trong những ngày không báo trước.\n[Bộ luật Lao động 45/2019/QH14 Điều 41 khoản 3] 3. Trường hợp người sử dụng lao động không muốn nhận lại người lao động và người lao động đồng ý thì ngoài khoản tiền người sử dụng lao động phải trả theo quy định tại khoản 1 Điều này và trợ cấp thôi việc theo quy định tại Điều 46 của Bộ luật này, hai bên thỏa thuận khoản tiền bồi thường thêm cho người lao động nhưng ít nhất bằng 02 tháng tiền lương theo hợp đồng lao động để chấm dứt hợp đồng lao động.","highlight":["ít nhất bằng 02 tháng tiền lương theo hợp đồng lao động"]},{"label":"Câu dẫn hoặc tên Điều chứa các đơn vị trên (không thuộc gold, hiện cùng đơn vị trong ngữ cảnh)","text":"[Điều 41, Bộ Luật lao động số 45/2019/QH14] Điều 41. Nghĩa vụ của người sử dụng lao động khi đơn phương chấm dứt hợp đồng lao động trái pháp luật","highlight":["đơn phương chấm dứt hợp đồng lao động trái pháp luật"]},{"label":"Đơn vị B: Nghị định 145/2020/NĐ-CP Điều 73","text":"[Nghị định 145/2020/NĐ-CP Điều 73] Điều 73. Khiếu nại về kỷ luật lao động, trách nhiệm vật chất Người bị xử lý kỷ luật lao động, bị tạm đình chỉ công việc hoặc phải bồi thường theo chế độ trách nhiệm vật chất nếu thấy không thỏa đáng thì có quyền khiếu nại với người sử dụng lao động, với cơ quan có thẩm quyền theo quy định của Chính phủ về giải quyết khiếu nại trong lĩnh vực lao động hoặc yêu cầu giải quyết tranh chấp lao động cá nhân theo trình tự quy định tại Mục 2 Chương XIV của Bộ luật Lao động. Trường hợp người sử dụng lao động quyết định xử lý kỷ luật lao động theo hình thức sa thải trái quy định của pháp luật thì ngoài nghĩa vụ, trách nhiệm theo quy định của Chính phủ về giải quyết khiếu nại trong lĩnh vực lao động hoặc giải quyết tranh chấp lao động cá nhân theo trình tự quy định tại Mục 2 Chương XIV của Bộ luật Lao động thì người sử dụng lao động có nghĩa vụ thực hiện quy định tại Điều 41 của Bộ luật Lao động.","highlight":["sa thải trái quy định của pháp luật","có nghĩa vụ thực hiện quy định tại Điều 41 của Bộ luật Lao động"]},{"label":"Đáp án tham chiếu (phần trong ngoặc kép phải có trong A, B hoặc câu dẫn của chúng)","text":"Nếu sa thải \"trái quy định của pháp luật\" thì \"người sử dụng lao động có nghĩa vụ thực hiện quy định tại Điều 41 của Bộ luật Lao động\". Theo Điều 41, phải \"trả thêm cho người lao động một khoản tiền ít nhất bằng 02 tháng tiền lương theo hợp đồng lao động\", cộng \"trợ cấp thôi việc theo quy định tại Điều 46\", và hai bên \"thỏa thuận khoản tiền bồi thường thêm cho người lao động nhưng ít nhất bằng 02 tháng tiền lương theo hợp đồng lao động\".","highlight":[]},{"label":"Ngày hiệu lực và trạng thái","text":"Bộ Luật lao động số 45/2019/QH14: hiệu lực từ 2021-01-01 (theo vbpl.vn)\nNghị định số 145/2020/NĐ-CP Quy định chi tiết và hướng dẫn thi hành một số điều của Bộ luật Lao động về điều kiện lao động và quan hệ lao động: hiệu lực từ 2021-02-01 (theo vbpl.vn)\nTrạng thái máy tính tại 2026-11-11 (unit-status-v2):\nkhoản 1 Điều 41, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nkhoản 3 Điều 41, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nĐiều 73, Nghị định số 145/2020/NĐ-CP Quy định chi tiết và hướng dẫn thi hành một số điều của Bộ luật Lao động về điều kiện lao động và quan hệ lao động: còn hiệu lực","highlight":[]},{"label":"Đơn vị liên quan agent tìm thấy (ngoài gold)","text":"[Điều 41, Bộ Luật lao động số 45/2019/QH14] Điều 41. Nghĩa vụ của người sử dụng lao động khi đơn phương chấm dứt hợp đồng lao động trái pháp luật","highlight":["đơn phương chấm dứt hợp đồng lao động trái pháp luật"]}]},{"id":"l04","group":"loại a","heading":"l04 · Người giúp việc gia đình làm hỏng hoặc làm mất đồ đạc của gia chủ thì phải bồi thường thế ...","question":"Câu hỏi có cần đơn vị B mới trả lời đủ không, và danh sách đáp án (A và B) có đủ, không thừa không?","fields":[{"label":"Câu hỏi (ngày áp dụng 2026-11-11, loại a: luật dẫn văn bản hướng dẫn)","text":"Người giúp việc gia đình làm hỏng hoặc làm mất đồ đạc của gia chủ thì phải bồi thường thế nào, và gia chủ cần thỏa thuận sẵn điều gì với người giúp việc?","highlight":["làm hỏng hoặc làm mất"]},{"label":"Đơn vị A: Bộ luật Lao động 45/2019/QH14 Điều 129 khoản 2","text":"[Bộ luật Lao động 45/2019/QH14 Điều 129 khoản 2] 2. Người lao động làm mất dụng cụ, thiết bị, tài sản của người sử dụng lao động hoặc tài sản khác do người sử dụng lao động giao hoặc tiêu hao vật tư quá định mức cho phép thì phải bồi thường thiệt hại một phần hoặc toàn bộ theo thời giá thị trường hoặc nội quy lao động; trường hợp có hợp đồng trách nhiệm thì phải bồi thường theo hợp đồng trách nhiệm; trường hợp do thiên tai, hỏa hoạn, địch họa, dịch bệnh nguy hiểm, thảm họa, sự kiện xảy ra khách quan không thể lường trước được và không thể khắc phục được mặc dù đã áp dụng mọi biện pháp cần thiết và khả năng cho phép thì không phải bồi thường.","highlight":["làm mất dụng cụ, thiết bị, tài sản"]},{"label":"Câu dẫn hoặc tên Điều chứa các đơn vị trên (không thuộc gold, hiện cùng đơn vị trong ngữ cảnh)","text":"[Điều 129, Bộ Luật lao động số 45/2019/QH14] Điều 129. Bồi thường thiệt hại\n[khoản 6 Điều 89, Nghị định số 145/2020/NĐ-CP Quy định chi tiết và hướng dẫn thi hành một số điều của Bộ luật Lao động về điều kiện lao động và quan hệ lao động] 6. Kỷ luật lao động, trách nhiệm vật chất đối với người lao động được thực hiện như sau:","highlight":[]},{"label":"Đơn vị B: Nghị định 145/2020/NĐ-CP Điều 89 khoản 6 điểm a","text":"[Nghị định 145/2020/NĐ-CP Điều 89 khoản 6 điểm a] a) Người sử dụng lao động và người lao động xác định cụ thể các hành vi, hình thức xử lý kỷ luật lao động, trách nhiệm vật chất theo quy định tại khoản 2 Điều 118 và Điều 129 của Bộ luật Lao động và ghi trong hợp đồng lao động hoặc thể hiện bằng hình thức thỏa thuận khác;","highlight":["xác định cụ thể các hành vi, hình thức xử lý kỷ luật lao động, trách nhiệm vật chất"]},{"label":"Đáp án tham chiếu (phần trong ngoặc kép phải có trong A, B hoặc câu dẫn của chúng)","text":"Người lao động làm mất tài sản \"phải bồi thường thiệt hại một phần hoặc toàn bộ theo thời giá thị trường hoặc nội quy lao động\". Với người giúp việc, hai bên \"xác định cụ thể các hành vi, hình thức xử lý kỷ luật lao động, trách nhiệm vật chất\" và \"ghi trong hợp đồng lao động hoặc thể hiện bằng hình thức thỏa thuận khác\".","highlight":[]},{"label":"Ngày hiệu lực và trạng thái","text":"Bộ Luật lao động số 45/2019/QH14: hiệu lực từ 2021-01-01 (theo vbpl.vn)\nNghị định số 145/2020/NĐ-CP Quy định chi tiết và hướng dẫn thi hành một số điều của Bộ luật Lao động về điều kiện lao động và quan hệ lao động: hiệu lực từ 2021-02-01 (theo vbpl.vn)\nTrạng thái máy tính tại 2026-11-11 (unit-status-v2):\nkhoản 2 Điều 129, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nđiểm a khoản 6 Điều 89, Nghị định số 145/2020/NĐ-CP Quy định chi tiết và hướng dẫn thi hành một số điều của Bộ luật Lao động về điều kiện lao động và quan hệ lao động: còn hiệu lực","highlight":[]},{"label":"Đơn vị liên quan agent tìm thấy (ngoài gold)","text":"[khoản 1 Điều 129, Bộ Luật lao động số 45/2019/QH14] 1. Người lao động làm hư hỏng dụng cụ, thiết bị hoặc có hành vi khác gây thiệt hại tài sản của người sử dụng lao động thì phải bồi thường theo quy định của pháp luật hoặc nội quy lao động của người sử dụng lao động.\nTrường hợp người lao động gây thiệt hại không nghiêm trọng do sơ suất với giá trị không quá 10 tháng lương tối thiểu vùng do Chính phủ công bố được áp dụng tại nơi người lao động làm việc thì người lao động phải bồi thường nhiều nhất là 03 tháng tiền lương và bị khấu trừ hằng tháng vào lương theo quy định tại khoản 3 Điều 102 của Bộ luật này.","highlight":["làm hư hỏng dụng cụ, thiết bị hoặc có hành vi khác gây thiệt hại tài sản"]}]},{"id":"l05","group":"loại a","heading":"l05 · Công ty có thể buộc nhân viên làm thêm giờ mà không cần hỏi ý kiến họ không?","question":"Câu hỏi có cần đơn vị B mới trả lời đủ không, và danh sách đáp án (A và B) có đủ, không thừa không?","fields":[{"label":"Câu hỏi (ngày áp dụng 2026-11-11, loại a: luật dẫn văn bản hướng dẫn)","text":"Công ty có thể buộc nhân viên làm thêm giờ mà không cần hỏi ý kiến họ không?","highlight":["mà không cần hỏi ý kiến"]},{"label":"Đơn vị A: Bộ luật Lao động 45/2019/QH14 Điều 108 khoản 1; Bộ luật Lao động 45/2019/QH14 Điều 108 khoản 2","text":"[Bộ luật Lao động 45/2019/QH14 Điều 108 khoản 1] 1. Thực hiện lệnh động viên, huy động bảo đảm nhiệm vụ quốc phòng, an ninh theo quy định của pháp luật;\n[Bộ luật Lao động 45/2019/QH14 Điều 108 khoản 2] 2. Thực hiện các công việc nhằm bảo vệ tính mạng con người, tài sản của cơ quan, tổ chức, cá nhân trong phòng ngừa, khắc phục hậu quả thiên tai, hỏa hoạn, dịch bệnh nguy hiểm và thảm họa, trừ trường hợp có nguy cơ ảnh hưởng đến tính mạng, sức khỏe của người lao động theo quy định của pháp luật về an toàn, vệ sinh lao động.","highlight":[]},{"label":"Câu dẫn hoặc tên Điều chứa các đơn vị trên (không thuộc gold, hiện cùng đơn vị trong ngữ cảnh)","text":"[Điều 108, Bộ Luật lao động số 45/2019/QH14] Điều 108. Làm thêm giờ trong trường hợp đặc biệt\nNgười sử dụng lao động có quyền yêu cầu người lao động làm thêm giờ vào bất kỳ ngày nào mà không bị giới hạn về số giờ làm thêm theo quy định tại Điều 107 của Bộ luật này và người lao động không được từ chối trong trường hợp sau đây:\n[khoản 1 Điều 59, Nghị định số 145/2020/NĐ-CP Quy định chi tiết và hướng dẫn thi hành một số điều của Bộ luật Lao động về điều kiện lao động và quan hệ lao động] 1. Trừ các trường hợp quy định tại Điều 108 của Bộ luật Lao động, các trường hợp khác khi tổ chức làm thêm giờ, người sử dụng lao động phải được sự đồng ý của người lao động tham gia làm thêm về các nội dung sau đây:","highlight":["người lao động không được từ chối"]},{"label":"Đơn vị B: Nghị định 145/2020/NĐ-CP Điều 59 khoản 1 điểm a; Nghị định 145/2020/NĐ-CP Điều 59 khoản 1 điểm b; Nghị định 145/2020/NĐ-CP Điều 59 khoản 1 điểm c","text":"[Nghị định 145/2020/NĐ-CP Điều 59 khoản 1 điểm a] a) Thời gian làm thêm;\n[Nghị định 145/2020/NĐ-CP Điều 59 khoản 1 điểm b] b) Địa điểm làm thêm;\n[Nghị định 145/2020/NĐ-CP Điều 59 khoản 1 điểm c] c) Công việc làm thêm.","highlight":[]},{"label":"Đáp án tham chiếu (phần trong ngoặc kép phải có trong A, B hoặc câu dẫn của chúng)","text":"Chỉ trong các trường hợp đặc biệt như \"Thực hiện lệnh động viên\" hoặc bảo vệ tính mạng con người, tài sản trước thiên tai, hỏa hoạn, dịch bệnh thì người lao động \"không được từ chối\". Các trường hợp khác \"người sử dụng lao động phải được sự đồng ý của người lao động tham gia làm thêm về các nội dung sau đây\": \"Thời gian làm thêm\", \"Địa điểm làm thêm\", \"Công việc làm thêm\".","highlight":[]},{"label":"Ngày hiệu lực và trạng thái","text":"Bộ Luật lao động số 45/2019/QH14: hiệu lực từ 2021-01-01 (theo vbpl.vn)\nNghị định số 145/2020/NĐ-CP Quy định chi tiết và hướng dẫn thi hành một số điều của Bộ luật Lao động về điều kiện lao động và quan hệ lao động: hiệu lực từ 2021-02-01 (theo vbpl.vn)\nTrạng thái máy tính tại 2026-11-11 (unit-status-v2):\nkhoản 1 Điều 108, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nkhoản 2 Điều 108, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nđiểm a khoản 1 Điều 59, Nghị định số 145/2020/NĐ-CP Quy định chi tiết và hướng dẫn thi hành một số điều của Bộ luật Lao động về điều kiện lao động và quan hệ lao động: còn hiệu lực\nđiểm b khoản 1 Điều 59, Nghị định số 145/2020/NĐ-CP Quy định chi tiết và hướng dẫn thi hành một số điều của Bộ luật Lao động về điều kiện lao động và quan hệ lao động: còn hiệu lực\nđiểm c khoản 1 Điều 59, Nghị định số 145/2020/NĐ-CP Quy định chi tiết và hướng dẫn thi hành một số điều của Bộ luật Lao động về điều kiện lao động và quan hệ lao động: còn hiệu lực","highlight":[]},{"label":"Đơn vị liên quan agent tìm thấy (ngoài gold)","text":"[điểm a khoản 2 Điều 107, Bộ Luật lao động số 45/2019/QH14] a) Phải được sự đồng ý của người lao động;\n[Điều 108, Bộ Luật lao động số 45/2019/QH14] Điều 108. Làm thêm giờ trong trường hợp đặc biệt\nNgười sử dụng lao động có quyền yêu cầu người lao động làm thêm giờ vào bất kỳ ngày nào mà không bị giới hạn về số giờ làm thêm theo quy định tại Điều 107 của Bộ luật này và người lao động không được từ chối trong trường hợp sau đây:","highlight":["Phải được sự đồng ý của người lao động","người lao động không được từ chối"]}]},{"id":"l06","group":"loại a","heading":"l06 · Tiền thưởng cho nhân viên có phải ghi chung vào phần lương trong hợp đồng lao động không?","question":"Câu hỏi có cần đơn vị B mới trả lời đủ không, và danh sách đáp án (A và B) có đủ, không thừa không?","fields":[{"label":"Câu hỏi (ngày áp dụng 2026-11-11, loại a: luật dẫn văn bản hướng dẫn)","text":"Tiền thưởng cho nhân viên có phải ghi chung vào phần lương trong hợp đồng lao động không?","highlight":[]},{"label":"Đơn vị A: Bộ luật Lao động 45/2019/QH14 Điều 104 khoản 1; Bộ luật Lao động 45/2019/QH14 Điều 104 khoản 2","text":"[Bộ luật Lao động 45/2019/QH14 Điều 104 khoản 1] 1. Thưởng là số tiền hoặc tài sản hoặc bằng các hình thức khác mà người sử dụng lao động thưởng cho người lao động căn cứ vào kết quả sản xuất, kinh doanh, mức độ hoàn thành công việc của người lao động.\n[Bộ luật Lao động 45/2019/QH14 Điều 104 khoản 2] 2. Quy chế thưởng do người sử dụng lao động quyết định và công bố công khai tại nơi làm việc sau khi tham khảo ý kiến của tổ chức đại diện người lao động tại cơ sở đối với nơi có tổ chức đại diện người lao động tại cơ sở.","highlight":[]},{"label":"Câu dẫn hoặc tên Điều chứa các đơn vị trên (không thuộc gold, hiện cùng đơn vị trong ngữ cảnh)","text":"[Điều 104, Bộ Luật lao động số 45/2019/QH14] Điều 104. Thưởng\n[khoản 5 Điều 3, Thông tư số 10/2020/TT-BLĐTBXH Quy định chi tiết và hướng dẫn thi hành một số điều, khoản sau đây của Bộ luật Lao động về nội dung của Hợp đồng lao động, hội đồng thương lượng tập thể và nghề, công việc có ảnh hưởng xấu tới chức năng sinh sản, nuôi con] 5. Mức lương theo công việc hoặc chức danh, hình thức trả lương, kỳ hạn trả lương, phụ cấp lương và các khoản bổ sung khác được quy định như sau:","highlight":[]},{"label":"Đơn vị B: Thông tư 10/2020/TT-BLĐTBXH Điều 3 khoản 5 điểm c","text":"[Thông tư 10/2020/TT-BLĐTBXH Điều 3 khoản 5 điểm c] c) Các khoản bổ sung khác theo thỏa thuận của hai bên như sau: c1) Các khoản bổ sung xác định được mức tiền cụ thể cùng với mức lương thỏa thuận trong hợp đồng lao động và trả thường xuyên trong mỗi kỳ trả lương; c2) Các khoản bổ sung không xác định được mức tiền cụ thể cùng với mức lương thỏa thuận trong hợp đồng lao động, trả thường xuyên hoặc không thường xuyên trong mỗi kỳ trả lương gắn với quá trình làm việc, kết quả thực hiện công việc của người lao động. Đối với các chế độ và phúc lợi khác như thưởng theo quy định tại Điều 104 của Bộ luật Lao động, tiền thưởng sáng kiến; tiền ăn giữa ca; các khoản hỗ trợ xăng xe, điện thoại, đi lại, tiền nhà ở, tiền giữ trẻ, nuôi con nhỏ; hỗ trợ khi người lao động có thân nhân bị chết, người lao động có người thân kết hôn, sinh nhật của người lao động, trợ cấp cho người lao động gặp hoàn cảnh khó khăn khi bị tai nạn lao động, bệnh nghề nghiệp và các khoản hỗ trợ, trợ cấp khác thì ghi thành mục riêng trong hợp đồng lao động.","highlight":["thì ghi thành mục riêng trong hợp đồng lao động","thưởng theo quy định tại Điều 104 của Bộ luật Lao động"]},{"label":"Đáp án tham chiếu (phần trong ngoặc kép phải có trong A, B hoặc câu dẫn của chúng)","text":"\"Thưởng là số tiền hoặc tài sản hoặc bằng các hình thức khác mà người sử dụng lao động thưởng cho người lao động\", theo quy chế do người sử dụng lao động quyết định. Về hợp đồng, \"thưởng theo quy định tại Điều 104 của Bộ luật Lao động\" \"thì ghi thành mục riêng trong hợp đồng lao động\".","highlight":[]},{"label":"Ngày hiệu lực và trạng thái","text":"Bộ Luật lao động số 45/2019/QH14: hiệu lực từ 2021-01-01 (theo vbpl.vn)\nThông tư số 10/2020/TT-BLĐTBXH Quy định chi tiết và hướng dẫn thi hành một số điều, khoản sau đây của Bộ luật Lao động về nội dung của Hợp đồng lao động, hội đồng thương lượng tập thể và nghề, công việc có ảnh hưởng xấu tới chức năng sinh sản, nuôi con: hiệu lực từ 2021-01-01 (theo vbpl.vn)\nTrạng thái máy tính tại 2026-11-11 (unit-status-v2):\nkhoản 1 Điều 104, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nkhoản 2 Điều 104, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nđiểm c khoản 5 Điều 3, Thông tư số 10/2020/TT-BLĐTBXH Quy định chi tiết và hướng dẫn thi hành một số điều, khoản sau đây của Bộ luật Lao động về nội dung của Hợp đồng lao động, hội đồng thương lượng tập thể và nghề, công việc có ảnh hưởng xấu tới chức năng sinh sản, nuôi con: còn hiệu lực","highlight":[]}]},{"id":"l07","group":"loại a","heading":"l07 · Nhân viên bị tạm đình chỉ công việc để xác minh vi phạm, sau đó không bị kỷ luật và được n...","question":"Câu hỏi có cần đơn vị B mới trả lời đủ không, và danh sách đáp án (A và B) có đủ, không thừa không?","fields":[{"label":"Câu hỏi (ngày áp dụng 2026-11-11, loại a: luật dẫn văn bản hướng dẫn)","text":"Nhân viên bị tạm đình chỉ công việc để xác minh vi phạm, sau đó không bị kỷ luật và được nhận lại làm việc. Khi sau này nghỉ việc, thời gian bị đình chỉ có được tính vào thời gian để tính trợ cấp thôi việc không?","highlight":[]},{"label":"Đơn vị A: Bộ luật Lao động 45/2019/QH14 Điều 128 khoản 2; Bộ luật Lao động 45/2019/QH14 Điều 128 khoản 4","text":"[Bộ luật Lao động 45/2019/QH14 Điều 128 khoản 2] 2. Thời hạn tạm đình chỉ công việc không được quá 15 ngày, trường hợp đặc biệt không được quá 90 ngày. Trong thời gian bị tạm đình chỉ công việc, người lao động được tạm ứng 50% tiền lương trước khi bị đình chỉ công việc. Hết thời hạn tạm đình chỉ công việc, người sử dụng lao động phải nhận người lao động trở lại làm việc.\n[Bộ luật Lao động 45/2019/QH14 Điều 128 khoản 4] 4. Trường hợp người lao động không bị xử lý kỷ luật lao động thì được người sử dụng lao động trả đủ tiền lương cho thời gian bị tạm đình chỉ công việc.","highlight":["trả đủ tiền lương cho thời gian bị tạm đình chỉ công việc"]},{"label":"Câu dẫn hoặc tên Điều chứa các đơn vị trên (không thuộc gold, hiện cùng đơn vị trong ngữ cảnh)","text":"[Điều 128, Bộ Luật lao động số 45/2019/QH14] Điều 128. Tạm đình chỉ công việc\n[khoản 3 Điều 8, Nghị định số 145/2020/NĐ-CP Quy định chi tiết và hướng dẫn thi hành một số điều của Bộ luật Lao động về điều kiện lao động và quan hệ lao động] 3. Thời gian làm việc để tính trợ cấp thôi việc, trợ cấp mất việc làm là tổng thời gian người lao động đã làm việc thực tế cho người sử dụng lao động trừ đi thời gian người lao động đã tham gia bảo hiểm thất nghiệp theo quy định của pháp luật về bảo hiểm thất nghiệp và thời gian làm việc đã được người sử dụng lao động chi trả trợ cấp thôi việc, trợ cấp mất việc làm, trong đó:","highlight":[]},{"label":"Đơn vị B: Nghị định 145/2020/NĐ-CP Điều 8 khoản 3 điểm a","text":"[Nghị định 145/2020/NĐ-CP Điều 8 khoản 3 điểm a] a) Tổng thời gian người lao động đã làm việc thực tế cho người sử dụng lao động bao gồm: thời gian người lao động đã trực tiếp làm việc; thời gian thử việc; thời gian được người sử dụng lao động cử đi học; thời gian nghỉ hưởng chế độ ốm đau, thai sản theo quy định của pháp luật về bảo hiểm xã hội; thời gian nghỉ việc để điều trị, phục hồi chức năng lao động khi bị tai nạn lao động, bệnh nghề nghiệp mà được người sử dụng lao động trả lương theo quy định của pháp luật về an toàn, vệ sinh lao động; thời gian nghỉ việc để thực hiện nghĩa vụ công dân theo quy định của pháp luật mà được người sử dụng lao động trả lương; thời gian ngừng việc không do lỗi của người lao động; thời gian nghỉ hằng tuần theo Điều 111, nghỉ việc hưởng nguyên lương theo Điều 112, Điều 113, Điều 114, khoản 1 Điều 115; thời gian thực hiện nhiệm vụ của tổ chức đại diện người lao động theo quy định tại khoản 2, khoản 3 Điều 176 và thời gian bị tạm đình chỉ công việc theo Điều 128 của Bộ luật Lao động.","highlight":["thời gian bị tạm đình chỉ công việc theo Điều 128 của Bộ luật Lao động"]},{"label":"Đáp án tham chiếu (phần trong ngoặc kép phải có trong A, B hoặc câu dẫn của chúng)","text":"\"Hết thời hạn tạm đình chỉ công việc, người sử dụng lao động phải nhận người lao động trở lại làm việc\", và nếu không bị kỷ luật thì \"được người sử dụng lao động trả đủ tiền lương cho thời gian bị tạm đình chỉ công việc\". Thời gian làm việc để tính trợ cấp thôi việc bao gồm \"thời gian bị tạm đình chỉ công việc theo Điều 128 của Bộ luật Lao động\".","highlight":[]},{"label":"Ngày hiệu lực và trạng thái","text":"Bộ Luật lao động số 45/2019/QH14: hiệu lực từ 2021-01-01 (theo vbpl.vn)\nNghị định số 145/2020/NĐ-CP Quy định chi tiết và hướng dẫn thi hành một số điều của Bộ luật Lao động về điều kiện lao động và quan hệ lao động: hiệu lực từ 2021-02-01 (theo vbpl.vn)\nTrạng thái máy tính tại 2026-11-11 (unit-status-v2):\nkhoản 2 Điều 128, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nkhoản 4 Điều 128, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nđiểm a khoản 3 Điều 8, Nghị định số 145/2020/NĐ-CP Quy định chi tiết và hướng dẫn thi hành một số điều của Bộ luật Lao động về điều kiện lao động và quan hệ lao động: còn hiệu lực","highlight":[]}]},{"id":"l08","group":"loại a","heading":"l08 · Người giúp việc gia đình báo trước 15 ngày xin nghỉ mà không nêu lý do thì có được trợ cấp...","question":"Câu hỏi có cần đơn vị B mới trả lời đủ không, và danh sách đáp án (A và B) có đủ, không thừa không?","fields":[{"label":"Câu hỏi (ngày áp dụng 2026-11-11, loại a: luật dẫn văn bản hướng dẫn)","text":"Người giúp việc gia đình báo trước 15 ngày xin nghỉ mà không nêu lý do thì có được trợ cấp thôi việc không, và mức tính thế nào?","highlight":[]},{"label":"Đơn vị A: Bộ luật Lao động 45/2019/QH14 Điều 46 khoản 1; Bộ luật Lao động 45/2019/QH14 Điều 46 khoản 3; Nghị định 145/2020/NĐ-CP Điều 89 khoản 1 điểm d","text":"[Bộ luật Lao động 45/2019/QH14 Điều 46 khoản 1] 1. Khi hợp đồng lao động chấm dứt theo quy định tại các khoản 1, 2, 3, 4, 6, 7, 9 và 10 Điều 34 của Bộ luật này thì người sử dụng lao động có trách nhiệm trả trợ cấp thôi việc cho người lao động đã làm việc thường xuyên cho mình từ đủ 12 tháng trở lên, mỗi năm làm việc được trợ cấp một nửa tháng tiền lương, trừ trường hợp đủ điều kiện hưởng lương hưu theo quy định của pháp luật về bảo hiểm xã hội và trường hợp quy định tại điểm e khoản 1 Điều 36 của Bộ luật này.\n[Bộ luật Lao động 45/2019/QH14 Điều 46 khoản 3] 3. Tiền lương để tính trợ cấp thôi việc là tiền lương bình quân của 06 tháng liền kề theo hợp đồng lao động trước khi người lao động thôi việc.\n[Nghị định 145/2020/NĐ-CP Điều 89 khoản 1 điểm d] d) Trong quá trình thực hiện hợp đồng lao động, mỗi bên có quyền đơn phương chấm dứt hợp đồng lao động mà không cần lý do nhưng phải báo trước ít nhất 15 ngày, trừ các trường hợp sau thì không phải báo trước: d1) Người lao động đơn phương chấm dứt hợp đồng lao động vì các lý do: Không được bố trí theo đúng công việc, địa điểm làm việc hoặc không được bảo đảm điều kiện làm việc theo thỏa thuận, trừ trường hợp quy định tại Điều 29 của Bộ luật Lao động; không được trả đủ lương hoặc trả lương không đúng thời hạn, trừ trường hợp quy định tại khoản 4 Điều 97 của Bộ luật Lao động; bị người sử dụng lao động ngược đãi, đánh đập hoặc có lời nói, hành vi nhục mạ, hành vi làm ảnh hưởng đến sức khỏe, nhân phẩm, danh dự; bị cưỡng bức lao động; bị quấy rối tình dục tại nơi làm việc; lao động nữ mang thai phải nghỉ việc theo quy định tại khoản 1 Điều 138 của Bộ luật Lao động; đủ tuổi nghỉ hưu theo quy định tại Điều 169 của Bộ luật Lao động trừ trường hợp các bên có thỏa thuận khác; người sử dụng lao động cung cấp thông tin không trung thực theo quy định tại khoản 1 Điều 16 của Bộ luật Lao động làm ảnh hưởng đến việc thực hiện hợp đồng lao động; d2) Người sử dụng lao động đơn phương chấm dứt hợp đồng lao động vì các lý do: Người lao động không có mặt tại nơi làm việc sau thời hạn quy định tại Điều 31 của Bộ luật Lao động; người lao động tự ý bỏ việc mà không có lý do chính đáng từ 05 ngày làm việc liên tục trở lên;","highlight":["mà không cần lý do nhưng phải báo trước ít nhất 15 ngày","mỗi năm làm việc được trợ cấp một nửa tháng tiền lương","từ đủ 12 tháng trở lên"]},{"label":"Câu dẫn hoặc tên Điều chứa các đơn vị trên (không thuộc gold, hiện cùng đơn vị trong ngữ cảnh)","text":"[Điều 46, Bộ Luật lao động số 45/2019/QH14] Điều 46. Trợ cấp thôi việc\n[khoản 1 Điều 89, Nghị định số 145/2020/NĐ-CP Quy định chi tiết và hướng dẫn thi hành một số điều của Bộ luật Lao động về điều kiện lao động và quan hệ lao động] 1. Quy định về hình thức hợp đồng lao động theo Điều 14 và khoản 1 Điều 162; nghĩa vụ cung cấp thông tin khi giao kết hợp đồng lao động theo Điều 16; nội dung hợp đồng lao động theo khoản 1 Điều 21; đơn phương chấm dứt hợp đồng lao động theo khoản 2 Điều 35, khoản 3 Điều 36 và khoản 2 Điều 162; nghĩa vụ khi đơn phương chấm dứt hợp đồng lao động trái pháp luật theo Điều 40, Điều 41; trợ cấp thôi việc theo Điều 46 của Bộ luật Lao động được thực hiện như sau:","highlight":[]},{"label":"Đơn vị B: Nghị định 145/2020/NĐ-CP Điều 89 khoản 1 điểm e","text":"[Nghị định 145/2020/NĐ-CP Điều 89 khoản 1 điểm e] e) Khi hợp đồng lao động chấm dứt theo quy định tại các khoản 1, 2, 3, 4, 6 và khoản 7 Điều 34 của Bộ luật Lao động và điểm d khoản này, người sử dụng lao động có trách nhiệm trả trợ cấp thôi việc cho người lao động theo quy định tại Điều 46 của Bộ luật Lao động; hai bên có trách nhiệm thanh toán đầy đủ các khoản tiền có liên quan đến quyền lợi của mỗi bên.","highlight":["điểm d khoản này, người sử dụng lao động có trách nhiệm trả trợ cấp thôi việc"]},{"label":"Đáp án tham chiếu (phần trong ngoặc kép phải có trong A, B hoặc câu dẫn của chúng)","text":"Mỗi bên \"có quyền đơn phương chấm dứt hợp đồng lao động mà không cần lý do nhưng phải báo trước ít nhất 15 ngày\". Theo điểm e, trong trường hợp này \"người sử dụng lao động có trách nhiệm trả trợ cấp thôi việc cho người lao động theo quy định tại Điều 46 của Bộ luật Lao động\". Mức là \"mỗi năm làm việc được trợ cấp một nửa tháng tiền lương\", tính trên \"tiền lương bình quân của 06 tháng liền kề theo hợp đồng lao động trước khi người lao động thôi việc\".","highlight":[]},{"label":"Ngày hiệu lực và trạng thái","text":"Bộ Luật lao động số 45/2019/QH14: hiệu lực từ 2021-01-01 (theo vbpl.vn)\nNghị định số 145/2020/NĐ-CP Quy định chi tiết và hướng dẫn thi hành một số điều của Bộ luật Lao động về điều kiện lao động và quan hệ lao động: hiệu lực từ 2021-02-01 (theo vbpl.vn)\nTrạng thái máy tính tại 2026-11-11 (unit-status-v2):\nkhoản 1 Điều 46, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nkhoản 3 Điều 46, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nđiểm d khoản 1 Điều 89, Nghị định số 145/2020/NĐ-CP Quy định chi tiết và hướng dẫn thi hành một số điều của Bộ luật Lao động về điều kiện lao động và quan hệ lao động: còn hiệu lực\nđiểm e khoản 1 Điều 89, Nghị định số 145/2020/NĐ-CP Quy định chi tiết và hướng dẫn thi hành một số điều của Bộ luật Lao động về điều kiện lao động và quan hệ lao động: còn hiệu lực","highlight":[]}]},{"id":"l09","group":"loại a","heading":"l09 · Chủ nhà cho người giúp việc nghỉ ngay mà không báo trước và không có lý do hợp lệ thì phải...","question":"Câu hỏi có cần đơn vị B mới trả lời đủ không, và danh sách đáp án (A và B) có đủ, không thừa không?","fields":[{"label":"Câu hỏi (ngày áp dụng 2026-11-11, loại a: luật dẫn văn bản hướng dẫn)","text":"Chủ nhà cho người giúp việc nghỉ ngay mà không báo trước và không có lý do hợp lệ thì phải bồi thường những gì?","highlight":[]},{"label":"Đơn vị A: Bộ luật Lao động 45/2019/QH14 Điều 41 khoản 1","text":"[Bộ luật Lao động 45/2019/QH14 Điều 41 khoản 1] 1. Phải nhận người lao động trở lại làm việc theo hợp đồng lao động đã giao kết; phải trả tiền lương, đóng bảo hiểm xã hội, bảo hiểm y tế, bảo hiểm thất nghiệp trong những ngày người lao động không được làm việc và phải trả thêm cho người lao động một khoản tiền ít nhất bằng 02 tháng tiền lương theo hợp đồng lao động. Sau khi được nhận lại làm việc, người lao động hoàn trả cho người sử dụng lao động các khoản tiền trợ cấp thôi việc, trợ cấp mất việc làm nếu đã nhận của người sử dụng lao động. Trường hợp không còn vị trí, công việc đã giao kết trong hợp đồng lao động mà người lao động vẫn muốn làm việc thì hai bên thỏa thuận để sửa đổi, bổ sung hợp đồng lao động. Trường hợp vi phạm quy định về thời hạn báo trước quy định tại khoản 2 Điều 36 của Bộ luật này thì phải trả một khoản tiền tương ứng với tiền lương theo hợp đồng lao động trong những ngày không báo trước.","highlight":["trong những ngày không báo trước","ít nhất bằng 02 tháng tiền lương theo hợp đồng lao động"]},{"label":"Câu dẫn hoặc tên Điều chứa các đơn vị trên (không thuộc gold, hiện cùng đơn vị trong ngữ cảnh)","text":"[Điều 41, Bộ Luật lao động số 45/2019/QH14] Điều 41. Nghĩa vụ của người sử dụng lao động khi đơn phương chấm dứt hợp đồng lao động trái pháp luật\n[khoản 1 Điều 89, Nghị định số 145/2020/NĐ-CP Quy định chi tiết và hướng dẫn thi hành một số điều của Bộ luật Lao động về điều kiện lao động và quan hệ lao động] 1. Quy định về hình thức hợp đồng lao động theo Điều 14 và khoản 1 Điều 162; nghĩa vụ cung cấp thông tin khi giao kết hợp đồng lao động theo Điều 16; nội dung hợp đồng lao động theo khoản 1 Điều 21; đơn phương chấm dứt hợp đồng lao động theo khoản 2 Điều 35, khoản 3 Điều 36 và khoản 2 Điều 162; nghĩa vụ khi đơn phương chấm dứt hợp đồng lao động trái pháp luật theo Điều 40, Điều 41; trợ cấp thôi việc theo Điều 46 của Bộ luật Lao động được thực hiện như sau:","highlight":[]},{"label":"Đơn vị B: Nghị định 145/2020/NĐ-CP Điều 89 khoản 1 điểm đ","text":"[Nghị định 145/2020/NĐ-CP Điều 89 khoản 1 điểm đ] đ) Đơn phương chấm dứt hợp đồng lao động trái pháp luật là trường hợp đơn phương chấm dứt hợp đồng lao động không đúng quy định tại điểm d khoản này. Khi đơn phương chấm dứt hợp đồng lao động trái pháp luật thì người lao động có nghĩa vụ thực hiện quy định tại Điều 40, người sử dụng lao động có nghĩa vụ thực hiện quy định tại Điều 41 của Bộ luật Lao động. Trường hợp người sử dụng lao động vi phạm thời hạn báo trước theo điểm d khoản này thì phải trả cho người lao động một khoản tiền tương ứng với tiền lương theo hợp đồng lao động trong những ngày không báo trước;","highlight":["không đúng quy định tại điểm d khoản này","trong những ngày không báo trước"]},{"label":"Đáp án tham chiếu (phần trong ngoặc kép phải có trong A, B hoặc câu dẫn của chúng)","text":"\"Trường hợp người sử dụng lao động vi phạm thời hạn báo trước theo điểm d khoản này thì phải trả cho người lao động một khoản tiền tương ứng với tiền lương theo hợp đồng lao động trong những ngày không báo trước\", và chấm dứt trái pháp luật thì \"người sử dụng lao động có nghĩa vụ thực hiện quy định tại Điều 41\", gồm \"phải trả thêm cho người lao động một khoản tiền ít nhất bằng 02 tháng tiền lương theo hợp đồng lao động\".","highlight":[]},{"label":"Ngày hiệu lực và trạng thái","text":"Bộ Luật lao động số 45/2019/QH14: hiệu lực từ 2021-01-01 (theo vbpl.vn)\nNghị định số 145/2020/NĐ-CP Quy định chi tiết và hướng dẫn thi hành một số điều của Bộ luật Lao động về điều kiện lao động và quan hệ lao động: hiệu lực từ 2021-02-01 (theo vbpl.vn)\nTrạng thái máy tính tại 2026-11-11 (unit-status-v2):\nkhoản 1 Điều 41, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nđiểm đ khoản 1 Điều 89, Nghị định số 145/2020/NĐ-CP Quy định chi tiết và hướng dẫn thi hành một số điều của Bộ luật Lao động về điều kiện lao động và quan hệ lao động: còn hiệu lực","highlight":[]},{"label":"Đơn vị liên quan agent tìm thấy (ngoài gold)","text":"[điểm d khoản 1 Điều 89, Nghị định số 145/2020/NĐ-CP Quy định chi tiết và hướng dẫn thi hành một số điều của Bộ luật Lao động về điều kiện lao động và quan hệ lao động] d) Trong quá trình thực hiện hợp đồng lao động, mỗi bên có quyền đơn phương chấm dứt hợp đồng lao động mà không cần lý do nhưng phải báo trước ít nhất 15 ngày, trừ các trường hợp sau thì không phải báo trước:\nd1) Người lao động đơn phương chấm dứt hợp đồng lao động vì các lý do: Không được bố trí theo đúng công việc, địa điểm làm việc hoặc không được bảo đảm điều kiện làm việc theo thỏa thuận, trừ trường hợp quy định tại Điều 29 của Bộ luật Lao động; không được trả đủ lương hoặc trả lương không đúng thời hạn, trừ trường hợp quy định tại khoản 4 Điều 97 của Bộ luật Lao động; bị người sử dụng lao động ngược đãi, đánh đập hoặc có lời nói, hành vi nhục mạ, hành vi làm ảnh hưởng đến sức khỏe, nhân phẩm, danh dự; bị cưỡng bức lao động; bị quấy rối tình dục tại nơi làm việc; lao động nữ mang thai phải nghỉ việc theo quy định tại khoản 1 Điều 138 của Bộ luật Lao động; đủ tuổi nghỉ hưu theo quy định tại Điều 169 của Bộ luật Lao động trừ trường hợp các bên có thỏa thuận khác; người sử dụng lao động cung cấp thông tin không trung thực theo quy định tại khoản 1 Điều 16 của Bộ luật Lao động làm ảnh hưởng đến việc thực hiện hợp đồng lao động;\nd2) Người sử dụng lao động đơn phương chấm dứt hợp đồng lao động vì các lý do: Người lao động không có mặt tại nơi làm việc sau thời hạn quy định tại Điều 31 của Bộ luật Lao động; người lao động tự ý bỏ việc mà không có lý do chính đáng từ 05 ngày làm việc liên tục trở lên;\n[khoản 2 Điều 41, Bộ Luật lao động số 45/2019/QH14] 2. Trường hợp người lao động không muốn tiếp tục làm việc thì ngoài khoản tiền phải trả quy định tại khoản 1 Điều này người sử dụng lao động phải trả trợ cấp thôi việc theo quy định tại Điều 46 của Bộ luật này để chấm dứt hợp đồng lao động.","highlight":["phải báo trước ít nhất 15 ngày"]}]},{"id":"l10","group":"loại b","heading":"l10 · Nữ nhân viên nghỉ thai sản xong quay lại làm nhưng công ty không cho làm lại việc cũ, cũng...","question":"Câu hỏi có cần đơn vị B mới trả lời đủ không, và danh sách đáp án (A và B) có đủ, không thừa không?","fields":[{"label":"Câu hỏi (ngày áp dụng 2026-11-11, loại b: chế tài, thẩm quyền xử phạt)","text":"Nữ nhân viên nghỉ thai sản xong quay lại làm nhưng công ty không cho làm lại việc cũ, cũng không bố trí việc khác với mức lương tương đương. Công ty có bị phạt tiền không và mức phạt bao nhiêu?","highlight":[]},{"label":"Đơn vị A: Bộ luật Lao động 45/2019/QH14 Điều 140","text":"[Bộ luật Lao động 45/2019/QH14 Điều 140] Điều 140. Bảo đảm việc làm cho lao động nghỉ thai sản Lao động được bảo đảm việc làm cũ khi trở lại làm việc sau khi nghỉ hết thời gian theo quy định tại các khoản 1, 3 và 5 Điều 139 của Bộ luật này mà không bị cắt giảm tiền lương và quyền, lợi ích so với trước khi nghỉ thai sản; trường hợp việc làm cũ không còn thì người sử dụng lao động phải bố trí việc làm khác cho họ với mức lương không thấp hơn mức lương trước khi nghỉ thai sản.","highlight":["với mức lương không thấp hơn mức lương trước khi nghỉ thai sản"]},{"label":"Câu dẫn hoặc tên Điều chứa các đơn vị trên (không thuộc gold, hiện cùng đơn vị trong ngữ cảnh)","text":"[khoản 2 Điều 26, Nghị định số 283/2026/NĐ-CP Quy định xử phạt vi phạm hành chính trong lĩnh vực lao động, bảo hiểm xã hội, người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng] 2. Phạt tiền từ 10.000.000 đồng đến 20.000.000 đồng đối với người sử dụng lao động có một trong các hành vi sau đây:","highlight":["Phạt tiền từ 10.000.000 đồng đến 20.000.000 đồng"]},{"label":"Đơn vị B: Nghị định 283/2026/NĐ-CP Điều 26 khoản 2 điểm e","text":"[Nghị định 283/2026/NĐ-CP Điều 26 khoản 2 điểm e] e) Không bảo đảm việc làm cho người lao động theo quy định tại Điều 140 của Bộ luật Lao động;","highlight":["Không bảo đảm việc làm cho người lao động theo quy định tại Điều 140 của Bộ luật Lao động"]},{"label":"Đáp án tham chiếu (phần trong ngoặc kép phải có trong A, B hoặc câu dẫn của chúng)","text":"Lao động nghỉ thai sản được bảo đảm việc làm cũ, \"không bị cắt giảm tiền lương và quyền, lợi ích so với trước khi nghỉ thai sản\"; nếu việc cũ không còn thì phải \"bố trí việc làm khác cho họ với mức lương không thấp hơn mức lương trước khi nghỉ thai sản\". Hành vi \"Không bảo đảm việc làm cho người lao động theo quy định tại Điều 140 của Bộ luật Lao động\" bị \"Phạt tiền từ 10.000.000 đồng đến 20.000.000 đồng đối với người sử dụng lao động\".","highlight":[]},{"label":"Ngày hiệu lực và trạng thái","text":"Bộ Luật lao động số 45/2019/QH14: hiệu lực từ 2021-01-01 (theo vbpl.vn)\nNghị định số 283/2026/NĐ-CP Quy định xử phạt vi phạm hành chính trong lĩnh vực lao động, bảo hiểm xã hội, người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng: hiệu lực từ 2026-09-10 (theo vbpl.vn)\nTrạng thái máy tính tại 2026-11-11 (unit-status-v2):\nĐiều 140, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nđiểm e khoản 2 Điều 26, Nghị định số 283/2026/NĐ-CP Quy định xử phạt vi phạm hành chính trong lĩnh vực lao động, bảo hiểm xã hội, người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng: còn hiệu lực","highlight":[]}]},{"id":"l11","group":"loại b","heading":"l11 · Công ty bắt nhân viên tăng ca mà không hỏi ý kiến họ và không thuộc trường hợp khẩn cấp th...","question":"Câu hỏi có cần đơn vị B mới trả lời đủ không, và danh sách đáp án (A và B) có đủ, không thừa không?","fields":[{"label":"Câu hỏi (ngày áp dụng 2026-11-11, loại b: chế tài, thẩm quyền xử phạt)","text":"Công ty bắt nhân viên tăng ca mà không hỏi ý kiến họ và không thuộc trường hợp khẩn cấp thì bị phạt thế nào?","highlight":[]},{"label":"Đơn vị A: Bộ luật Lao động 45/2019/QH14 Điều 108 khoản 1; Bộ luật Lao động 45/2019/QH14 Điều 108 khoản 2","text":"[Bộ luật Lao động 45/2019/QH14 Điều 108 khoản 1] 1. Thực hiện lệnh động viên, huy động bảo đảm nhiệm vụ quốc phòng, an ninh theo quy định của pháp luật;\n[Bộ luật Lao động 45/2019/QH14 Điều 108 khoản 2] 2. Thực hiện các công việc nhằm bảo vệ tính mạng con người, tài sản của cơ quan, tổ chức, cá nhân trong phòng ngừa, khắc phục hậu quả thiên tai, hỏa hoạn, dịch bệnh nguy hiểm và thảm họa, trừ trường hợp có nguy cơ ảnh hưởng đến tính mạng, sức khỏe của người lao động theo quy định của pháp luật về an toàn, vệ sinh lao động.","highlight":[]},{"label":"Câu dẫn hoặc tên Điều chứa các đơn vị trên (không thuộc gold, hiện cùng đơn vị trong ngữ cảnh)","text":"[Điều 108, Bộ Luật lao động số 45/2019/QH14] Điều 108. Làm thêm giờ trong trường hợp đặc biệt\nNgười sử dụng lao động có quyền yêu cầu người lao động làm thêm giờ vào bất kỳ ngày nào mà không bị giới hạn về số giờ làm thêm theo quy định tại Điều 107 của Bộ luật này và người lao động không được từ chối trong trường hợp sau đây:\n[khoản 3 Điều 24, Nghị định số 283/2026/NĐ-CP Quy định xử phạt vi phạm hành chính trong lĩnh vực lao động, bảo hiểm xã hội, người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng] 3. Phạt tiền từ 20.000.000 đồng đến 25.000.000 đồng đối với người sử dụng lao động có một trong các hành vi sau đây:","highlight":["Phạt tiền từ 20.000.000 đồng đến 25.000.000 đồng"]},{"label":"Đơn vị B: Nghị định 283/2026/NĐ-CP Điều 24 khoản 3 điểm b","text":"[Nghị định 283/2026/NĐ-CP Điều 24 khoản 3 điểm b] b) Huy động người lao động làm thêm giờ mà không được sự đồng ý của người lao động, trừ trường hợp theo quy định tại Điều 108 của Bộ luật Lao động.","highlight":["Huy động người lao động làm thêm giờ mà không được sự đồng ý của người lao động, trừ trường hợp theo quy định tại Điều 108"]},{"label":"Đáp án tham chiếu (phần trong ngoặc kép phải có trong A, B hoặc câu dẫn của chúng)","text":"Hành vi \"Huy động người lao động làm thêm giờ mà không được sự đồng ý của người lao động, trừ trường hợp theo quy định tại Điều 108 của Bộ luật Lao động\" bị \"Phạt tiền từ 20.000.000 đồng đến 25.000.000 đồng đối với người sử dụng lao động\". Các trường hợp ngoại lệ ở Điều 108 gồm \"Thực hiện lệnh động viên\" và công việc bảo vệ tính mạng con người, tài sản trước thiên tai, hỏa hoạn, dịch bệnh.","highlight":[]},{"label":"Ngày hiệu lực và trạng thái","text":"Bộ Luật lao động số 45/2019/QH14: hiệu lực từ 2021-01-01 (theo vbpl.vn)\nNghị định số 283/2026/NĐ-CP Quy định xử phạt vi phạm hành chính trong lĩnh vực lao động, bảo hiểm xã hội, người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng: hiệu lực từ 2026-09-10 (theo vbpl.vn)\nTrạng thái máy tính tại 2026-11-11 (unit-status-v2):\nkhoản 1 Điều 108, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nkhoản 2 Điều 108, Bộ Luật lao động số 45/2019/QH14: còn hiệu lực\nđiểm b khoản 3 Điều 24, Nghị định số 283/2026/NĐ-CP Quy định xử phạt vi phạm hành chính trong lĩnh vực lao động, bảo hiểm xã hội, người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng: còn hiệu lực","highlight":[]}]},{"id":"l12","group":"loại b","heading":"l12 · Công ty cho thuê lại lao động không phối hợp với bên thuê trong việc điều tra tai nạn làm ...","question":"Câu hỏi có cần đơn vị B mới trả lời đủ không, và danh sách đáp án (A và B) có đủ, không thừa không?","fields":[{"label":"Câu hỏi (ngày áp dụng 2026-11-11, loại b: chế tài, thẩm quyền xử phạt)","text":"Công ty cho thuê lại lao động không phối hợp với bên thuê trong việc điều tra tai nạn làm một lao động thuê lại bị thương nặng. Ai có quyền xử phạt hành vi này?","highlight":["Ai có quyền xử phạt"]},{"label":"Đơn vị A: Nghị định 283/2026/NĐ-CP Điều 19 khoản 3 điểm c","text":"[Nghị định 283/2026/NĐ-CP Điều 19 khoản 3 điểm c] c) Không phối hợp với bên thuê lại lao động trong việc điều tra tai nạn lao động làm bị thương nặng một người lao động thuê lại theo quy định của pháp luật;","highlight":[]},{"label":"Câu dẫn hoặc tên Điều chứa các đơn vị trên (không thuộc gold, hiện cùng đơn vị trong ngữ cảnh)","text":"[khoản 3 Điều 19, Nghị định số 283/2026/NĐ-CP Quy định xử phạt vi phạm hành chính trong lĩnh vực lao động, bảo hiểm xã hội, người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng] 3. Phạt tiền từ 1.000.000 đồng đến 3.000.000 đồng đối với doanh nghiệp cho thuê lại lao động có một trong các hành vi sau đây:\n[Điều 63, Nghị định số 283/2026/NĐ-CP Quy định xử phạt vi phạm hành chính trong lĩnh vực lao động, bảo hiểm xã hội, người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng] Điều 63. Nguyên tắc xác định và phân định thẩm quyền xử phạt","highlight":[]},{"label":"Đơn vị B: Nghị định 283/2026/NĐ-CP Điều 63 khoản 9","text":"[Nghị định 283/2026/NĐ-CP Điều 63 khoản 9] 9. Cục trưởng Cục Việc làm có thẩm quyền xử phạt vi phạm hành chính và áp dụng các biện pháp khắc phục hậu quả đối với các hành vi vi phạm hành chính về việc làm, an toàn lao động, bảo hiểm thất nghiệp, thời giờ làm việc, thời giờ nghỉ ngơi tại các mục 1, 3 chương II; khoản 2 Điều 18; các điểm c, d, đ, e khoản 3 Điều 19; khoản 5 Điều 19; các Điều 20, 24, 26, 27, 28, 45, 46, 47 và Điều 48 của Nghị định này theo thẩm quyền quy định tại khoản 2 Điều 61 của Nghị định này và chức năng, nhiệm vụ, quyền hạn được giao.","highlight":["các điểm c, d, đ, e khoản 3 Điều 19"]},{"label":"Đáp án tham chiếu (phần trong ngoặc kép phải có trong A, B hoặc câu dẫn của chúng)","text":"Hành vi \"Không phối hợp với bên thuê lại lao động trong việc điều tra tai nạn lao động làm bị thương nặng một người lao động thuê lại\" bị \"Phạt tiền từ 1.000.000 đồng đến 3.000.000 đồng đối với doanh nghiệp cho thuê lại lao động\". \"Cục trưởng Cục Việc làm có thẩm quyền xử phạt vi phạm hành chính\" đối với \"các điểm c, d, đ, e khoản 3 Điều 19\".","highlight":[]},{"label":"Ngày hiệu lực và trạng thái","text":"Nghị định số 283/2026/NĐ-CP Quy định xử phạt vi phạm hành chính trong lĩnh vực lao động, bảo hiểm xã hội, người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng: hiệu lực từ 2026-09-10 (theo vbpl.vn)\nTrạng thái máy tính tại 2026-11-11 (unit-status-v2):\nđiểm c khoản 3 Điều 19, Nghị định số 283/2026/NĐ-CP Quy định xử phạt vi phạm hành chính trong lĩnh vực lao động, bảo hiểm xã hội, người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng: còn hiệu lực\nkhoản 9 Điều 63, Nghị định số 283/2026/NĐ-CP Quy định xử phạt vi phạm hành chính trong lĩnh vực lao động, bảo hiểm xã hội, người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng: còn hiệu lực","highlight":[]},{"label":"Đơn vị liên quan agent tìm thấy (ngoài gold)","text":"[khoản 2 Điều 63, Nghị định số 283/2026/NĐ-CP Quy định xử phạt vi phạm hành chính trong lĩnh vực lao động, bảo hiểm xã hội, người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng] 2. Chủ tịch Ủy ban nhân dân các cấp có thẩm quyền xử phạt vi phạm hành chính và áp dụng các biện pháp khắc phục hậu quả đối với các hành vi vi phạm hành chính quy định tại Chương II, Chương III và Chương IV của Nghị định này theo thẩm quyền quy định tại Điều 55 của Nghị định này và chức năng, nhiệm vụ, quyền hạn được giao.\n[khoản 8 Điều 63, Nghị định số 283/2026/NĐ-CP Quy định xử phạt vi phạm hành chính trong lĩnh vực lao động, bảo hiểm xã hội, người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng] 8. Giám đốc Sở Nội vụ có thẩm quyền xử phạt vi phạm hành chính và áp dụng các biện pháp khắc phục hậu quả đối với các hành vi vi phạm hành chính quy định tại Chương II, Chương III, Chương IV của Nghị định này theo thẩm quyền quy định tại khoản 1 Điều 61 của Nghị định này và chức năng, nhiệm vụ, quyền hạn được giao.\n[khoản 10 Điều 63, Nghị định số 283/2026/NĐ-CP Quy định xử phạt vi phạm hành chính trong lĩnh vực lao động, bảo hiểm xã hội, người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng] 10. Trưởng đoàn kiểm tra do Cục trưởng Cục Việc làm thành lập có thẩm quyền xử phạt vi phạm hành chính và áp dụng các biện pháp khắc phục hậu quả đối với các hành vi vi phạm hành chính về việc làm, an toàn lao động, bảo hiểm thất nghiệp, thời giờ làm việc, thời giờ nghỉ ngơi quy định tại các mục 1, 3 chương II; khoản 2 Điều 18; các điểm c, d, đ, e khoản 3 Điều 19; khoản 5 Điều 19; các Điều 20, 24, 26, 27, 28, 45, 46, 47 và Điều 48 của Nghị định này theo thẩm quyền quy định tại khoản 4 Điều 61 của Nghị định này và chức năng, nhiệm vụ, quyền hạn được giao.\n[khoản 13 Điều 63, Nghị định số 283/2026/NĐ-CP Quy định xử phạt vi phạm hành chính trong lĩnh vực lao động, bảo hiểm xã hội, người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng] 13. Trưởng đoàn kiểm tra do Bộ trưởng Bộ Nội vụ thành lập có thẩm quyền xử phạt vi phạm hành chính và áp dụng biện pháp khắc phục hậu quả đối với các hành vi vi phạm hành chính quy định tại Chương II, Chương III và Chương IV của Nghị định này theo thẩm quyền quy định tại khoản 3 Điều 61 của Nghị định này và chức năng, nhiệm vụ, quyền hạn được giao.","highlight":["các điểm c, d, đ, e khoản 3 Điều 19","Chương II"]}]},{"id":"l13","group":"loại b","heading":"l13 · Doanh nghiệp đưa người lao động đi làm việc ở nước ngoài cho bên khác mượn giấy phép hoạt ...","question":"Câu hỏi có cần đơn vị B mới trả lời đủ không, và danh sách đáp án (A và B) có đủ, không thừa không?","fields":[{"label":"Câu hỏi (ngày áp dụng 2026-11-11, loại b: chế tài, thẩm quyền xử phạt)","text":"Doanh nghiệp đưa người lao động đi làm việc ở nước ngoài cho bên khác mượn giấy phép hoạt động dịch vụ của mình thì bị phạt thế nào, và bản quyết định xử phạt phải gửi cho cơ quan nào?","highlight":[]},{"label":"Đơn vị A: Nghị định 283/2026/NĐ-CP Điều 49 khoản 10 điểm b","text":"[Nghị định 283/2026/NĐ-CP Điều 49 khoản 10 điểm b] b) Cho tổ chức, cá nhân khác sử dụng Giấy phép hoạt động dịch vụ đưa người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng của doanh nghiệp mình để đưa người lao động Việt Nam đi làm việc ở nước ngoài;","highlight":["Cho tổ chức, cá nhân khác sử dụng Giấy phép hoạt động dịch vụ"]},{"label":"Câu dẫn hoặc tên Điều chứa các đơn vị trên (không thuộc gold, hiện cùng đơn vị trong ngữ cảnh)","text":"[khoản 10 Điều 49, Nghị định số 283/2026/NĐ-CP Quy định xử phạt vi phạm hành chính trong lĩnh vực lao động, bảo hiểm xã hội, người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng] 10. Phạt tiền từ 180.000.000 đồng đến 200.000.000 đồng khi có một trong các hành vi sau đây:\n[Điều 64, Nghị định số 283/2026/NĐ-CP Quy định xử phạt vi phạm hành chính trong lĩnh vực lao động, bảo hiểm xã hội, người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng] Điều 64. Thi hành các hình thức xử phạt vi phạm hành chính","highlight":["Phạt tiền từ 180.000.000 đồng đến 200.000.000 đồng"]},{"label":"Đơn vị B: Nghị định 283/2026/NĐ-CP Điều 64 khoản 2","text":"[Nghị định 283/2026/NĐ-CP Điều 64 khoản 2] 2. Người ra quyết định xử phạt vi phạm hành chính gửi 01 bản quyết định xử phạt đến Bộ trưởng Bộ Nội vụ đối với hành vi vi phạm quy định tại điểm a, b, c, e, h khoản 5; khoản 6; điểm a, b, đ, e, g, h khoản 9; điểm a, b, c khoản 10 Điều 49 của Nghị định này.","highlight":["gửi 01 bản quyết định xử phạt đến Bộ trưởng Bộ Nội vụ","điểm a, b, c khoản 10 Điều 49"]},{"label":"Đáp án tham chiếu (phần trong ngoặc kép phải có trong A, B hoặc câu dẫn của chúng)","text":"Hành vi \"Cho tổ chức, cá nhân khác sử dụng Giấy phép hoạt động dịch vụ đưa người lao động Việt Nam đi làm việc ở nước ngoài\" bị \"Phạt tiền từ 180.000.000 đồng đến 200.000.000 đồng\". Người ra quyết định xử phạt \"gửi 01 bản quyết định xử phạt đến Bộ trưởng Bộ Nội vụ\" đối với hành vi tại \"điểm a, b, c khoản 10 Điều 49\".","highlight":[]},{"label":"Ngày hiệu lực và trạng thái","text":"Nghị định số 283/2026/NĐ-CP Quy định xử phạt vi phạm hành chính trong lĩnh vực lao động, bảo hiểm xã hội, người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng: hiệu lực từ 2026-09-10 (theo vbpl.vn)\nTrạng thái máy tính tại 2026-11-11 (unit-status-v2):\nđiểm b khoản 10 Điều 49, Nghị định số 283/2026/NĐ-CP Quy định xử phạt vi phạm hành chính trong lĩnh vực lao động, bảo hiểm xã hội, người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng: còn hiệu lực\nkhoản 2 Điều 64, Nghị định số 283/2026/NĐ-CP Quy định xử phạt vi phạm hành chính trong lĩnh vực lao động, bảo hiểm xã hội, người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng: còn hiệu lực","highlight":[]}]},{"id":"l14","group":"loại b","heading":"l14 · Cục trưởng Cục Tiền lương và Bảo hiểm xã hội được phạt tiền tối đa bao nhiêu, và quyền xử ...","question":"Câu hỏi có cần đơn vị B mới trả lời đủ không, và danh sách đáp án (A và B) có đủ, không thừa không?","fields":[{"label":"Câu hỏi (ngày áp dụng 2026-11-11, loại b: chế tài, thẩm quyền xử phạt)","text":"Cục trưởng Cục Tiền lương và Bảo hiểm xã hội được phạt tiền tối đa bao nhiêu, và quyền xử phạt đó có hiệu lực từ khi nào?","highlight":[]},{"label":"Đơn vị A: Nghị định 283/2026/NĐ-CP Điều 61 khoản 2 điểm b","text":"[Nghị định 283/2026/NĐ-CP Điều 61 khoản 2 điểm b] b) Phạt tiền đến 75.000.000 đồng đối với hành vi vi phạm trong lĩnh vực lao đ
