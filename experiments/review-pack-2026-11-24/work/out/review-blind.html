<script>
"use strict";
const PACK = JSON.parse(document.getElementById('pack-data').textContent);
const BLIND = PACK.mode === 'blind';
const $ = id => document.getElementById(id);
const CONTENT = ['action', 'object', 'conditions', 'exceptions', 'quantities', 'deadlines', 'outcome'];
const MAX_NORMS = 8;
const MOD_VI = {obligation: 'Nghĩa vụ (phải)', prohibition: 'Cấm (không được)', entitlement: 'Quyền (có quyền)', permission: 'Cho phép (được)', unknown: 'Chưa rõ'};
const state = {tab: null, reviewer: '', filter: 'all', data: {}};
const tasks = PACK.order.map(k => PACK.tasks[k]);

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v);

  for (const kid of kids.flat()) if (kid != null) e.append(kid);
  return e;
}
function marked(text, phrases) {
  const out = document.createDocumentFragment();
  const ranges = [];
  for (const p of phrases || []) {
    if (!p) continue;
    let i = text.indexOf(p);
    while (i >= 0) { ranges.push([i, i + p.length]); i = text.indexOf(p, i + p.length); }
  }
  ranges.sort((a, b) => a[0] - b[0]);
  const merged = [];
  for (const r of ranges) { const l = merged[merged.length - 1]; if (l && r[0] <= l[1]) l[1] = Math.max(l[1], r[1]); else merged.push(r.slice()); }
  let pos = 0;
  for (const [s, e] of merged) { if (s > pos) out.append(text.slice(pos, s)); out.append(el('mark', {text: text.slice(s, e)})); pos = e; }
  out.append(text.slice(pos));
  return out;
}
const clone = v => JSON.parse(JSON.stringify(v));
const taskOf = key => PACK.tasks[key];
const itemsOf = key => taskOf(key).items;

function storeKey(task) { return `rp:v1:${PACK.pack}:${task}:${state.reviewer.trim()}`; }

  let d = null;
  try { d = JSON.parse(localStorage.getItem(storeKey(task)) || 'null'); } catch (e) { d = null; }

  try { localStorage.setItem(storeKey(state.tab), JSON.stringify(state.data[state.tab])); $('saved').textContent = 'Đã lưu trong trình duyệt ' + new Date().toLocaleTimeString('vi-VN'); }

function peek(task, id) { return state.data[task].items[id]; }

function goldNorms(it) {
  const draft = BLIND ? [] : (it.draft || []);
  return clone(draft).map(n => ({modality: n.modality || 'unknown', cue: n.cue || n.modality_cue || '', slots: n.slots || {}}));
}
function goldStateNorms(task, it) {
  const st = stOf(task, it.id);
  if (!st.norms) st.norms = goldNorms(it);
  return st.norms;
}
function validateNorm(n, sentence) {
  const errors = {}; let any = false;
  if (!PACK.modalities.includes(n.modality)) errors.modality = 'Chọn tính quy phạm.';
  if (n.cue && !sentence.includes(n.cue)) errors.cue = 'Từ tình thái phải là cụm chép nguyên văn từ câu này.';
  for (const s of PACK.slots) {
    const v = (n.slots[s] || '').trim();
    if (!v) continue;
    if (!sentence.includes(v)) errors[s] = 'Không phải cụm nguyên văn của câu này.';
    if (CONTENT.includes(s)) any = true;
  }
  if (!any) errors.content = 'Điền ít nhất một ô nội dung (hành vi, đối tượng, điều kiện, ngoại lệ, định lượng, thời hạn hoặc kết quả).';
  return errors;
}
function goldProblems(task, it) {
  const norms = goldStateNorms(task, it);
  if (norms.length > MAX_NORMS) return [`Tối đa ${MAX_NORMS} quy phạm mỗi câu.`];
  const out = [];
  norms.forEach((n, i) => { const e = validateNorm(n, it.sentence); if (Object.keys(e).length) out.push(`Quy phạm ${i + 1}: ` + Object.values(e)[0]); });

function cleanNorm(n) {

}
function normSig(list) { return JSON.stringify(list.map(cleanNorm).map(n => [n.modality, n.cue, Object.entries(n.slots).sort()]).sort()); }
function goldChanged(task, it) {
  if (BLIND) return null;
  const st = peek(task, it.id);
  if (!st || !st.norms) return false;
  return normSig(st.norms) !== normSig(goldNorms(it));

function isDone(task, it) { const st = state.data[task] && state.data[task].items[it.id]; return !!(st && st.done); }
function lowConf(task, it) { const c = task === 'gold' ? it.confidence : (it.suggestion && it.suggestion.confidence); return !BLIND && c === 'thấp'; }
function changed(task, it) {

}

  const cands = ids.filter(id => dir > 0 ? order(id) > co : order(id) < co);
  const pick = dir > 0 ? cands[0] : cands[cands.length - 1];
  if (pick) go(pick); else { renderAll(); say(dir > 0 ? 'Đã đến mục cuối của bộ lọc này.' : 'Đây là mục đầu tiên của bộ lọc này.'); }
}
function say(msg) { $('live').textContent = msg; }

// ---- rendering ----
function renderTabs() {
  const tabs = $('tabs'); tabs.replaceChildren();
  tasks.forEach(t => {
    const done = t.items.filter(i => isDone(t.task, i)).length;
    tabs.append(el('button', {type: 'button', role: 'tab', id: 'tab-' + t.task, 'aria-selected': String(t.task === state.tab), tabindex: t.task === state.tab ? '0' : '-1',
      onclick: () => switchTab(t.task)}, t.short || t.title, el('span', {class: 'cnt', text: `${done}/${t.items.length}`})));
  });
}
function renderProgress() {
  const t = taskOf(state.tab);
  const done = t.items.filter(i => isDone(state.tab, i)).length, total = t.items.length;
  const pct = total ? Math.round(100 * done / total) : 0;
  $('pfill').style.width = pct + '%';
  $('pbar').setAttribute('aria-valuemax', total); $('pbar').setAttribute('aria-valuenow', done);
  $('ptext').textContent = `Đã xong ${done}/${total} (${pct}%)`;
  const sel = $('filter');
  const opts = [['all', 'Tất cả'], ['todo', 'Chưa xong']].concat(BLIND ? [] : [['low', 'Độ tin cậy thấp'], ['changed', 'Đã sửa so với gợi ý']]);
  if (sel.options.length !== opts.length) sel.replaceChildren(...opts.map(([v, l]) => el('option', {value: v, text: l})));
  sel.value = state.filter;
}
function renderChips() {
  const chips = $('chips'); chips.replaceChildren();
  const items = itemsOf(state.tab), cur = currentId(), vis = new Set(visibleIds());
  items.forEach((it, i) => {
    if (!vis.has(it.id) && it.id !== cur) return;
    chips.append(el('button', {type: 'button', class: [isDone(state.tab, it) ? 'done' : '', lowConf(state.tab, it) ? 'low' : '', it.id === cur ? 'cur' : ''].join(' ').trim(),
      'aria-label': `Mục ${i + 1}: ${it.heading || it.id}${isDone(state.tab, it) ? ', đã xong' : ''}`, 'aria-current': it.id === cur ? 'true' : false,
      onclick: () => go(it.id), text: String(i + 1)}));
  });
}
function renderAll() {
  renderTabs(); renderProgress(); renderChips();
  const main = $('main'); main.replaceChildren();
  const id = currentId();
  if (!id) { main.append(el('div', {class: 'empty', text: 'Việc này chưa có mục nào.'})); return; }
  const it = itemsOf(state.tab).find(i => i.id === id);
  main.append(state.tab === 'gold' ? renderGold(it) : renderChoice(it));
}
function confClass(c) { return c === 'cao' ? 'cao' : c === 'thấp' ? 'thap' : 'vua'; }
function head(task, it) {
  const items = itemsOf(task), n = items.findIndex(i => i.id === it.id) + 1, done = isDone(task, it);
  const conf = task === 'gold' ? it.confidence : (it.suggestion && it.suggestion.confidence);
  return [el('div', {class: 'meta'}, `Mục ${n}/${items.length}`, it.group ? el('span', {class: 'badge', text: it.group}) : null,
      el('span', {class: 'status ' + (done ? 'done' : 'todo'), text: done ? 'Đã xong' : 'Chưa xong'}),
      !BLIND && conf ? el('span', {class: 'badge ' + confClass(conf), text: 'Độ tin cậy: ' + conf}) : null),
    el('h2', {text: it.heading || it.id})];
}

function renderChoice(it) {
  const task = state.tab, T = taskOf(task), st = stOf(task, it.id);
  const sugg = BLIND ? null : it.suggestion;
  const sel = st.value !== undefined ? st.value : (sugg ? sugg.value : undefined);
  const card = el('section', {class: 'card', 'aria-label': 'Mục đang duyệt'}, head(task, it));
  if (it.question) card.append(el('div', {class: 'question', text: it.question}));
  for (const f of it.fields || []) card.append(el('div', {class: 'field'}, el('span', {class: 'fl', text: f.label}), el('div', {class: 'ft'}, marked(f.text || '', f.highlight))));
  if (sugg) {
    const opt = T.options.find(o => o.value === sugg.value);
    const box = el('div', {class: 'sugg', role: 'group', 'aria-label': 'Gợi ý của model'},
      el('h3', {}, 'Gợi ý của model: ', el('strong', {text: opt ? opt.label : sugg.value}), el('span', {class: 'badge ' + confClass(sugg.confidence), text: 'Độ tin cậy: ' + sugg.confidence})));
    if (sugg.reason) box.append(el('p', {text: sugg.reason}));
    for (const q of sugg.quotes || []) box.append(el('blockquote', {}, el('cite', {text: q.label}), q.text));
    box.append(el('p', {class: 'help', text: 'Gợi ý chỉ là của model, không phải kết luận pháp lý; bạn là người quyết định.'}));
    card.append(box);
  }
  const fs = el('fieldset', {}, el('legend', {text: 'Lựa chọn của bạn'}));
  T.options.forEach((o, i) => {
    const input = el('input', {type: 'radio', name: 'opt', value: o.value, id: 'opt' + i, checked: sel === o.value, onchange: () => pick(it, o.value)});
    fs.append(el('label', {class: 'opt' + (sel === o.value ? ' sel' : ''), for: 'opt' + i}, input,
      el('span', {class: 'k', text: i < 9 ? String(i + 1) : ''}),
      el('span', {}, el('strong', {text: o.label}), sugg && sugg.value === o.value ? el('span', {class: 'badge', text: 'gợi ý', style: 'margin-left:.4rem'}) : null, o.hint ? el('span', {class: 'hint', text: o.hint}) : null)));
  });
  card.append(fs);
  const note = el('textarea', {id: 'note', placeholder: 'Ghi chú (không bắt buộc)', oninput: e => { st.note = e.target.value; save(); }});
  note.value = st.note || '';
  card.append(el('label', {for: 'note', class: 'fl', text: 'Ghi chú'}), note);
  card.append(el('div', {class: 'actions'},
    el('button', {type: 'button', onclick: () => step(-1), text: 'Trước (k)'}),
    el('button', {type: 'button', class: 'primary', id: 'accept', onclick: () => accept(it), text: BLIND ? 'Xác nhận và tiếp (Enter)' : 'Đồng ý và tiếp (Enter)'}),
    el('button', {type: 'button', onclick: () => step(1), text: 'Bỏ qua, tiếp (j)'})));
  card.append(el('p', {class: 'help'}, el('kbd', {text: '1-9'}), ' chọn phương án, ', el('kbd', {text: 'Enter'}), BLIND ? ' xác nhận lựa chọn và sang mục sau, ' : ' nhận gợi ý (hoặc lựa chọn hiện tại) và sang mục sau, ', el('kbd', {text: 'j'}), ' / ', el('kbd', {text: 'k'}), ' mục sau / trước.'));
  return card;
}
function pick(it, value) { const st = stOf(state.tab, it.id); st.value = value; st.done = true; save(); renderAll(); say('Đã chọn. Bấm Enter để sang mục sau.'); }
function accept(it) {
  const st = stOf(state.tab, it.id), sugg = BLIND ? null : it.suggestion;
  const v = st.value !== undefined ? st.value : (sugg ? sugg.value : undefined);
  if (v === undefined) { say('Hãy chọn một phương án trước.'); return; }
  st.value = v; st.done = true; save(); step(1);
}

// ---- gold ----
function renderGold(it) {
  const task = 'gold', st = stOf(task, it.id), norms = goldStateNorms(task, it);
  const card = el('section', {class: 'card', 'aria-label': 'Câu đang duyệt'}, head(task, it));
  if (it.context) card.append(el('div', {class: 'ctx'}, el('strong', {text: 'Câu dẫn: '}), it.context));
  const sent = el('div', {class: 'sentence', 'aria-label': 'Nguyên văn câu'});
  card.append(sent);
  const paint = () => { const vals = []; norms.forEach(n => { if (n.cue) vals.push(n.cue); PACK.slots.forEach(s => { if ((n.slots[s] || '').trim()) vals.push(n.slots[s].trim()); }); }); sent.replaceChildren(marked(it.sentence, vals)); };
  paint();
  if (!BLIND && (it.reason || (it.draft || []).length)) {
    const box = el('div', {class: 'sugg', role: 'group', 'aria-label': 'Bản nháp của model'},
      el('h3', {}, 'Bản nháp của model: ', el('strong', {text: (it.draft || []).length ? `${it.draft.length} quy phạm` : 'không có quy phạm'})));
    if (it.reason) box.append(el('p', {text: it.reason}));
    card.append(box);
  }
  const list = el('div', {id: 'norms'});
  const status = el('span', {class: 'status'});
  const msgs = el('div', {class: 'err', role: 'alert'});
  const refresh = () => {
    const problems = goldProblems(task, it);
    if (problems.length && st.done) st.done = false;
    status.className = 'status ' + (st.done ? 'done' : 'todo'); status.textContent = st.done ? 'Đã xong' : 'Chưa xong';
    msgs.textContent = problems.length ? problems.join(' ') : '';
    renderProgress(); renderChips(); renderTabs();
  };
  const draw = () => {
    list.replaceChildren();
    if (!norms.length) list.append(el('p', {class: 'help', text: 'Chưa có quy phạm nào. Bấm "Thêm quy phạm", hoặc "Không có quy phạm" nếu câu không nêu quy phạm.'}));
    norms.forEach((n, i) => list.append(normEditor(n, i, it, norms, paint, refresh, draw, st)));
    refresh();
  };
  card.append(el('h3', {text: 'Quy phạm trong câu', style: 'font-size:1rem;margin:.9rem 0 0'}), list);
  card.append(el('div', {class: 'actions'},
    el('button', {type: 'button', class: 'primary', id: 'accept', onclick: () => goldAccept(it, st), text: (!BLIND ? 'Chấp nhận bản nháp' : 'Xác nhận') + ' (Enter)'}),
    el('button', {type: 'button', id: 'nonorm', onclick: () => noNorm(it), text: 'Không có quy phạm (n)'}),
    el('button', {type: 'button', id: 'addnorm', onclick: () => { if (norms.length >= MAX_NORMS) { say(`Tối đa ${MAX_NORMS} quy phạm.`); return; } norms.push({modality: 'obligation', cue: '', slots: {}}); st.done = false; save(); draw(); paint(); const f = list.querySelector('.norm:last-child select'); if (f) f.focus(); }, text: 'Thêm quy phạm (+)'}),
    el('button', {type: 'button', onclick: () => { st.norms = goldNorms(it); st.done = false; save(); renderAll(); }, text: BLIND ? 'Làm lại từ đầu' : 'Khôi phục bản nháp'}),
    status), msgs);
  const note = el('textarea', {id: 'note', placeholder: 'Ghi chú (không bắt buộc)', oninput: e => { st.note = e.target.value; save(); }});
  note.value = st.note || '';
  card.append(el('label', {for: 'note', class: 'fl', text: 'Ghi chú', style: 'margin-top:.8rem'}), note);
  card.append(el('div', {class: 'actions'}, el('button', {type: 'button', onclick: () => step(-1), text: 'Trước (k)'}), el('button', {type: 'button', onclick: () => step(1), text: 'Bỏ qua, tiếp (j)'})));
  card.append(el('p', {class: 'help'}, 'Mọi ô phải là cụm chép nguyên văn từ câu trên; ô sai sẽ đỏ và mục chưa thể đánh dấu xong. ', el('kbd', {text: 'Enter'}), ' chấp nhận (khi không đang gõ), ', el('kbd', {text: 'n'}), ' không có quy phạm, ', el('kbd', {text: 'j'}), ' / ', el('kbd', {text: 'k'}), ' mục sau / trước.'));
  draw();
  return card;
}
function noNorm(it) { const st = stOf('gold', it.id); st.norms = []; st.done = true; save(); step(1); }
function goldAccept(it, st) {
  const problems = goldProblems('gold', it);
  if (problems.length) { say('Chưa thể xong: ' + problems[0]); return; }
  if (BLIND && !goldStateNorms('gold', it).length) { say('Hãy thêm quy phạm, hoặc bấm "Không có quy phạm" nếu câu không nêu quy phạm.'); return; }
  st.done = true; save(); step(1);
}
function normEditor(n, i, it, norms, paint, refresh, draw, st) {
  const box = el('div', {class: 'norm'});
  const errBox = {};
  const cmsg = el('div', {class: 'err'});
  const check = () => {
    const errs = validateNorm(n, it.sentence);
    box.classList.toggle('invalid', Object.keys(errs).length > 0);
    for (const [k, e] of Object.entries(errBox)) { const msg = errs[k] || ''; e.input.classList.toggle('bad', !!msg); e.msg.textContent = msg; if (msg) e.input.setAttribute('aria-invalid', 'true'); else e.input.removeAttribute('aria-invalid'); }
    cmsg.textContent = errs.content || '';
  };
  const touch = () => { st.done = false; save(); paint(); check(); refresh(); };
  const mod = el('select', {id: `m${i}`, onchange: e => { n.modality = e.target.value; touch(); }}, PACK.modalities.map(m => el('option', {value: m, text: MOD_VI[m] || m})));
  mod.value = n.modality;
  const cue = el('input', {type: 'text', id: `c${i}`, value: n.cue || '', autocomplete: 'off', oninput: e => { n.cue = e.target.value; touch(); }});
  const cueMsg = el('div', {class: 'err'}), modMsg = el('div', {class: 'err'});
  errBox.cue = {input: cue, msg: cueMsg}; errBox.modality = {input: mod, msg: modMsg};
  box.append(el('div', {class: 'normhead'}, el('strong', {text: `Quy phạm ${i + 1}`}), el('span', {class: 'spacer'}),
    el('button', {type: 'button', class: 'danger', 'aria-label': `Xóa quy phạm ${i + 1}`, onclick: () => { norms.splice(i, 1); st.done = false; save(); draw(); paint(); }, text: 'Xóa quy phạm'})));
  const grid = el('div', {class: 'slots'},
    el('div', {}, el('label', {for: `m${i}`, text: 'Tính quy phạm'}), mod, modMsg),
    el('div', {}, el('label', {for: `c${i}`, text: 'Từ tình thái (cue)'}), cue, cueMsg));
  for (const s of PACK.slots) {
    const input = el('input', {type: 'text', id: `s${i}${s}`, value: n.slots[s] || '', autocomplete: 'off', oninput: e => { n.slots[s] = e.target.value; touch(); }});
    const msg = el('div', {class: 'err'});
    errBox[s] = {input, msg};
    grid.append(el('div', {}, el('label', {for: `s${i}${s}`, text: PACK.slot_names[s] || s}), input, msg));
  }
  box.append(grid, cmsg);
  check();
  return box;
}

// ---- actions ----
function switchTab(task) {
  state.tab = task; state.filter = 'all'; renderAll();
  try { sessionStorage.setItem('rp:tab', task); } catch (e) {}
}
function exportResult() {
  const task = state.tab;
  if (!state.reviewer.trim()) { say('Nhập tên người duyệt ở đầu trang trước khi xuất.'); $('reviewer').focus(); return; }
  const items = [];
  for (const it of itemsOf(task)) {
    const st = peek(task, it.id);
    if (!st || !st.done) continue;
    const row = {id: it.id, value: st.value === undefined ? null : st.value, note: st.note || ''};
    if (task === 'gold') {
      const norms = (st.norms || []).map(cleanNorm);
      row.value = norms.length ? 'norms' : 'no_norm';
      row.edited_norms = norms;
      row.changed_from_suggestion = BLIND ? null : goldChanged(task, it);
    } else {
      row.changed_from_suggestion = BLIND ? null : (!it.suggestion || st.value !== it.suggestion.value);
    }
    items.push(row);
  }
  const body = {task, reviewer: state.reviewer.trim(), mode: BLIND ? 'blind' : 'suggestions', exported_at: new Date().toISOString(), items};
  const slug = state.reviewer.trim().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '').toLowerCase() || 'nguoi-duyet';
  const blob = new Blob([JSON.stringify(body, null, 2)], {type: 'application/json'});
  const a = el('a', {href: URL.createObjectURL(blob), download: `review-${task}-${slug}.json`});
  document.body.append(a); a.click(); a.remove();
  say(`Đã xuất ${items.length}/${itemsOf(task).length} mục xong của việc này.`);
}
function importResult(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try { data = JSON.parse(reader.result); } catch (e) { say('Tệp không phải JSON hợp lệ.'); return; }
    if (!data || !PACK.tasks[data.task] || !Array.isArray(data.items)) { say('Tệp không phải kết quả duyệt của gói này.'); return; }
    if (data.mode && data.mode !== (BLIND ? 'blind' : 'suggestions')) { say('Tệp này thuộc chế độ khác (có gợi ý hoặc độc lập); không nhập.'); return; }
    if (!state.reviewer.trim() && data.reviewer) { state.reviewer = data.reviewer; $('reviewer').value = data.reviewer; loadAll(); }
    if (state.tab !== data.task) switchTab(data.task);
    const known = new Set(itemsOf(data.task).map(i => i.id));
    let n = 0;
    for (const r of data.items) {
      if (!known.has(r.id)) continue;
      const st = stOf(data.task, r.id);
      st.note = r.note || ''; st.done = true;
      if (data.task === 'gold') st.norms = (r.edited_norms || []).map(x => ({modality: x.modality, cue: x.cue || x.modality_cue || '', slots: x.slots || {}}));
      else st.value = r.value;
      n++;
    }
    save(); renderAll(); say(`Đã nhập ${n} mục.`);
  };
  reader.readAsText(file);
}
function loadAll() { for (const t of tasks) load(t.task); }

// ---- keyboard ----
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target, tag = t && t.tagName;
  if ((tag === 'INPUT' && t.type !== 'radio') || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if (tag === 'BUTTON' && (e.key === 'Enter' || e.key === ' ')) return;
  const task = state.tab; if (!task) return;
  const it = itemsOf(task).find(i => i.id === currentId()); if (!it) return;
  if (e.key === 'j') { step(1); e.preventDefault(); }
  else if (e.key === 'k') { step(-1); e.preventDefault(); }
  else if (e.key === 'Enter') { if (task === 'gold') goldAccept(it, stOf(task, it.id)); else accept(it); e.preventDefault(); }
  else if (task === 'gold' && e.key === 'n') { noNorm(it); e.preventDefault(); }
  else if (task === 'gold' && e.key === '+') { const b = $('addnorm'); if (b) b.click(); e.preventDefault(); }
  else if (task !== 'gold' && /^[1-9]$/.test(e.key)) { const o = taskOf(task).options[Number(e.key) - 1]; if (o) { pick(it, o.value); e.preventDefault(); } }
});
$('tabs').addEventListener('keydown', e => {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  const i = tasks.findIndex(t => t.task === state.tab), j = (i + (e.key === 'ArrowRight' ? 1 : tasks.length - 1)) % tasks.length;
  switchTab(tasks[j].task); $('tab-' + tasks[j].task).focus(); e.preventDefault();
});
$('filter').addEventListener('change', e => { state.filter = e.target.value; const ids = visibleIds(); if (ids.length && !ids.includes(currentId())) state.data[state.tab].pos = ids[0]; renderAll(); });
$('export').addEventListener('click', exportResult);
$('import').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', e => { if (e.target.files[0]) importResult(e.target.files[0]); e.target.value = ''; });
$('reviewer').addEventListener('change', e => { state.reviewer = e.target.value; try { localStorage.setItem('rp:reviewer', state.reviewer); } catch (x) {} loadAll(); renderAll(); say(`Đang lưu cho "${state.reviewer.trim() || 'chưa đặt tên'}".`); });
$('theme').addEventListener('click', () => {
  const root = document.documentElement;
  const dark = root.dataset.theme === 'dark' || (!root.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('rp:theme', root.dataset.theme); } catch (x) {}
});

// ---- start ----
(function init() {
  const hash = new URLSearchParams(location.hash.slice(1));
  try { const th = hash.get('theme') || localStorage.getItem('rp:theme'); if (th) document.documentElement.dataset.theme = th; } catch (x) {}
  const mb = $('modebadge');
  mb.textContent = BLIND ? 'Chế độ độc lập: không có gợi ý' : 'Có gợi ý của model'; mb.className = 'badge' + (BLIND ? ' blind' : '');
  try { state.reviewer = localStorage.getItem('rp:reviewer') || ''; } catch (x) {}
  if (hash.get('reviewer')) state.reviewer = hash.get('reviewer');
  $('reviewer').value = state.reviewer;
  loadAll();
  let start = hash.get('tab');
  if (!start) { try { start = sessionStorage.getItem('rp:tab'); } catch (x) {} }
  state.tab = PACK.tasks[start] ? start : tasks[0].task;
  if (hash.get('item')) state.data[state.tab].pos = hash.get('item');
  renderAll();
  if (!state.reviewer) say('Nhập tên người duyệt ở đầu trang; tiến độ được lưu riêng cho từng tên.');
})();
</script>
