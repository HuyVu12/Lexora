html{font-size:17px}

"thấp"},{"id":"10-2020-tt-bldtbxh/chapter-ii/article-3/clause-3/point-b@2795-3015","group":"10-2020-tt-bldtbxh/chapter-ii/article-3","heading":"TT 10/2020 - Chương II \u003e Điều 3 \u003e Khoản 3 \u003e Điểm b","sentence":"Địa điểm làm việc của người lao động: địa điểm, phạm vi người lao động làm công việc theo thỏa thuận; trường hợp người lao động làm việc có tính chất thường xuyên ở nhiều địa điểm khác nhau thì ghi đầy đủ các địa điểm đó","context":"3. Công việc và địa điểm làm việc được quy định như sau:","draft":[{"modality":"unknown","slots":{"action":"ghi đầy đủ","object":"các địa điểm đó","conditions":"trường hợp người lao động làm việc có tính chất thường xuyên ở nhiều địa điểm khác nhau"}}],"reason":"Khi làm việc ở nhiều địa điểm thì ghi đủ các địa điểm; không có từ tình thái.","confidence":"thấp"},{"id":"10-2020-tt-bldtbxh/chapter-ii/article-3/clause-4@3020-3327","group":"10-2020-tt-bldtbxh/chapter-ii/article-3","heading":"TT 10/2020 - Chương II \u003e Điều 3 \u003e Khoản 4","sentence":"Thời hạn của hợp đồng lao động: thời gian thực hiện hợp đồng lao động (số tháng hoặc số ngày), thời điểm bắt đầu và thời điểm kết thúc thực hiện hợp đồng lao động (đối với hợp đồng lao động xác định thời hạn); thời điểm bắt đầu thực hiện hợp đồng lao động (đối với hợp đồng lao động không xác định thời hạn)","context":"Điều 3. Nội dung chủ yếu của hợp đồng lao động","draft":[],"reason":"Giải thích nội dung mục Thời hạn hợp đồng, không nêu ai phải làm gì.","confidence":"vừa"},{"id":"10-2020-tt-bldtbxh/chapter-ii/article-3/clause-5/point-a@3478-3843","group":"10-2020-tt-bldtbxh/chapter-ii/article-3","heading":"TT 10/2020 - Chương II \u003e Điều 3 \u003e Khoản 5 \u003e Điểm a","sentence":"Mức lương theo công việc hoặc chức danh: ghi mức lương tính theo thời gian của công việc hoặc chức danh theo thang lương, bảng lương do người sử dụng lao động xây dựng theo quy định tại Điều 93 của Bộ luật Lao động; đối với người lao động hưởng lương theo sản phẩm hoặc lương khoán thì ghi mức ","slots":{"actor":"người sử dụng lao động","action":"thực hiện thu thập","object":"chứng cứ chứng minh lỗi của người lao động","conditions":"Trường hợp người sử dụng lao động phát hiện hành vi vi phạm kỷ luật lao động sau thời điểm hành vi vi phạm đã xảy ra"}}],"reason":"Khi phát hiện vi phạm muộn thì thu thập chứng cứ; không có từ tình thái.","confidence":"thấp"},{"id":"145-2020-nd-cp/chapter-viii/article-70/clause-2/point-a@24893-25334","group":"145-2020-nd-cp/chapter-viii/article-70","heading":"NĐ 145/2020 - Chương VIII \u003e Điều 70 \u003e Khoản 2 \u003e Điểm a","sentence":"Ít nhất 05 ngày làm việc trước ngày tiến hành họp xử lý kỷ luật lao động, người sử dụng lao động thông báo về nội dung, thời gian, địa điểm tiến hành cuộc họp xử lý kỷ luật lao động, họ tên người bị xử lý kỷ luật lao động, hành vi vi phạm bị xử lý kỷ luật lao động đến các thành phần phải tham dự họp quy định tại điểm b, điểm c khoản 1 Điều 122 của Bộ luật Lao động, bảo đảm các thành phần này nhận được thông báo trước khi diễn ra cuộc họp","context":"2. Trong thời hiệu xử lý kỷ luật lao động quy định tại khoản 1, khoản 2 Điều 123 của Bộ luật Lao động, người sử dụng lao động tiến hành họp xử lý kỷ luật lao động như sau:","draft":[{"modality":"unknown","slots":{"actor":"người sử dụng lao động","action":"thông báo","object":"nội dung, thời gian, địa điểm tiến hành cuộc họp xử lý kỷ luật lao động, họ tên người bị xử lý kỷ luật lao động, hành vi vi phạm bị xử lý kỷ luật lao động","recipient":"các thành phần phải tham dự họp quy định tại điểm b, điểm c khoản 1 Điều 122 của Bộ luật Lao động","deadlines":"Ít nhất 05 ngày làm việc trước ngày tiến hành họp xử lý kỷ luật lao động"}},{"modality":"unknown","slots":{"actor":"người sử dụng lao động","action":"bảo đảm","object":"các thành phần này nhận được thông báo","deadlines":"trước khi diễn ra cuộc họp"}}],"reason":"Báo trước họp kỷ luật ít nhất 05 ngày làm việc và bảo đảm người dự nhận được thông báo; không có từ tình thái.","confidence":"thấp"},{"id":"145-2020-nd-cp/chapter-viii/article-70/clause-2/point-b@25339-25546","group":"145-2020-nd-cp/chapter-viii/article-70","heading":"NĐ 145/2020 - Chương VIII \u003e Điều 70 \u003e Khoản 2 \u003e Điểm b","sentence":"Khi nhận được thông báo của người sử dụng lao động, các thành phần phải tham dự họp quy định tại điểm b, điểm c khoản 1 Điều 122 của Bộ luật Lao động phải xác nhận tham dự cuộc họp với người sử dụng lao động","context":"2. Trong thời hiệu xử lý kỷ luật lao động quy định tại khoản 1, khoản 2 Điều 123 của Bộ luật Lao động, người sử dụng lao động tiến hành họp xử lý kỷ luật lao động như sau:","draft":[{"modality":"obligation","cue":"phải","slots":{"actor":"các thành phần phải tham dự họp quy định tại điểm b, điểm c khoản 1 Điều 122 của Bộ luật Lao động","action":"xác nhận tham dự cuộc họp","recipient":"người sử dụng lao động","conditions":"Khi nhận được thông báo của người sử dụng lao động"}}],"reason":"Người dự họp phải xác nhận tham dự với người sử dụng lao động khi nhận thông báo.","confidence":"cao"},{"id":"145-2020-nd-cp/chapter-viii/article-70/clause-2/point-b@25548-25854","group":"145-2020-nd-cp/chapter-viii/article-70","heading":"NĐ 145/2020 - Chương VIII \u003e Điều 70 \u003e Khoản 2 \u003e Điểm b","sentence":"Trường hợp một trong các thành phần phải tham dự không thể tham dự họp theo thời gian, địa điểm đã thông báo thì người lao động và người sử dụng lao động thỏa thuận việc thay đổi thời gian, địa điểm họp; trường hợp hai bên không thỏa thuận được thì người sử dụng lao động quyết định thời gian, địa điểm họp","context":"2. Trong thời hiệu xử lý kỷ luật lao động quy định tại khoản 1, khoản 2 Điều 123 của Bộ luật Lao động, người sử dụng lao động tiến hành họp xử lý kỷ luật lao động như sau:","draft":[{"modality":"unknown","slots":{"actor":"người lao động và người sử dụng lao động","action":"thỏa thuận","object":"việc thay đổi thời gian, địa điểm họp","conditions":"Trường hợp một trong các thành phần phải tham dự không thể tham dự họp theo thời gian, địa điểm đã thông báo"}},{"modality":"unknown","slots":{"actor":"người sử dụng lao động","action":"quyết định","object":"thời gian, địa điểm họp","conditions":"trường hợp hai bên không thỏa thuận được"}}],"reason":"Hai quy tắc: hai bên thỏa thuận đổi thời gian, địa điểm; nếu không thỏa thuận được thì người sử dụng lao động quyết định.","confidence":"thấp"},{"id":"145-2020-nd-cp/chapter-viii/article-70/clause-2/point-c@25859-25994","group":"145-2020-nd-cp/chapter-viii/article-70","heading":"NĐ 145/2020 - Chương VIII \u003e Điều 70 \u003e Khoản 2 \u003e Điểm c","sentence":"Người sử dụng lao động tiến hành họp xử lý kỷ luật lao động theo thời gian, địa điểm đã thông báo quy định tại điểm a, điểm b khoản này","context":"2. Trong thời hiệu xử lý kỷ luật lao động quy định tại khoản 1, khoản 2 Điều 123 của Bộ luật Lao động, người sử dụng lao động tiến hành họp xử lý kỷ luật lao động như sau:","draft":[{"modality":"unknown","slots":{"actor":"Người sử dụng lao động","action":"tiến hành họp xử lý kỷ luật lao động","conditions":"theo thời gian, địa điểm đã thông báo quy định tại điểm a, điểm b khoản này"}}],"reason":"Họp xử lý kỷ luật theo thời gian, địa điểm đã thông báo; không có từ tình thái.","confidence":"thấp"},{"id":"145-2020-nd-cp/chapter-viii/article-70/clause-2/point-c@25996-26228","group":"145-2020-nd-cp/chapter-viii/article-70","heading":"NĐ 145/2020 - Chương VIII \u003e Điều 70 \u003e Khoản 2 \u003e Điểm c","sentence":"Trường hợp một trong các thành phần phải tham dự họp quy định tại điểm b, điểm c khoản 1 Điều 122 của Bộ luật Lao động không xác nhận tham dự cuộc họp hoặc vắng mặt thì người sử dụng lao động vẫn tiến hành họp xử lý kỷ luật lao động","context":"2. Trong thời hiệu xử lý kỷ luật lao động quy định tại khoản 1, khoản 2 Điều 123 của Bộ luật Lao động, người sử dụng lao động tiến hành họp xử lý kỷ luật lao động như sau:","draft":[{"modality":"unknown","slots":{"actor":"người sử dụng lao động","action":"vẫn tiến hành họp xử lý kỷ luật lao động","conditions":"Trường hợp một trong các thành phần phải tham dự họp quy định tại điểm b, điểm c khoản 1 Điều 122 của Bộ luật Lao động không xác nhận tham dự cuộc họp hoặc vắng mặt"}}],"reason":"Người dự họp không xác nhận hoặc vắng mặt thì người sử dụng lao động vẫn họp; không có từ tình thái.","confidence":"thấp"},{"id":"145-2020-nd-cp/chapter-viii/article-70/clause-3@26233-26574","group":"145-2020-nd-cp/chapter-viii/article-70","heading":"NĐ 145/2020 - Chương VIII \u003e Điều 70 \u003e Khoản 3","sentence":"Nội dung cuộc họp xử lý kỷ luật lao động phải được lập thành biên bản, thông qua trước khi kết thúc cuộc họp và có chữ ký của người tham dự cuộc họp quy định tại điểm b, điểm c khoản 1 Điều 122 của Bộ luật Lao động, trường hợp có người không ký vào biên bản thì người ghi biên bản nêu rõ họ tên, lý do không ký (nếu có) vào nội dung biên bản","context":"Điều 70. Trình tự, thủ tục xử lý kỷ luật lao động","draft":[{"modality":"obligation","cue":"phải","slots":{"object":"Nội dung cuộc họp xử lý kỷ luật lao động","action":"được lập thành biên bản"}},{"modality":"obligation","cue":"phải","slots":{"object":"Nội dung cuộc họp xử lý kỷ luật lao động","action":"thông qua","deadlines":"trước khi kết thúc cuộc họp"}},{"modality":"obligation","cue":"phải","slots":{"object":"Nội dung cuộc họp xử lý kỷ luật lao động","action":"có chữ ký của người tham dự cuộc họp quy định tại điểm b, điểm c khoản 1 Điều 122 của Bộ luật Lao động"}},{"modality":"unknown","slots":{"actor":"người ghi biên bản","action":"nêu rõ","object":"họ tên, lý do không ký (nếu có) vào nội dung biên bản","conditions":"trường hợp có người không ký vào biên bản"}}],"reason":"Biên bản cuộc họp phải được lập, thông qua và có chữ ký; nếu có người không ký thì người ghi biên bản nêu rõ họ tên, lý do.","confidence":"vừa"},{"id":"145-2020-nd-cp/chapter-viii/article-70/clause-4@26579-26869","group":"145-2020-nd-cp/chapter-viii/article-70","heading":"NĐ 145/2020 - Chương VIII \u003e Điều 70 \u003e Khoản 4","sentence":"Trong thời hiệu xử lý kỷ luật lao động quy định tại khoản 1, khoản 2 Điều 123 của Bộ luật Lao động, người có thẩm quyền xử lý kỷ luật lao động ban hành quyết định xử lý kỷ luật lao động và gửi đến các thành phần phải tham dự quy định tại điểm b, điểm c khoản 1 Điều 122 của Bộ luật Lao động","context":"Điều 70. Trình tự, thủ tục xử lý kỷ luật lao động","draft":[{"modality":"unknown","slots":{"actor":"người có thẩm quyền xử lý kỷ luật lao động","action":"ban hành","object":"quyết định xử lý kỷ luật lao động","deadlines":"Trong thời hiệu xử lý kỷ luật lao động quy định tại khoản 1, khoản 2 Điều 123 của Bộ luật Lao động"}},{"modality":"unknown","slots":{"actor":"người có thẩm quyền xử lý kỷ luật lao động","action":"gửi","object":"quyết định xử lý kỷ luật lao động","recipient":"các thành phần phải tham dự quy định tại điểm b, điểm c khoản 1 Điều 122 của Bộ luật Lao động","deadlines":"Trong thời hiệu xử lý kỷ luật lao động quy định tại khoản 1, khoản 2 Điều 123 của Bộ luật Lao động"}}],"reason":"Ban hành quyết định xử lý kỷ luật và gửi cho người dự họp trong thời hiệu; không có từ tình thái.","confidence":"thấp"},{"id":"45-2019-qh14/chapter-i/article-3/clause-1@117-275","group":"45-2019-qh14/chapter-i/article-3","heading":"BLLĐ 2019 - Chương I \u003e Điều 3 \u003e Khoản 1","sentence":"Người lao động là người làm việc cho người sử dụng lao động theo thỏa thuận, được trả lương và chịu sự quản lý, điều hành, giám sát của người sử dụng lao động","context":"Điều 3. Giải thích từ ngữ","draft":[],"reason":"Định nghĩa khái niệm, không nêu quy tắc xử sự.","confidence":"cao"},{"id":"45-2019-qh14/chapter-i/article-3/clause-1@277-397","group":"45-2019-qh14/chapter-i/article-3","heading":"BLLĐ 2019 - Chương I \u003e Điều 3 \u003e Khoản 1","sentence":"Độ tuổi lao động tối thiểu của người lao động là đủ 15 tuổi, trừ trường hợp quy định tại Mục 1 Chương XI của Bộ luật này","context":"Điều 3. Giải thích từ ngữ","draft":[],"reason":"Định nghĩa độ tuổi lao động tối thiểu (đủ 15 tuổi), nằm trong Điều giải thích từ ngữ.","confidence":"vừa"},{"id":"45-2019-qh14/chapter-i/article-3/clause-2@402-652","group":"45-2019-qh14/chapter-i/article-3","heading":"BLLĐ 2019 - Chương I \u003e Điều 3 \u003e Khoản 2","sentence":"Người sử dụng lao động là doanh nghiệp, cơ quan, tổ chức, hợp tác xã, hộ gia đình, cá nhân có thuê mướn, sử dụng người lao động làm việc cho mình theo thỏa thuận; trường hợp người sử dụng lao động là cá nhân thì phải có năng lực hành vi dân sự đầy đủ","context":"Điều 3. Giải thích từ ngữ","draft":[{"modality":"obligation","cue":"phải","slots":{"actor":"người sử dụng lao động","action":"có năng lực hành vi dân sự đầy đủ","conditions":"trường hợp người sử dụng lao động là cá nhân"}}],"reason":"Câu định nghĩa nhưng mệnh đề sau đặt yêu cầu: người sử dụng lao động là cá nhân phải có năng lực hành vi dân sự đầy đủ.","confidence":"thấp"},{"id":"45-2019-qh14/chapter-i/article-3/clause-3@657-992","group":"45-2019-qh14/chapter-i/article-3","heading":"BLLĐ 2019 - Chương I \u003e Điều 3 \u003e Khoản 3","sentence":"Tổ chức đại diện người lao động tại cơ sở là tổ chức được thành lập trên cơ sở tự nguyện của người lao động tại một đơn vị sử dụng lao động nhằm mục đích bảo vệ quyền và lợi ích hợp pháp, chính đáng của người lao động trong quan hệ lao động thông qua thương lượng tập thể hoặc các hình thức khác theo quy định của pháp luật về lao động","context":"Điều 3. Giải thích từ ngữ","draft":[],"reason":"Định nghĩa khái niệm, không nêu quy tắc xử sự.","confidence":"cao"},{"id":"45-2019-qh14/chapter-i/article-3/clause-3@994-1106","group":"45-2019-qh14/chapter-i/article-3","heading":"BLLĐ 2019 - Chương I \u003e Điều 3 \u003e Khoản 3","sentence":"Tổ chức đại diện người lao động tại cơ sở bao gồm công đoàn cơ sở và tổ chức của người lao động tại doanh nghiệp","context":"Điều 3. Giải thích từ ngữ","draft":[],"reason":"Định nghĩa khái niệm, không nêu quy tắc xử sự.","confidence":"cao"},{"id":"45-2019-qh14/chapter-i/article-3/clause-4@1111-1279","group":"45-2019-qh14/chapter-i/article-3","heading":"BLLĐ 2019 - Chương I \u003e Điều 3 \u003e Khoản 4","sentence":"Tổ chức đại diện người sử dụng lao động là tổ chức được thành lập hợp pháp, đại diện và bảo vệ quyền, lợi ích hợp pháp của người sử dụng lao động trong quan hệ lao động","context":"Điều 3. Giải thích từ ngữ","draft":[],"reason":"Định nghĩa khái niệm, không nêu quy tắc xử sự.","confidence":"cao"},{"id":"45-2019-qh14/chapter-i/article-3/clause-5@1284-1488","group":"45-2019-qh14/chapter-i/article-3","heading":"BLLĐ 2019 - Chương I \u003e Điều 3 \u003e Khoản 5","sentence":"Quan hệ lao động là quan hệ xã hội phát sinh trong việc thuê mướn, sử dụng lao động, trả lương giữa người lao động, người sử dụng lao động, các tổ chức đại diện của các bên, cơ quan nhà nước có thẩm quyền","context":"Điều 3. Giải thích từ ngữ","draft":[],"reason":"Định nghĩa khái niệm, không nêu quy tắc xử sự.","confidence":"cao"},{"id":"45-2019-qh14/chapter-i/article-3/clause-5@1490-1567","group":"45-2019-qh14/chapter-i/article-3","heading":"BLLĐ 2019 - Chương I \u003e Điều 3 \u003e Khoản 5","sentence":"Quan hệ lao động bao gồm quan hệ lao động cá nhân và quan hệ lao động tập thể","context":"Điều 3. Giải thích từ ngữ","draft":[],"reason":"Định nghĩa khái niệm, không nêu quy tắc xử sự.","confidence":"cao"},{"id":"45-2019-qh14/chapter-i/article-3/clause-6@1572-1680","group":"45-2019-qh14/chapter-i/article-3","heading":"BLLĐ 2019 - Chương I \u003e Điều 3 \u003e Khoản 6","sentence":"Người làm việc không có quan hệ lao động là người làm việc không trên cơ sở thuê mướn bằng hợp đồng lao động","context":"Điều 3. Giải thích từ ngữ","draft":[],"reason":"Định nghĩa khái niệm, không nêu quy tắc xử sự.","confidence":"cao"},{"id":"45-2019-qh14/chapter-i/article-3/clause-7@1685-1825","group":"45-2019-qh14/chapter-i/article-3","heading":"BLLĐ 2019 - Chương I \u003e Điều 3 \u003e Khoản 7","sentence":"Cưỡng bức lao động là việc dùng vũ lực, đe dọa dùng vũ lực hoặc các thủ đoạn khác để ép buộc người lao động phải làm việc trái ý muốn của họ","context":"Điều 3. Giải thích từ ngữ","draft":[],"reason":"Định nghĩa khái niệm, không nêu quy tắc xử sự.","confidence":"cao"},{"id":"45-2019-qh14/chapter-i/article-3/clause-8@1830-2328","group":"45-2019-qh14/chapter-i/article-3","heading":"BLLĐ 2019 - Chương I \u003e Điều 3 \u003e Khoản 8","sentence":"Phân biệt đối xử trong lao động là hành vi phân biệt, loại trừ hoặc ưu tiên dựa trên chủng tộc, màu da, nguồn gốc quốc gia hoặc nguồn gốc xã hội, dân tộc, giới tính, độ tuổi, tình trạng thai sản, tình trạng hôn nhân, tôn giáo, tín ngưỡng, chính kiến, khuyết tật, trách nhiệm gia đình hoặc trên cơ sở tình trạng nhiễm HIV hoặc vì lý do thành lập, gia nhập và hoạt động công đoàn, tổ chức của người lao động tại doanh nghiệp có tác động làm ảnh hưởng đến bình đẳng về cơ hội việc làm hoặc nghề nghiệp","context":"Điều 3. Giải thích từ ngữ","draft":[],"reason":"Định nghĩa khái niệm, không nêu quy tắc xử sự.","confidence":"cao"},{"id":"45-2019-qh14/chapter-i/article-3/clause-8@2330-2523","group":"45-2019-qh14/chapter-i/article-3","heading":"BLLĐ 2019 - Chương I \u003e Điều 3 \u003e Khoản 8","sentence":"Việc phân biệt, loại trừ hoặc ưu tiên xuất phát từ yêu cầu đặc thù của công việc và các hành vi duy trì, bảo vệ việc làm cho người lao động dễ bị tổn thương thì không bị xem là phân biệt đối xử","context":"Điều 3. Giải thích từ ngữ","draft":[],"reason":"Làm rõ trường hợp không bị xem là phân biệt đối xử, mang tính giải thích.","confidence":"thấp"},{"id":"45-2019-qh14/chapter-i/article-3/clause-9@2528-2700","group":"45-2019-qh14/chapter-i/article-3","heading":"BLLĐ 2019 - Chương I \u003e Điều 3 \u003e Khoản 9","sentence":"Quấy rối tình dục tại nơi làm việc là hành vi có tính chất tình dục của bất kỳ người nào đối với người khác tại nơi làm việc mà không được người đó mong muốn hoặc chấp nhận","context":"Điều 3. Giải thích từ ngữ","draft":[],"reason":"Định nghĩa khái niệm, không nêu quy tắc xử sự.","confidence":"cao"},{"id":"45-2019-qh14/chapter-i/article-3/clause-9@2702-2825","group":"45-2019-qh14/chapter-i/article-3","heading":"BLLĐ 2019 - Chương I \u003e Điều 3 \u003e Khoản 9","sentence":"Nơi làm việc là bất kỳ nơi nào mà người lao động thực tế làm việc theo thỏa thuận hoặc phân công của người sử dụng lao động","context":"Điều 3. Giải thích từ ngữ","draft":[],"reason":"Định nghĩa khái niệm, không nêu quy tắc xử sự.","confidence":"cao"},{"id":"45-2019-qh14/chapter-iii/section-1/article-26@12994-13125","group":"45-2019-qh14/chapter-iii/section-1/article-26","heading":"BLLĐ 2019 - Chương III \u003e Mục 1 \u003e Điều 26","sentence":"Tiền lương của người lao động trong thời gian thử việc do hai bên thỏa thuận nhưng ít nhất phải bằng 85% mức lương của công việc đó","context":"Mục 1. GIAO KẾT HỢP ĐỒNG LAO ĐỘNG","draft":[{"modality":"obligation","cue":"phải","slots":{"actor":"hai bên","action":"thỏa thuận","object":"Tiền lương của người lao động trong thời gian thử việc","quantities":"ít nhất phải bằng 85% mức lương của công việc đó"}}],"reason":"Lương thử việc do hai bên thỏa thuận nhưng ít nhất bằng 85% lương công việc đó (nghĩa vụ).","confidence":"cao"},{"id":"45-2019-qh14/chapter-iii/section-2/article-32/clause-1@17513-17776","group":"45-2019-qh14/chapter-iii/section-2/article-32","heading":"BLLĐ 2019 - Chương III \u003e Mục 2 \u003e Điều 32 \u003e Khoản 1","sentence":"Người lao động làm việc không trọn thời gian là người lao động có thời gian làm việc ngắn hơn so với thời gian làm việc bình thường theo ngày hoặc theo tuần hoặc theo tháng được quy định trong pháp luật về lao động, thỏa ước lao động tập thể hoặc nội quy lao động","context":"Điều 32. Làm việc không trọn thời gian","draft":[],"reason":"Định nghĩa người lao động làm việc không trọn thời gian.","confidence":"cao"},{"id":"45-2019-qh14/chapter-iii/section-2/article-32/clause-2@17781-17894","group":"45-2019-qh14/chapter-iii/section-2/article-32","heading":"BLLĐ 2019 - Chương III \u003e Mục 2 \u003e Điều 32 \u003e Khoản 2","sentence":"Người lao động thỏa thuận với người sử dụng lao động làm việc không trọn thời gian khi giao kết hợp đồng lao động","context":"Điều 32. Làm việc không trọn thời gian","draft":[{"modality":"unknown","slots":{"actor":"Người lao động","action":"thỏa thuận","recipient":"người sử dụng lao động","object":"làm việc không trọn thời gian","conditions":"khi giao kết hợp đồng lao động"}}],"reason":"Người lao động thỏa thuận với người sử dụng lao động về làm việc không trọn thời gian khi giao kết hợp đồng; không có từ tình thái.","confidence":"thấp"},{"id":"45-2019-qh14/chapter-iii/section-2/article-32/clause-3@17899-18131","group":"45-2019-qh14/chapter-iii/section-2/article-32","heading":"BLLĐ 2019 - Chương III \u003e Mục 2 \u003e Điều 32 \u003e Khoản 3","sentence":"Người lao động làm việc không trọn thời gian được hưởng lương; bình đẳng trong thực hiện quyền và nghĩa vụ với người lao động làm việc trọn thời gian; bình đẳng về cơ hội, không bị phân biệt đối xử, bảo đảm an toàn, vệ sinh lao động","context":"Điều 32. Làm việc không trọn thời gian","draft":[{"modality":"entitlement","cue":"được","slots":{"actor":"Người lao động làm việc không trọn thời gian","action":"hưởng","object":"lương"}},{"modality":"entitlement","cue":"được","slots":{"actor":"Người lao động làm việc không trọn thời gian","action":"bình đẳng trong thực hiện quyền và nghĩa vụ với người lao động làm việc trọn thời gian"}},{"modality":"entitlement","cue":"được","slots":{"actor":"Người lao động làm việc không trọn thời gian","action":"bình đẳng về cơ hội"}},{"modality":"entitlement","cue":"được","slots":{"actor":"Người lao động làm việc không trọn thời gian","action":"không bị phân biệt đối xử"}},{"modality":"entitlement","cue":"được","slots":{"actor":"Người lao động làm việc không trọn thời gian","action":"bảo đảm an toàn, vệ sinh lao động"}}],"reason":"Người lao động không trọn thời gian được hưởng lương và các quyền bình đẳng; tách năm quyền theo dấu chấm phẩy và dấu phẩy.","confidence":"vừa"},{"id":"45-2019-qh14/chapter-iii/section-3/article-34/clause- icle-34","heading":"BLLĐ 2019 - Chương III \u003e Mục 3 \u003e Điều 34 \u003e Khoản 4","sentence":"Người lao động bị kết án phạt tù nhưng không được hưởng án treo hoặc không thuộc trường hợp được trả tự do theo quy định tại khoản 5 Điều 328 của Bộ luật Tố tụng hình sự, tử hình hoặc bị cấm làm công việc ghi trong hợp đồng lao động theo bản án, quyết định của Tòa án đã có hiệu lực pháp luật","context":"Điều 34. Các trường hợp chấm dứt hợp đồng lao động","draft":[{"modality":"unknown","slots":{"conditions":"Người lao động bị kết án phạt tù nhưng không được hưởng án treo hoặc không thuộc trường hợp được trả tự do theo quy định tại khoản 5 Điều 328 của Bộ luật Tố tụng hình sự, tử hình hoặc bị cấm làm công việc ghi trong hợp đồng lao động theo bản án, quyết định của Tòa án đã có hiệu lực pháp luật"}}],"reason":"Một trường hợp chấm dứt hợp đồng lao động (liệt kê dưới tên Điều); không có từ tình thái nên để chưa rõ loại, có thể coi là không quy phạm.","confidence":"thấp"},{"id":"45-2019-qh14/chapter-iii/section-3/article-34/clause-5@19306-19482","group":"45-2019-qh14/chapter-iii/section-3/article-34","heading":"BLLĐ 2019 - Chương III \u003e Mục 3 \u003e Điều 34 \u003e Khoản 5","sentence":"Người lao động là người nước ngoài làm việc tại Việt Nam bị trục xuất theo bản án, quyết định của Tòa án đã có hiệu lực pháp luật, quyết định của cơ quan nhà nước có thẩm quyền","context":"Điều 34. Các trường hợp chấm dứt hợp đồng lao động","draft":[{"modality":"unknown","slots":{"conditions":"Người lao động là người nước ngoài làm việc tại Việt Nam bị trục xuất theo bản án, quyết định của Tòa án đã có hiệu lực pháp luật, quyết định của cơ quan nhà nước có thẩm quyền"}}],"reason":"Một trường hợp chấm dứt hợp đồng lao động (liệt kê dưới tên Điều); không có từ tình thái nên để chưa rõ loại, có thể coi là không quy phạm.","confidence":"thấp"},{"id":"45-2019-qh14/chapter-iii/section-3/article-34/clause-6@19487-19577","group":"45-2019-qh14/chapter-iii/section-3/article-34","heading":"BLLĐ 2019 có thời hạn dưới 12 tháng mà khả năng lao động chưa hồi phục"}}],"reason":"Một trường hợp người sử dụng lao động có quyền đơn phương chấm dứt hợp đồng; tính quy phạm lấy theo câu dẫn, chủ thể và hành vi nằm ở câu dẫn.","confidence":"vừa"},{"id":"45-2019-qh14/chapter-iii/section-3/article-36/clause-1/point-b@23222-23356","group":"45-2019-qh14/chapter-iii/section-3/article-36","heading":"BLLĐ 2019 - Chương III \u003e Mục 3 \u003e Điều 36 \u003e Khoản 1 \u003e Điểm b","sentence":"Khi sức khỏe của người lao động bình phục thì người sử dụng lao động xem xét để tiếp tục giao kết hợp đồng lao động với người lao động","context":"1. Người sử dụng lao động có quyền đơn phương chấm dứt hợp đồng lao động trong trường hợp sau đây:","draft":[{"modality":"entitlement","slots":{"actor":"người sử dụng lao động","action":"xem xét để tiếp tục giao kết hợp đồng lao động","recipient":"người lao động","conditions":"Khi sức khỏe của người lao động bình phục"}}],"reason":"Sức khỏe người lao động bình phục thì người sử dụng lao động xem xét giao kết tiếp; theo hướng dẫn lấy tính quy phạm theo câu dẫn (Quyền) nhưng nghĩa thực tế gần với nghĩa vụ xem xét.","confidence":"thấp"},{"id":"45-2019-qh14/chapter-iii/section-3/article-36/clause-1/point-c@23361-23599","group":"45-2019-qh14/chapter-iii/section-3/article-36","heading":"BLLĐ 2019 - Chương III \u003e Mục 3 \u003e Điều 36 \u003e Khoản 1 \u003e Điểm c","sentence":"Do thiên tai, hỏa hoạn, dịch bệnh nguy hiểm, địch họa hoặc di dời, thu hẹp sản xuất, kinh doanh theo yêu cầu của cơ quan nhà nước có thẩm quyền mà người sử dụng lao động đã tìm mọi biện pháp khắc phục nhưng vẫn buộc phải giảm chỗ làm việc","context":"1. Người sử dụng lao động có quyền đơn phương chấm dứt hợp đồng lao động trong trường hợp sau đây:","draft":[{"modality":"entitlement","slots":{"conditions":"Do thiên tai, hỏa hoạn, dịch bệnh nguy hiểm, địch họa hoặc di dời, thu hẹp sản xuất, kinh doanh theo yêu cầu của cơ quan nhà nước có thẩm quyền mà người sử dụng lao động đã tìm mọi biện pháp khắc phục nhưng vẫn buộc phải giảm chỗ làm việc"}}],"reason":"Một trường hợp người sử dụng lao động có quyền đơn phương chấm dứt hợp đồng; tính quy phạm lấy theo câu dẫn, chủ thể và hành vi nằm ở câu dẫn.","confidence":"vừa"},{"id":"45-2019-qh14/chapter-iii/section-3/article-36/clause-1/point-d@23604-23698","group":"45-2019-qh14/chapter-iii/section-3/article-36","heading":"BLLĐ 2019 - Chương III \u003e Mục 3 \u003e Điều 36 \u003e Khoản 1 \u003e Điểm d","sentence":"Người lao động không có mặt tại nơi làm việc sau thời hạn quy định tại Điều 31 của Bộ luật này","context":"1. Người sử dụng lao động có quyền đơn phương chấm dứt hợp đồng lao động trong trường hợp sau đây:","draft":[{"modality":"entitlement","slots":{"conditions":"Người lao động không có mặt tại nơi làm việc sau thời hạn quy định tại Điều 31 của Bộ luật này"}}],"reason":"Một trường hợp người sử dụng lao động có quyền đơn phương chấm dứt hợp đồng; tính quy phạm lấy theo câu dẫn, chủ thể và hành vi nằm ở câu dẫn.","confidence":"vừa"},{"id":"45-2019-qh14/chapter-iii/section-3/article-36/clause-1/point-đ@23703-23812","group":"45-2019-qh14/chapter-iii/section-3/article-36","heading":"BLLĐ 2019 - Chương III \u003e Mục 3 \u003e Điều 36 \u003e Khoản 1 \u003e Điểm đ","sentence":"Người lao động đủ tuổi nghỉ hưu theo quy định tại Điều 169 của Bộ luật này, trừ trường hợp có thỏa thuận khác","context":"1. Người sử dụng lao động có quyền đơn phương chấm dứt hợp đồng lao động trong trường hợp sau đây:","draft":[{"modality":"entitlement","slots":{"conditions":"Người lao động đủ tuổi nghỉ hưu theo quy định tại Điều 169 của Bộ luật này","exceptions":"trừ trường hợp có thỏa thuận khác"}}],"reason":"Một trường hợp người sử dụng lao động có quyền đơn phương chấm dứt hợp đồng; tính quy phạm lấy theo câu dẫn, chủ thể và hành vi nằm ở câu dẫn.","confidence":"cao"},{"id":"45-2019-qh14/chapter-iii/section-3/article-36/clause-1/point-e@23817-23910","group":"45-2019-qh14/chapter-iii/section-3/article-36","heading":"BLLĐ 2 <script>
"use strict";
const PACK = JSON.parse(document.getElementById('pack-data').textContent);
const BLIND = PACK.mode === 'blind';
const $ = id => document.getElementById(id);
const CONTENT = ['action', 'object', 'conditions', 'exceptions', 'quantities', 'deadlines', 'outcome'];
const MAX_NORMS = 8;
const MOD_VI = {obligation: 'Nghĩa vụ (phải)', prohibition: 'Cấm (không được)', entitlement: 'Quyền (có quyền)', permission: 'Cho phép (được)', unknown: 'Chưa rõ'};
const state = {tab: null, reviewer: '', filter: 'all', data: {}};
const tasks = PACK.order.map(k => PACK.tasks[k]);

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null) e.append(kid);
  return e;
}
function marked(text, phrases) {
  const out = document.createDocumentFragment();
  const ranges = [];
  for (const p of phrases || []) {
    if (!p) continue;
    let i = text.indexOf(p);
    while (i >= 0) { ranges.push([i, i + p.length]); i = text.indexOf(p, i + p.length); }
  }
  ranges.sort((a, b) => a[0] - b[0]);
  const merged = [];
  for (const r of ranges) { const l = merged[merged.length - 1]; if (l && r[0] <= l[1]) l[1] = Math.max(l[1], r[1]); else merged.push(r.slice()); }
  let pos = 0;
  for (const [s, e] of merged) { if (s > pos) out.append(text.slice(pos, s)); out.append(el('mark', {text: text.slice(s, e)})); pos = e; }
  out.append(text.slice(pos));
  return out;
}
const clone = v => JSON.parse(JSON.stringify(v));
const taskOf = key => PACK.tasks[key];
const itemsOf = key => taskOf(key).items;

// ---- state and storage ----
function storeKey(task) { return `rp:v1:${PACK.pack}:${task}:${state.reviewer.trim()}`; }
function load(task) {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(storeKey(task)) || 'null'); } catch (e) { d = null; }
  state.data[task] = d && d.items ? d : {items: {}, pos: null};
}
function save() {
  try { localStorage.setItem(storeKey(state.tab), JSON.stringify(state.data[state.tab])); $('saved').textContent = 'Đã lưu trong trình duyệt ' + new Date().toLocaleTimeString('vi-VN'); }
  catch (e) { $('saved').textContent = 'Không lưu được: hãy xuất tệp kết quả'; }
}
function stOf(task, id) {
  const d = state.data[task];
  return d.items[id] || (d.items[id] = {note: '', done: false});
}
function peek(task, id) { return state.data[task].items[id]; }

// ---- gold helpers ----
function goldNorms(it) {
  const draft = BLIND ? [] : (it.draft || []);
  return clone(draft).map(n => ({modality: n.modality || 'unknown', cue: n.cue || n.modality_cue || '', slots: n.slots || {}}));
}
function goldStateNorms(task, it) {
  const st = stOf(task, it.id);
  if (!st.norms) st.norms = goldNorms(it);
  return st.norms;
}
function validateNorm(n, sentence) {
  const errors = {}; let any = false;
  if (!PACK.modalities.includes(n.modality)) errors.modality = 'Chọn tính quy phạm.';
  if (n.cue && !sentence.includes(n.cue)) errors.cue = 'Từ tình thái phải là cụm chép nguyên văn từ câu này.';
  for (const s of PACK.slots) {
    const v = (n.slots[s] || '').trim();
    if (!v) continue;
    if (!sentence.includes(v)) errors[s] = 'Không phải cụm nguyên văn của câu này.';
    if (CONTENT.includes(s)) any = true;
  }
  if (!any) errors.content = 'Điền ít nhất một ô nội dung (hành vi, đối tượng, điều kiện, ngoại lệ, định lượng, thời hạn hoặc kết quả).';
  return errors;
}
function goldProblems(task, it) {
  const norms = goldStateNorms(task, it);
  if (norms.length > MAX_NORMS) return [`Tối đa ${MAX_NORMS} quy phạm mỗi câu.`];
  const out = [];
  norms.forEach((n, i) => { const e = validateNorm(n, it.sentence); if (Object.keys(e).length) out.push(`Quy phạm ${i + 1}: ` + Object.values(e)[0]); });
  return out;
}
function cleanNorm(n) {
  const slots = {};
  for (const s of PACK.slots) { const v = (n.slots[s] || '').trim(); if (v) slots[s] = v; }

  const mb = $('modebadge');
  mb.textContent = BLIND ? 'Chế độ độc lập: không có gợi ý' : 'Có gợi ý của model'; mb.className = 'badge' + (BLIND ? ' blind' : '');
  try { state.reviewer = localStorage.getItem('rp:reviewer') || ''; } catch (x) {}
  if (hash.get('reviewer')) state.reviewer = hash.get('reviewer');
  $('reviewer').value = state.reviewer;
  loadAll();
  let start = hash.get('tab');
  if (!start) { try { start = sessionStorage.getItem('rp:tab'); } catch (x) {} }
  state.tab = PACK.tasks[start] ? start : tasks[0].task;
  if (hash.get('item')) state.data[state.tab].pos = hash.get('item');
  renderAll();
  if (!state.reviewer) say('Nhập tên người duyệt ở đầu trang; tiến độ được lưu riêng cho từng tên.');
})();
</script>
</body>
</html>
